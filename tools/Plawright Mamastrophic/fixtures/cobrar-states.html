<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cobrar state fixture</title>
  <link rel="stylesheet" href="../../../apps/terminal-de-venta-system/products/tablet/app/components/pos/pos.module.css">
  <link rel="stylesheet" href="cobrar-states.css">
</head>
<body>
  <main>
    <header>
      <p>ATLASFIN / MAMASTROPHIC</p>
      <h1>Cobrar state fixture</h1>
    </header>
    <section class="fixture-grid" aria-label="Cobrar visual states">
      <article data-case="enabled-normal"><h2>Enabled normal</h2><button class="cobrarReferenceButton fixture-button" type="button" data-prisma-state="ready"><span class="cobrarIcon" aria-hidden="true">C</span><span class="cobrarCopy"><strong>Cobrar</strong><small>Listo para cerrar</small></span><strong class="cobrarAmount">$128.40</strong></button></article>
      <article data-case="enabled-hover"><h2>Enabled hover</h2><button class="cobrarReferenceButton fixture-button" type="button" data-prisma-state="ready"><span class="cobrarIcon" aria-hidden="true">C</span><span class="cobrarCopy"><strong>Cobrar</strong><small>Listo para cerrar</small></span><strong class="cobrarAmount">$128.40</strong></button></article>
      <article data-case="focus-visible"><h2>Focus visible</h2><button class="cobrarReferenceButton fixture-button" type="button" data-prisma-state="ready"><span class="cobrarIcon" aria-hidden="true">C</span><span class="cobrarCopy"><strong>Cobrar</strong><small>Navegacion por teclado</small></span><strong class="cobrarAmount">$128.40</strong></button></article>
      <article data-case="loading"><h2>Loading</h2><button class="cobrarReferenceButton fixture-button" type="button" disabled aria-disabled="true" aria-busy="true" data-prisma-state="loading"><span class="cobrarIcon" aria-hidden="true">C</span><span class="cobrarCopy"><strong>Cobrando</strong><small>Procesando estado aislado</small></span><strong class="cobrarAmount">$128.40</strong></button></article>
      <article data-case="reduced-motion"><h2>Reduced motion</h2><button class="cobrarReferenceButton fixture-button" type="button" data-prisma-state="ready"><span class="cobrarIcon" aria-hidden="true">C</span><span class="cobrarCopy"><strong>Cobrar</strong><small>Movimiento reducido</small></span><strong class="cobrarAmount">$128.40</strong></button></article>
      <article data-case="disabled"><h2>Disabled</h2><button class="cobrarReferenceButton fixture-button" type="button" disabled aria-disabled="true" data-prisma-state="disabled"><span class="cobrarIcon" aria-hidden="true">C</span><span class="cobrarCopy"><strong>Solo vista</strong><small>Revisar ticket</small></span><strong class="cobrarAmount">$0.00</strong></button></article>
    </section>
  </main>
</body>
</html>
