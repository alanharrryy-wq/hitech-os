change_budgets:
  class_a_local_doc:
    description: small package-local clarification
    max_files: 3
    max_new_files: 1
    scope: package_local
    approvals:
      - package_owner

  class_b_package_contract:
    description: package contract or acceptance gate update
    max_files: 6
    max_new_files: 2
    scope: package_local_frozen_docs
    approvals:
      - package_owner
      - governance_notice

  class_c_cross_package_contract:
    description: change that affects downstream consumers
    max_files: 10
    max_new_files: 3
    scope: cross_package
    approvals:
      - governance_change_record

  class_d_run_control:
    description: active run, round, or packet change
    max_files: 12
    max_new_files: 4
    scope: run_control
    approvals:
      - mission_control
      - governance_change_record

  class_e_constitution:
    description: constitutional change
    max_files: 20
    max_new_files: 6
    scope: global
    approvals:
      - operator
      - governance_change_record

rules:
  - Any task crossing package boundaries requires governance approval.
  - Any task that changes a frozen shared contract requires a decision record.
  - Execution agents may not self-upgrade a task into a higher budget class.
  - Runtime path ownership changes are at least class_c.
