project_runtime_paths_template:
  01-identity-access-and-trust: []
  02-domain-data-and-persistence: []
  03-service-contracts-and-orchestration: []
  04-experience-clients-and-interactions: []
  05-platform-infrastructure-and-delivery: []
  06-quality-release-and-operations: []

rules:
  - Runtime paths are project-specific and must be frozen during homologation.
  - Work packets may narrow a package's active paths, but may not widen beyond homologated ownership without a governance decision record.
  - Framework docs ownership and project runtime ownership are separate and both must be respected.
