version: 1
defaults:
  preflight:
    - { name: "git_status", cmd: "git status --porcelain=v1" }

node:
  detect:
    any_files: ["pnpm-lock.yaml", "package.json"]
  commands:
    - { name: "pnpm_install", cmd: "pnpm -w install --frozen-lockfile", allow_fail: true }
    - { name: "typecheck",   cmd: "pnpm -w -r typecheck", allow_fail: true }
    - { name: "build",       cmd: "pnpm -w -r build", allow_fail: true }
    - { name: "test_unit",   cmd: "pnpm -w -r test", allow_fail: true }

playwright:
  detect:
    any_files: ["playwright.config.ts", "playwright.config.js"]
  commands:
    - { name: "e2e_smoke", cmd: "npx playwright test --reporter=line", allow_fail: true }

policies:
  additive_only: true
  deterministic_default: true
  feature_flags_default_off: true
