[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hitech-git-sentinel-modular"
version = "0.1.0"
description = "Coherent package/bootstrap model for git_sentinel_modular"
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
git-sentinel-modular = "tools.hos.git_sentinel_modular.app.modular_cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["../../.."]
include = ["tools", "tools.*"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["tests"]
