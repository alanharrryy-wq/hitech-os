name: PRISMA Sync Sentinel Drift Repair Mutation Gate

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - '.github/workflows/sync-sentinel-drift-repair-gate.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  anti-rework-gate:
    if: github.event.pull_request.head.ref == 'gate/sync-sentinel-drift-repair-2908'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact carrier
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fail closed on canonical drift and carrier scope
        shell: bash
        run: |
          set -euo pipefail
          CANONICAL_SHA='a751520bbc559adbfced29abdd82ef0dfa6e0566'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$CANONICAL_SHA"
          MERGE_BASE="$(git merge-base origin/main HEAD)"
          mapfile -t files < <(git diff --name-only "$MERGE_BASE"...HEAD)
          test "${#files[@]}" = "1"
          test "${files[0]}" = ".github/workflows/sync-sentinel-drift-repair-gate.yml"

      - name: Validate and run universal anti-rework mutation gate
        shell: bash
        run: |
          set -euo pipefail
          CANONICAL_SHA='a751520bbc559adbfced29abdd82ef0dfa6e0566'
          git checkout --detach "$CANONICAL_SHA"
          test "$(git rev-parse HEAD)" = "$CANONICAL_SHA"
          python "PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py" --validate
          python "PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py" --self-test
          cat > "$RUNNER_TEMP/sync-sentinel-drift-repair-request.json" <<'JSON'
          {
            "schemaVersion": "prisma.factory-ledger.anti-rework-request.v1",
            "mode": "MUTATION",
            "expectedHead": "a751520bbc559adbfced29abdd82ef0dfa6e0566",
            "task": "Evidence-backed drift repair discovered by PRISMA Sync Sentinel isolated Journey B. Apply only the smallest correctness repair in apps/terminal-de-venta-system/products/tablet/app/src/server/sync/catalog-pull.ts: close the missing double quote in the PricingProjectionRecord UPSERT identifier excluded.\"updatedAt\" so real PC-to-Tablet catalog delta application can execute. Preserve all existing catalog-delta semantics, checkpoint/cursor behavior, local-first behavior, and the invariant that PC catalog updates do not overwrite Tablet local operational stock. Then rerun the existing Sync Sentinel source branch against isolated Sentinel-owned SQLite only. No UI, no schema/model/migration change, no sync redesign, no live/customer DB, no unrelated cleanup. Reconcile native verifiers only if fresh evidence proves their assertions stale, under verifier-only scope.",
            "capabilities": [
              {"id": "tooling.sync_sentinel", "requestedAction": "BUILD"},
              {"id": "tablet.sync.runtime_truth", "requestedAction": "ADVANCE"},
              {"id": "pc.sync.dispatch_replay_runtime", "requestedAction": "VERIFY"},
              {"id": "data.canonical_schema_reproducibility", "requestedAction": "VERIFY"}
            ],
            "authorityMesh": {
              "status": "PASS_COMPOSED_AUTHORITY_MESH",
              "repoHead": "a751520bbc559adbfced29abdd82ef0dfa6e0566",
              "requiredAuthorityCoveragePct": 100,
              "blockers": 0,
              "requestDigest": "fa6bef888a5547604f3deb13370a6cee40b6ae0ca1b422cb6ea2a4d4ae9bea7a",
              "artifactDigest": "fbb7b1b169afb180e3d9e06a599a245191ae963a848eaa0d63f162cf06af3639",
              "layerMapPresent": false
            },
            "visualMutation": false
          }
          JSON
          python "PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py" --request "$RUNNER_TEMP/sync-sentinel-drift-repair-request.json" | tee "$RUNNER_TEMP/SYNC_SENTINEL_DRIFT_REPAIR_ANTI_REWORK_GATE.json"
          grep -F '"result": "PASS_ANTI_REWORK_GATE"' "$RUNNER_TEMP/SYNC_SENTINEL_DRIFT_REPAIR_ANTI_REWORK_GATE.json"

      - name: Upload mutation gate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sync-sentinel-drift-repair-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/SYNC_SENTINEL_DRIFT_REPAIR_ANTI_REWORK_GATE.json
          if-no-files-found: error
          retention-days: 14
