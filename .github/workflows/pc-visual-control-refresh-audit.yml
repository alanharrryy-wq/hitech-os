name: PC Visual Control Refresh Audit

on:
  push:
    branches:
      - agent/pc-atlasfin-bindings-preflight-20260829
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  visual-control-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install parser dependency in isolated temp prefix
        shell: bash
        run: |
          set -euo pipefail
          PARSER_ROOT="$RUNNER_TEMP/prisma-visual-parser"
          mkdir -p "$PARSER_ROOT"
          npm install --prefix "$PARSER_ROOT" --package-lock=false --ignore-scripts postcss@8
          APP_ROOT="$GITHUB_WORKSPACE/apps/terminal-de-venta-system"
          test ! -e "$APP_ROOT/node_modules"
          ln -s "$PARSER_ROOT/node_modules" "$APP_ROOT/node_modules"
          cd "$APP_ROOT"
          node --input-type=module -e "import('postcss').then(m => console.log('POSTCSS_OK=' + !!m.default))"

      - name: Build fresh PC-only Visual Control evidence
        working-directory: apps/terminal-de-venta-system
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/pc-visual-control-fresh"
          mkdir -p "$OUT"
          node tools/quality/ui-visual-control.mjs visual-control:report --surface pc --output-root "$OUT"
          echo "VISUAL_OUT=$OUT" >> "$GITHUB_ENV"

      - name: Summarize exact PC authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib
          out = pathlib.Path(os.environ['VISUAL_OUT'])
          vc = out / 'visual-control'
          summary_path = out / 'PC_VISUAL_CONTROL_REFRESH_SUMMARY.json'
          def load(name):
              return json.loads((vc / name).read_text(encoding='utf-8'))
          surfaces = load('surfaces.json')
          routes = load('routes.json')
          components = load('components.json')
          owners = load('owners.json')
          slots = load('editable-slots.json')
          layers = load('layers.json')
          risks = load('risks.json')
          summary = {
              'status': risks.get('status'),
              'pc': {
                  'surfaceRecords': surfaces.get('surfaces', []),
                  'routeCount': routes.get('routeCount'),
                  'componentCount': components.get('componentCount'),
                  'componentOwnerCount': owners.get('componentOwnerCount'),
                  'cssOwnerCount': owners.get('cssOwnerCount'),
                  'regionOwnerCount': owners.get('regionOwnerCount'),
                  'editableSlotCount': slots.get('editableSlotCount'),
                  'slotUnitCount': slots.get('slotUnitCount'),
                  'layerCount': layers.get('layerCount'),
                  'countsByLayer': layers.get('countsByLayer'),
                  'countsByVisualRegion': layers.get('countsByVisualRegion'),
                  'activeImportantCount': risks.get('activeImportantCount'),
                  'ambiguousActiveLayerOwnerCount': risks.get('ambiguousActiveLayerOwnerCount'),
                  'blockerCount': risks.get('blockerCount'),
                  'warningCount': risks.get('warningCount'),
              },
              'source': 'fresh current-source PC-only visual-control report; external evidence only; canonical repo indexes not mutated'
          }
          summary_path.write_text(json.dumps(summary, indent=2) + '\n', encoding='utf-8')
          print(summary_path.read_text())
          PY

      - name: Prove repo source was not mutated
        working-directory: apps/terminal-de-venta-system
        shell: bash
        run: |
          set -euo pipefail
          rm -f node_modules
          git status --short
          test -z "$(git status --short -- products/pc .prisma-ui .governance)"

      - name: Upload fresh PC visual-control evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc-visual-control-refresh-audit
          path: |
            ${{ runner.temp }}/pc-visual-control-fresh/**
          if-no-files-found: error
          retention-days: 7
