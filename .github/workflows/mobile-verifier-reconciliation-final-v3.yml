name: Mobile Verifier Reconciliation Final V3

on:
  pull_request:
    paths:
      - '.github/workflows/mobile-verifier-reconciliation-final-v3.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: tools/code-atlas/src
  TARGET_HEAD: 468da2fdacf938456dc4f2c0119e4a3ac44d0318
  TARGET_BASE: 630f025e3b41ac932a10ffab2f5992817c3037e5
  MOBILE_ROOT: apps/terminal-de-venta-system/products/mobile/app

jobs:
  final-v3:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_HEAD }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Exact-head bounded scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
          python - <<'PY'
          import os, subprocess
          base,head=os.environ['TARGET_BASE'],os.environ['TARGET_HEAD']
          m='apps/terminal-de-venta-system/products/mobile/app/'
          docs={m+'docs/prisma-app/PRISMA_MOBILE_INTERFACE_CANON.md',m+'docs/prisma-app/PRISMA_MOBILE_INTERFACE_CANON.contract.json',m+'docs/prisma-app/PRISMA_APP_MOBILE_41_MULTI_CONTEXT_SWITCHER_RENDER_GRADE.md'}
          changed=subprocess.check_output(['git','diff','--name-only',base,head],text=True).splitlines()
          bad=[p for p in changed if not (p in docs or p==m+'package.json' or (p.startswith(m+'tools/verify') and p.endswith('.mjs')))]
          if not changed or bad: raise SystemExit('SCOPE_GUARD_FAIL:'+','.join(bad))
          if any(p.endswith(('.tsx','.css')) for p in changed): raise SystemExit('PRODUCT_SOURCE_MUTATION_FORBIDDEN')
          print('CHANGE_BOUNDARY_PASS',len(changed))
          PY

      - name: Governance and fresh Authority Mesh
        shell: bash
        run: |
          set -euo pipefail
          python "PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py" --self-test
          python - "$RUNNER_TEMP/request.json" <<'PY'
          import json,os,sys
          a='apps/terminal-de-venta-system/'; m=a+'products/mobile/app/'; l='PRISMA Factory Ledger/'
          auth=[l+'PRISMA_FACTORY_LEDGER.json',l+'PRISMA_FACTORY_LEDGER_AGENT_GATE.md',l+'tools/verify_prisma_anti_rework_gate.py',a+'docs/ops/PRISMA_FIELD_MANUAL_APRENDIZAJE_OPERATIVO.md',a+'quality/contracts/no-fake-green.contract.json',m+'docs/prisma-app/PRISMA_MOBILE_INTERFACE_CANON.md',m+'docs/prisma-app/PRISMA_MOBILE_INTERFACE_CANON.contract.json',m+'docs/prisma-app/archive/interface-history/PRISMA_APP_MOBILE_41_MULTI_CONTEXT_SWITCHER_RENDER_GRADE.md',m+'package.json',m+'tools/verify_prisma_mobile_interface_canon.mjs',m+'tools/verify_prisma_app_mobile_28_data_readiness.mjs',m+'tools/verify_prisma_app_mobile_32_source_states.mjs']
          tasks=[{'id':'mobile-final-v3-conformance','surface':'mobile','intent':'VERIFY','domain':'testing','task':'Verify final Mobile interface/verifier reconciliation after semantic Data Readiness and Source States fixes. MultiContextSwitcher is absent from normative Mobile product intent with no replacement. Current seven-tab canon remains. No product source/runtime mutation.','requiredAuthorities':auth,'requiredDirectories':[m+'tools',m+'docs/prisma-app'],'requiredCapabilities':['mobile.interface_specification_canon'],'minimumCoverage':100,'failOnMissingAuthority':True},{'id':'mobile-final-v3-closure','surface':'governance','intent':'VERIFY','domain':'governance','task':'Require no-fake-green closure. Active MultiContext iteration-41 spec/verifier absent, archive historical only, current technical gates plus typecheck and production build must pass.','requiredAuthorities':auth+[l+'PRISMA_EVIDENCE_INDEX.json'],'requiredDirectories':[a+'quality/contracts'],'requiredCapabilities':['mobile.interface_specification_canon'],'minimumCoverage':100,'failOnMissingAuthority':True}]
          json.dump({'schemaVersion':'v2','profile':'mobile-final-no-multicontext-v3','expectedHead':os.environ['TARGET_HEAD'],'tasks':tasks},open(sys.argv[1],'w',encoding='utf-8'),ensure_ascii=False,indent=2)
          PY
          pre="$RUNNER_TEMP/pre"; par="$RUNNER_TEMP/par"; comp="$RUNNER_TEMP/comp/payload"; mkdir -p "$pre" "$par" "$comp"
          python -m code_atlas.motors.prisma_mesh_gateway preflight --repo "$GITHUB_WORKSPACE" --request "$RUNNER_TEMP/request.json" --out "$pre"
          python tools/code-atlas/src/code_atlas/motors/smart_allmesh_parallel.py --repo "$GITHUB_WORKSPACE" --out-root "$par" --task-spec "$pre/legacy_tasks.json" --parallel 2 --workers 18 --shards 54 --max-files 160 --max-mb 48
          python -m code_atlas.motors.prisma_mesh_gateway compose --repo "$GITHUB_WORKSPACE" --request "$RUNNER_TEMP/request.json" --preflight "$pre" --mesh-result "$par" --out "$comp" | tee "$RUNNER_TEMP/compose.txt"
          grep -Fq PASS_COMPOSED_AUTHORITY_MESH "$RUNNER_TEMP/compose.txt"

      - name: Factory Ledger MUTATION gate
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/comp/payload/PRISMA_MESH_GATEWAY_REPORT.json" "$RUNNER_TEMP/pre/PREFLIGHT_MANIFEST.json" "$RUNNER_TEMP/comp/prisma-automesh-composed-result.zip" "$RUNNER_TEMP/mutation.json" <<'PY'
          import hashlib,json,os,sys
          r=json.load(open(sys.argv[1],encoding='utf-8')); p=json.load(open(sys.argv[2],encoding='utf-8')); d=hashlib.sha256(open(sys.argv[3],'rb').read()).hexdigest(); c=min(float((x.get('coverage') or {}).get('resolvedPercent',0)) for x in p['lanes'])
          q={'schemaVersion':'prisma.factory-ledger.anti-rework-gate.v1','mode':'MUTATION','expectedHead':os.environ['TARGET_HEAD'],'task':'Advance mobile.interface_specification_canon through final bounded verifier/spec reconciliation. Retire MultiContextSwitcher normative concept; align Data Readiness and Source States tests to current semantic contracts. No Mobile product source/runtime mutation.','capabilities':[{'id':'mobile.interface_specification_canon','requestedAction':'ADVANCE'}],'authorityMesh':{'status':r['status'],'repoHead':r['repoHead'],'requiredAuthorityCoveragePct':c,'blockers':len(p.get('blockers') or []),'requestDigest':r['requestDigest'],'artifactDigest':d,'layerMapPresent':False},'visualMutation':False}
          json.dump(q,open(sys.argv[4],'w',encoding='utf-8'),ensure_ascii=False,indent=2)
          PY
          python "PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py" --request "$RUNNER_TEMP/mutation.json" | tee "$RUNNER_TEMP/decision.json"
          python - "$RUNNER_TEMP/decision.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8')); assert d.get('result')=='PASS_ANTI_REWORK_GATE' and d.get('errors')==[],d
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Canon and all current Mobile gates
        working-directory: ${{ env.MOBILE_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          test ! -e tools/verify_prisma_app_mobile_41_multi_context_switcher.mjs
          test ! -e docs/prisma-app/PRISMA_APP_MOBILE_41_MULTI_CONTEXT_SWITCHER_RENDER_GRADE.md
          test -e docs/prisma-app/archive/interface-history/PRISMA_APP_MOBILE_41_MULTI_CONTEXT_SWITCHER_RENDER_GRADE.md
          pnpm run verify:interface-canon
          node tools/verify_prisma_app_mobile_20_command_center.mjs
          node tools/verify_prisma_app_mobile_21_owner_action_inbox.mjs
          node tools/verify_prisma_app_mobile_22_daily_brief.mjs
          node tools/verify_prisma_app_mobile_23_decision_ledger.mjs
          node tools/verify_prisma_app_mobile_24_pulse_timeline.mjs
          node tools/verify_prisma_app_mobile_33_mando_contracts.mjs
          node tools/verify_prisma_app_mobile_37_release_hardening.mjs
          pnpm run verify:health-radar
          pnpm run verify:health-radar-compat
          pnpm run verify:data-readiness
          pnpm run verify:premium-navigation
          pnpm run verify:crystal-intelligence
          pnpm run verify:secure-projection-gateway
          pnpm run verify:source-states
          pnpm run verify:runtime-error-guard

      - name: Typecheck Mobile
        working-directory: ${{ env.MOBILE_ROOT }}
        run: pnpm run typecheck

      - name: Production build Mobile
        working-directory: ${{ env.MOBILE_ROOT }}
        run: pnpm run build

      - name: Evidence
        if: always()
        shell: bash
        run: |
          out="$RUNNER_TEMP/evidence"; mkdir -p "$out"; git diff --name-status "$TARGET_BASE" "$TARGET_HEAD" > "$out/changed-files.txt"; git log -1 --format='%H%n%T%n%s' "$TARGET_HEAD" > "$out/target-head.txt"
          for p in "$RUNNER_TEMP/request.json" "$RUNNER_TEMP/pre/PREFLIGHT_MANIFEST.json" "$RUNNER_TEMP/comp/payload/PRISMA_MESH_GATEWAY_REPORT.json" "$RUNNER_TEMP/comp/prisma-automesh-composed-result.zip" "$RUNNER_TEMP/mutation.json" "$RUNNER_TEMP/decision.json"; do [ ! -f "$p" ] || cp "$p" "$out/$(basename "$p")"; done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mobile-verifier-reconciliation-final-v3-evidence
          path: ${{ runner.temp }}/evidence/**
          if-no-files-found: error
          retention-days: 14
