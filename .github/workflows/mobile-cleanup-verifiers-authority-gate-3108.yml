name: Mobile Cleanup Verifiers Authority Gate 3108

on:
  pull_request:
    paths:
      - '.github/workflows/mobile-cleanup-verifiers-authority-gate-3108.yml'

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  TARGET_HEAD: c17635fb69bb0208dc8237ee97cc82017f1d30a6
  MESH_RUN_ID: '33422010227'
  MESH_ARTIFACT_ID: '9769306890'
  MESH_OUTER_SHA256: b10283576aea840dc3e1fddc43ca5f047453cf898c614d18505c097881d5dd7a
  MESH_COMPOSED_SHA256: 4c3ed647973d7e68451551d4daa4da9f44898ae87cf7bc26c9423ac694443a4e
  MESH_REQUEST_DIGEST: 780d6e6c9ecdadf30d8b25eeead15bdc2bd449a022f938bfaddbff22038d85e5

jobs:
  authority-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact governed main
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_HEAD }}
          fetch-depth: 0
          clean: false

      - name: Guard current main and anti-rework tooling
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
          remote_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_head" = "$TARGET_HEAD"
          python -m py_compile "PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py"
          python "PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py" --validate
          python "PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py" --self-test

      - name: Prove zero external runtime consumers
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/MULTICONTEXT_CONSUMER_PROOF.json" <<'PY'
          import json, os, pathlib, subprocess, sys
          out = pathlib.Path(sys.argv[1])
          mobile = pathlib.Path('apps/terminal-de-venta-system/products/mobile/app')
          patterns = ['PrismaMobileMultiContextSwitcher','multiContextRoot','mobile-multi-context-switcher','PRISMA_APP_MOBILE_41_MULTI_CONTEXT_SWITCHER_RENDER_GRADE','prisma-mobile-multi-context-switcher.module.css']
          residue = {
              (mobile / 'src/components/prisma-app/PrismaMobileMultiContextSwitcher.tsx').as_posix(),
              (mobile / 'src/components/prisma-app/prisma-mobile-multi-context-switcher.module.css').as_posix(),
              (mobile / 'src/components/prisma-app/index.ts').as_posix(),
              (mobile / 'src/components/prisma-app/prisma-mobile-dashboard.module.css').as_posix(),
          }
          refs, unexpected = [], []
          for pattern in patterns:
              p = subprocess.run(['git','grep','-n','-I','-F',pattern,'--',(mobile/'src').as_posix(),(mobile/'app').as_posix()], text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=False)
              if p.returncode not in (0,1): raise SystemExit(f'GIT_GREP_FAILED:{pattern}:{p.stderr[:500]}')
              for line in p.stdout.splitlines():
                  path = line.partition(':')[0]
                  row = {'pattern':pattern,'match':line,'path':path}
                  refs.append(row)
                  if path not in residue: unexpected.append(row)
          missing = [p for p in sorted(residue) if not pathlib.Path(p).is_file()]
          pkg = json.loads((mobile/'package.json').read_text(encoding='utf-8'))
          checks = {
              'dedicatedMultiContextVerifierAbsent': pkg.get('scripts',{}).get('verify:multi-context-switcher') is None,
              'multiContextVersionMetadataAbsent': 'prismaMobileMultiContextSwitcherVersion' not in pkg,
              'multiContextPackageMetadataAbsent': 'prismaMobileMultiContextSwitcherPackage' not in pkg,
              'canonicalVerifierInCheckAll': 'verify:interface-canon' in str(pkg.get('scripts',{}).get('check:all','')),
              'retiredTerminologyAbsentFromCheckAll': 'multi-context' not in str(pkg.get('scripts',{}).get('check:all','')).lower(),
          }
          payload = {'schemaVersion':'prisma.mobile.multicontext-consumer-proof.v1','repoHead':os.environ['TARGET_HEAD'],'sourceMatches':refs,'unexpectedRuntimeConsumers':unexpected,'missingResidueFiles':missing,'packageChecks':checks,'branchesApiExistsAndIsOutOfScope':(mobile/'app/api/mobile/branches/route.ts').is_file()}
          payload['verdict'] = 'PASS_NO_EXTERNAL_RUNTIME_CONSUMERS' if not unexpected and not missing and all(checks.values()) and payload['branchesApiExistsAndIsOutOfScope'] else 'BLOCKED_CONSUMER_OR_CONTRACT_DRIFT'
          out.write_text(json.dumps(payload,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(payload,indent=2))
          if payload['verdict'] != 'PASS_NO_EXTERNAL_RUNTIME_CONSUMERS': raise SystemExit(payload['verdict'])
          PY

      - name: Download and verify fresh task-exact Mesh
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mesh="$RUNNER_TEMP/mobile-mesh.zip"
          curl --fail --location --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$MESH_ARTIFACT_ID/zip" -o "$mesh"
          test "$(sha256sum "$mesh" | awk '{print $1}')" = "$MESH_OUTER_SHA256"
          python - "$mesh" "$RUNNER_TEMP/mesh-verified.json" <<'PY'
          import hashlib, io, json, os, sys, zipfile
          artifact,out=sys.argv[1:]
          with zipfile.ZipFile(artifact) as outer: composed=outer.read('prisma-automesh-composed-result.zip')
          actual=hashlib.sha256(composed).hexdigest()
          if actual != os.environ['MESH_COMPOSED_SHA256']: raise SystemExit(f'COMPOSED_DIGEST_MISMATCH:{actual}')
          with zipfile.ZipFile(io.BytesIO(composed)) as comp:
              report=json.loads(comp.read('PRISMA_MESH_GATEWAY_REPORT.json'))
              pre=json.loads(comp.read('authority/PREFLIGHT_MANIFEST.json'))
              legacy=comp.read('legacy_surface_mesh.zip')
          if report.get('status')!='PASS_COMPOSED_AUTHORITY_MESH': raise SystemExit('MESH_NOT_PASS')
          if report.get('repoHead')!=os.environ['TARGET_HEAD']: raise SystemExit('MESH_HEAD_MISMATCH')
          if report.get('requestDigest')!=os.environ['MESH_REQUEST_DIGEST']: raise SystemExit('MESH_REQUEST_DIGEST_MISMATCH')
          if pre.get('status')!='PASS_PREFLIGHT' or pre.get('blockers'): raise SystemExit('MESH_PREFLIGHT_NOT_CLEAN')
          lanes=pre.get('lanes') or []
          if len(lanes)!=2: raise SystemExit('MESH_LANE_COUNT_INVALID')
          coverage=min(float((x.get('coverage') or {}).get('resolvedPercent',0)) for x in lanes)
          if coverage!=100: raise SystemExit(f'MESH_COVERAGE_NOT_100:{coverage}')
          with zipfile.ZipFile(io.BytesIO(legacy)) as z:
              for name in ['tasks/mobile-physical-cleanup/authority_mesh/reports/LAYERS_MAP.json','tasks/mobile-verifiers-aligned-governance/authority_mesh/reports/LAYERS_MAP.json']:
                  if name not in z.namelist(): raise SystemExit('LAYER_MAP_MISSING:'+name)
                  json.loads(z.read(name))
          evidence={'status':report['status'],'repoHead':report['repoHead'],'requiredAuthorityCoveragePct':coverage,'blockers':0,'requestDigest':report['requestDigest'],'artifactDigest':os.environ['MESH_COMPOSED_SHA256'],'outerArtifactDigest':os.environ['MESH_OUTER_SHA256'],'artifactId':os.environ['MESH_ARTIFACT_ID'],'runId':os.environ['MESH_RUN_ID'],'layerMapPresent':True}
          open(out,'w',encoding='utf-8').write(json.dumps(evidence,indent=2)+'\n')
          print(json.dumps(evidence,indent=2))
          PY

      - name: Run anti-rework gates
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/mesh-verified.json" "$RUNNER_TEMP" <<'PY'
          import json, os, pathlib, subprocess, sys
          mesh=json.load(open(sys.argv[1],encoding='utf-8'))
          root=pathlib.Path(sys.argv[2])
          tool='PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py'
          for mode in ('PROPOSAL','MUTATION'):
              req={'schemaVersion':'prisma.factory-ledger.anti-rework-gate.v1','mode':mode,'expectedHead':os.environ['TARGET_HEAD'],'task':'Complete PRISMA Mobile retired MultiContext physical dead-code cleanup plus evidence-based claims.verifiersAligned reconciliation for mobile.interface_specification_canon. Preserve seven-section canon, branches API and excluded surfaces; no redesign or claim inflation.','capabilities':[{'id':'mobile.interface_specification_canon','requestedAction':'ADVANCE'}],'visualMutation':True}
              if mode=='MUTATION': req['authorityMesh']={k:mesh[k] for k in ('status','repoHead','requiredAuthorityCoveragePct','blockers','requestDigest','artifactDigest','layerMapPresent')}
              rp=root/f'{mode.lower()}.request.json'; op=root/f'{mode.lower()}.decision.json'
              rp.write_text(json.dumps(req,indent=2)+'\n',encoding='utf-8')
              p=subprocess.run(['python',tool,'--request',str(rp)],text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              op.write_text(p.stdout,encoding='utf-8'); print(p.stdout,end='')
              if p.returncode: raise SystemExit(f'{mode}_GATE_COMMAND_FAILED')
              d=json.loads(p.stdout)
              if d.get('result')!='PASS_ANTI_REWORK_GATE' or d.get('errors')!=[]: raise SystemExit(f'{mode}_GATE_NOT_CLEAN_PASS')
              print(f'PASS_{mode}_ANTI_REWORK_GATE')
          PY

      - name: Stage authority evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/mobile-authority-evidence"
          mkdir -p "$out"
          for f in MULTICONTEXT_CONSUMER_PROOF.json mesh-verified.json proposal.request.json proposal.decision.json mutation.request.json mutation.decision.json; do
            src="$RUNNER_TEMP/$f"; [ ! -f "$src" ] || cp "$src" "$out/$f"
          done

      - name: Upload authority evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-cleanup-verifiers-authority-3108
          path: ${{ runner.temp }}/mobile-authority-evidence/**
          if-no-files-found: error
          retention-days: 14
