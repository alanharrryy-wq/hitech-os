name: UIMAP Alias Reachability Diagnostic 2

on:
  push:
    branches:
      - agent/prisma-html-three-app-visual-closure

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: tools/code-atlas/src

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Isolate reachability versus extraction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json, os
          from pathlib import Path
          import code_atlas.app_map.uimap.discovery as d

          repo = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          pc_root = d.resolve_runtime_roots(repo)['pc'][0]
          stock_page = pc_root / 'app/stock/page.tsx'
          workspace = pc_root / 'components/inventory/inventory-workspace.tsx'
          workspace_rel = d.norm_rel(repo, workspace)

          cfg = json.loads((pc_root / 'tsconfig.json').read_text(encoding='utf-8'))
          paths_cfg = (cfg.get('compilerOptions') or {}).get('paths') or {}
          exts = ('.ts','.tsx','.js','.jsx','.mjs','.cjs','.vue','.svelte','.json','.css','.scss','.sass','.less')

          def resolve_base(base: Path, root: Path):
              for candidate in [base.resolve(), *[Path(str(base)+ext).resolve() for ext in exts], *[(base/('index'+ext)).resolve() for ext in exts]]:
                  try: candidate.relative_to(root.resolve())
                  except Exception: continue
                  if candidate.is_file(): return candidate
              return None

          def rules(root: Path):
              out=[]
              for pattern, targets in paths_cfg.items():
                  if pattern.count('*') > 1: continue
                  if '*' in pattern: prefix,suffix=pattern.split('*',1); exact=False
                  else: prefix,suffix,exact=pattern,'',True
                  out.append((exact,prefix,suffix,pattern,[str(x) for x in targets]))
              return sorted(out, key=lambda r:(-int(r[0]),-len(r[1]),-len(r[2]),r[3]))

          alias_rules = rules(pc_root)
          def patched(source: Path, spec: str, root: Path):
              if spec.startswith('.'):
                  return resolve_base((source.parent/spec).resolve(), root)
              matches=[]
              for exact,prefix,suffix,pattern,targets in alias_rules:
                  if exact:
                      wildcard='' if spec==pattern else None
                  elif spec.startswith(prefix) and (not suffix or spec.endswith(suffix)):
                      end=len(spec)-len(suffix) if suffix else len(spec)
                      wildcard=spec[len(prefix):end] if end>=len(prefix) else None
                  else:
                      wildcard=None
                  if wildcard is not None:
                      matches.append(((int(exact),len(prefix),len(suffix)),pattern,targets,wildcard))
              if not matches: return None
              score=max(x[0] for x in matches)
              resolved=set()
              for _,pattern,targets,wildcard in [x for x in matches if x[0]==score]:
                  for target_pattern in targets:
                      sub=target_pattern.replace('*',wildcard) if '*' in target_pattern else target_pattern
                      found=resolve_base((pc_root/sub).resolve(), root)
                      if found is not None:
                          resolved.add(found.resolve()); break
              return next(iter(resolved)) if len(resolved)==1 else None

          d.resolve_import = patched
          files = sorted(d.iter_files(pc_root), key=lambda p:str(p).lower())
          hashes = d.parallel_hash(files, workers=18)
          routes = d.discover_routes('pc', pc_root, repo, hashes)
          stock_routes = [r for r in routes if r.route_path == '/stock']
          reach = d.build_route_reachability(pc_root, repo, routes)
          workspace_routes = reach.get(workspace_rel, [])

          extraction_error = None
          manual_candidates = []
          try:
              manual_candidates = d.extract_ui_candidates_from_file('pc', workspace, repo, workspace_routes, hashes.get(workspace,''))
          except Exception as exc:
              extraction_error = f'{type(exc).__name__}: {exc}'

          runtime = d.discover_runtime('pc', pc_root, repo, workers=18)
          runtime_workspace = [c for c in runtime['candidates'] if c.render_source_file == workspace_rel or c.owner_file == workspace_rel]
          manual_stock = [c for c in manual_candidates if c.route_path == '/stock']

          report = {
              'status':'DIAGNOSTIC_ONLY_NO_SOURCE_MUTATION',
              'pcRoot':d.norm_rel(repo,pc_root),
              'workspaceRel':workspace_rel,
              'workspaceInIterFiles':workspace in files,
              'workspaceHashPresent':workspace in hashes,
              'stockRouteCount':len(stock_routes),
              'stockRouteImports':[r.imports for r in stock_routes],
              'directAliasResolution':str(patched(stock_page,'@components/inventory/inventory-workspace',pc_root)),
              'workspaceInReach':workspace_rel in reach,
              'workspaceReachRoutes':[{'routePath':r.route_path,'kind':r.kind,'sourceFile':r.source_file} for r in workspace_routes],
              'manualExtractionError':extraction_error,
              'manualCandidateCount':len(manual_candidates),
              'manualStockCandidateCount':len(manual_stock),
              'manualStockSample':[{'className':c.class_name,'tagName':c.tag_name,'widgetKind':c.widget_kind,'data':c.data_attributes,'routePath':c.route_path} for c in manual_stock[:20]],
              'discoverRuntimeWorkspaceCandidateCount':len(runtime_workspace),
              'discoverRuntimeWorkspaceSample':[{'className':c.class_name,'tagName':c.tag_name,'widgetKind':c.widget_kind,'data':c.data_attributes,'routePath':c.route_path} for c in runtime_workspace[:20]],
          }
          print('PRISMA_UIMAP_REACH_EXTRACTION_DIAGNOSTIC_BEGIN')
          print(json.dumps(report,ensure_ascii=False,indent=2,sort_keys=True))
          print('PRISMA_UIMAP_REACH_EXTRACTION_DIAGNOSTIC_END')
          if str(patched(stock_page,'@components/inventory/inventory-workspace',pc_root)) != str(workspace.resolve()):
              raise SystemExit('DIRECT_ALIAS_RESOLUTION_FAILED')
          if not report['workspaceInIterFiles']:
              raise SystemExit('WORKSPACE_EXCLUDED_FROM_FILE_INVENTORY')
          if not report['workspaceInReach']:
              raise SystemExit('WORKSPACE_NOT_PROPAGATED_IN_REACHABILITY')
          if extraction_error:
              raise SystemExit('WORKSPACE_EXTRACTION_EXCEPTION')
          if not runtime_workspace:
              raise SystemExit('DISCOVER_RUNTIME_DROPPED_EXTRACTED_WORKSPACE')
          PY
      - name: Prove source untouched
        shell: bash
        run: test -z "$(git status --porcelain=v1 --untracked-files=all)"
