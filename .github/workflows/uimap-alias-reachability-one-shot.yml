name: UIMAP Alias Reachability Diagnostic

on:
  push:
    branches:
      - agent/prisma-html-three-app-visual-closure

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: tools/code-atlas/src

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Diagnose alias reachability through real UIMAP pipeline
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import tempfile
          from pathlib import Path

          import code_atlas.app_map.uimap.discovery as discovery
          from code_atlas.app_map.uimap.runner import run_uimap

          repo = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          governor = repo / 'prisma-html'
          roots = discovery.resolve_runtime_roots(repo)
          pc_roots = roots.get('pc') or []
          if len(pc_roots) != 1:
              raise SystemExit(f'PC_RUNTIME_ROOT_COUNT:{len(pc_roots)}:{pc_roots}')
          pc_root = pc_roots[0]
          tsconfig = pc_root / 'tsconfig.json'
          stock_page = pc_root / 'app/stock/page.tsx'
          workspace = pc_root / 'components/inventory/inventory-workspace.tsx'
          if not tsconfig.is_file() or not stock_page.is_file() or not workspace.is_file():
              raise SystemExit('PC_DIAGNOSTIC_PREIMAGE_MISSING')

          cfg = json.loads(tsconfig.read_text(encoding='utf-8'))
          raw_paths = (cfg.get('compilerOptions') or {}).get('paths') or {}

          def load_rules(root: Path):
              rows = []
              config = root / 'tsconfig.json'
              payload = json.loads(config.read_text(encoding='utf-8'))
              paths = (payload.get('compilerOptions') or {}).get('paths') or {}
              for pattern, raw_targets in paths.items():
                  if not isinstance(pattern, str) or pattern.count('*') > 1:
                      continue
                  targets = raw_targets if isinstance(raw_targets, list) else [raw_targets]
                  targets = [str(x) for x in targets if isinstance(x, str) and x.strip()]
                  if not targets:
                      continue
                  if '*' in pattern:
                      prefix, suffix = pattern.split('*', 1)
                      exact = False
                  else:
                      prefix, suffix, exact = pattern, '', True
                  rows.append({
                      'pattern': pattern,
                      'prefix': prefix,
                      'suffix': suffix,
                      'exact': exact,
                      'targets': targets,
                      'baseDir': config.parent.resolve(),
                  })
              return sorted(rows, key=lambda r: (-int(bool(r['exact'])), -len(r['prefix']), -len(r['suffix']), r['pattern']))

          exts = ('.ts','.tsx','.js','.jsx','.mjs','.cjs','.vue','.svelte','.json','.css','.scss','.sass','.less')

          def resolve_base(base: Path, root: Path):
              candidates = [base.resolve()]
              candidates += [Path(str(base) + ext).resolve() for ext in exts]
              candidates += [(base / ('index' + ext)).resolve() for ext in exts]
              seen = set()
              for candidate in candidates:
                  if candidate in seen:
                      continue
                  seen.add(candidate)
                  try:
                      candidate.relative_to(root.resolve())
                  except Exception:
                      continue
                  if candidate.is_file():
                      return candidate
              return None

          rules_cache = {}
          def patched_resolve_import(source: Path, spec: str, root: Path):
              if spec.startswith('.'):
                  return resolve_base((source.parent / spec).resolve(), root)
              key = root.resolve()
              rules = rules_cache.setdefault(key, load_rules(root))
              matches = []
              for rule in rules:
                  if rule['exact']:
                      wildcard = '' if spec == rule['pattern'] else None
                  else:
                      prefix, suffix = rule['prefix'], rule['suffix']
                      if not spec.startswith(prefix) or (suffix and not spec.endswith(suffix)):
                          wildcard = None
                      else:
                          end = len(spec) - len(suffix) if suffix else len(spec)
                          wildcard = spec[len(prefix):end] if end >= len(prefix) else None
                  if wildcard is None:
                      continue
                  score = (int(bool(rule['exact'])), len(rule['prefix']), len(rule['suffix']))
                  matches.append((score, rule, wildcard))
              if not matches:
                  return None
              best_score = max(score for score, _, _ in matches)
              best = [(rule, wildcard) for score, rule, wildcard in matches if score == best_score]
              resolved = set()
              for rule, wildcard in sorted(best, key=lambda x: x[0]['pattern']):
                  chosen = None
                  for target_pattern in rule['targets']:
                      if target_pattern.count('*') > 1:
                          continue
                      substituted = target_pattern.replace('*', wildcard) if '*' in target_pattern else target_pattern
                      chosen = resolve_base((Path(rule['baseDir']) / substituted).resolve(), root)
                      if chosen is not None:
                          break
                  if chosen is not None:
                      resolved.add(chosen.resolve())
              return next(iter(resolved)) if len(resolved) == 1 else None

          discovery.resolve_import = patched_resolve_import

          stock_text = stock_page.read_text(encoding='utf-8')
          stock_imports = discovery.parse_imports(stock_text)
          direct = {spec: str(patched_resolve_import(stock_page, spec, pc_root)) for spec in stock_imports}

          runtime = discovery.discover_runtime('pc', pc_root, repo, workers=18)
          workspace_rel = discovery.norm_rel(repo, workspace)
          candidate_rows = [
              {
                  'routePath': c.route_path,
                  'routeId': c.route_id,
                  'renderSourceFile': c.render_source_file,
                  'ownerFile': c.owner_file,
                  'ownerSymbol': c.owner_symbol,
                  'className': c.class_name,
                  'tagName': c.tag_name,
                  'widgetKind': c.widget_kind,
                  'dataAttributes': c.data_attributes,
              }
              for c in runtime.get('candidates', [])
              if c.route_path == '/stock'
              and (c.render_source_file == workspace_rel or c.owner_file == workspace_rel)
          ]
          stock_route = next((r for r in runtime.get('routes', []) if r.route_path == '/stock' and r.kind == 'page'), None)

          with tempfile.TemporaryDirectory() as tmp:
              out = Path(tmp) / 'uimap'
              result = run_uimap(
                  product_root=str(repo),
                  governor_root=str(governor),
                  output_dir=str(out),
                  workers=18,
              )
              pc_batch_path = out / 'batches/02_pc.json'
              if not pc_batch_path.is_file():
                  raise SystemExit('PC_BATCH_MISSING')
              pc_batch = json.loads(pc_batch_path.read_text(encoding='utf-8'))
              emitted_stock = [
                  {
                      'componentId': row.get('componentId'),
                      'componentUiId': row.get('componentUiId'),
                      'routePath': row.get('routePath'),
                      'ownerFile': row.get('ownerFile'),
                      'renderSourceFile': row.get('renderSourceFile'),
                      'ownerSymbol': row.get('ownerSymbol'),
                      'targetResolutionStatus': row.get('targetResolutionStatus'),
                      'visualSelectors': [t.get('selector') for t in row.get('visualTargets', [])],
                  }
                  for row in pc_batch.get('components', [])
                  if row.get('routePath') == '/stock'
              ]
              emitted_workspace = [row for row in emitted_stock if row.get('ownerFile') == workspace_rel or row.get('renderSourceFile') == workspace_rel]

              report = {
                  'status': 'DIAGNOSTIC_ONLY_NO_SOURCE_MUTATION',
                  'pcRuntimeRoot': discovery.norm_rel(repo, pc_root),
                  'tsconfig': discovery.norm_rel(repo, tsconfig),
                  'tsconfigPaths': raw_paths,
                  'stockPage': discovery.norm_rel(repo, stock_page),
                  'stockImports': stock_imports,
                  'directResolvedImports': direct,
                  'workspaceExpected': workspace_rel,
                  'stockRouteRecord': {
                      'routeId': stock_route.route_id if stock_route else None,
                      'sourceFile': stock_route.source_file if stock_route else None,
                      'imports': stock_route.imports if stock_route else None,
                  },
                  'discoverRuntimeWorkspaceCandidateCount': len(candidate_rows),
                  'discoverRuntimeWorkspaceCandidatesSample': candidate_rows[:20],
                  'runUimapOk': result.get('ok'),
                  'runUimapFinalStatus': result.get('finalStatus'),
                  'runUimapComponentCount': result.get('componentCount'),
                  'pcBatchStockComponentCount': len(emitted_stock),
                  'pcBatchWorkspaceComponentCount': len(emitted_workspace),
                  'pcBatchWorkspaceSample': emitted_workspace[:20],
                  'pcBatchStockOwnerFiles': sorted({str(row.get('ownerFile')) for row in emitted_stock}),
                  'pcBatchStockRenderFiles': sorted({str(row.get('renderSourceFile')) for row in emitted_stock}),
              }
              print('PRISMA_UIMAP_ALIAS_DIAGNOSTIC_BEGIN')
              print(json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True))
              print('PRISMA_UIMAP_ALIAS_DIAGNOSTIC_END')

              if direct.get('@components/inventory/inventory-workspace') != str(workspace.resolve()):
                  raise SystemExit('DIRECT_ALIAS_RESOLUTION_FAILED')
              if not candidate_rows:
                  raise SystemExit('DISCOVER_RUNTIME_DID_NOT_REACH_WORKSPACE')
              if not emitted_workspace:
                  raise SystemExit('RUN_UIMAP_DROPPED_REACHED_WORKSPACE')
          PY

      - name: Prove repository source remains untouched
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
