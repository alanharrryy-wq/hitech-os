name: Mobile Cleanup Verifiers Apply 3108 Final

on:
  pull_request:
    paths:
      - '.github/workflows/mobile-cleanup-verifiers-apply-3108.yml'

permissions:
  contents: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  TARGET_HEAD: 565abc2742ab18dce1fcd729cd8f0f1633d3ef34
  TARGET_BRANCH: fix/mobile-multicontext-verifiers-cleanup-3108-v2
  MESH_RUN_ID: '33423735563'
  MESH_ARTIFACT_ID: '9769953491'
  MESH_OUTER_SHA256: cc9f98ff0c9d46dbe14a02d0f2c5aab1a3480e2e7a4a8c0c142f062d1b81c69d
  MESH_COMPOSED_SHA256: 0735534c109db0245b96515b12791ea470dc12aa910315f7163b7b223951f8d2
  MESH_REQUEST_DIGEST: 809bdef720f18706f7f2db69f0a0e4742e60d4211fd57aa7da25b1af08bdd274
  BASELINE_BLOCKER_FILE: docs/prisma-app/qa/prisma-app-mobile-38-optional-adder-boundary-scenarios.json

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout mutation branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          clean: false

      - name: Setup runtimes
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Guard exact governed base and carrier-only diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "$TARGET_HEAD"
          test "$(git merge-base HEAD origin/main)" = "$TARGET_HEAD"
          mapfile -t changed < <(git diff --name-only origin/main...HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/mobile-cleanup-verifiers-apply-3108.yml"
          python -m py_compile "PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py"
          python "PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py" --validate
          python "PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py" --self-test

      - name: Verify fresh AutoMesh, consumer proof and anti-rework gates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mesh="$RUNNER_TEMP/mobile-mesh.zip"
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$MESH_ARTIFACT_ID/zip" \
            -o "$mesh"
          test "$(sha256sum "$mesh" | awk '{print $1}')" = "$MESH_OUTER_SHA256"
          python - "$mesh" "$RUNNER_TEMP/mesh-verified.json" <<'PY'
          import hashlib, io, json, os, sys, zipfile
          artifact,out=sys.argv[1:]
          with zipfile.ZipFile(artifact) as outer:
              composed=outer.read('prisma-automesh-composed-result.zip')
          actual=hashlib.sha256(composed).hexdigest()
          if actual != os.environ['MESH_COMPOSED_SHA256']: raise SystemExit('COMPOSED_DIGEST_MISMATCH:'+actual)
          with zipfile.ZipFile(io.BytesIO(composed)) as comp:
              report=json.loads(comp.read('PRISMA_MESH_GATEWAY_REPORT.json'))
              pre=json.loads(comp.read('authority/PREFLIGHT_MANIFEST.json'))
              legacy=comp.read('legacy_surface_mesh.zip')
          if report.get('status')!='PASS_COMPOSED_AUTHORITY_MESH': raise SystemExit('MESH_NOT_PASS')
          if report.get('repoHead')!=os.environ['TARGET_HEAD']: raise SystemExit('MESH_HEAD_MISMATCH')
          if report.get('requestDigest')!=os.environ['MESH_REQUEST_DIGEST']: raise SystemExit('REQUEST_DIGEST_MISMATCH')
          if pre.get('status')!='PASS_PREFLIGHT' or pre.get('blockers'): raise SystemExit('PREFLIGHT_NOT_CLEAN')
          lanes=pre.get('lanes') or []
          if len(lanes)!=2: raise SystemExit('LANE_COUNT_INVALID')
          coverage=min(float((x.get('coverage') or {}).get('resolvedPercent',0)) for x in lanes)
          if coverage != 100: raise SystemExit('AUTHORITY_COVERAGE_NOT_100')
          with zipfile.ZipFile(io.BytesIO(legacy)) as z:
              for name in ['tasks/mobile-physical-cleanup/authority_mesh/reports/LAYERS_MAP.json','tasks/mobile-verifiers-aligned-governance/authority_mesh/reports/LAYERS_MAP.json']:
                  if name not in z.namelist(): raise SystemExit('LAYER_MAP_MISSING:'+name)
                  json.loads(z.read(name))
          evidence={'status':report['status'],'repoHead':report['repoHead'],'requiredAuthorityCoveragePct':coverage,'blockers':0,'requestDigest':report['requestDigest'],'artifactDigest':actual,'layerMapPresent':True}
          open(out,'w',encoding='utf-8').write(json.dumps(evidence,indent=2)+'\n')
          print(json.dumps(evidence,indent=2))
          PY
          python - "$RUNNER_TEMP/MULTICONTEXT_CONSUMER_PROOF.json" <<'PY'
          import json, os, pathlib, subprocess, sys
          out=pathlib.Path(sys.argv[1]); mobile=pathlib.Path('apps/terminal-de-venta-system/products/mobile/app')
          patterns=['PrismaMobileMultiContextSwitcher','multiContextRoot','mobile-multi-context-switcher','PRISMA_APP_MOBILE_41_MULTI_CONTEXT_SWITCHER_RENDER_GRADE','prisma-mobile-multi-context-switcher.module.css']
          residue={(mobile/'src/components/prisma-app/PrismaMobileMultiContextSwitcher.tsx').as_posix(),(mobile/'src/components/prisma-app/prisma-mobile-multi-context-switcher.module.css').as_posix(),(mobile/'src/components/prisma-app/index.ts').as_posix(),(mobile/'src/components/prisma-app/prisma-mobile-dashboard.module.css').as_posix()}
          refs=[]; unexpected=[]
          for pattern in patterns:
              p=subprocess.run(['git','grep','-n','-I','-F',pattern,'--',(mobile/'src').as_posix(),(mobile/'app').as_posix()],text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=False)
              if p.returncode not in (0,1): raise SystemExit('GIT_GREP_FAILED:'+pattern)
              for line in p.stdout.splitlines():
                  path=line.partition(':')[0]; row={'pattern':pattern,'match':line,'path':path}; refs.append(row)
                  if path not in residue: unexpected.append(row)
          missing=[p for p in sorted(residue) if not pathlib.Path(p).is_file()]
          pkg=json.loads((mobile/'package.json').read_text(encoding='utf-8'))
          checks={'dedicatedMultiContextVerifierAbsent':pkg.get('scripts',{}).get('verify:multi-context-switcher') is None,'multiContextVersionMetadataAbsent':'prismaMobileMultiContextSwitcherVersion' not in pkg,'multiContextPackageMetadataAbsent':'prismaMobileMultiContextSwitcherPackage' not in pkg,'canonicalVerifierInCheckAll':'verify:interface-canon' in str(pkg.get('scripts',{}).get('check:all','')),'retiredTerminologyAbsentFromCheckAll':'multi-context' not in str(pkg.get('scripts',{}).get('check:all','')).lower()}
          payload={'schemaVersion':'prisma.mobile.multicontext-consumer-proof.v1','repoHead':os.environ['TARGET_HEAD'],'sourceMatches':refs,'unexpectedRuntimeConsumers':unexpected,'missingResidueFiles':missing,'packageChecks':checks,'branchesApiExistsAndIsOutOfScope':(mobile/'app/api/mobile/branches/route.ts').is_file()}
          payload['verdict']='PASS_NO_EXTERNAL_RUNTIME_CONSUMERS' if not unexpected and not missing and all(checks.values()) and payload['branchesApiExistsAndIsOutOfScope'] else 'BLOCKED_CONSUMER_OR_CONTRACT_DRIFT'
          out.write_text(json.dumps(payload,indent=2)+'\n',encoding='utf-8'); print(json.dumps(payload,indent=2))
          if payload['verdict']!='PASS_NO_EXTERNAL_RUNTIME_CONSUMERS': raise SystemExit(payload['verdict'])
          PY
          git switch --detach "$TARGET_HEAD"
          trap 'git switch "$TARGET_BRANCH" >/dev/null 2>&1 || true' EXIT
          python - "$RUNNER_TEMP/mesh-verified.json" "$RUNNER_TEMP" <<'PY'
          import json, os, pathlib, subprocess, sys
          mesh=json.load(open(sys.argv[1],encoding='utf-8')); root=pathlib.Path(sys.argv[2]); tool='PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py'
          for mode in ('PROPOSAL','MUTATION'):
              req={'schemaVersion':'prisma.factory-ledger.anti-rework-gate.v1','mode':mode,'expectedHead':os.environ['TARGET_HEAD'],'task':'Complete PRISMA Mobile retired MultiContext physical dead-code cleanup plus evidence-based claims.verifiersAligned reconciliation for mobile.interface_specification_canon. Preserve seven-section canon, branches API and excluded surfaces; no redesign or claim inflation.','capabilities':[{'id':'mobile.interface_specification_canon','requestedAction':'ADVANCE'}],'visualMutation':True}
              if mode=='MUTATION': req['authorityMesh']={k:mesh[k] for k in ('status','repoHead','requiredAuthorityCoveragePct','blockers','requestDigest','artifactDigest','layerMapPresent')}
              rp=root/f'{mode.lower()}.request.json'; rp.write_text(json.dumps(req,indent=2)+'\n',encoding='utf-8')
              p=subprocess.run(['python',tool,'--request',str(rp)],text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              print(p.stdout,end='')
              if p.returncode: raise SystemExit(mode+'_GATE_COMMAND_FAILED')
              d=json.loads(p.stdout)
              if d.get('result')!='PASS_ANTI_REWORK_GATE' or d.get('errors')!=[] or d.get('repoHead')!=os.environ['TARGET_HEAD']: raise SystemExit(mode+'_GATE_NOT_CLEAN_PASS')
          PY
          git switch "$TARGET_BRANCH"
          trap - EXIT

      - name: Install workspace dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Capture baseline gates
        shell: bash
        run: |
          set -euo pipefail
          mobile='apps/terminal-de-venta-system/products/mobile/app'
          set +e
          pnpm -C "$mobile" typecheck 2>&1 | tee "$RUNNER_TEMP/baseline-typecheck.log"
          echo "${PIPESTATUS[0]}" > "$RUNNER_TEMP/baseline-typecheck.rc"
          pnpm -C "$mobile" check:all 2>&1 | tee "$RUNNER_TEMP/baseline-checkall.log"
          check_rc=${PIPESTATUS[0]}
          set -e
          test "$check_rc" -ne 0
          test ! -f "$mobile/$BASELINE_BLOCKER_FILE"
          grep -Fq 'verify:optional-adder-boundary' "$RUNNER_TEMP/baseline-checkall.log"
          grep -Fq 'Missing required Mobile boundary file.' "$RUNNER_TEMP/baseline-checkall.log"

      - name: Apply exact authorized cleanup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, pathlib
          m=pathlib.Path('apps/terminal-de-venta-system/products/mobile/app')
          component=m/'src/components/prisma-app/PrismaMobileMultiContextSwitcher.tsx'; component_css=m/'src/components/prisma-app/prisma-mobile-multi-context-switcher.module.css'; index=m/'src/components/prisma-app/index.ts'; dash=m/'src/components/prisma-app/prisma-mobile-dashboard.module.css'; contract=m/'docs/prisma-app/PRISMA_MOBILE_INTERFACE_CANON.contract.json'; verifier=m/'tools/verify_prisma_mobile_interface_canon.mjs'; branches=m/'app/api/mobile/branches/route.ts'
          for p in (component,component_css,index,dash,contract,verifier,branches):
              if not p.is_file(): raise SystemExit('REQUIRED_FILE_MISSING:'+p.as_posix())
          before=hashlib.sha256(branches.read_bytes()).hexdigest()
          s=index.read_text(); old='export { PrismaMobileMultiContextSwitcher } from "./PrismaMobileMultiContextSwitcher";\n'
          if s.count(old)!=1: raise SystemExit('INDEX_EXPORT_EXPECTATION_FAILED')
          index.write_text(s.replace(old,'',1))
          s=dash.read_text(); old='.crystalCommand,\n.multiContextRoot {\n  display: grid;\n  gap: 9px;\n}'; new='.crystalCommand {\n  display: grid;\n  gap: 9px;\n}'
          if s.count(old)!=1: raise SystemExit('DASHBOARD_SELECTOR_EXPECTATION_FAILED')
          dash.write_text(s.replace(old,new,1))
          s=contract.read_text(); old='    "verifiersAligned": false'; new='    "verifiersAligned": true'
          if s.count(old)!=1 or new in s: raise SystemExit('CLAIM_EXPECTATION_FAILED')
          contract.write_text(s.replace(old,new,1))
          s=verifier.read_text(); marker='const canonicalCommand = "node tools/verify_prisma_mobile_interface_canon.mjs";\n'; guard='if (contract.claims?.verifiersAligned !== true) fail("Canon claims.verifiersAligned must stay true after verifier reconciliation", { verifiersAligned: contract.claims?.verifiersAligned });\n\n'
          if s.count(marker)!=1 or guard in s: raise SystemExit('VERIFIER_GUARD_EXPECTATION_FAILED')
          verifier.write_text(s.replace(marker,guard+marker,1)); component.unlink(); component_css.unlink()
          if before!=hashlib.sha256(branches.read_bytes()).hexdigest(): raise SystemExit('BRANCHES_API_CHANGED')
          print('PASS_EXACT_MUTATION')
          PY

      - name: Prove focused Mobile gates and blocker parity
        shell: bash
        run: |
          set -euo pipefail
          mobile='apps/terminal-de-venta-system/products/mobile/app'
          for pattern in PrismaMobileMultiContextSwitcher multiContextRoot mobile-multi-context-switcher PRISMA_APP_MOBILE_41_MULTI_CONTEXT_SWITCHER_RENDER_GRADE prisma-mobile-multi-context-switcher.module.css; do
            if git grep -n -I -F "$pattern" -- "$mobile/src" "$mobile/app"; then exit 1; fi
          done
          (
            cd "$mobile"
            node tools/verify_prisma_mobile_interface_canon.mjs
            node tools/verify_prisma_app_mobile_27_premium_navigation.mjs
            node tools/verify_prisma_app_mobile_28_data_readiness.mjs
            node tools/verify_prisma_app_mobile_32_source_states.mjs
          )
          node tools/quality/verify-zero-important.mjs
          set +e
          pnpm -C "$mobile" check:all 2>&1 | tee "$RUNNER_TEMP/candidate-checkall.log"
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -ne 0
          grep -Fq 'verify:optional-adder-boundary' "$RUNNER_TEMP/candidate-checkall.log"
          grep -Fq 'Missing required Mobile boundary file.' "$RUNNER_TEMP/candidate-checkall.log"

      - name: Prove no new TypeScript diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mobile='apps/terminal-de-venta-system/products/mobile/app'
          set +e
          pnpm -C "$mobile" typecheck 2>&1 | tee "$RUNNER_TEMP/candidate-typecheck.log"
          candidate_rc=${PIPESTATUS[0]}
          set -e
          python - "$RUNNER_TEMP/baseline-typecheck.log" "$RUNNER_TEMP/candidate-typecheck.log" <<'PY'
          import pathlib,re,sys
          ansi=re.compile(r'\x1b\[[0-?]*[ -/]*[@-~]')
          def diag(p): return {ansi.sub('',x).strip() for x in pathlib.Path(p).read_text(errors='replace').splitlines() if re.search(r'error TS\d+:',ansi.sub('',x))}
          b,c=diag(sys.argv[1]),diag(sys.argv[2]); new=sorted(c-b)
          print('BASELINE_TS_DIAGNOSTICS',len(b)); print('CANDIDATE_TS_DIAGNOSTICS',len(c)); print('NEW_TS_DIAGNOSTICS',len(new))
          if new:
              print('\n'.join(new)); raise SystemExit('NEW_TYPESCRIPT_DIAGNOSTICS')
          PY
          baseline_rc="$(cat "$RUNNER_TEMP/baseline-typecheck.rc")"
          if [ "$baseline_rc" = "0" ] || [ "$candidate_rc" = "0" ]; then
            test "$candidate_rc" = "0"
            pnpm -C "$mobile" build
          fi

      - name: Final exact scope, self-remove, commit and push
        shell: bash
        run: |
          set -euo pipefail
          mobile='apps/terminal-de-venta-system/products/mobile/app'
          workflow='.github/workflows/mobile-cleanup-verifiers-apply-3108.yml'
          find "$mobile" -maxdepth 1 -type d -name 'zero-important-gate *' -exec rm -rf {} +
          find . -maxdepth 1 -type d -name 'zero-important-gate *' -exec rm -rf {} +
          git rm "$workflow"
          mapfile -t changed < <(git diff --name-only "$TARGET_HEAD" | sort)
          expected=(
            "$mobile/docs/prisma-app/PRISMA_MOBILE_INTERFACE_CANON.contract.json"
            "$mobile/src/components/prisma-app/PrismaMobileMultiContextSwitcher.tsx"
            "$mobile/src/components/prisma-app/index.ts"
            "$mobile/src/components/prisma-app/prisma-mobile-dashboard.module.css"
            "$mobile/src/components/prisma-app/prisma-mobile-multi-context-switcher.module.css"
            "$mobile/tools/verify_prisma_mobile_interface_canon.mjs"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq 6
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${changed[@]}")
          test "$(git diff "$TARGET_HEAD" -- "$mobile/app/api/mobile/branches/route.ts")" = ""
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "${expected[@]}"
          git diff --cached --quiet && exit 1 || true
          git commit -m "fix(mobile): remove retired MultiContext residue"
          git push origin "HEAD:$TARGET_BRANCH"
