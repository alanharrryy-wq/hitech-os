name: Mobile Cleanup Verifiers Apply 3108 Final

on:
  pull_request:
    paths:
      - '.github/workflows/mobile-cleanup-verifiers-apply-3108.yml'

permissions:
  contents: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  TARGET_HEAD: c17635fb69bb0208dc8237ee97cc82017f1d30a6
  TARGET_BRANCH: fix/mobile-multicontext-verifiers-cleanup-3108-v2
  AUTH_RUN_ID: '33422412017'
  AUTH_ARTIFACT_ID: '9769418216'
  AUTH_ARTIFACT_SHA256: 39d733f52c9fbb1fe821fd012ee45dde277df6832f8e478589ea947641fec17f
  MESH_REQUEST_DIGEST: 780d6e6c9ecdadf30d8b25eeead15bdc2bd449a022f938bfaddbff22038d85e5
  MESH_COMPOSED_SHA256: 4c3ed647973d7e68451551d4daa4da9f44898ae87cf7bc26c9423ac694443a4e
  BASELINE_BLOCKER_FILE: docs/prisma-app/qa/prisma-app-mobile-38-optional-adder-boundary-scenarios.json

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout mutation branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          clean: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Guard exact governed base and clean carrier state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "$TARGET_HEAD"
          test "$(git merge-base HEAD origin/main)" = "$TARGET_HEAD"
          mapfile -t changed < <(git diff --name-only origin/main...HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/mobile-cleanup-verifiers-apply-3108.yml"

      - name: Verify fresh authority artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          auth="$RUNNER_TEMP/mobile-authority-proof.zip"
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$AUTH_ARTIFACT_ID/zip" \
            -o "$auth"
          test "$(sha256sum "$auth" | awk '{print $1}')" = "$AUTH_ARTIFACT_SHA256"
          python - "$auth" <<'PY'
          import json, os, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              mesh=json.loads(z.read('mesh-verified.json'))
              proof=json.loads(z.read('MULTICONTEXT_CONSUMER_PROOF.json'))
              proposal=json.loads(z.read('proposal.decision.json'))
              mutation=json.loads(z.read('mutation.decision.json'))
          head=os.environ['TARGET_HEAD']
          assert mesh['status']=='PASS_COMPOSED_AUTHORITY_MESH'
          assert mesh['repoHead']==head
          assert mesh['requiredAuthorityCoveragePct']==100
          assert mesh['blockers']==0
          assert mesh['requestDigest']==os.environ['MESH_REQUEST_DIGEST']
          assert mesh['artifactDigest']==os.environ['MESH_COMPOSED_SHA256']
          assert mesh['layerMapPresent'] is True
          assert proof['repoHead']==head
          assert proof['verdict']=='PASS_NO_EXTERNAL_RUNTIME_CONSUMERS'
          assert proof['unexpectedRuntimeConsumers']==[]
          assert proof['branchesApiExistsAndIsOutOfScope'] is True
          for d,mode in ((proposal,'PROPOSAL'),(mutation,'MUTATION')):
              assert d['result']=='PASS_ANTI_REWORK_GATE'
              assert d['errors']==[]
              assert d['repoHead']==head
              assert d['mode']==mode
          print('PASS_FRESH_AUTHORITY_BINDING')
          PY

      - name: Install workspace dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Capture baseline gates
        shell: bash
        run: |
          set -euo pipefail
          mobile='apps/terminal-de-venta-system/products/mobile/app'
          set +e
          pnpm -C "$mobile" typecheck 2>&1 | tee "$RUNNER_TEMP/baseline-typecheck.log"
          echo "${PIPESTATUS[0]}" > "$RUNNER_TEMP/baseline-typecheck.rc"
          pnpm -C "$mobile" check:all 2>&1 | tee "$RUNNER_TEMP/baseline-checkall.log"
          check_rc=${PIPESTATUS[0]}
          set -e
          test "$check_rc" -ne 0
          test ! -f "$mobile/$BASELINE_BLOCKER_FILE"
          grep -Fq 'verify:optional-adder-boundary' "$RUNNER_TEMP/baseline-checkall.log"
          grep -Fq 'Missing required Mobile boundary file.' "$RUNNER_TEMP/baseline-checkall.log"

      - name: Apply exact authorized cleanup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, pathlib
          m=pathlib.Path('apps/terminal-de-venta-system/products/mobile/app')
          component=m/'src/components/prisma-app/PrismaMobileMultiContextSwitcher.tsx'
          component_css=m/'src/components/prisma-app/prisma-mobile-multi-context-switcher.module.css'
          index=m/'src/components/prisma-app/index.ts'
          dash=m/'src/components/prisma-app/prisma-mobile-dashboard.module.css'
          contract=m/'docs/prisma-app/PRISMA_MOBILE_INTERFACE_CANON.contract.json'
          verifier=m/'tools/verify_prisma_mobile_interface_canon.mjs'
          branches=m/'app/api/mobile/branches/route.ts'
          for p in (component,component_css,index,dash,contract,verifier,branches):
              if not p.is_file(): raise SystemExit('REQUIRED_FILE_MISSING:'+p.as_posix())
          before=hashlib.sha256(branches.read_bytes()).hexdigest()
          s=index.read_text()
          old='export { PrismaMobileMultiContextSwitcher } from "./PrismaMobileMultiContextSwitcher";\n'
          if s.count(old)!=1: raise SystemExit('INDEX_EXPORT_EXPECTATION_FAILED')
          index.write_text(s.replace(old,'',1))
          s=dash.read_text()
          old='.crystalCommand,\n.multiContextRoot {\n  display: grid;\n  gap: 9px;\n}'
          new='.crystalCommand {\n  display: grid;\n  gap: 9px;\n}'
          if s.count(old)!=1: raise SystemExit('DASHBOARD_SELECTOR_EXPECTATION_FAILED')
          dash.write_text(s.replace(old,new,1))
          s=contract.read_text()
          old='    "verifiersAligned": false'; new='    "verifiersAligned": true'
          if s.count(old)!=1 or new in s: raise SystemExit('CLAIM_EXPECTATION_FAILED')
          contract.write_text(s.replace(old,new,1))
          s=verifier.read_text()
          marker='const canonicalCommand = "node tools/verify_prisma_mobile_interface_canon.mjs";\n'
          guard='if (contract.claims?.verifiersAligned !== true) fail("Canon claims.verifiersAligned must stay true after verifier reconciliation", { verifiersAligned: contract.claims?.verifiersAligned });\n\n'
          if s.count(marker)!=1 or guard in s: raise SystemExit('VERIFIER_GUARD_EXPECTATION_FAILED')
          verifier.write_text(s.replace(marker,guard+marker,1))
          component.unlink(); component_css.unlink()
          after=hashlib.sha256(branches.read_bytes()).hexdigest()
          if before!=after: raise SystemExit('BRANCHES_API_CHANGED')
          print('PASS_EXACT_MUTATION')
          PY

      - name: Prove focused Mobile gates and blocker parity
        shell: bash
        run: |
          set -euo pipefail
          mobile='apps/terminal-de-venta-system/products/mobile/app'
          for pattern in PrismaMobileMultiContextSwitcher multiContextRoot mobile-multi-context-switcher PRISMA_APP_MOBILE_41_MULTI_CONTEXT_SWITCHER_RENDER_GRADE prisma-mobile-multi-context-switcher.module.css; do
            if git grep -n -I -F "$pattern" -- "$mobile/src" "$mobile/app"; then exit 1; fi
          done
          (
            cd "$mobile"
            node tools/verify_prisma_mobile_interface_canon.mjs
            node tools/verify_prisma_app_mobile_27_premium_navigation.mjs
            node tools/verify_prisma_app_mobile_28_data_readiness.mjs
            node tools/verify_prisma_app_mobile_32_source_states.mjs
          )
          node tools/quality/verify-zero-important.mjs
          set +e
          pnpm -C "$mobile" check:all 2>&1 | tee "$RUNNER_TEMP/candidate-checkall.log"
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -ne 0
          grep -Fq 'verify:optional-adder-boundary' "$RUNNER_TEMP/candidate-checkall.log"
          grep -Fq 'Missing required Mobile boundary file.' "$RUNNER_TEMP/candidate-checkall.log"

      - name: Prove no new TypeScript diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mobile='apps/terminal-de-venta-system/products/mobile/app'
          set +e
          pnpm -C "$mobile" typecheck 2>&1 | tee "$RUNNER_TEMP/candidate-typecheck.log"
          candidate_rc=${PIPESTATUS[0]}
          set -e
          python - "$RUNNER_TEMP/baseline-typecheck.log" "$RUNNER_TEMP/candidate-typecheck.log" <<'PY'
          import pathlib,re,sys
          ansi=re.compile(r'\x1b\[[0-?]*[ -/]*[@-~]')
          def diag(p):
              return {ansi.sub('',x).strip() for x in pathlib.Path(p).read_text(errors='replace').splitlines() if re.search(r'error TS\d+:',ansi.sub('',x))}
          b,c=diag(sys.argv[1]),diag(sys.argv[2])
          new=sorted(c-b)
          print('BASELINE_TS_DIAGNOSTICS',len(b))
          print('CANDIDATE_TS_DIAGNOSTICS',len(c))
          print('NEW_TS_DIAGNOSTICS',len(new))
          if new:
              print('\n'.join(new))
              raise SystemExit('NEW_TYPESCRIPT_DIAGNOSTICS')
          PY
          baseline_rc="$(cat "$RUNNER_TEMP/baseline-typecheck.rc")"
          if [ "$baseline_rc" = "0" ]; then
            test "$candidate_rc" = "0"
            pnpm -C "$mobile" build
          elif [ "$candidate_rc" = "0" ]; then
            pnpm -C "$mobile" build
          fi

      - name: Final exact scope, self-remove, commit and push
        shell: bash
        run: |
          set -euo pipefail
          mobile='apps/terminal-de-venta-system/products/mobile/app'
          workflow='.github/workflows/mobile-cleanup-verifiers-apply-3108.yml'
          git rm "$workflow"
          mapfile -t changed < <(git diff --name-only "$TARGET_HEAD" | sort)
          expected=(
            "$mobile/docs/prisma-app/PRISMA_MOBILE_INTERFACE_CANON.contract.json"
            "$mobile/src/components/prisma-app/PrismaMobileMultiContextSwitcher.tsx"
            "$mobile/src/components/prisma-app/index.ts"
            "$mobile/src/components/prisma-app/prisma-mobile-dashboard.module.css"
            "$mobile/src/components/prisma-app/prisma-mobile-multi-context-switcher.module.css"
            "$mobile/tools/verify_prisma_mobile_interface_canon.mjs"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq 6
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${changed[@]}")
          test "$(git diff "$TARGET_HEAD" -- "$mobile/app/api/mobile/branches/route.ts")" = ""
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(mobile): remove retired MultiContext residue"
          git push origin "HEAD:$TARGET_BRANCH"
