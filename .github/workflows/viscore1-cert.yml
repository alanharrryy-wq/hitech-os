name: PRISMA VISCORE1 Finalizer

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/viscore1-cert.yml'
      - 'prisma-html/**'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  finalize:
    name: build final reconciled commit object
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Rebuild RIFAT projection hashes from exact current bytes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          from pathlib import Path

          root = Path.cwd()
          path = root / 'prisma-html/authority/rifat/visual-source-manifest.json'
          manifest = json.loads(path.read_text(encoding='utf-8'))

          def sha256(p: Path) -> str:
              return hashlib.sha256(p.read_bytes()).hexdigest()

          for entry in manifest.get('entries', []):
              source = root / entry['source']
              output = root / entry['output']
              if not source.is_file() or not output.is_file():
                  raise SystemExit(f'missing projection pair: {source} -> {output}')
              source_hash = sha256(source)
              output_hash = sha256(output)
              if entry.get('projectionMode') == 'exact-byte-copy' and source_hash != output_hash:
                  raise SystemExit(f'exact-copy drift remains: {source} -> {output}')
              entry['sourceSha256'] = source_hash
              entry['outputSha256'] = output_hash

          path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8', newline='\n')
          PY

          python prisma-html/tools/validate_rifat_authority.py
          python prisma-html/tools/refresh_files_manifest.py --write
          python prisma-html/tools/refresh_files_manifest.py --check

      - name: Prove candidates are byte-identical to certified run 6 artifacts
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            'a94286e4b594581e1e31c77173ffcf53216e8309025b1f0a7eef1309049d8d78' \
            'prisma-html/authority/rifat/visual-source-manifest.json' \
            '00c419b4e35b81f864bac299914b943fa740636524ad9afca1feeb66c34bcfa6' \
            'prisma-html/FILES_MANIFEST.json' | sha256sum -c -

      - name: Restore read-only certification workflow and verify final tree delta
        shell: bash
        env:
          SAFE_WORKFLOW_COMMIT: e5cdbe33efd2189c4ccafa83ec5c2e38d261920e
        run: |
          set -euo pipefail
          git show "${SAFE_WORKFLOW_COMMIT}:.github/workflows/viscore1-cert.yml" > .github/workflows/viscore1-cert.yml
          python prisma-html/tools/validate_rifat_authority.py
          python prisma-html/tools/refresh_files_manifest.py --check
          git diff --check
          python - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/viscore1-cert.yml',
              'prisma-html/FILES_MANIFEST.json',
              'prisma-html/authority/rifat/visual-source-manifest.json',
          }
          changed = {
              line.strip()
              for line in subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
              if line.strip()
          }
          if changed != expected:
              raise SystemExit(f'unexpected final delta: {sorted(changed)}')
          print('final delta verified:', sorted(changed))
          PY

      - name: Create final commit object without moving branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import base64
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          root = Path.cwd()
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          base_tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          paths = [
              '.github/workflows/viscore1-cert.yml',
              'prisma-html/FILES_MANIFEST.json',
              'prisma-html/authority/rifat/visual-source-manifest.json',
          ]

          def post(endpoint: str, payload: dict) -> dict:
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/{endpoint}',
                  data=json.dumps(payload).encode('utf-8'),
                  method='POST',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'prisma-viscore1-finalizer',
                  },
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)

          entries = []
          for rel in paths:
              raw = (root / rel).read_bytes()
              blob = post('git/blobs', {
                  'content': base64.b64encode(raw).decode('ascii'),
                  'encoding': 'base64',
              })
              entries.append({'path': rel, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})

          tree = post('git/trees', {'base_tree': base_tree, 'tree': entries})
          commit = post('git/commits', {
              'message': 'fix(rifat): persist reconciled visual authority manifests',
              'tree': tree['sha'],
              'parents': [parent],
          })
          out = root / 'final-commit-sha.txt'
          out.write_text(commit['sha'] + '\n', encoding='utf-8')
          print(f'FINAL_COMMIT_SHA={commit["sha"]}')
          PY

      - name: Upload final commit SHA
        uses: actions/upload-artifact@v4
        with:
          name: viscore1-final-commit-sha
          path: final-commit-sha.txt
          if-no-files-found: error
          retention-days: 1
