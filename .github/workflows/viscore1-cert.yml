name: PRISMA VISCORE1 Finalizer

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/viscore1-cert.yml'
      - 'prisma-html/**'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PINNED_MAIN_SHA: 'dec4ef395778be09cfe4b9ac2bc527efb80a9b0d'

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    name: validate and push reconciled merge
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Merge pinned current main without committing
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "$PINNED_MAIN_SHA"
          git -c user.name='prisma-viscore-finalizer' -c user.email='noreply@prisma.local' merge --no-commit --no-ff "$PINNED_MAIN_SHA"

      - name: Rebuild and validate RIFAT on reconciled tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          repo = Path.cwd()
          manifest_path = repo / 'prisma-html/authority/rifat/visual-source-manifest.json'
          targets = {
              'apps/terminal-de-venta-system/products/mobile/app/src/components/prisma-app/prisma-mobile-dashboard.module.css',
              'apps/terminal-de-venta-system/products/pc/app/components/inventory/pc-inventory-master-detail.module.css',
          }
          data = json.loads(manifest_path.read_text(encoding='utf-8'))
          seen = set()
          for entry in data.get('entries', []):
              output = entry.get('output')
              if output not in targets:
                  continue
              source = repo / entry['source']
              projected = repo / output
              source_bytes = source.read_bytes()
              output_bytes = projected.read_bytes()
              if source_bytes != output_bytes:
                  raise SystemExit(f"exact-copy drift remains: {entry['source']} -> {output}")
              digest = hashlib.sha256(source_bytes).hexdigest()
              entry['sourceSha256'] = digest
              entry['outputSha256'] = digest
              seen.add(output)
          missing = targets - seen
          if missing:
              raise SystemExit(f'missing RIFAT projection targets: {sorted(missing)}')
          manifest_path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

          python prisma-html/tools/validate_rifat_authority.py
          python prisma-html/tools/refresh_files_manifest.py --write
          python prisma-html/tools/refresh_files_manifest.py --check
          python prisma-html/tools/validate_rifat_authority.py
          sha256sum prisma-html/authority/rifat/visual-source-manifest.json prisma-html/FILES_MANIFEST.json

      - name: Commit and push reconciled merge
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          python prisma-html/tools/validate_rifat_authority.py
          python prisma-html/tools/refresh_files_manifest.py --check
          git diff --cached --check
          git config user.name 'prisma-viscore-finalizer'
          git config user.email 'noreply@prisma.local'
          git commit -m 'fix(rifat): reconcile VISCORE1 with current main authority'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
