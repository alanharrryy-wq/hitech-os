name: PC Customer Experience Wave 2 Evidence

on:
  pull_request:
    paths:
      - "apps/terminal-de-venta-system/products/pc/app/**"
      - ".github/workflows/pc-customer-experience-wave2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pc-customer-experience-wave2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PC_APP: apps/terminal-de-venta-system/products/pc/app
  BASE_URL: http://127.0.0.1:3130

jobs:
  runtime-gate:
    name: PC Wave 2 Runtime Visual Journey Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare isolated Playwright toolchain
        shell: bash
        run: |
          set -euo pipefail
          PW_ROOT="$RUNNER_TEMP/pc-wave2-playwright"
          mkdir -p "$PW_ROOT"
          npm install --prefix "$PW_ROOT" --no-audit --no-fund --no-package-lock @playwright/test@1.60.0
          echo "PRISMA_PLAYWRIGHT_TEST_MODULE=$PW_ROOT/node_modules/@playwright/test" >> "$GITHUB_ENV"
          "$PW_ROOT/node_modules/.bin/playwright" install --with-deps chromium

      - name: Prepare isolated runtime
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_ROOT="$RUNNER_TEMP/pc-wave2-runtime"
          LICENSE_PATH="$RUNTIME_ROOT/license.json"
          mkdir -p "$RUNTIME_ROOT/evidence" "$RUNTIME_ROOT/server"
          echo "DATABASE_URL=file:$RUNTIME_ROOT/canonical.db" >> "$GITHUB_ENV"
          echo "PRISMA_LICENSE_PATH=$LICENSE_PATH" >> "$GITHUB_ENV"
          echo "PRISMA_LICENSE_ALLOW_UNSIGNED=1" >> "$GITHUB_ENV"
          echo "PRISMA_RUNTIME_MODE=dev" >> "$GITHUB_ENV"
          echo "PRISMA_RUNTIME_ROLE=pc" >> "$GITHUB_ENV"
          echo "WAVE2_RUNTIME_ROOT=$RUNTIME_ROOT" >> "$GITHUB_ENV"

      - name: Generate PC Prisma client in isolated runner
        run: pnpm -C apps/terminal-de-venta-system/products/pc/app run prisma:generate

      - name: Migrate isolated SQLite
        run: pnpm -C apps/terminal-de-venta-system/products/pc/app run db:canonical:migrate

      - name: Seed populated isolated SQLite from canonical fixture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sqlite3
          from pathlib import Path
          from urllib.parse import unquote

          database_url = os.environ["DATABASE_URL"]
          if not database_url.startswith("file:"):
              raise SystemExit("Wave 2 evidence requires file: SQLite DATABASE_URL")
          database_path = Path(unquote(database_url[5:])).resolve()
          seed_path = Path("apps/terminal-de-venta-system/prisma/seeds/canonical.seed.json").resolve()
          seed = json.loads(seed_path.read_text(encoding="utf-8"))

          order = [
              ("businesses", "Business"),
              ("stores", "Store"),
              ("terminals", "Terminal"),
              ("taxRates", "TaxRate"),
              ("priceLists", "PriceList"),
              ("products", "Product"),
              ("barcodes", "Barcode"),
              ("priceListItems", "PriceListItem"),
              ("stockSnapshots", "StockSnapshot"),
              ("stockMovements", "StockMovement"),
              ("suppliers", "Supplier"),
              ("purchaseOrders", "PurchaseOrder"),
              ("purchaseOrderLines", "PurchaseOrderLine"),
              ("goodsReceipts", "GoodsReceipt"),
              ("goodsReceiptLines", "GoodsReceiptLine"),
              ("replenishmentSignals", "ReplenishmentSignal"),
              ("cashSessions", "CashSession"),
              ("cashMovements", "CashMovement"),
              ("sales", "Sale"),
              ("saleLines", "SaleLine"),
              ("saleReturns", "SaleReturn"),
              ("auditCounts", "AuditCount"),
              ("outboxEvents", "OutboxEvent"),
          ]

          def normalize(value):
              if isinstance(value, bool):
                  return 1 if value else 0
              if isinstance(value, (dict, list)):
                  return json.dumps(value, ensure_ascii=False, separators=(",", ":"))
              return value

          conn = sqlite3.connect(database_path)
          inserted = {}
          try:
              conn.execute("PRAGMA foreign_keys=ON")
              for collection, table in order:
                  rows = seed.get(collection, []) or []
                  table_columns = {row[1] for row in conn.execute(f'PRAGMA table_info("{table}")')}
                  if not table_columns:
                      raise RuntimeError(f"missing migrated table: {table}")
                  count = 0
                  for row in rows:
                      payload = {key: normalize(value) for key, value in row.items() if key in table_columns}
                      if not payload:
                          continue
                      columns = list(payload)
                      placeholders = ",".join("?" for _ in columns)
                      quoted = ",".join(f'"{column}"' for column in columns)
                      conn.execute(
                          f'INSERT INTO "{table}" ({quoted}) VALUES ({placeholders})',
                          [payload[column] for column in columns],
                      )
                      count += 1
                  inserted[table] = count
              conn.commit()

              required_nonempty = ["Business", "Product", "Supplier", "StockSnapshot", "StockMovement", "AuditCount"]
              observed = {
                  table: conn.execute(f'SELECT COUNT(*) FROM "{table}"').fetchone()[0]
                  for table in required_nonempty
              }
              missing = {table: count for table, count in observed.items() if count <= 0}
              if missing:
                  raise RuntimeError(f"canonical fixture did not populate required tables: {missing}")
              report = {"database": str(database_path), "seed": str(seed_path), "inserted": inserted, "observed": observed, "pass": True}
              out = Path(os.environ["WAVE2_RUNTIME_ROOT"]) / "evidence" / "CANONICAL_FIXTURE_SEED.json"
              out.write_text(json.dumps(report, indent=2), encoding="utf-8")
              print(json.dumps(report, indent=2))
          finally:
              conn.close()
          PY

      - name: Write entitled PC test license
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone, timedelta

          now = datetime.now(timezone.utc)
          payload = {
            "schemaVersion": "1.0.0",
            "licenseId": "lic_wave2_runtime_ci",
            "customerId": "cust_wave2_runtime_ci",
            "businessId": "biz_hitech_default",
            "storeId": "store_obrera_04",
            "plan": "TABLET_PC_MANAGED",
            "state": "active",
            "validFrom": (now - timedelta(days=1)).isoformat().replace("+00:00", "Z"),
            "validUntil": (now + timedelta(days=30)).isoformat().replace("+00:00", "Z"),
            "assignmentState": "assigned",
            "limits": {"maxDevices": 2},
            "features": {},
            "capabilities": {},
            "notes": ["Wave 2 isolated entitled PC runtime evidence fixture"]
          }
          target = Path(os.environ["PRISMA_LICENSE_PATH"])
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          print(f"entitled PC license fixture written: {target}")
          PY

      - name: Start isolated PC runtime
        shell: bash
        run: |
          set -euo pipefail
          pnpm -C apps/terminal-de-venta-system/products/pc/app dev > "$WAVE2_RUNTIME_ROOT/server/pc-3130.log" 2>&1 &
          echo $! > "$WAVE2_RUNTIME_ROOT/server/pc-3130.pid"

      - name: Wait for PC runtime
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            if curl --fail --silent --show-error "$BASE_URL/catalog" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "PC runtime did not become ready" >&2
          cat "$WAVE2_RUNTIME_ROOT/server/pc-3130.log" >&2 || true
          exit 1

      - name: Run Wave 2 runtime visual and customer journeys
        run: node "$PC_APP/tools/visual/verify_pc_customer_experience_wave2_runtime.mjs" --base-url "$BASE_URL" --out "$WAVE2_RUNTIME_ROOT/evidence"

      - name: Assert clean Wave 2 server log
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/pc-wave2-runtime"
          LOG="$ROOT/server/pc-3130.log"
          mkdir -p "$ROOT/evidence"
          if [[ ! -f "$LOG" ]]; then
            echo "Server log unavailable because runtime did not start." > "$ROOT/evidence/SERVER_LOG_NOT_CREATED.txt"
            exit 0
          fi
          cp "$LOG" "$ROOT/evidence/pc-3130.log"
          if grep -Eini "PrismaClientKnownRequestError|unhandledRejection|no such table|SQLITE_ERROR|Error: ENOENT|code[^A-Za-z0-9]+ENOENT" "$LOG"; then
            echo "Forbidden runtime error found in Wave 2 server log" >&2
            exit 1
          fi

      - name: Upload Wave 2 runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pc-customer-experience-wave2-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pc-wave2-runtime/evidence
          if-no-files-found: warn
          retention-days: 14

  restricted-license-evidence:
    name: PC Wave 2 Restricted License Evidence
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare isolated Playwright toolchain
        shell: bash
        run: |
          set -euo pipefail
          PW_ROOT="$RUNNER_TEMP/pc-wave2-playwright"
          mkdir -p "$PW_ROOT"
          npm install --prefix "$PW_ROOT" --no-audit --no-fund --no-package-lock @playwright/test@1.60.0
          echo "PRISMA_PLAYWRIGHT_TEST_MODULE=$PW_ROOT/node_modules/@playwright/test" >> "$GITHUB_ENV"
          "$PW_ROOT/node_modules/.bin/playwright" install --with-deps chromium

      - name: Prepare isolated restricted runtime
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_ROOT="$RUNNER_TEMP/pc-wave2-license"
          LICENSE_PATH="$RUNTIME_ROOT/license.json"
          mkdir -p "$RUNTIME_ROOT/evidence" "$RUNTIME_ROOT/server"
          echo "DATABASE_URL=file:$RUNTIME_ROOT/canonical.db" >> "$GITHUB_ENV"
          echo "PRISMA_LICENSE_PATH=$LICENSE_PATH" >> "$GITHUB_ENV"
          echo "PRISMA_LICENSE_ALLOW_UNSIGNED=1" >> "$GITHUB_ENV"
          echo "PRISMA_RUNTIME_MODE=dev" >> "$GITHUB_ENV"
          echo "PRISMA_RUNTIME_ROLE=pc" >> "$GITHUB_ENV"
          echo "PRISMA_LICENSE_DEVICE_ID=pc_wave2_restricted_ci" >> "$GITHUB_ENV"
          echo "WAVE2_LICENSE_ROOT=$RUNTIME_ROOT" >> "$GITHUB_ENV"

      - name: Generate PC Prisma client in restricted runner
        run: pnpm -C apps/terminal-de-venta-system/products/pc/app run prisma:generate

      - name: Migrate isolated restricted SQLite
        run: pnpm -C apps/terminal-de-venta-system/products/pc/app run db:canonical:migrate

      - name: Seed isolated restricted SQLite from canonical fixture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sqlite3
          from pathlib import Path
          from urllib.parse import unquote

          database_path = Path(unquote(os.environ["DATABASE_URL"][5:])).resolve()
          seed_path = Path("apps/terminal-de-venta-system/prisma/seeds/canonical.seed.json").resolve()
          seed = json.loads(seed_path.read_text(encoding="utf-8"))
          order = [
              ("businesses", "Business"), ("stores", "Store"), ("terminals", "Terminal"),
              ("taxRates", "TaxRate"), ("priceLists", "PriceList"), ("products", "Product"),
              ("barcodes", "Barcode"), ("priceListItems", "PriceListItem"), ("stockSnapshots", "StockSnapshot"),
              ("stockMovements", "StockMovement"), ("suppliers", "Supplier"), ("purchaseOrders", "PurchaseOrder"),
              ("purchaseOrderLines", "PurchaseOrderLine"), ("goodsReceipts", "GoodsReceipt"),
              ("goodsReceiptLines", "GoodsReceiptLine"), ("replenishmentSignals", "ReplenishmentSignal"),
              ("cashSessions", "CashSession"), ("cashMovements", "CashMovement"), ("sales", "Sale"),
              ("saleLines", "SaleLine"), ("saleReturns", "SaleReturn"), ("auditCounts", "AuditCount"),
              ("outboxEvents", "OutboxEvent"),
          ]
          def normalize(value):
              if isinstance(value, bool): return 1 if value else 0
              if isinstance(value, (dict, list)): return json.dumps(value, ensure_ascii=False, separators=(",", ":"))
              return value
          conn = sqlite3.connect(database_path)
          try:
              conn.execute("PRAGMA foreign_keys=ON")
              for collection, table in order:
                  columns = {row[1] for row in conn.execute(f'PRAGMA table_info("{table}")')}
                  if not columns: raise RuntimeError(f"missing migrated table: {table}")
                  for row in seed.get(collection, []) or []:
                      payload = {key: normalize(value) for key, value in row.items() if key in columns}
                      if not payload: continue
                      names = list(payload)
                      quoted = ",".join(f'"{name}"' for name in names)
                      placeholders = ",".join("?" for _ in names)
                      conn.execute(f'INSERT INTO "{table}" ({quoted}) VALUES ({placeholders})', [payload[name] for name in names])
              conn.commit()
          finally:
              conn.close()
          PY

      - name: Write restricted local test license
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone, timedelta

          now = datetime.now(timezone.utc)
          payload = {
            "schemaVersion": "1.0.0",
            "licenseId": "lic_wave2_restricted_ci",
            "customerId": "cust_wave2_restricted_ci",
            "businessId": "biz_hitech_default",
            "storeId": "store_obrera_04",
            "deviceId": "pc_wave2_restricted_ci",
            "plan": "TABLET_SOLO",
            "state": "active",
            "validFrom": (now - timedelta(days=1)).isoformat().replace("+00:00", "Z"),
            "validUntil": (now + timedelta(days=30)).isoformat().replace("+00:00", "Z"),
            "assignmentState": "assigned",
            "authorizedDevices": [
              {"deviceId": "pc_wave2_restricted_ci", "role": "pc", "storeId": "store_obrera_04"}
            ],
            "limits": {"maxDevices": 1},
            "features": {},
            "capabilities": {},
            "notes": ["Wave 2 isolated restricted-license evidence fixture"]
          }
          target = Path(os.environ["PRISMA_LICENSE_PATH"])
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          print(f"restricted license fixture written: {target}")
          PY

      - name: Start restricted PC runtime
        shell: bash
        run: |
          set -euo pipefail
          pnpm -C apps/terminal-de-venta-system/products/pc/app dev > "$WAVE2_LICENSE_ROOT/server/pc-3130.log" 2>&1 &
          echo $! > "$WAVE2_LICENSE_ROOT/server/pc-3130.pid"

      - name: Wait for restricted PC runtime
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            if curl --silent --show-error "$BASE_URL/catalog" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "Restricted PC runtime did not become ready" >&2
          cat "$WAVE2_LICENSE_ROOT/server/pc-3130.log" >&2 || true
          exit 1

      - name: Collect restricted license navigation evidence
        run: node "$PC_APP/tools/visual/verify_pc_customer_experience_wave2_license.mjs" --base-url "$BASE_URL" --out "$WAVE2_LICENSE_ROOT/evidence"

      - name: Preserve restricted runtime log
        if: always()
        shell: bash
        run: |
          ROOT="$RUNNER_TEMP/pc-wave2-license"
          mkdir -p "$ROOT/evidence"
          if [[ -f "$ROOT/server/pc-3130.log" ]]; then
            cp "$ROOT/server/pc-3130.log" "$ROOT/evidence/pc-3130.log"
          else
            echo "Server log unavailable because restricted runtime did not start." > "$ROOT/evidence/SERVER_LOG_NOT_CREATED.txt"
          fi

      - name: Upload restricted license evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pc-customer-experience-wave2-license-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pc-wave2-license/evidence
          if-no-files-found: warn
          retention-days: 14
