name: UIMAP Certified Pilot Crosswalk Once

on:
  push:
    branches:
      - agent/prisma-html-three-app-visual-closure
    paths:
      - .github/workflows/uimap-certified-pilot-crosswalk-once.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: tools/code-atlas/src
  EXPECTED_PARENT: 30a17a8c2e23014edd7a14392801ebca776c2d4e
  EXPECTED_RUNNER_BLOB: 76ec89e8339e933a587bd625909341853117ef8e
  EXPECTED_PROMOTION_BLOB: f0f84e4b3c38585bb4ee0dbe4dc20d0ea075a420
  EXPECTED_HELPER_BLOB: 66f13ee5612037e46310bfdf24f0b119d4685eff

jobs:
  crosswalk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact transaction branch
        uses: actions/checkout@v6
        with:
          ref: agent/prisma-html-three-app-visual-closure
          fetch-depth: 2
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Fail closed on preimage drift
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git hash-object tools/code-atlas/src/code_atlas/app_map/uimap/runner.py)" = "$EXPECTED_RUNNER_BLOB"
          test "$(git hash-object tools/code-atlas/src/code_atlas/ui_bridge/binding_promotion.py)" = "$EXPECTED_PROMOTION_BLOB"
          test "$(git hash-object tools/code-atlas/src/code_atlas/app_map/uimap/governed_markers.py)" = "$EXPECTED_HELPER_BLOB"
          test ! -e tools/code-atlas/tests/test_operational_uimap_certified_pilot_crosswalk.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Replace governed marker helper with certified alias crosswalk producer
        shell: bash
        run: |
          set -euo pipefail
          echo ' ' | base64 -d > tools/code-atlas/src/code_atlas/app_map/uimap/governed_markers.py
          echo '21e64fd029d3557a4fe6455d3d7758b6c12ef25d4eb018ee16cfc3345bcdc7bd  tools/code-atlas/src/code_atlas/app_map/uimap/governed_markers.py' | sha256sum -c -

      - name: Patch UIMAP alias emission
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > "$RUNNER_TEMP/patch_runner.py"
          python "$RUNNER_TEMP/patch_runner.py"

      - name: Patch binding promotion alias awareness
        shell: bash
        run: |
          set -euo pipefail
          echo ' ' | base64 -d > "$RUNNER_TEMP/patch_binding.py"
          python "$RUNNER_TEMP/patch_binding.py"

      - name: Materialize focused crosswalk regression
        shell: bash
        run: |
          set -euo pipefail
          echo '  ' | base64 -d > tools/code-atlas/tests/test_operational_uimap_certified_pilot_crosswalk.py
          echo 'e05da778d4622de63968f29941a1238b3eed7c2fa3a7a3d8d5b0614163399393  tools/code-atlas/tests/test_operational_uimap_certified_pilot_crosswalk.py' | sha256sum -c -

      - name: Compile and run focused tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/code-atlas/src/code_atlas/app_map/uimap/governed_markers.py \
            tools/code-atlas/src/code_atlas/app_map/uimap/runner.py \
            tools/code-atlas/src/code_atlas/ui_bridge/binding_promotion.py \
            tools/code-atlas/tests/test_operational_uimap_certified_pilot_crosswalk.py \
            tools/code-atlas/tests/test_operational_uimap_candidate_evidence.py \
            tools/code-atlas/tests/test_operational_uimap_route_projection.py \
            tools/code-atlas/tests/test_operational_ui_bridge_multisurface.py
          python -m unittest -v \
            tools/code-atlas/tests/test_operational_uimap_certified_pilot_crosswalk.py \
            tools/code-atlas/tests/test_operational_uimap_candidate_evidence.py \
            tools/code-atlas/tests/test_operational_uimap_route_projection.py \
            tools/code-atlas/tests/test_operational_ui_bridge_multisurface.py

      - name: Generate real three-app mapping evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/certified-crosswalk"
          python -m code_atlas.cli.main ui-bridge refresh-three-app-map \
            --product-root "$GITHUB_WORKSPACE" \
            --governor-root "$GITHUB_WORKSPACE/prisma-html" \
            --output-root "$RUNNER_TEMP/certified-crosswalk" \
            --binding-registry "$GITHUB_WORKSPACE/prisma-html/authority/rifat/identity/registries/element-bindings.registry.json" \
            --pilot-contract "$GITHUB_WORKSPACE/apps/terminal-de-venta-system/products/pc/app/docs/visual-pilots/PC_STOCK_FICHA_TABLET_LICENSES_VISUAL_PILOT_V1.contract.json" \
            --workers 18

      - name: Prove certified alias crosswalk without canonical drift
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from code_atlas.ui_bridge.repository import BridgeRepository

          root = Path(os.environ['RUNNER_TEMP']) / 'certified-crosswalk'
          refresh = json.loads((root / 'PRISMA_THREE_APP_VISUAL_MAPPING_REFRESH.json').read_text(encoding='utf-8'))
          if refresh.get('status') == 'BLOCKED_BY_UIMAP':
              raise SystemExit('CROSSWALK_BLOCKED_UIMAP')

          uimap_root = root / 'uimap'
          repository = BridgeRepository.load([uimap_root / 'batches'])
          pilot_id = 'PC-STOCK-FICHA-PANEL-01'
          canonical_id = repository.resolve_alias(pilot_id)
          if canonical_id == pilot_id:
              raise SystemExit('STOCK_FICHA_CERTIFIED_ALIAS_NOT_RESOLVED')
          component = repository.component(pilot_id)
          if component is None:
              raise SystemExit('STOCK_FICHA_CANONICAL_COMPONENT_NOT_FOUND')
          if component.get('componentUiId') != canonical_id:
              raise SystemExit('STOCK_FICHA_ALIAS_TARGET_COMPONENT_MISMATCH')
          if component.get('runtimeAlias') != 'pc':
              raise SystemExit('STOCK_FICHA_CANONICAL_RUNTIME_DRIFT')
          if component.get('routeId') != 'ROUTE.pc.stock' or component.get('routePath') != '/stock':
              raise SystemExit('STOCK_FICHA_CANONICAL_ROUTE_DRIFT')
          if component.get('ownerFile') != 'apps/terminal-de-venta-system/products/pc/app/components/inventory/inventory-workspace.tsx':
              raise SystemExit('STOCK_FICHA_CANONICAL_OWNER_FILE_DRIFT')
          if component.get('adapterId') != 'ADP.PC.ADMIN.V2':
              raise SystemExit('STOCK_FICHA_CANONICAL_ADAPTER_DRIFT')
          if component.get('componentUiId') == pilot_id:
              raise SystemExit('STOCK_FICHA_PILOT_ID_BECAME_CANONICAL')
          if component.get('neutralMeaningId') is not None:
              raise SystemExit('STOCK_FICHA_NEUTRAL_MEANING_MUST_REMAIN_UNRESOLVED')
          if component.get('targetResolutionStatus') == 'SOURCE_RESOLVED':
              raise SystemExit('STOCK_FICHA_MUST_NOT_FAKE_SOURCE_RESOLVED')
          if component.get('applicationReadiness') != 'BLOCKED':
              raise SystemExit('STOCK_FICHA_APPLICATION_MUST_REMAIN_BLOCKED')

          alias_rows = []
          for batch in repository.batches:
              for alias in batch.get('aliases', []):
                  if alias.get('aliasId') == pilot_id:
                      alias_rows.append(alias)
          certified = [
              alias for alias in alias_rows
              if alias.get('reason') == 'CERTIFIED_VISUAL_PILOT_CROSSWALK'
              and alias.get('canonicalComponentUiId') == canonical_id
          ]
          if len(certified) != 1:
              raise SystemExit(f'STOCK_FICHA_CERTIFIED_ALIAS_COUNT:{len(certified)}')
          alias = certified[0]
          if (alias.get('pilotTrace') or {}).get('adapterId') != 'ADP.PC.DENSE.CLOUDGLASS.V1':
              raise SystemExit('STOCK_FICHA_PILOT_ADAPTER_PROVENANCE_MISSING')
          if (alias.get('canonicalTrace') or {}).get('adapterId') != 'ADP.PC.ADMIN.V2':
              raise SystemExit('STOCK_FICHA_CANONICAL_ADAPTER_PROVENANCE_MISSING')

          gaps = json.loads((root / 'PRISMA_UI_BRIDGE_BINDING_GAP_MATRIX.json').read_text(encoding='utf-8'))
          gap_rows = [row for row in gaps.get('rows', []) if row.get('componentUiId') == canonical_id]
          if len(gap_rows) != 1:
              raise SystemExit(f'STOCK_FICHA_CANONICAL_GAP_ROW_COUNT:{len(gap_rows)}')
          gap = gap_rows[0]
          alignment = gap.get('pilotAlignment') or {}
          if alignment.get('aligned') is not True:
              raise SystemExit('STOCK_FICHA_PILOT_CROSSWALK_NOT_ALIGNED:' + json.dumps(alignment, sort_keys=True))
          if alignment.get('identityResolution') != 'CERTIFIED_ALIAS_CROSSWALK':
              raise SystemExit('STOCK_FICHA_PILOT_IDENTITY_RESOLUTION_WRONG')
          if alignment.get('pilotComponentUiId') != pilot_id or alignment.get('canonicalComponentUiId') != canonical_id:
              raise SystemExit('STOCK_FICHA_PILOT_CROSSWALK_IDS_WRONG')
          blockers = set(gap.get('blockingReasons') or [])
          if 'MISSING_COORDINATE:neutralMeaningId' not in blockers:
              raise SystemExit('STOCK_FICHA_NEUTRAL_MEANING_BLOCKER_MISSING')
          if gap.get('uimapState', {}).get('applicationReadiness') != 'BLOCKED':
              raise SystemExit('STOCK_FICHA_PROMOTION_MUST_REMAIN_BLOCKED')

          cobrar = repository.component('TB-POS-PAY-COBRAR-BTN-01')
          if not cobrar or cobrar.get('targetResolutionStatus') != 'SOURCE_RESOLVED':
              raise SystemExit('COBRAR_GOLDEN_REGRESSION')

          uimap = refresh.get('uimap') or {}
          gates = uimap.get('gates') or {}
          if gates and gates.get('productByteForByteIntact') is False:
              raise SystemExit('PRODUCT_BYTES_CHANGED')
          if gates and gates.get('governorByteForByteIntact') is False:
              raise SystemExit('GOVERNOR_BYTES_CHANGED')

          print(json.dumps({
              'pilotAliasId': pilot_id,
              'canonicalComponentUiId': canonical_id,
              'canonicalAdapterId': component.get('adapterId'),
              'pilotAdapterId': (alias.get('pilotTrace') or {}).get('adapterId'),
              'pilotAlignment': alignment,
              'blockingReasons': sorted(blockers),
              'cobrarStatus': cobrar.get('targetResolutionStatus'),
          }, indent=2, sort_keys=True))
          PY

      - name: Prove read-only product/governor scope and commit source
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only -- prisma-html apps/terminal-de-venta-system/products/tablet apps/terminal-de-venta-system/products/pc apps/terminal-de-venta-system/products/mobile)"
          changed="$(git diff --name-only; git ls-files --others --exclude-standard)"
          printf '%s\n' "$changed"
          printf '%s\n' "$changed" | grep -Fx 'tools/code-atlas/src/code_atlas/app_map/uimap/governed_markers.py'
          printf '%s\n' "$changed" | grep -Fx 'tools/code-atlas/src/code_atlas/app_map/uimap/runner.py'
          printf '%s\n' "$changed" | grep -Fx 'tools/code-atlas/src/code_atlas/ui_bridge/binding_promotion.py'
          printf '%s\n' "$changed" | grep -Fx 'tools/code-atlas/tests/test_operational_uimap_certified_pilot_crosswalk.py'
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | sort -u | wc -l)" -eq 4

          git config user.name 'prisma-uimap-bot'
          git config user.email 'prisma-uimap-bot@users.noreply.github.com'
          git add \
            tools/code-atlas/src/code_atlas/app_map/uimap/governed_markers.py \
            tools/code-atlas/src/code_atlas/app_map/uimap/runner.py \
            tools/code-atlas/src/code_atlas/ui_bridge/binding_promotion.py \
            tools/code-atlas/tests/test_operational_uimap_certified_pilot_crosswalk.py
          git rm .github/workflows/uimap-certified-pilot-crosswalk-once.yml
          git commit -m 'fix(uimap): add certified pilot alias crosswalk'
          git push origin HEAD:agent/prisma-html-three-app-visual-closure
