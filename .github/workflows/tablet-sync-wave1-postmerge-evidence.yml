name: Tablet Sync WAVE1 Postmerge Evidence

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/tablet-sync-wave1-postmerge-evidence.yml]

permissions:
  contents: read

concurrency:
  group: tablet-sync-wave1-postmerge-evidence
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  TARGET_SHA: 7d5637685b86e910e2dd5aaa00a61f88422d34d3
  AUTHORITY_MESH_REQUEST_ID: 0c4e35332bcadda9
  APP_ROOT: apps/terminal-de-venta-system/products/tablet/app
  EVIDENCE_DIR: evidence/tablet-sync-wave1-postmerge
  RUNTIME_PORT: '3120'

jobs:
  tablet-sync-wave1-postmerge:
    if: github.head_ref == 'evidence/tablet-sync-wave1-postmerge'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact target
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Pin evidence scope
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          cat > "$EVIDENCE_DIR/scope.json" <<JSON
          {"schemaVersion":"tablet.sync.wave1.postmerge.evidence.v1","targetSha":"$TARGET_SHA","authorityMeshRequestId":"$AUTHORITY_MESH_REQUEST_ID","productMutation":false,"dbMutation":false,"prismaGenerate":false,"workflowOnlyEvidenceBranch":true}
          JSON

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install standalone Tablet safely
        shell: bash
        run: |
          set -euo pipefail
          pnpm -C "$APP_ROOT" install --frozen-lockfile --ignore-scripts 2>&1 | tee "$EVIDENCE_DIR/tablet-install.log"
          test -x "$APP_ROOT/node_modules/.bin/next"
          test ! -e "$APP_ROOT/.generated/prisma-client"

      - name: Run current truth gates
        shell: bash
        run: |
          set -euo pipefail
          node "$APP_ROOT/tools/verify_tablet_sync_panel_truth_1808.mjs" 2>&1 | tee "$EVIDENCE_DIR/verify-sync.log"
          pnpm -C "$APP_ROOT" run verify:zero-important 2>&1 | tee "$EVIDENCE_DIR/verify-zero-important.log"
          pnpm -C "$APP_ROOT" run verify:tablet-license-missing-fallback 2>&1 | tee "$EVIDENCE_DIR/verify-license.log"
          pnpm -C "$APP_ROOT" run verify:tablet-operational-gate 2>&1 | tee "$EVIDENCE_DIR/verify-operational.log"
          pnpm -C "$APP_ROOT" run verify:tablet-sync-dispatcher 2>&1 | tee "$EVIDENCE_DIR/verify-dispatcher.log"

      - name: Resolve preinstalled Chrome
        id: chrome
        shell: bash
        run: |
          set -euo pipefail
          chrome=''
          for c in google-chrome google-chrome-stable chromium chromium-browser; do
            command -v "$c" >/dev/null 2>&1 && chrome="$(command -v "$c")" && break
          done
          test -n "$chrome"
          "$chrome" --version | tee "$EVIDENCE_DIR/chrome.log"
          echo "bin=$chrome" >> "$GITHUB_OUTPUT"

      - name: Start runner-local Tablet only
        shell: bash
        run: |
          set -euo pipefail
          if curl -sf --max-time 1 "http://127.0.0.1:$RUNTIME_PORT/" >/dev/null 2>&1; then
            echo "BLOCKED occupied runner port $RUNTIME_PORT; refusing cleanup" | tee "$EVIDENCE_DIR/runtime-start.log"
            exit 1
          fi
          setsid bash -lc "cd '$APP_ROOT' && exec pnpm exec next dev --webpack -p '$RUNTIME_PORT'" > "$EVIDENCE_DIR/server.log" 2>&1 &
          echo $! > "$EVIDENCE_DIR/server.pid"
          for _ in $(seq 1 120); do
            curl -sf --max-time 2 "http://127.0.0.1:$RUNTIME_PORT/sync" >/dev/null 2>&1 && exit 0
            kill -0 "$(cat "$EVIDENCE_DIR/server.pid")" >/dev/null 2>&1 || break
            sleep 1
          done
          tail -n 240 "$EVIDENCE_DIR/server.log" || true
          exit 1

      - name: Materialize governed runtime capture
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/capture.mjs.gz.b64" <<'B64'
          
          B64
          base64 -d "$RUNNER_TEMP/capture.mjs.gz.b64" | gzip -d > "$RUNNER_TEMP/capture-wave1-postmerge.mjs"
          node --check "$RUNNER_TEMP/capture-wave1-postmerge.mjs"

      - name: Capture fail-closed multi-state runtime evidence
        shell: bash
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.bin }}
        run: node "$RUNNER_TEMP/capture-wave1-postmerge.mjs"

      - name: Build immutable evidence manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [ -d "$EVIDENCE_DIR" ] || exit 0
          find "$EVIDENCE_DIR" -type f -print0 | sort -z | xargs -0 sha256sum > "$EVIDENCE_DIR/MANIFEST.sha256"
          python - <<'PY2'
          import hashlib,json,os
          from pathlib import Path
          r=Path(os.environ['EVIDENCE_DIR']); rows=[]
          for p in sorted(r.rglob('*')):
              if p.is_file() and p.name!='MANIFEST.json':
                  b=p.read_bytes(); rows.append({'path':p.relative_to(r).as_posix(),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          (r/'MANIFEST.json').write_text(json.dumps({'schemaVersion':'tablet.sync.wave1.postmerge.evidence-manifest.v1','targetSha':os.environ['TARGET_SHA'],'files':rows},indent=2),encoding='utf-8')
          PY2

      - name: Stop only runner-local process
        if: always()
        shell: bash
        run: |
          set +e
          if [ -f "$EVIDENCE_DIR/server.pid" ]; then
            pid="$(cat "$EVIDENCE_DIR/server.pid")"
            kill -0 "$pid" >/dev/null 2>&1 && (kill -TERM -- "-$pid" >/dev/null 2>&1 || kill -TERM "$pid" >/dev/null 2>&1 || true)
          fi

      - name: Upload postmerge evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tablet-sync-wave1-postmerge-${{ env.TARGET_SHA }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 14
