name: Code Atlas External Hardening Closure

on:
  push:
    branches: ['governance/code-atlas-external-closure-1508']
    paths:
      - '.github/workflows/caext-closure-apply.yml'

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  BASELINE: caf918694c1c397d19a61bff217800d027a384e3

jobs:
  evidence-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout governed closure branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Verify closure baseline and applicator
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$BASELINE")" = "$BASELINE"
          git diff --exit-code "$BASELINE"..HEAD -- \
            tools/code-atlas \
            "PRISMA Factory Ledger" \
            apps/terminal-de-venta-system/docs/ops/PRISMA_FIELD_MANUAL_APRENDIZAJE_OPERATIVO.md
          python -m py_compile .github/scripts/caext_closure_apply.py

      - name: Apply evidence-only closure
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/caext_closure_apply.py
          python -m json.tool tools/code-atlas/docs/CODE_ATLAS_CUSTOMER_WOW_V1.contract.json >/dev/null
          python -m json.tool "PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER.json" >/dev/null
          python -m json.tool "PRISMA Factory Ledger/PRISMA_EVIDENCE_INDEX.json" >/dev/null
          git diff --check

      - name: Run Code Atlas regression suite
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/tools/code-atlas/src" \
            python -m unittest discover -s tools/code-atlas/tests -p 'test_*.py' -q

      - name: Enforce effective closure scope
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/caext-closure-apply.yml .github/scripts/caext_closure_apply.py
          git add -A
          git diff --cached "$BASELINE" --name-only | sort | tee /tmp/caext_closure_paths.txt
          python - <<'PY'
          from pathlib import Path
          expected = {
              "PRISMA Factory Ledger/PRISMA_EVIDENCE_INDEX.json",
              "PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER.json",
              "apps/terminal-de-venta-system/docs/ops/PRISMA_FIELD_MANUAL_APRENDIZAJE_OPERATIVO.md",
              "tools/code-atlas/README.md",
              "tools/code-atlas/docs/CODE_ATLAS_CUSTOMER_WOW_V1.contract.json",
              "tools/code-atlas/docs/CODE_ATLAS_CUSTOMER_WOW_V1.md",
          }
          actual = {x for x in Path("/tmp/caext_closure_paths.txt").read_text(encoding="utf-8").splitlines() if x}
          print("EFFECTIVE_CLOSURE_PATHS=", sorted(actual))
          if actual != expected:
              raise SystemExit("CLOSURE_SCOPE_MISMATCH:" + repr({
                  "missing": sorted(expected - actual),
                  "extra": sorted(actual - expected),
              }))
          PY
          git diff --cached --check
          git diff --cached --stat

      - name: Commit evidence closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Code Atlas Governance Bot"
          git config user.email "code-atlas-governance@example.invalid"
          git commit -m "docs(code-atlas): close external falsification evidence gate"
          git rev-parse HEAD
          git push origin "HEAD:${GITHUB_REF_NAME}"
