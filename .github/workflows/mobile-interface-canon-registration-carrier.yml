name: Mobile Interface Canon Registration Carrier

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  register-mobile-interface-canon:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'governance/mobile-interface-canon-registration-20260825'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact carrier branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Fail closed on base drift
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "5c805bc2f448af0b2742b52e19055b05f1859bab"

      - name: Register canonical capability only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          path = Path('PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          cid = 'mobile.interface_specification_canon'
          ids = [str(x.get('id') or '') for x in data.get('capabilities', []) if isinstance(x, dict)]
          if cid in ids:
              raise SystemExit(f'{cid} already exists; fail closed')

          data['capabilities'].append({
              'id': cid,
              'displayName': 'PRISMA Mobile canonical interface specification',
              'domain': 'mobile',
              'surfaces': ['mobile', 'governance'],
              'classification': 'BUILD',
              'status': 'NOT_STARTED',
              'stateLabel': 'REGISTERED_CANON_BUILD_NOT_STARTED',
              'doNotRebuild': False,
              'nextGate': 'Create the single aspirational PRISMA Mobile interface canon and retire only explicitly superseded competing interface/product specifications under a fresh task-exact Authority Mesh and MUTATION anti-rework gate. Preserve all Mobile product source, APIs, runtime, PWA behavior, data/security/sync/licensing contracts, verifiers, technical evidence and Atlas implementation maps.',
              'evidence': [
                  'Mobile interface consolidation audit Authority Mesh run 32869966974 artifact 9571804870 sha256:1f89a1391920e1aac8e7d701dc544c37238ddb52bc56a80ed8444d941cdc95a7',
                  'Mobile interface canon registration Authority Mesh run 32870972064 artifact 9572278651 sha256:b3f174fb173d710adf71edd25878998f46a287f211512f88c0604a9967b29e94',
                  'Registration Authority Mesh requestDigest 39a745a7f80fa6c865493d3aa40877654b4892aad4938dbc489690f2a6c19f80'
              ],
              'doesNotProve': [
                  'The canonical Mobile interface specification has been created',
                  'Current Mobile runtime or source conforms to the future canon',
                  'Any Mobile source, API, runtime, data, sync, licensing or verifier mutation is authorized',
                  'Visual or runtime certification',
                  'Tablet or PC changes'
              ],
              'allowedActions': [
                  'verify the registration',
                  'advance to documentation-only canon consolidation under fresh exact-task authority',
                  'build only the bounded canonical interface specification and retirement migration'
              ],
              'forbiddenActions': [
                  'modify Mobile application source as part of registration',
                  'delete technical runtime, security, sync, licensing, release or verifier evidence',
                  'treat current Mobile runtime as product-interface authority',
                  'claim code conformance from documentation'
              ],
              'forbiddenClaims': [
                  'Do not claim the PRISMA Mobile interface canon is DONE from registration alone.',
                  'Do not claim current Mobile implementation conforms to an aspirational canon that has not been created yet.'
              ]
          })
          mx = timezone(timedelta(hours=-6))
          data['updatedAt'] = datetime.now(mx).isoformat(timespec='seconds')
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Validate canonical anti-rework authority
        shell: bash
        run: |
          set -euo pipefail
          python "PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py" --validate
          python "PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py" --self-test

      - name: Remove carrier and commit bounded registration
        shell: bash
        run: |
          set -euo pipefail
          rm -f '.github/workflows/mobile-interface-canon-registration-carrier.yml'
          git config user.name 'prisma-governance-carrier[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- 'PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER.json' '.github/workflows/mobile-interface-canon-registration-carrier.yml'
          git diff --cached --exit-code && { echo 'Expected bounded registration diff was empty'; exit 1; } || true
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = '2'
          git commit -m 'governance(mobile): register interface specification canon'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
