name: PC Atlasfin RIFAT PC Authority Bridge

on:
  push:
    branches:
      - agent/pc-atlasfin-rifat-pc-authority-bridge-20260830
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Generate fresh PC-only Visual Control source evidence
        shell: bash
        run: |
          set -euo pipefail
          PARSER_ROOT="$RUNNER_TEMP/prisma-visual-parser"
          mkdir -p "$PARSER_ROOT"
          npm install --prefix "$PARSER_ROOT" --package-lock=false --ignore-scripts postcss@8 >/dev/null
          APP_ROOT="$GITHUB_WORKSPACE/apps/terminal-de-venta-system"
          test ! -e "$APP_ROOT/node_modules"
          ln -s "$PARSER_ROOT/node_modules" "$APP_ROOT/node_modules"
          cd "$APP_ROOT"
          node --input-type=module -e "import('postcss').then(m => console.log('POSTCSS_OK=' + !!m.default))"
          OUT="$RUNNER_TEMP/pc-visual-control-fresh"
          mkdir -p "$OUT"
          node tools/quality/ui-visual-control.mjs visual-control:certify --surface pc --strict --output-root "$OUT" | tee "$RUNNER_TEMP/pc-visual-control-certify.log"
          echo "PC_VC_OUT=$OUT" >> "$GITHUB_ENV"
          rm -f "$APP_ROOT/node_modules"
          test -z "$(git status --short -- products/pc .prisma-ui .governance)"

      - name: Apply source-only per-surface RIFAT bridge
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/pc_rifat_authority_bridge.py --repo "$GITHUB_WORKSPACE" --vc "$PC_VC_OUT" | tee "$RUNNER_TEMP/bridge-motor.log"

      - name: Refresh identity snapshot and compiled projections
        shell: bash
        run: |
          set -euo pipefail
          python prisma-html/tools/identity_binding_resolver.py refresh-snapshot --write | tee "$RUNNER_TEMP/identity-refresh.log"
          cd prisma-html
          python tools/compile_identity_dictionary.py --write | tee "$RUNNER_TEMP/identity-compile-write.log"
          python tools/compile_identity_dictionary.py --check | tee "$RUNNER_TEMP/identity-compile-check.log"
          python tools/validate_identity_dictionary.py | tee "$RUNNER_TEMP/identity-dictionary-validate.log"
          python tools/validate_identity_bindings.py | tee "$RUNNER_TEMP/identity-bindings-validate.log"
          python tools/identity_binding_resolver.py example | tee "$RUNNER_TEMP/tablet-example-regression.log"

      - name: Enforce bridge invariants and allowed diff
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import os
          import subprocess

          repo = Path(os.environ['GITHUB_WORKSPACE'])
          bindings = json.loads((repo / 'prisma-html/authority/rifat/identity/registries/bindings.registry.json').read_text(encoding='utf-8'))
          pc = next(x for x in bindings['bindings'] if x['surface'] == 'pc')
          tb = next(x for x in bindings['bindings'] if x['surface'] == 'tablet')
          assert pc['readiness'] == 'CERTIFIED_BINDING_SOURCE'
          assert pc['ownerSource'] == 'authority/rifat/prisma-ui/visual-control/pc/owners.json'
          assert pc['componentSource'] == 'authority/rifat/prisma-ui/visual-control/pc/components.json'
          assert pc['slotSource'] == 'authority/rifat/prisma-ui/visual-control/pc/editable-slots.json'
          assert pc['layerSource'] == 'authority/rifat/prisma-ui/visual-control/pc/layers.json'
          assert pc['runtimeProjectionAllowed'] is False
          assert tb['readiness'] == 'CERTIFIED_BINDING_SOURCE'
          assert tb['ownerSource'] == 'authority/rifat/prisma-ui/visual-control/owners.json'

          registry = json.loads((repo / 'prisma-html/authority/rifat/identity/registries/element-bindings.registry.json').read_text(encoding='utf-8'))
          cobrar = next(x for x in registry['bindings'] if x['bindingId'] == 'BND.ACT.PRIMARY.TABLET.POS.COBRAR.V1')
          target = cobrar['targets'][0]
          assert target['layerId'] == 'LYR.ACT.PRIMARY.TABLET.POS.COBRAR.BASE'
          assert target['status'] == 'RESOLVED'

          changed = subprocess.check_output(['git', 'diff', '--name-only'], cwd=repo, text=True).splitlines()
          allowed_prefixes = (
              'prisma-html/authority/rifat/prisma-ui/visual-control/pc/',
              'prisma-html/authority/rifat/identity/compiled/current/',
          )
          allowed_exact = {
              'prisma-html/authority/rifat/identity/registries/bindings.registry.json',
              'prisma-html/authority/rifat/identity/registries/element-bindings.registry.json',
              'prisma-html/authority/rifat/identity/bindings/reports/BINDING_COVERAGE.json',
              'prisma-html/authority/rifat/identity/bindings/examples/preview-primary-tablet.binding-envelope.json',
              'prisma-html/tools/identity_binding_resolver_core.py',
          }
          bad = [p for p in changed if p not in allowed_exact and not p.startswith(allowed_prefixes)]
          if bad:
              raise SystemExit('UNEXPECTED_DIFF=' + json.dumps(bad))
          product = [p for p in changed if p.startswith('apps/terminal-de-venta-system/products/')]
          if product:
              raise SystemExit('PRODUCT_MUTATION=' + json.dumps(product))

          result = {'status': 'PASS_SOURCE_ONLY_BRIDGE', 'changed': changed}
          print(json.dumps(result, indent=2))
          (Path(os.environ['RUNNER_TEMP']) / 'bridge-invariants.json').write_text(json.dumps(result, indent=2) + '\n', encoding='utf-8')
          PY
          git diff --check
          git diff --stat | tee "$RUNNER_TEMP/diff-stat.txt"

      - name: Commit validated source-only bridge and remove carriers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PRISMA GitHub Carrier"
          git config user.email "actions@users.noreply.github.com"
          git add prisma-html/authority/rifat/prisma-ui/visual-control/pc \
                  prisma-html/authority/rifat/identity/registries/bindings.registry.json \
                  prisma-html/authority/rifat/identity/registries/element-bindings.registry.json \
                  prisma-html/authority/rifat/identity/bindings/reports/BINDING_COVERAGE.json \
                  prisma-html/authority/rifat/identity/bindings/examples/preview-primary-tablet.binding-envelope.json \
                  prisma-html/authority/rifat/identity/compiled/current \
                  prisma-html/tools/identity_binding_resolver_core.py
          git rm .github/workflows/pc-atlasfin-rifat-pc-authority-bridge.yml
          git rm .github/scripts/pc_rifat_authority_bridge.py
          git diff --cached --check
          git commit -m "feat(identity): add per-surface PC binding authority"
          git push origin HEAD:agent/pc-atlasfin-rifat-pc-authority-bridge-20260830

      - name: Upload bridge evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc-atlasfin-rifat-pc-authority-bridge-evidence
          path: |
            ${{ runner.temp }}/pc-visual-control-certify.log
            ${{ runner.temp }}/bridge-motor.log
            ${{ runner.temp }}/identity-refresh.log
            ${{ runner.temp }}/identity-compile-write.log
            ${{ runner.temp }}/identity-compile-check.log
            ${{ runner.temp }}/identity-dictionary-validate.log
            ${{ runner.temp }}/identity-bindings-validate.log
            ${{ runner.temp }}/tablet-example-regression.log
            ${{ runner.temp }}/bridge-invariants.json
            ${{ runner.temp }}/diff-stat.txt
          if-no-files-found: warn
          retention-days: 7
