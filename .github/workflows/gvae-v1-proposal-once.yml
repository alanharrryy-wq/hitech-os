name: PRISMA GVAE V1 Proposal Gate Once

on:
  push:
    branches:
      - feat/gvae-v1-implementation-3108

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  EXPECTED_MAIN: '565abc2742ab18dce1fcd729cd8f0f1633d3ef34'

jobs:
  proposal:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout implementation carrier
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: feat/gvae-v1-implementation-3108

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run exact canonical Factory Ledger PROPOSAL gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          actual="$(git rev-parse origin/main)"
          test "$actual" = "$EXPECTED_MAIN"
          canonical="$RUNNER_TEMP/canonical-main"
          git worktree add --detach "$canonical" "$EXPECTED_MAIN"
          cat > "$RUNNER_TEMP/gvae-proposal.request.json" <<JSON
          {
            "schemaVersion":"prisma.factory-ledger.anti-rework-gate.v1",
            "mode":"PROPOSAL",
            "expectedHead":"$EXPECTED_MAIN",
            "task":"Build the canonical Generic Visual Application Engine V1 only after governance authorization. Scope the proposal to prisma-html tools/visual_application, generated visual-control target-index, identity application contracts, Visual Core source/static readiness, deterministic tests including frozen Cobrar parity, minimal source/static CI, canonical Master Map documentation references, and eventual Ledger/Evidence closure. Preserve Code Atlas UI Bridge read-only, preserve Cobrar historical runner/evidence, preserve NDC neutral meaning and RIFAT exact-location authority, forbid guessed target/binding/layer/adapter/recipe authority, direct generated-product writes, !important, arbitrary TSX/JSX/DOM/business/API/routing/DB/Prisma/migration mutations, surface expansion, stale hashes, and fake runtime green.",
            "capabilities":[
              {"id":"visual.generic_application_engine_v1","requestedAction":"BUILD"}
            ],
            "visualMutation":false
          }
          JSON
          (
            cd "$canonical"
            python "PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py" --request "$RUNNER_TEMP/gvae-proposal.request.json" > "$RUNNER_TEMP/gvae-proposal.result.json"
          )
          python - "$RUNNER_TEMP/gvae-proposal.result.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          assert d.get('result')=='PASS_ANTI_REWORK_GATE', d
          assert d.get('errors')==[], d
          assert d.get('repoHead')=='565abc2742ab18dce1fcd729cd8f0f1633d3ef34', d
          sel=d.get('selected') or []
          assert len(sel)==1 and sel[0].get('id')=='visual.generic_application_engine_v1', d
          assert sel[0].get('classification')=='BUILD', d
          assert sel[0].get('status')=='NOT_STARTED', d
          assert sel[0].get('doNotRebuild') is False, d
          PY

      - name: Upload proposal evidence
        uses: actions/upload-artifact@v7
        with:
          name: gvae-v1-proposal-gate
          path: |
            ${{ runner.temp }}/gvae-proposal.request.json
            ${{ runner.temp }}/gvae-proposal.result.json
          if-no-files-found: error
          retention-days: 14

      - name: Remove one-shot proposal workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/gvae-v1-proposal-once.yml
          git config user.name 'prisma-governance-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(governance): close GVAE V1 proposal harness'
          git push origin HEAD:feat/gvae-v1-implementation-3108
