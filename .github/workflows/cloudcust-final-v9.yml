name: cloudcust final v9

on:
  push:
    branches: [cloudcust-runtime-20260814]
    paths: [.github/workflows/cloudcust-final-v9.yml]

permissions:
  contents: write

jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: cloudcust-runtime-20260814
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Authority, main and preimage
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          git merge-base --is-ancestor origin/main HEAD || { echo 'BRANCH_NOT_ON_CURRENT_MAIN'; exit 1; }
          test "$(git hash-object 'apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/py/command_center_store.py')" = 'dfec957562bf548ac6b4c9133d089fa7a8a31e8f'
          test "$(git hash-object 'apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/web/cloud_command_center.js')" = 'a3d460029a8cfd38ec0664527add991fb0c9c415'
          test "$(git hash-object 'apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/web/cloud_command_center.html')" = '919b2d72807e5af9709ff5e0a1815ab11349ba87'
          test "$(git hash-object 'apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/py/prisma_unified_lab_v3.py')" = 'b8ba736c5ed2e1074332d3713b167d39d906e2f6'
          test -f 'apps/terminal-de-venta-system/tools/_cloudcust_finalize_source_v2.py'
          echo "HEAD=$(git rev-parse HEAD)"
          echo "MAIN=$(git rev-parse origin/main)"
          echo PASS_AUTHORITY_MAIN_PREIMAGE

      - name: Apply readable runtime and proven click-lifecycle fix
        shell: bash
        run: |
          set -euo pipefail
          python 'apps/terminal-de-venta-system/tools/_cloudcust_finalize_source_v2.py'
          python - <<'PY'
          from pathlib import Path
          import json
          app=Path('apps/terminal-de-venta-system')
          js_path=app/'Prisma Cloud Ctr/internal/web/cloud_command_center.js'
          html_path=app/'Prisma Cloud Ctr/internal/web/cloud_command_center.html'
          report_path=Path('.cloudcust-evidence/SOURCE_PATCH_REPORT.json')

          html=html_path.read_text(encoding='utf-8')
          ent='      <button type="button" data-surface="entitlements">Licencias</button>\n'
          bill='      <button type="button" data-surface="billing">Cobranza</button>\n'
          if bill not in html:
              if html.count(ent)!=1: raise SystemExit('BILLING_NAV_ANCHOR')
              html=html.replace(ent,ent+bill,1)
          viewport='<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n'
          if '<link rel="icon" href="data:,">' not in html:
              if html.count(viewport)!=1: raise SystemExit('VIEWPORT_ANCHOR')
              html=html.replace(viewport,viewport+'  <link rel="icon" href="data:,">\n',1)
          html_path.write_text(html,encoding='utf-8')

          js=js_path.read_text(encoding='utf-8')
          interaction='active.matches("input,select,textarea,button,[contenteditable=\'true\']")'
          if js.count(interaction)!=1: raise SystemExit(f'INTERACTION_ANCHOR:{js.count(interaction)}')
          js=js.replace(interaction,'active.matches("input,select,textarea,[contenteditable=\'true\']")',1)

          change_start=js.find('    document.addEventListener("change", (event) => {')
          click_start=js.find('    document.addEventListener("click", (event) => {',change_start)
          if change_start<0 or click_start<=change_start: raise SystemExit(f'CHANGE_CLICK_RANGE:{change_start}:{click_start}')
          change='''    document.addEventListener("change", (event) => {\n      const field=event.target.closest("[data-flow-field]");\n      if(!field) return;\n      syncFlowFromDom();\n      const key=field.dataset.flowField;\n      state.flow[key]=field.value;\n      if(key!=="clientRequestId") state.flow.clientRequestId="";\n      reconcileDependencies(key);\n      if(field.tagName==="SELECT") render();\n    });\n'''
          js=js[:change_start]+change+js[click_start:]

          capture='''    document.addEventListener("click",(event)=>{ if(state.openPicker && !event.target.closest("[data-picker-toggle],[data-picker-panel]")){ syncFlowFromDom(); state.openPicker=null; render(); } }, true);\n'''
          bubble='''    document.addEventListener("click",(event)=>{\n      if(state.openPicker && !event.target.closest("[data-picker-toggle],[data-picker-panel],[data-action]")){\n        syncFlowFromDom();\n        state.openPicker=null;\n        render();\n      }\n    });\n'''
          if js.count(capture)!=1: raise SystemExit(f'PICKER_CAPTURE_ANCHOR:{js.count(capture)}')
          js=js.replace(capture,bubble,1)
          js_path.write_text(js,encoding='utf-8')

          report=json.loads(report_path.read_text(encoding='utf-8'))
          extras=[
            'billing_navigation_exposed','button_focus_not_edit_session','text_change_preserves_action_target',
            'select_change_preserves_dependency_refresh','picker_close_after_action_dispatch','action_click_excluded_from_picker_rerender',
            'favicon_console_noise_removed','hidden_evidence_upload_enabled','structural_event_range_patch'
          ]
          report['improvements']=report.get('improvements',[])+extras
          report['improvementCount']=len(report['improvements'])
          report_path.write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print('PASS_PROVEN_BROWSER_FIX')
          print('IMPROVEMENTS='+str(report['improvementCount']))
          PY

      - name: Static contracts
        shell: bash
        run: |
          set -euo pipefail
          APP='apps/terminal-de-venta-system'
          python -m py_compile \
            "$APP/Prisma Cloud Ctr/internal/py/customer_registration.py" \
            "$APP/Prisma Cloud Ctr/internal/py/customer_registration_runtime.py" \
            "$APP/Prisma Cloud Ctr/internal/py/command_center_store.py" \
            "$APP/Prisma Cloud Ctr/internal/py/prisma_unified_lab_v3.py" \
            "$APP/tools/verify-cloud-center-customer-registration-01.py" \
            "$APP/tools/verify-cloud-center-customer-runtime-02.py"
          node --check "$APP/Prisma Cloud Ctr/internal/web/cloud_command_center.js"
          python - <<'PY'
          from pathlib import Path
          app=Path('apps/terminal-de-venta-system')
          js=(app/'Prisma Cloud Ctr/internal/web/cloud_command_center.js').read_text(encoding='utf-8')
          html=(app/'Prisma Cloud Ctr/internal/web/cloud_command_center.html').read_text(encoding='utf-8')
          store=(app/'Prisma Cloud Ctr/internal/py/command_center_store.py').read_text(encoding='utf-8')
          verifier=(app/'tools/verify-cloud-center-customer-runtime-02.py').read_text(encoding='utf-8')
          required=['data-customer-registration-form="v2"','Medición homologada','syncFlowFromDom','reconcileDependencies','clientRequestId','noDefault:true','field.tagName==="SELECT"','[data-picker-toggle],[data-picker-panel],[data-action]']
          missing=[m for m in required if m not in js]
          if missing: raise SystemExit('MISSING:'+','.join(missing))
          if html.count('data-surface="billing"')!=1: raise SystemExit('BILLING_NAV_COUNT')
          if '<html lang="es-MX">' not in html or '<link rel="icon" href="data:,">' not in html: raise SystemExit('HTML_SEMANTICS')
          if 'customer_registration_runtime' not in store or 'PRISMA_COMMAND_CENTER_DB_PATH' not in store: raise SystemExit('STORE_RUNTIME_SEAM')
          start=js.index('function clientWizard'); end=js.index('function deviceWizard',start); client=js[start:end]
          for forbidden in ('cityZone','selectField("plan"','save-other-values'):
              if forbidden in client: raise SystemExit('LEGACY_CUSTOMER_FIELD:'+forbidden)
          if "page.click('[data-surface=\"customers\"]')" not in verifier or "Medición homologada') && document.body.innerText.includes('Cliente Runtime UI')" not in verifier:
              raise SystemExit('CUSTOMER_DESK_PROJECTION_GATE_MISSING')
          print('PASS_STATIC_FINAL_CONTRACTS')
          PY
          git diff --check

      - name: Local registration verifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cloudcust-evidence/local
          python 'apps/terminal-de-venta-system/tools/verify-cloud-center-customer-registration-01.py' --out-dir .cloudcust-evidence/local | tee .cloudcust-evidence/local/registration.log

      - name: Chrome browser runtime E2E
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input playwright==1.54.0
          mkdir -p .cloudcust-evidence/runtime
          python 'apps/terminal-de-venta-system/tools/verify-cloud-center-customer-runtime-02.py' --out-dir .cloudcust-evidence/runtime | tee .cloudcust-evidence/runtime/runtime.log

      - name: Final certification and field manual
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          ev=Path('.cloudcust-evidence')
          expected=[
            ('local/CLOUD_CENTER_CUSTOMER_REGISTRATION_VERIFY.json','PASS_CLOUD_CENTER_CUSTOMER_REGISTRATION_LOCAL_VERIFIED'),
            ('runtime/CLOUD_CENTER_CUSTOMER_RUNTIME_VERIFY.json','PASS_CLOUD_CENTER_CUSTOMER_RUNTIME_VISUAL_VERIFIED')
          ]
          for rel,result in expected:
              p=ev/rel
              if not p.exists(): raise SystemExit('MISSING_EVIDENCE:'+rel)
              d=json.loads(p.read_text(encoding='utf-8'))
              if d.get('status')!='PASS' or d.get('result')!=result: raise SystemExit(f'NON_PASS:{rel}:{d}')
          report=json.loads((ev/'SOURCE_PATCH_REPORT.json').read_text(encoding='utf-8'))
          report.update({
            'status':'PASS_DIRECT_SOURCE_FINALIZATION',
            'registrationVerifier':'PASS_CLOUD_CENTER_CUSTOMER_REGISTRATION_LOCAL_VERIFIED',
            'runtimeVerifier':'PASS_CLOUD_CENTER_CUSTOMER_RUNTIME_VISUAL_VERIFIED',
            'realDatabaseTouched':False,'liveProcessesTouched':False,
            'transport':'direct-readable-source-no-base64','authorityMainAncestry':'PASS','gitDiffCheck':'PASS',
            'browserRootCause':'text_input_change_render_replaced_action_target_before_click',
            'projectionContract':'created customer is verified on Customers desk after successful provisioning response'
          })
          (ev/'CLOUDCUST_FINAL_REPORT.json').write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          manual=Path('apps/terminal-de-venta-system/docs/ops/PRISMA_FIELD_MANUAL_APRENDIZAJE_OPERATIVO.md')
          marker='## 2026-08-14 — Cloud Center customer registration: direct-source finalization'
          text=manual.read_text(encoding='utf-8')
          if marker not in text:
              entry=f'''\n\n{marker}\n\n- **Tipo:** FIX + UX hardening / transport + browser lifecycle recovery.\n- **Superficie:** Prisma Cloud Center 3160, customer registration/navigation only. Tablet/PC/Mobile/Cloudflare/Prisma schema excluded.\n- **Transporte:** el payload base64 falló antes de `git apply`; se reemplazó por fuente UTF-8 legible con SHA de preimage y gate de `main` vigente.\n- **Causa browser:** `change` de un input re-renderizaba `surfaceRoot.innerHTML` entre pointerdown y click, destruyendo el botón. Diagnóstico confirmó `busy=false`, cero entrada a `handleAction`.\n- **Fix browser:** texto sincroniza estado sin render en `change`; selects sí renderizan para dependencias; picker cierra en bubble y excluye acciones.\n- **Contrato E2E:** el POST de alta debe responder 200/ok; la proyección del cliente se certifica en la mesa `Clientes`, no duplicando el nombre en la pantalla de Alta.\n- **Gates:** registro local PASS, Chrome runtime PASS, consola/red limpia, `git diff --check` PASS, DB/puerto efímeros.\n- **Regla:** no usar base64/zip para patches grandes si Git puede aplicar fuente legible. No recrear el target entre pointerdown y click por blur/change/capture.\n- **Evidencia:** artifact `cloudcust-1408-final-v9`.\n- **Rollback:** revert del commit/PR; pre-commit CI es efímero y fail-closed.\n'''
              manual.write_text(text.rstrip()+entry+'\n',encoding='utf-8')
          print(report['status'], 'improvements='+str(report['improvementCount']))
          PY

      - name: Remove temporary transport and workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            '.github/workflows/cloudcust-click-inspect.yml' \
            '.github/workflows/cloudcust-runtime-apply-once.yml' \
            '.github/workflows/cloudcust-source-finalize.yml' \
            '.github/workflows/cloudcust-source-finalize-v2.yml' \
            '.github/workflows/cloudcust-source-finalize-v3.yml' \
            '.github/workflows/cloudcust-source-finalize-v4.yml' \
            '.github/workflows/cloudcust-source-finalize-v5.yml' \
            '.github/workflows/cloudcust-runtime-diagnose-v6.yml' \
            '.github/workflows/cloudcust-source-finalize-v7.yml' \
            '.github/workflows/cloudcust-source-finalize-v8.yml' \
            '.github/workflows/cloudcust-final-v9.yml' \
            'apps/terminal-de-venta-system/tools/_cloudcust_patch_part1.txt' \
            'apps/terminal-de-venta-system/tools/_cloudcust_patch_part2.txt' \
            'apps/terminal-de-venta-system/tools/_cloudcust_patch_part3.txt' \
            'apps/terminal-de-venta-system/tools/_cloudcust_patch_part4.txt' \
            'apps/terminal-de-venta-system/tools/_cloudcust_patch_part5.txt' \
            'apps/terminal-de-venta-system/tools/_cloudcust_runtime_patch.zb64' \
            'apps/terminal-de-venta-system/tools/_cloudcust_finalize_source_v2.py'
          git diff --check
          if git status --short | grep -E '(_cloudcust_|cloudcust-source-finalize|cloudcust-runtime-diagnose|cloudcust-click-inspect|cloudcust-runtime-apply-once|cloudcust-final-v9)'; then
            echo TEMP_TRANSPORT_REMAINS
            git status --short
            exit 1
          fi
          echo PASS_ZERO_TEMP_TRANSPORT

      - name: Upload final evidence
        uses: actions/upload-artifact@v4
        with:
          name: cloudcust-1408-final-v9
          path: .cloudcust-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Commit certified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PRISMA Cloud Center Bot'
          git config user.email 'prisma-cloud-center-bot@users.noreply.github.com'
          rm -rf .cloudcust-evidence
          git add -A
          git diff --cached --check
          if git diff --cached --name-only | grep -E '(_cloudcust_|cloudcust-source-finalize|cloudcust-runtime-diagnose|cloudcust-click-inspect|cloudcust-runtime-apply-once|cloudcust-final-v9)'; then
            echo TEMP_FILE_STAGED
            exit 1
          fi
          git diff --cached --quiet && { echo NO_FINAL_DIFF; exit 1; }
          git diff --cached --stat
          git commit -m 'fix(cloud-center): finalize governed customer registration runtime'
          git push origin HEAD:cloudcust-runtime-20260814
          echo "FINAL_HEAD=$(git rev-parse HEAD)"
