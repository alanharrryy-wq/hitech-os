name: Code Atlas External Hardening Commit

on:
  push:
    branches: ['fix/code-atlas-external-hardening-1508']
    paths:
      - '.github/workflows/caext-fix-apply.yml'

permissions:
  contents: write
  actions: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  PIN: 6bd15cda5649a58c7bac806faff446c9074a2d94
  SOURCE_PATCH_SHA256: 6ad4e0dc057490172534556340e9b22e1d289895f3e61127fc9efe6f5c7b566a

jobs:
  commit-proven-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout governed branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Verify clean Code Atlas baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$PIN")" = "$PIN"
          git diff --exit-code "$PIN"..HEAD -- tools/code-atlas

      - name: Download previously falsified-and-passed fix evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fix-evidence"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9242394010/zip" \
            -o "$RUNNER_TEMP/fix-evidence/artifact.zip"
          unzip -q "$RUNNER_TEMP/fix-evidence/artifact.zip" -d "$RUNNER_TEMP/fix-evidence/unpacked"
          test -f "$RUNNER_TEMP/fix-evidence/unpacked/source_fix.patch"
          actual="$(sha256sum "$RUNNER_TEMP/fix-evidence/unpacked/source_fix.patch" | awk '{print $1}')"
          echo "SOURCE_PATCH_SHA256=$actual"
          test "$actual" = "$SOURCE_PATCH_SHA256"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP'])/'fix-evidence/unpacked/external_fix_validation.json'
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data.get('passed') is True, data
          assert len(data.get('repos') or []) == 3, data
          assert all(r.get('passed') is True for r in data['repos']), data
          print('PRIOR_EXTERNAL_EVIDENCE=PASS_3_OF_3')
          PY

      - name: Apply exact proven patch
        shell: bash
        run: |
          set -euo pipefail
          patch="$RUNNER_TEMP/fix-evidence/unpacked/source_fix.patch"
          git apply --check "$patch"
          git apply "$patch"
          git diff --check
          git diff --name-only -- tools/code-atlas | sort

      - name: Re-run complete Code Atlas test suite
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q tools/code-atlas/src tools/code-atlas/tests
          PYTHONPATH="$GITHUB_WORKSPACE/tools/code-atlas/src" \
            python -m unittest discover -s tools/code-atlas/tests -p 'test_*.py' -v

      - name: Enforce effective final diff against governed baseline
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/caext-fix-apply.yml
          git add -A
          git diff --cached "$PIN" --name-only | sort | tee "$RUNNER_TEMP/final_changed_files.txt"
          python - <<'PY'
          import os
          from pathlib import Path
          expected = {
              'tools/code-atlas/src/code_atlas/intelligence/common.py',
              'tools/code-atlas/src/code_atlas/intelligence/repository.py',
              'tools/code-atlas/src/code_atlas/intelligence/graphs.py',
              'tools/code-atlas/src/code_atlas/change_intelligence/universal_binding.py',
              'tools/code-atlas/tests/test_operational_universal_intelligence.py',
              'tools/code-atlas/tests/test_operational_change_intelligence_binding.py',
          }
          actual = {x for x in (Path(os.environ['RUNNER_TEMP'])/'final_changed_files.txt').read_text().splitlines() if x}
          print('EFFECTIVE_FINAL_PATHS=', sorted(actual))
          assert actual == expected, {'missing': sorted(expected-actual), 'extra': sorted(actual-expected)}
          PY
          git diff --cached --check

      - name: Commit exact source hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Code Atlas Governance Bot"
          git config user.email "code-atlas-governance@example.invalid"
          git commit -m "fix(code-atlas): harden external repository intelligence"
          git rev-parse HEAD
          git push origin "HEAD:${GITHUB_REF_NAME}"
