name: Code Atlas External Hardening Apply

on:
  push:
    branches: ['fix/code-atlas-external-hardening-1508']
    paths:
      - '.github/workflows/caext-fix-apply.yml'

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  fix-and-falsify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact governed branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Verify baseline and decode governed applicator
        shell: bash
        run: |
          set -euo pipefail
          PIN=6bd15cda5649a58c7bac806faff446c9074a2d94
          test "$(git merge-base HEAD "$PIN")" = "$PIN"
          git diff --exit-code "$PIN"..HEAD -- tools/code-atlas
          python - <<'PY'
          import base64, gzip, hashlib, os
          from pathlib import Path
          payload = ''
          raw = gzip.decompress(base64.b64decode(payload))
          expected = '05d8c545e9967b972b8a1159fa3a7f8bf9dfa3af589428daca836765cb00d864'
          actual = hashlib.sha256(raw).hexdigest()
          if actual != expected:
              raise SystemExit(f'APPLICATOR_DIGEST_MISMATCH:{actual}')
          target = Path(os.environ['RUNNER_TEMP']) / 'caext_fix_apply.py'
          target.write_bytes(raw)
          print('APPLICATOR=' + str(target))
          print('SHA256=' + actual)
          PY
          python -m py_compile "$RUNNER_TEMP/caext_fix_apply.py"

      - name: Apply exact-target source fix
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/caext_fix_apply.py" --apply --repo-root "$GITHUB_WORKSPACE"
          git diff --check
          git status --short

      - name: Run complete Code Atlas unit suite
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/caext_fix_apply.py" --validate --repo-root "$GITHUB_WORKSPACE"

      - name: Re-run external falsification targets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/caext-fix-evidence"
          python "$RUNNER_TEMP/caext_fix_apply.py" --external --repo-root "$GITHUB_WORKSPACE" --out "$RUNNER_TEMP/caext-fix-evidence"
          git diff --binary 6bd15cda5649a58c7bac806faff446c9074a2d94 -- tools/code-atlas > "$RUNNER_TEMP/caext-fix-evidence/source_fix.patch"
          sha256sum "$RUNNER_TEMP/caext-fix-evidence/source_fix.patch" > "$RUNNER_TEMP/caext-fix-evidence/source_fix.patch.sha256"

      - name: Enforce final source scope and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/caext-fix-apply.yml
          git add -A
          git diff --cached --name-only | sort | tee "$RUNNER_TEMP/caext-fix-evidence/final_changed_files.txt"
          python - <<'PY'
          from pathlib import Path
          import os
          allowed = {
              'tools/code-atlas/src/code_atlas/intelligence/common.py',
              'tools/code-atlas/src/code_atlas/intelligence/repository.py',
              'tools/code-atlas/src/code_atlas/intelligence/graphs.py',
              'tools/code-atlas/src/code_atlas/change_intelligence/universal_binding.py',
              'tools/code-atlas/tests/test_operational_universal_intelligence.py',
              'tools/code-atlas/tests/test_operational_change_intelligence_binding.py',
          }
          paths = {p for p in Path(os.environ['RUNNER_TEMP']).joinpath('caext-fix-evidence/final_changed_files.txt').read_text().splitlines() if p}
          extra = sorted(paths - allowed)
          missing = sorted(allowed - paths)
          print('FINAL_PATHS', sorted(paths))
          if extra:
              raise SystemExit('SCOPE_VIOLATION:' + ','.join(extra))
          if missing:
              raise SystemExit('EXPECTED_FIX_PATH_MISSING:' + ','.join(missing))
          PY
          git diff --cached --check

      - name: Commit exact source fix to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Code Atlas Governance Bot"
          git config user.email "code-atlas-governance@example.invalid"
          git commit -m "fix(code-atlas): harden external repository intelligence"
          git rev-parse HEAD | tee "$RUNNER_TEMP/caext-fix-evidence/final_commit.txt"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload fix evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: caext-fix-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: ${{ runner.temp }}/caext-fix-evidence
