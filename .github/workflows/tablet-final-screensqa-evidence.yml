name: Tablet Final ScreensQA Runtime Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tablet-final-screensqa-evidence.yml'
      - '.github/evidence/tablet-final-screensqa-capture.mjs'

permissions:
  contents: read

concurrency:
  group: tablet-final-screensqa-runtime-evidence
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PRODUCT_TARGET: 01b1d2f6c3f654fbe51d2336bb2d7fc4741563eb
  EVIDENCE_BASE: 630f025e3b41ac932a10ffab2f5992817c3037e5
  APP_ROOT: apps/terminal-de-venta-system/products/tablet/app
  EVIDENCE_DIR: evidence/tablet-final-screensqa
  RUNTIME_PORT: '3120'
  CHROME_DEBUG_PORT: '9224'

jobs:
  tablet-final-screensqa-runtime:
    if: github.head_ref == 'evidence/tablet-final-screensqa-2608'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout evidence carrier
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Preserve harness and pin certified Tablet product target
        shell: bash
        env:
          EVIDENCE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -n "$EVIDENCE_HEAD"
          test "$(git merge-base "$EVIDENCE_BASE" "$EVIDENCE_HEAD")" = "$EVIDENCE_BASE"
          python - "$EVIDENCE_BASE" "$EVIDENCE_HEAD" <<'PY'
          import subprocess, sys
          base, head = sys.argv[1:3]
          allowed={'.github/workflows/tablet-final-screensqa-evidence.yml','.github/evidence/tablet-final-screensqa-capture.mjs'}
          changed=set(subprocess.check_output(['git','diff','--name-only',base+'..'+head],text=True).splitlines())
          if changed != allowed: raise SystemExit(f'EVIDENCE_CARRIER_SCOPE_DRIFT:{sorted(changed)}')
          PY
          mkdir -p "$RUNNER_TEMP/screensqa-harness"
          git show "$EVIDENCE_HEAD:.github/evidence/tablet-final-screensqa-capture.mjs" > "$RUNNER_TEMP/screensqa-harness/capture.mjs"
          git checkout --detach "$PRODUCT_TARGET"
          test "$(git rev-parse HEAD)" = "$PRODUCT_TARGET"
          test -z "$(git status --porcelain)"
          mkdir -p "$EVIDENCE_DIR"
          cat > "$EVIDENCE_DIR/scope.json" <<JSON
          {"schemaVersion":"tablet.final.screensqa.scope.v1","productTarget":"$PRODUCT_TARGET","evidenceBase":"$EVIDENCE_BASE","evidenceCarrierHead":"$EVIDENCE_HEAD","authorityRun":32963408883,"authorityArtifact":9604786000,"authorityDigest":"sha256:f2f95c2c9d4d71325c00087f7b8b98b9dd7c35f09252ab6ac2146c1d636b0011","customerContractRoutes":22,"directStatic":17,"aliases":2,"dynamicFixtures":3,"canonicalTabletLayers":948,"productMutation":false,"dbMutation":false,"prismaGenerate":false,"runtime":"runner-local-isolated","browserFixtureTransport":"CDP Fetch interception","screenshotsRequired":22}
          JSON

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install standalone Tablet safely
        shell: bash
        run: |
          set -euo pipefail
          pnpm -C "$APP_ROOT" install --frozen-lockfile --ignore-scripts 2>&1 | tee "$EVIDENCE_DIR/tablet-install.log"
          test -x "$APP_ROOT/node_modules/.bin/next"
          test ! -e "$APP_ROOT/.generated/prisma-client"

      - name: Run protected source gates
        shell: bash
        run: |
          set -euo pipefail
          pnpm -C "$APP_ROOT" run verify:zero-important 2>&1 | tee "$EVIDENCE_DIR/verify-zero-important.log"
          pnpm -C "$APP_ROOT" run verify:tablet-license-missing-fallback 2>&1 | tee "$EVIDENCE_DIR/verify-license.log"
          node - <<'NODE' | tee "$EVIDENCE_DIR/route-contract.log"
          const fs=require('fs'); const p=process.env.APP_ROOT+'/src/navigation/tablet-page-contracts.ts'; const s=fs.readFileSync(p,'utf8');
          const rows=[...s.matchAll(/\{ route: '[^']+', label: '[^']+', module: '[^']+', roles: \[[^\]]*\], visibility: '[^']+', canonicalRoute: '[^']+', finalMenu: (?:true|false), order: \d+, rationale: '[^']*' \}/g)];
          if(rows.length!==22) throw new Error('TABLET_CUSTOMER_ROUTE_CONTRACT_DRIFT:'+rows.length);
          if(!s.includes("{ route: '/tablet-lab', replacement: null")) throw new Error('TABLET_LAB_RETIREMENT_MISSING');
          console.log('PASS_TABLET_SCREENSQA_ROUTE_CONTRACT 22/22; tablet-lab retired');
          NODE

      - name: Resolve preinstalled Chrome
        id: chrome
        shell: bash
        run: |
          set -euo pipefail
          chrome=''
          for c in google-chrome google-chrome-stable chromium chromium-browser; do command -v "$c" >/dev/null 2>&1 && chrome="$(command -v "$c")" && break; done
          test -n "$chrome"
          "$chrome" --version | tee "$EVIDENCE_DIR/chrome-version.log"
          echo "bin=$chrome" >> "$GITHUB_OUTPUT"

      - name: Start isolated Tablet runtime
        shell: bash
        run: |
          set -euo pipefail
          if curl -sf --max-time 1 "http://127.0.0.1:$RUNTIME_PORT/" >/dev/null 2>&1; then echo "BLOCKED occupied runner port $RUNTIME_PORT; refusing cleanup" | tee "$EVIDENCE_DIR/runtime-start.log"; exit 1; fi
          setsid bash -lc "cd '$APP_ROOT' && exec pnpm exec next dev --webpack -p '$RUNTIME_PORT'" > "$EVIDENCE_DIR/server.log" 2>&1 &
          echo $! > "$EVIDENCE_DIR/server.pid"
          for _ in $(seq 1 120); do curl -sf --max-time 2 "http://127.0.0.1:$RUNTIME_PORT/" >/dev/null 2>&1 && exit 0; kill -0 "$(cat "$EVIDENCE_DIR/server.pid")" >/dev/null 2>&1 || break; sleep 1; done
          tail -n 240 "$EVIDENCE_DIR/server.log" || true
          exit 1

      - name: Start isolated headless Chrome
        shell: bash
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.bin }}
        run: |
          set -euo pipefail
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-debugging-address=127.0.0.1 --remote-debugging-port="$CHROME_DEBUG_PORT" --user-data-dir="$RUNNER_TEMP/screensqa-chrome-profile" about:blank > "$EVIDENCE_DIR/chrome-runtime.log" 2>&1 &
          echo $! > "$EVIDENCE_DIR/chrome.pid"
          for _ in $(seq 1 80); do curl -sf --max-time 1 "http://127.0.0.1:$CHROME_DEBUG_PORT/json/version" > "$EVIDENCE_DIR/chrome-debug.json" 2>/dev/null && exit 0; kill -0 "$(cat "$EVIDENCE_DIR/chrome.pid")" >/dev/null 2>&1 || break; sleep 0.25; done
          cat "$EVIDENCE_DIR/chrome-runtime.log" || true
          exit 1

      - name: Capture governed Tablet customer screens
        shell: bash
        env:
          RUNTIME_URL: http://127.0.0.1:3120
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/screensqa-harness/capture.mjs" 2>&1 | tee "$EVIDENCE_DIR/browser-capture.log"
          grep -Fq 'PASS_TABLET_FINAL_SCREENSQA_BROWSER_22_22' "$EVIDENCE_DIR/browser-capture.log"
          test "$(find "$EVIDENCE_DIR/screenshots" -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 22

      - name: Build runtime evidence summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('evidence/tablet-final-screensqa'); shots=sorted((root/'screenshots').glob('*.png')) if (root/'screenshots').exists() else []
          manifest=[{'name':p.name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in shots]
          results={}
          if (root/'screensqa-results.json').exists(): results=json.loads((root/'screensqa-results.json').read_text(encoding='utf-8'))
          report={'schemaVersion':'tablet.final.screensqa.evidence.report.v1','productTarget':'01b1d2f6c3f654fbe51d2336bb2d7fc4741563eb','evidenceBase':'630f025e3b41ac932a10ffab2f5992817c3037e5','authorityRun':32963408883,'authorityArtifact':9604786000,'authorityDigest':'sha256:f2f95c2c9d4d71325c00087f7b8b98b9dd7c35f09252ab6ac2146c1d636b0011','screenshotCount':len(manifest),'screenshots':manifest,'capturedCount':results.get('capturedCount',0),'failedCount':results.get('failedCount',22),'claimCeiling':['runner-local isolated visual/runtime evidence only','does not prove distributable package','does not prove hosted production','does not mutate or certify production DB','does not authorize visual source changes']}
          root.mkdir(parents=True,exist_ok=True); (root/'RUNTIME_EVIDENCE.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          marker='PASS_TABLET_FINAL_SCREENSQA_RUNTIME_NO_FAKE_GREEN' if report['screenshotCount']==22 and report['failedCount']==0 else 'BLOCKED_TABLET_FINAL_SCREENSQA_RUNTIME'
          (root/'FINAL_RESULT.txt').write_text(marker+'\n',encoding='utf-8')
          PY

      - name: Stop only runner-owned processes
        if: always()
        shell: bash
        run: |
          set +e
          for pidfile in "$EVIDENCE_DIR/chrome.pid" "$EVIDENCE_DIR/server.pid"; do [ ! -f "$pidfile" ] || kill "$(cat "$pidfile")" >/dev/null 2>&1 || true; done

      - name: Upload Tablet Final ScreensQA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tablet-final-screensqa-runtime
          path: ${{ env.EVIDENCE_DIR }}/**
          if-no-files-found: error
          retention-days: 14

      - name: Final runtime gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$EVIDENCE_DIR/FINAL_RESULT.txt"
          grep -Fxq 'PASS_TABLET_FINAL_SCREENSQA_RUNTIME_NO_FAKE_GREEN' "$EVIDENCE_DIR/FINAL_RESULT.txt"
          test "$(find "$EVIDENCE_DIR/screenshots" -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 22
          node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(x.failedCount!==0||x.capturedCount!==22)process.exit(1)' "$EVIDENCE_DIR/screensqa-results.json"
