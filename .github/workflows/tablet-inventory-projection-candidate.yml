name: Tablet Inventory Projection Candidate

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tablet-inventory-projection-candidate.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  SOURCE_PATH: prisma-html/authority/rifat/tablet/runtime-sources/modules/catalog-stock-selling-assist/catalog-stock-selling-assist.module.css
  OUTPUT_PATH: apps/terminal-de-venta-system/products/tablet/app/components/catalog-stock-selling-assist/catalog-stock-selling-assist.module.css

jobs:
  projection-candidate:
    if: github.head_ref == 'feat/tablet-inventory-viscore-full-surface-20260831'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Generate Tablet projection only
        shell: bash
        env:
          AUTHORITY_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python prisma-html/tools/generate_tablet_visual_runtime.py --authority-commit "$AUTHORITY_COMMIT" | tee "$RUNNER_TEMP/projection.log"
          python prisma-html/tools/generate_tablet_visual_runtime.py --authority-commit "$AUTHORITY_COMMIT" --check | tee "$RUNNER_TEMP/projection-check.log"
          grep -Fq '"status": "PASS"' "$RUNNER_TEMP/projection.log"
          grep -Fq '"status": "PASS"' "$RUNNER_TEMP/projection-check.log"

      - name: Refresh exact visual-source integrity hashes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          manifest_path = Path('prisma-html/authority/rifat/visual-source-manifest.json')
          source = Path('prisma-html/authority/rifat/tablet/runtime-sources/modules/catalog-stock-selling-assist/catalog-stock-selling-assist.module.css')
          output = Path('apps/terminal-de-venta-system/products/tablet/app/components/catalog-stock-selling-assist/catalog-stock-selling-assist.module.css')
          doc = json.loads(manifest_path.read_text(encoding='utf-8'))
          rows = [r for r in doc.get('entries', []) if r.get('source') == source.as_posix() and r.get('output') == output.as_posix()]
          if len(rows) != 1:
              raise SystemExit(f'EXACT_VISUAL_SOURCE_ENTRY_CARDINALITY_{len(rows)}')
          sha = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          rows[0]['sourceSha256'] = sha(source)
          rows[0]['outputSha256'] = sha(output)
          if rows[0].get('manualEditsForbidden') is not True:
              raise SystemExit('GENERATED_OUTPUT_NOT_PROTECTED')
          manifest_path.write_text(json.dumps(doc, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('SOURCE_SHA256=' + rows[0]['sourceSha256'])
          print('OUTPUT_SHA256=' + rows[0]['outputSha256'])
          PY

      - name: Validate RIFAT authority after exact hash refresh
        working-directory: prisma-html
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_rifat_authority.py | tee "$RUNNER_TEMP/rifat-authority.json"
          grep -Fq '"status": "PASS"' "$RUNNER_TEMP/rifat-authority.json"

      - name: Refresh deterministic FILES_MANIFEST last
        working-directory: prisma-html
        shell: bash
        run: |
          set -euo pipefail
          python tools/refresh_files_manifest.py --write
          python tools/refresh_files_manifest.py --check

      - name: Revalidate RIFAT after final manifest generation
        working-directory: prisma-html
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_rifat_authority.py | tee "$RUNNER_TEMP/rifat-final.json"
          grep -Fq '"status": "PASS"' "$RUNNER_TEMP/rifat-final.json"

      - name: Package exact generated candidate bytes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, shutil, subprocess
          from pathlib import Path

          root = Path.cwd()
          out = Path('projection-candidate')
          out.mkdir(parents=True, exist_ok=True)
          raw = subprocess.check_output(['git','status','--porcelain=v1'], text=True)
          paths = []
          for line in raw.splitlines():
              rel = line[3:].strip()
              if ' -> ' in rel:
                  rel = rel.split(' -> ',1)[1]
              rel = rel.replace('\\','/')
              if rel == '.github/workflows/tablet-inventory-projection-candidate.yml':
                  continue
              p = root / rel
              if not p.is_file():
                  raise SystemExit(f'NON_FILE_CANDIDATE:{rel}')
              paths.append(rel)
          required = {
              'prisma-html/authority/rifat/visual-source-manifest.json',
              'prisma-html/FILES_MANIFEST.json',
              'apps/terminal-de-venta-system/products/tablet/app/components/catalog-stock-selling-assist/catalog-stock-selling-assist.module.css',
          }
          missing = sorted(required - set(paths))
          if missing:
              raise SystemExit('MISSING_REQUIRED_CANDIDATES:' + ','.join(missing))
          rows=[]
          for rel in sorted(set(paths)):
              src = root / rel
              dst = out / 'repo' / rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src,dst)
              rows.append({'path':rel,'bytes':src.stat().st_size,'sha256':hashlib.sha256(src.read_bytes()).hexdigest()})
          (out/'CANDIDATE_MANIFEST.json').write_text(json.dumps({'status':'PASS_DETERMINISTIC_PROJECTION_CANDIDATE','files':rows},indent=2)+'\n',encoding='utf-8')
          print('\n'.join(x['path'] for x in rows))
          PY
          cp "$RUNNER_TEMP/projection.log" projection-candidate/
          cp "$RUNNER_TEMP/projection-check.log" projection-candidate/
          cp "$RUNNER_TEMP/rifat-authority.json" projection-candidate/
          cp "$RUNNER_TEMP/rifat-final.json" projection-candidate/

      - name: Upload candidate
        uses: actions/upload-artifact@v7
        with:
          name: tablet-inventory-projection-candidate-${{ github.event.pull_request.head.sha }}
          path: projection-candidate/**
          if-no-files-found: error
          retention-days: 7
