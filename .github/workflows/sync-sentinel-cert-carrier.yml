name: PRISMA Sync Sentinel Certification Carrier

on:
  pull_request:
    branches:
      - tooling/prisma-sync-sentinel-v1-2808
    paths:
      - '.github/workflows/sync-sentinel-cert-carrier.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  certify-sync-sentinel:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout carrier
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate carrier scope and detach exact source commit
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA='06ddfc999b1ed4a07cf6c040286628f7c6b0f29e'
          git fetch origin tooling/prisma-sync-sentinel-v1-2808
          ACTUAL_SOURCE_SHA="$(git rev-parse origin/tooling/prisma-sync-sentinel-v1-2808)"
          test "$ACTUAL_SOURCE_SHA" = "$SOURCE_SHA"
          mapfile -t changed < <(git diff --name-only "$SOURCE_SHA" HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = '.github/workflows/sync-sentinel-cert-carrier.yml'
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install workspace dependencies without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Compile and self-test Sync Sentinel
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q tools/prisma-sentinels/sync-sentinel
          python tools/prisma-sentinels/sync-sentinel/prisma_sync_sentinel.py self-test | tee /tmp/sync-sentinel-selftest.log
          grep -Fq 'PASS_SYNC_SENTINEL_SELF_TEST' /tmp/sync-sentinel-selftest.log

      - name: Run isolated real-code Tablet-PC certification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools/_local/reports/sync-sentinel
          python tools/prisma-sentinels/sync-sentinel/prisma_sync_sentinel.py certify \
            --repo . \
            --expected-head "$SOURCE_SHA" \
            --evidence-dir tools/_local/reports/sync-sentinel \
            --workers 3 | tee /tmp/sync-sentinel-cert.log
          grep -Fq 'PASS_SYNC_CERTIFICATION' /tmp/sync-sentinel-cert.log

      - name: Assert certification boundaries and safety evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('tools/_local/reports/sync-sentinel/SYNC_SENTINEL_REPORT.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          assert d['status'] == 'PASS_SYNC_CERTIFICATION', d
          assert d['productionCertified'] is False, d
          assert d['liveDbTouched'] is False, d
          assert d['sourceDrift'] is False, d
          assert d['cleanupPass'] is True, d
          assert d['orphanProcesses'] is False, d
          m = json.loads(Path('tools/_local/reports/sync-sentinel/SYNC_SENTINEL_MANIFEST.json').read_text(encoding='utf-8'))
          assert m['remainingSecretFindings'] == 0, m
          print('PASS_SYNC_SENTINEL_EVIDENCE_ASSERTIONS')
          PY

      - name: Upload certification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sync-sentinel-certification-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: tools/_local/reports/sync-sentinel/**
