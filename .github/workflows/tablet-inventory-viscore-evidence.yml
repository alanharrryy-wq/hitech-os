name: Tablet Inventory VISCORE Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tablet-inventory-viscore-evidence.yml'
      - '.github/evidence/tablet-inventory-viscore-capture.mjs'
      - 'prisma-html/authority/rifat/tablet/runtime-sources/modules/catalog-stock-selling-assist/catalog-stock-selling-assist.module.css'
      - 'apps/terminal-de-venta-system/products/tablet/app/components/catalog-stock-selling-assist/catalog-stock-selling-assist-screen.tsx'
      - 'apps/terminal-de-venta-system/products/tablet/app/components/inventory/inventory-operations-workspace.tsx'
      - 'apps/terminal-de-venta-system/config/prisma-visual/identity-layer-certifications.registry.json'
      - 'prisma-html/authority/rifat/identity/registries/element-bindings.registry.json'
      - 'prisma-html/**'

permissions:
  contents: read

concurrency:
  group: tablet-inventory-viscore-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  APP_ROOT: apps/terminal-de-venta-system/products/tablet/app
  EVIDENCE_DIR: evidence/tablet-inventory-viscore
  RUNTIME_PORT: '3120'
  CHROME_DEBUG_PORT: '9224'
  CERTIFIED_BASE: 6f5b3df2ccd4b83a613648fef8e0874df3e1ac09

jobs:
  tablet-inventory-runtime-evidence:
    if: github.head_ref == 'feat/tablet-inventory-viscore-full-surface-20260831'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout governed branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Classify evidence phase and scope
        id: meta
        shell: bash
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          head="$PR_HEAD"
          test "$(git rev-parse HEAD)" = "$head"
          test "$(git merge-base "$CERTIFIED_BASE" "$head")" = "$CERTIFIED_BASE"
          changed="$(git diff --name-only "$CERTIFIED_BASE..$head")"
          printf '%s\n' "$changed" > changed-files.txt
          if printf '%s\n' "$changed" | grep -Eq '^(prisma-html/authority/rifat/|apps/terminal-de-venta-system/products/tablet/app/components/catalog-stock-selling-assist/|apps/terminal-de-venta-system/config/prisma-visual/)'; then
            phase=AFTER
          else
            phase=BEFORE
          fi
          short="${head:0:12}"
          echo "phase=$phase" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          mkdir -p "$EVIDENCE_DIR"
          cp changed-files.txt "$EVIDENCE_DIR/changed-files.txt"
          printf '{"schemaVersion":"tablet.inventory.viscore.scope.v1","phase":"%s","commit":"%s","certifiedBase":"%s","route":"/inventory","viewport":{"width":1365,"height":1000},"operationsReveal":"real-browser-click","productBehaviorMutationAllowed":false,"productionDbMutation":false,"runnerEphemeralFixtureDb":true,"screenshotsRequired":2}\n' "$phase" "$head" "$CERTIFIED_BASE" > "$EVIDENCE_DIR/scope.json"
          echo "VISCORE_EVIDENCE_PHASE=$phase" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Tablet without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          pnpm -C "$APP_ROOT" install --frozen-lockfile --ignore-scripts 2>&1 | tee "$EVIDENCE_DIR/tablet-install.log"
          test -x "$APP_ROOT/node_modules/.bin/next"
          test -x "$APP_ROOT/node_modules/.bin/prisma"

      - name: Run focused visual safety gate
        shell: bash
        run: |
          set -euo pipefail
          pnpm -C "$APP_ROOT" run verify:zero-important 2>&1 | tee "$EVIDENCE_DIR/verify-zero-important.log"

      - name: Generate runner-local Prisma client only
        shell: bash
        run: |
          set -euo pipefail
          export DATABASE_URL='file:/dev/null'
          pnpm -C "$APP_ROOT" run prisma:generate 2>&1 | tee "$EVIDENCE_DIR/prisma-generate.log"
          test -f "$APP_ROOT/.generated/prisma-client/index.js"
          if grep -Eiq '(migrate|db push|seed)' "$EVIDENCE_DIR/prisma-generate.log"; then
            echo 'BLOCKED unexpected database lifecycle operation in generate-only log'
            exit 1
          fi
          echo 'PASS_PRISMA_GENERATE_ONLY_RUNNER_EPHEMERAL' > "$EVIDENCE_DIR/prisma-generate-result.txt"

      - name: Prepare runner-local Tablet fixtures
        shell: bash
        env:
          PILOT_DB: ${{ runner.temp }}/tablet-inventory-viscore.db
          PILOT_LICENSE: ${{ runner.temp }}/tablet-inventory-license.json
        run: |
          set -euo pipefail
          rm -f "$PILOT_DB" "$PILOT_LICENSE"
          python - <<'PY'
          import os, sqlite3, json
          db=os.environ['PILOT_DB']
          c=sqlite3.connect(db)
          c.executescript('''
          CREATE TABLE "Business" ("id" TEXT PRIMARY KEY, "name" TEXT NOT NULL, "taxId" TEXT, "currency" TEXT NOT NULL DEFAULT 'MXN', "createdAt" DATETIME NOT NULL, "updatedAt" DATETIME NOT NULL);
          CREATE TABLE "Store" ("id" TEXT PRIMARY KEY, "businessId" TEXT NOT NULL, "code" TEXT NOT NULL, "name" TEXT NOT NULL, "createdAt" DATETIME NOT NULL, "updatedAt" DATETIME NOT NULL);
          CREATE TABLE "Terminal" ("id" TEXT PRIMARY KEY, "businessId" TEXT NOT NULL, "storeId" TEXT NOT NULL, "code" TEXT NOT NULL, "name" TEXT NOT NULL, "isActive" INTEGER NOT NULL DEFAULT 1, "createdAt" DATETIME NOT NULL, "updatedAt" DATETIME NOT NULL);
          CREATE TABLE "CashSession" ("id" TEXT PRIMARY KEY, "businessId" TEXT NOT NULL, "storeId" TEXT NOT NULL, "terminalId" TEXT NOT NULL, "cashierId" TEXT NOT NULL, "cashier" TEXT NOT NULL, "status" TEXT NOT NULL, "openedAt" DATETIME NOT NULL, "openingFloatCents" INTEGER NOT NULL DEFAULT 0, "createdAt" DATETIME NOT NULL, "updatedAt" DATETIME NOT NULL);
          CREATE TABLE "Product" ("id" TEXT PRIMARY KEY, "businessId" TEXT NOT NULL, "isActive" INTEGER NOT NULL DEFAULT 1, "stockOnHand" INTEGER NOT NULL DEFAULT 0);
          CREATE TABLE "StockMovement" ("id" TEXT PRIMARY KEY, "businessId" TEXT NOT NULL, "createdAt" DATETIME NOT NULL);
          CREATE TABLE "OutboxEvent" ("id" TEXT PRIMARY KEY, "businessId" TEXT NOT NULL, "status" TEXT NOT NULL);
          CREATE TABLE "Sale" ("id" TEXT PRIMARY KEY, "businessId" TEXT NOT NULL, "status" TEXT NOT NULL, "createdAt" DATETIME NOT NULL, "terminalId" TEXT);
          CREATE TABLE "SaleReturn" ("id" TEXT PRIMARY KEY, "businessId" TEXT NOT NULL, "status" TEXT NOT NULL, "createdAt" DATETIME NOT NULL);
          ''')
          now='2026-08-31T07:30:00.000Z'; business='biz_78b3c840796a4a4dad'; store='store_00728649f3804a9e82'; terminal='term_49103c7382d84663a3'
          c.execute('INSERT INTO Business VALUES(?,?,?,?,?,?)',(business,'Prisma Inventory Evidence',None,'MXN',now,now))
          c.execute('INSERT INTO Store VALUES(?,?,?,?,?,?)',(store,business,'CENTRO','Sucursal principal',now,now))
          c.execute('INSERT INTO Terminal VALUES(?,?,?,?,?,?,?,?)',(terminal,business,store,'TB-01','Tablet Caja 1',1,now,now))
          c.execute('INSERT INTO CashSession VALUES(?,?,?,?,?,?,?,?,?,?,?)',('shift-inventory-viscore',business,store,terminal,'tablet-cashier','Ana Caja','OPEN',now,150000,now,now))
          for i,stock in enumerate((24,18,13,9,32,7),1): c.execute('INSERT INTO Product VALUES(?,?,1,?)',(f'prod-{i}',business,stock))
          c.commit(); c.close()
          license_doc={'schemaVersion':'1.0.0','licenseId':'lic_tablet_inventory_viscore','customerId':'cust_inventory_evidence','businessId':business,'storeId':store,'terminalId':terminal,'plan':'DEVELOPMENT','state':'development','assignmentState':'assigned','validFrom':'2026-01-01T00:00:00.000Z','validUntil':'2027-12-31T23:59:59.000Z','offlineGraceDays':30,'notes':['Runner-local deterministic VISCORE evidence fixture; not customer licensing evidence.']}
          with open(os.environ['PILOT_LICENSE'],'w',encoding='utf-8') as f: json.dump(license_doc,f,ensure_ascii=False,indent=2)
          PY
          test -s "$PILOT_DB"
          test -s "$PILOT_LICENSE"
          echo 'PASS_RUNNER_LOCAL_INVENTORY_DB_AND_DEV_LICENSE_FIXTURES'

      - name: Resolve Chrome
        id: chrome
        shell: bash
        run: |
          set -euo pipefail
          chrome=''
          for c in google-chrome google-chrome-stable chromium chromium-browser; do
            command -v "$c" >/dev/null 2>&1 && chrome="$(command -v "$c")" && break
          done
          test -n "$chrome"
          "$chrome" --version | tee "$EVIDENCE_DIR/chrome-version.log"
          echo "bin=$chrome" >> "$GITHUB_OUTPUT"

      - name: Start isolated Tablet runtime
        shell: bash
        run: |
          set -euo pipefail
          db="$RUNNER_TEMP/tablet-inventory-viscore.db"
          license="$RUNNER_TEMP/tablet-inventory-license.json"
          if curl -sf --max-time 1 "http://127.0.0.1:$RUNTIME_PORT/inventory" >/dev/null 2>&1; then
            echo "BLOCKED occupied runner port $RUNTIME_PORT; refusing cleanup"
            exit 1
          fi
          setsid bash -lc "cd '$APP_ROOT' && export TABLET_DATABASE_URL='file:$db' TABLET_OPERATOR_NAME='Ana Caja' PRISMA_LICENSE_FILE='$license' PRISMA_LICENSE_ALLOW_UNSIGNED='1' PRISMA_RUNTIME_MODE='dev' && exec pnpm exec next dev --webpack -p '$RUNTIME_PORT'" > "$EVIDENCE_DIR/server.log" 2>&1 &
          echo $! > "$EVIDENCE_DIR/server.pid"
          for _ in $(seq 1 120); do
            curl -sf --max-time 2 "http://127.0.0.1:$RUNTIME_PORT/inventory" >/dev/null 2>&1 && exit 0
            kill -0 "$(cat "$EVIDENCE_DIR/server.pid")" >/dev/null 2>&1 || break
            sleep 1
          done
          tail -n 200 "$EVIDENCE_DIR/server.log" || true
          exit 1

      - name: Start isolated headless Chrome
        shell: bash
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.bin }}
        run: |
          set -euo pipefail
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-debugging-address=127.0.0.1 --remote-debugging-port="$CHROME_DEBUG_PORT" --user-data-dir="$RUNNER_TEMP/inventory-viscore-chrome" about:blank > "$EVIDENCE_DIR/chrome-runtime.log" 2>&1 &
          echo $! > "$EVIDENCE_DIR/chrome.pid"
          for _ in $(seq 1 80); do
            curl -sf --max-time 1 "http://127.0.0.1:$CHROME_DEBUG_PORT/json/version" > "$EVIDENCE_DIR/chrome-debug.json" 2>/dev/null && exit 0
            sleep 0.25
          done
          exit 1

      - name: Capture Inventory surface
        shell: bash
        env:
          RUNTIME_URL: http://127.0.0.1:3120
          GITHUB_SHA: ${{ steps.meta.outputs.head }}
        run: |
          set -euo pipefail
          node .github/evidence/tablet-inventory-viscore-capture.mjs 2>&1 | tee "$EVIDENCE_DIR/browser-capture.log"
          grep -Fxq 'PASS_TABLET_INVENTORY_VISCORE_RUNTIME_EVIDENCE' "$EVIDENCE_DIR/browser-capture.log"
          test -s "$EVIDENCE_DIR/screenshots/inventory-viewport.png"
          test -s "$EVIDENCE_DIR/screenshots/inventory-full.png"

      - name: Validate fail-closed evidence
        shell: bash
        run: |
          set -euo pipefail
          if grep -E '(^|[^A-Za-z])(TypeError|ReferenceError|SyntaxError|Unhandled Runtime Error|Internal Server Error)([^A-Za-z]|$)|^[[:space:]]*⨯' "$EVIDENCE_DIR/server.log" > "$EVIDENCE_DIR/server-anomalies.log"; then
            cat "$EVIDENCE_DIR/server-anomalies.log"
            exit 1
          fi
          node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(x.route!=="/inventory"||x.runtimeErrors.length||x.consoleErrors.length||x.networkErrors.length||!x.meta?.screenPresent||!x.meta?.operationsPresent||!x.meta?.primaryOperationPresent)process.exit(1)' "$EVIDENCE_DIR/inventory-results.json"
          printf 'PASS_TABLET_INVENTORY_VISCORE_%s_NO_FAKE_GREEN\n' "$VISCORE_EVIDENCE_PHASE" | tee "$EVIDENCE_DIR/FINAL_RESULT.txt"

      - name: Build evidence manifest
        if: always()
        shell: bash
        env:
          HEAD_SHA: ${{ steps.meta.outputs.head }}
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('evidence/tablet-inventory-viscore'); shots=sorted((root/'screenshots').glob('*.png')) if (root/'screenshots').exists() else []
          rows=[{'name':p.name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in shots]
          marker=(root/'FINAL_RESULT.txt').read_text().strip() if (root/'FINAL_RESULT.txt').exists() else 'NOT_REACHED'
          payload={'schemaVersion':'tablet.inventory.viscore.evidence-manifest.v1','phase':os.environ.get('VISCORE_EVIDENCE_PHASE'),'commit':os.environ.get('HEAD_SHA'),'route':'/inventory','viewport':{'width':1365,'height':1000},'screenshots':rows,'finalMarker':marker,'productionDbMutation':False,'runnerEphemeralFixtureDb':True}
          (root/'EVIDENCE_MANIFEST.json').write_text(json.dumps(payload,indent=2)+'\n')
          PY

      - name: Stop runner-owned processes
        if: always()
        shell: bash
        run: |
          set +e
          for pidfile in "$EVIDENCE_DIR/chrome.pid" "$EVIDENCE_DIR/server.pid"; do [ ! -f "$pidfile" ] || kill "$(cat "$pidfile")" >/dev/null 2>&1 || true; done

      - name: Upload Inventory evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tablet-inventory-${{ steps.meta.outputs.phase }}-${{ steps.meta.outputs.short }}
          path: ${{ env.EVIDENCE_DIR }}/**
          if-no-files-found: error
          retention-days: 14

      - name: Final evidence gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq "PASS_TABLET_INVENTORY_VISCORE_${VISCORE_EVIDENCE_PHASE}_NO_FAKE_GREEN" "$EVIDENCE_DIR/FINAL_RESULT.txt"
          test -s "$EVIDENCE_DIR/screenshots/inventory-viewport.png"
          test -s "$EVIDENCE_DIR/screenshots/inventory-full.png"
