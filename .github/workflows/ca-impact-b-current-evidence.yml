name: CA Impact B Current Evidence

on:
  pull_request:
    paths:
      - '.github/workflows/ca-impact-b-current-evidence.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: tools/code-atlas/src
  CAEXT_WORKERS: '18'

jobs:
  current-real-diff:
    name: Current Impact real-diff / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Prove read-only evidence scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD origin/main)" = "2ee6c9053e3eea024cad4715e4ec3172f02de341"
          changed="$(git diff --name-only origin/main...HEAD)"
          test "$changed" = ".github/workflows/ca-impact-b-current-evidence.yml"
          python -m py_compile .github/scripts/caext_historical_real_diff_v1.py
          python .github/scripts/caext_historical_real_diff_v1.py --self-test
          git diff --exit-code

      - name: Run current-code historical real-diff evidence
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/ca-impact-b-current"
          mkdir -p "$out"
          python .github/scripts/caext_historical_real_diff_v1.py --output "$out" --hitech-root .
          git diff --exit-code

      - name: Upload evidence even when red
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ca-impact-b-current-${{ matrix.os }}
          path: ${{ runner.temp }}/ca-impact-b-current/*.zip
          if-no-files-found: error
          retention-days: 7
