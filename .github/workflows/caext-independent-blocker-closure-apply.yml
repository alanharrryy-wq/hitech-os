name: Code Atlas Independent Evaluator Blocker Closure Apply

on:
  push:
    branches:
      - 'governance/caext-independent-blocker-closure-1508'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONUTF8: '1'

jobs:
  apply-governance-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: governance/caext-independent-blocker-closure-1508
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Apply exact governed six-document closure
        run: python .github/scripts/caext_independent_blocker_closure_apply.py

      - name: Validate exact working-tree scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --porcelain=v1 | sed -E 's/^.. //' | sort > /tmp/changed.txt
          printf '%s\n' \
            'PRISMA Factory Ledger/PRISMA_EVIDENCE_INDEX.json' \
            'PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER.json' \
            'apps/terminal-de-venta-system/docs/ops/PRISMA_FIELD_MANUAL_APRENDIZAJE_OPERATIVO.md' \
            'tools/code-atlas/README.md' \
            'tools/code-atlas/docs/CODE_ATLAS_CUSTOMER_WOW_V1.contract.json' \
            'tools/code-atlas/docs/CODE_ATLAS_CUSTOMER_WOW_V1.md' \
            | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          echo 'PASS_EXACT_SIX_DOCUMENT_BLOCKER_CLOSURE_SCOPE'

      - name: Commit six governance docs only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CAEXT Governance Closure'
          git config user.email 'caext-governance@example.invalid'
          git add -- \
            'tools/code-atlas/README.md' \
            'tools/code-atlas/docs/CODE_ATLAS_CUSTOMER_WOW_V1.md' \
            'tools/code-atlas/docs/CODE_ATLAS_CUSTOMER_WOW_V1.contract.json' \
            'PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER.json' \
            'PRISMA Factory Ledger/PRISMA_EVIDENCE_INDEX.json' \
            'apps/terminal-de-venta-system/docs/ops/PRISMA_FIELD_MANUAL_APRENDIZAJE_OPERATIVO.md'
          git diff --cached --check
          git commit -m 'docs(code-atlas): record independent evaluator policy blocker'
          git push origin HEAD:governance/caext-independent-blocker-closure-1508
