name: Tablet Sync WAVE2 Exact Apply Carrier

on:
  pull_request:
    paths:
      - '.github/workflows/automesh-parallel-cert.yml'
      - 'tools/tablet_sync_wave2_apply_carrier.py'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  PINNED_HEAD: ce1bda5d4e6765d9927f33c16f0a08472427e4ba
  TARGET_BRANCH: agent/tablet-sync-wave2-operations-2508

jobs:
  tablet-sync-wave2-apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout carrier head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Preserve carrier engine and verify pins
        shell: bash
        run: |
          set -euo pipefail
          cp tools/tablet_sync_wave2_apply_carrier.py "$RUNNER_TEMP/tablet_sync_wave2_apply_carrier.py"
          python -m py_compile "$RUNNER_TEMP/tablet_sync_wave2_apply_carrier.py"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$PINNED_HEAD"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$PINNED_HEAD"

      - name: Reset to exact authorized base and apply five-file patch
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B "$TARGET_BRANCH" "$PINNED_HEAD"
          test -z "$(git status --porcelain)"
          python "$RUNNER_TEMP/tablet_sync_wave2_apply_carrier.py"

      - name: Verify exact scope and generated-owner protection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          expected = {
            "apps/terminal-de-venta-system/products/tablet/app/src/lib/pending-offline-sync/sync-panel-contract.ts",
            "apps/terminal-de-venta-system/products/tablet/app/src/server/pos-sync-panel/index.ts",
            "apps/terminal-de-venta-system/products/tablet/app/src/server/sync/reconciliation.ts",
            "apps/terminal-de-venta-system/products/tablet/app/components/sync/pending-offline-sync-panel-screen.tsx",
            "apps/terminal-de-venta-system/products/tablet/app/tools/verify_tablet_sync_panel_truth_1808.mjs",
          }
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          if changed != expected:
              raise SystemExit(f"EXACT_FIVE_FILE_SCOPE_REQUIRED:{sorted(changed)}")
          PY
          git diff --check
          test "$(git diff -- 'apps/terminal-de-venta-system/products/tablet/app/components/sync/pending-offline-sync-panel.module.css' | wc -c)" -eq 0
          test "$(git diff -- 'apps/terminal-de-venta-system/products/tablet/app/prisma/schema.prisma' | wc -c)" -eq 0
          if git diff | grep -Fq '!important'; then echo 'BLOCKED_IMPORTANT'; exit 1; fi

      - name: Run focused WAVE2 truth verifier
        shell: bash
        run: |
          set -euo pipefail
          node apps/terminal-de-venta-system/products/tablet/app/tools/verify_tablet_sync_panel_truth_1808.mjs | tee "$RUNNER_TEMP/wave2-verifier.txt"
          grep -Eq '^PASS TABLET_SYNC_PANEL_TRUTH_1808 [0-9]+/[0-9]+$' "$RUNNER_TEMP/wave2-verifier.txt"
          if grep -q '^FAIL ' "$RUNNER_TEMP/wave2-verifier.txt"; then exit 1; fi

      - name: Commit and push product branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$PINNED_HEAD"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$PINNED_HEAD"
          git add \
            apps/terminal-de-venta-system/products/tablet/app/src/lib/pending-offline-sync/sync-panel-contract.ts \
            apps/terminal-de-venta-system/products/tablet/app/src/server/pos-sync-panel/index.ts \
            apps/terminal-de-venta-system/products/tablet/app/src/server/sync/reconciliation.ts \
            apps/terminal-de-venta-system/products/tablet/app/components/sync/pending-offline-sync-panel-screen.tsx \
            apps/terminal-de-venta-system/products/tablet/app/tools/verify_tablet_sync_panel_truth_1808.mjs
          test "$(git diff --cached --name-only | wc -l)" -eq 5
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(tablet): advance sync operations center wave2"
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Stage carrier evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/wave2-apply-evidence"
          mkdir -p "$out"
          cp "$RUNNER_TEMP/wave2-verifier.txt" "$out/" 2>/dev/null || true
          git status --short > "$out/git-status.txt" || true
          git log -1 --oneline > "$out/final-commit.txt" || true
          git diff "$PINNED_HEAD"..HEAD --name-status > "$out/exact-diff.txt" || true
          sha256sum \
            apps/terminal-de-venta-system/products/tablet/app/src/lib/pending-offline-sync/sync-panel-contract.ts \
            apps/terminal-de-venta-system/products/tablet/app/src/server/pos-sync-panel/index.ts \
            apps/terminal-de-venta-system/products/tablet/app/src/server/sync/reconciliation.ts \
            apps/terminal-de-venta-system/products/tablet/app/components/sync/pending-offline-sync-panel-screen.tsx \
            apps/terminal-de-venta-system/products/tablet/app/tools/verify_tablet_sync_panel_truth_1808.mjs \
            > "$out/final-hashes.txt" 2>/dev/null || true

      - name: Upload apply evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tablet-sync-wave2-exact-apply
          path: ${{ runner.temp }}/wave2-apply-evidence/**
          if-no-files-found: error
          retention-days: 14
