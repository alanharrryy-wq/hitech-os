name: AutoMesh Parallel Certification

on:
  pull_request:
    paths:
      - '.github/workflows/automesh-parallel-cert.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: tools/code-atlas/src

jobs:
  h-mutation-authority:
    name: H governance promotion authority
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Compile and self-test authority tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/code-atlas/src/code_atlas/motors/prisma_automesh_runtime.py \
            tools/code-atlas/src/code_atlas/motors/smart_allmesh_automesh.py \
            tools/code-atlas/src/code_atlas/motors/smart_allmesh_parallel.py \
            tools/code-atlas/src/code_atlas/motors/prisma_mesh_gateway.py \
            'PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py' \
            'PRISMA Factory Ledger/tools/verify_change_intelligence_capability_gate.py'
          python tools/code-atlas/src/code_atlas/motors/smart_allmesh_automesh.py --self-test
          test "$(git status --porcelain | wc -l)" -eq 0

      - name: Run task-exact H promotion authority and both gates
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          request="$RUNNER_TEMP/ca-prove-h.request.json"
          preflight="$RUNNER_TEMP/ca-prove-h-preflight"
          parallel="$RUNNER_TEMP/ca-prove-h-parallel"
          composed="$RUNNER_TEMP/ca-prove-h-composed"
          mkdir -p "$preflight" "$parallel" "$composed"
          python - "$request" "$head_sha" <<'PY'
          import json, sys
          path, head = sys.argv[1], sys.argv[2]
          task = (
              "Governance-only evidence promotion for PRISMA Change Assurance V1 checklist H / PROVE / Portable reproducible runner. "
              "Existing runner owners and their source bytes remain unchanged. Reuse ci.runner.local_only, ci.runner.portable_evidence and ci.rental.private_repo_v2, all protected doNotRebuild owners. "
              "Promote H only if current source plus fresh cross-platform focused tests prove documented runner modes replay from declared inputs without hidden founder-workstation dependencies, while preserving read-only, no-source-egress, lifecycle, cleanup and fail-closed boundaries. "
              "The promotion must remain LOCAL_VERIFIED and must not claim customer production deployment, arbitrary infrastructure/container execution, legal/privacy/security certification, enterprise readiness, paid-pilot readiness or secure erase. "
              "Allowed mutation after PASS is limited to the single Change Assurance registry/checklist and its two human-readable canonical companions; no source/runtime/Cloud Center/Tablet/PC/Mobile/Chart Lab/Shared UI/DB/Prisma/process/port/deploy mutation."
          )
          common_authorities = [
              "PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER.json",
              "PRISMA Factory Ledger/PRISMA_CHANGE_INTELLIGENCE_CAPABILITY_MAP.json",
              "PRISMA Factory Ledger/PRISMA_CHANGE_INTELLIGENCE_CAPABILITY_MAP.md",
              "PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER_AGENT_GATE.md",
              "PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py",
              "PRISMA Factory Ledger/tools/verify_change_intelligence_capability_gate.py",
              "tools/code-atlas/CODE_ATLAS_CHANGE_ASSURANCE_CONTRACT.json",
              "tools/code-atlas/docs/PRISMA_CHANGE_ASSURANCE_V1.md",
              "tools/code-atlas/src/code_atlas/change_intelligence/runner_contract.py",
              "tools/code-atlas/src/code_atlas/change_intelligence/bundle.py",
              "tools/code-atlas/src/code_atlas/change_intelligence/customer_lifecycle.py",
              "tools/code-atlas/src/code_atlas/change_intelligence/artifact_hygiene.py",
              "tools/code-atlas/tests/test_operational_rental_hardening.py",
              ".github/workflows/code-atlas-operational-hardening.yml"
          ]
          common_dirs = [
              "PRISMA Factory Ledger",
              "tools/code-atlas/src/code_atlas/change_intelligence",
              "tools/code-atlas/tests",
              "tools/code-atlas/docs",
              ".github/workflows"
          ]
          request = {
              "schemaVersion": "prisma_remote_authority_gateway.v2",
              "expectedHead": head,
              "profile": "change-assurance-prove-h-promotion-v1",
              "tasks": [
                  {
                      "id": "prove-h-governance-promotion",
                      "surface": "governance",
                      "task": task + " Resolve exact evidence requirements, allowed governance files, claim ceiling and promotion constraints.",
                      "intent": "VERIFY",
                      "domain": "governance",
                      "requiredAuthorities": common_authorities,
                      "requiredDirectories": common_dirs,
                      "requiredCapabilities": [
                          "code_atlas.change_intelligence.customer_wow_v1",
                          "change_intelligence.capability_anti_rework_gate"
                      ],
                      "minimumCoverage": 100,
                      "failOnMissingAuthority": True
                  },
                  {
                      "id": "prove-h-protected-runner-owners",
                      "surface": "governance",
                      "task": task + " Prove this is evidence-only status governance: LOCAL_ONLY, PORTABLE_EVIDENCE, rental V2, lifecycle, sanitization, bundle and runner source stay byte-identical; return fail-closed anti-rework boundaries.",
                      "intent": "VERIFY",
                      "domain": "tooling",
                      "requiredAuthorities": common_authorities,
                      "requiredDirectories": common_dirs,
                      "requiredCapabilities": [
                          "code_atlas.change_intelligence.customer_wow_v1",
                          "change_intelligence.capability_anti_rework_gate"
                      ],
                      "minimumCoverage": 100,
                      "failOnMissingAuthority": True
                  }
              ]
          }
          with open(path, 'w', encoding='utf-8') as f:
              json.dump(request, f, indent=2, ensure_ascii=False)
          PY

          python -m code_atlas.motors.prisma_mesh_gateway preflight --repo . --request "$request" --out "$preflight"
          python tools/code-atlas/src/code_atlas/motors/smart_allmesh_parallel.py \
            --repo . --out-root "$parallel" --task-spec "$preflight/legacy_tasks.json" \
            --parallel 2 --workers 18 --shards 54
          python -m code_atlas.motors.prisma_mesh_gateway compose \
            --repo . --request "$request" --preflight "$preflight" --mesh-result "$parallel" --out "$composed" \
            | tee "$composed/compose.stdout.txt"
          grep -Fq 'PASS_COMPOSED_AUTHORITY_MESH' "$composed/compose.stdout.txt"
          composed_zip="$RUNNER_TEMP/prisma-automesh-composed-result.zip"
          test -f "$composed_zip"
          cp "$composed_zip" "$composed/prisma-automesh-composed-result.zip"

          python - "$preflight/PREFLIGHT_MANIFEST.json" "$composed/PRISMA_MESH_GATEWAY_REPORT.json" "$composed_zip" "$RUNNER_TEMP/factory-gate.request.json" "$RUNNER_TEMP/change-assurance-gate.request.json" <<'PY'
          import hashlib, json, sys
          pf_path, report_path, zip_path, factory_path, ca_path = sys.argv[1:]
          pf=json.load(open(pf_path,encoding='utf-8'))
          report=json.load(open(report_path,encoding='utf-8'))
          if report.get('status')!='PASS_COMPOSED_AUTHORITY_MESH' or pf.get('status')!='PASS_PREFLIGHT':
              raise SystemExit('BLOCKED_MESH_NOT_PASS')
          coverage=min(float(lane['coverage']['resolvedPercent']) for lane in pf['lanes'])
          blockers=len(pf.get('blockers') or [])
          mesh={
              'status':'PASS_COMPOSED_AUTHORITY_MESH',
              'repoHead':report['repoHead'],
              'requiredAuthorityCoveragePct':int(coverage),
              'blockers':blockers,
              'requestDigest':report['requestDigest'],
              'artifactDigest':'sha256:'+hashlib.sha256(open(zip_path,'rb').read()).hexdigest(),
              'layerMapPresent':True
          }
          gate_task='Governance-only evidence promotion of Change Assurance checklist H to DONE / LOCAL_VERIFIED using existing protected runner owners; source bytes unchanged.'
          factory={
              'schemaVersion':'prisma.factory-ledger.anti-rework-request.v1',
              'mode':'MUTATION',
              'expectedHead':report['repoHead'],
              'task':gate_task,
              'capabilities':[{'id':'code_atlas.change_intelligence.customer_wow_v1','requestedAction':'VERIFY'}],
              'authorityMesh':mesh,
              'visualMutation':False
          }
          ca={
              'mode':'MUTATION',
              'capabilityIds':['ci.runner.local_only','ci.runner.portable_evidence','ci.rental.private_repo_v2'],
              'task':gate_task,
              'authorityMesh':mesh,
              'visualMutation':False
          }
          json.dump(factory,open(factory_path,'w',encoding='utf-8'),indent=2)
          json.dump(ca,open(ca_path,'w',encoding='utf-8'),indent=2)
          print(json.dumps({'mesh':mesh},indent=2))
          PY

          python 'PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py' --request "$RUNNER_TEMP/factory-gate.request.json" | tee "$RUNNER_TEMP/factory-gate.decision.json"
          grep -Fq 'PASS_ANTI_REWORK_GATE' "$RUNNER_TEMP/factory-gate.decision.json"
          python 'PRISMA Factory Ledger/tools/verify_change_intelligence_capability_gate.py' --request "$RUNNER_TEMP/change-assurance-gate.request.json" | tee "$RUNNER_TEMP/change-assurance-gate.decision.json"
          grep -Fq 'PASS_CHANGE_ASSURANCE_CAPABILITY_GATE' "$RUNNER_TEMP/change-assurance-gate.decision.json"
          test "$(git status --porcelain | wc -l)" -eq 0
          echo 'PASS_H_GOVERNANCE_PROMOTION_AUTHORITY'

      - name: Upload H authority evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ca-prove-h-authority
          path: |
            ${{ runner.temp }}/ca-prove-h.request.json
            ${{ runner.temp }}/ca-prove-h-preflight/
            ${{ runner.temp }}/ca-prove-h-parallel/*.zip
            ${{ runner.temp }}/ca-prove-h-composed/
            ${{ runner.temp }}/factory-gate.request.json
            ${{ runner.temp }}/factory-gate.decision.json
            ${{ runner.temp }}/change-assurance-gate.request.json
            ${{ runner.temp }}/change-assurance-gate.decision.json
          if-no-files-found: error
          retention-days: 7
