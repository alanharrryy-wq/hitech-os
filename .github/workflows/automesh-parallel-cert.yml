name: AutoMesh Parallel Certification

on:
  pull_request:
    paths:
      - '.github/workflows/automesh-parallel-cert.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: tools/code-atlas/src

jobs:
  ca-edge-c-promotion-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Verify post-merge source baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c32644cdc0691668b9a1a27251af10b03aecf167"
          test "$(git rev-parse HEAD:tools/code-atlas/src/code_atlas/intelligence/graphs.py)" = "a595fe69b33e297e89259c76349e73d9aec89325"
          test "$(git rev-parse HEAD:tools/code-atlas/src/code_atlas/intelligence/edge_provenance.py)" = "e8f40df38a0e31d4a09b5e5c50e0cfde6e7db42e"
          test "$(git rev-parse HEAD:tools/code-atlas/src/code_atlas/intelligence/engine.py)" = "435acff53f832f2a47f11605c08ca2e94bafdb67"
          test "$(git rev-parse HEAD:tools/code-atlas/tests/test_operational_edge_provenance.py)" = "51b55fc9d8cfee0850b17a389f5c34f3108a06ee"
          python -m py_compile \
            tools/code-atlas/src/code_atlas/motors/prisma_mesh_gateway.py \
            tools/code-atlas/src/code_atlas/motors/smart_allmesh_parallel.py \
            tools/code-atlas/src/code_atlas/intelligence/edge_provenance.py \
            tools/code-atlas/src/code_atlas/intelligence/engine.py \
            tools/code-atlas/tests/test_operational_edge_provenance.py \
            'PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py' \
            'PRISMA Factory Ledger/tools/verify_change_intelligence_capability_gate.py'
          python tools/code-atlas/src/code_atlas/motors/smart_allmesh_automesh.py --self-test
          test "$(git status --porcelain | wc -l)" -eq 0

      - name: Run exact-head governance promotion Authority Mesh
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          request="$RUNNER_TEMP/c-promote.request.json"
          pre="$RUNNER_TEMP/c-promote-pre"
          par="$RUNNER_TEMP/c-promote-par"
          comp="$RUNNER_TEMP/c-promote-comp"
          mkdir -p "$pre" "$par" "$comp"
          python - "$request" "$head_sha" <<'PY'
          import json,sys
          path,head=sys.argv[1:]
          task=(
            "Verify authority to promote PRISMA Change Assurance V1 checklist C / UNDERSTAND / Edge provenance from PARTIAL to DONE / LOCAL_VERIFIED after source PR 352 merged at c32644cdc0691668b9a1a27251af10b03aecf167. "
            "The exact Definition of Done is: material graph edges expose source/provenance and confidence or remain inference/unknown. "
            "Existing implemented-byte evidence run 32406412712 proved the canonical intelligence context exposes explicit provenance and confidence for material edges, repository authority declaration/conflict edges are supported only from repository declaration facts, and unproven supported edges downgrade to unknown. Full operational hardening passed 143/143 tests on Ubuntu with Windows and macOS lanes green. "
            "This step is governance-only. If authorized, the only mutable paths are PRISMA Factory Ledger/PRISMA_CHANGE_INTELLIGENCE_CAPABILITY_MAP.json, PRISMA Factory Ledger/PRISMA_CHANGE_INTELLIGENCE_CAPABILITY_MAP.md, and tools/code-atlas/docs/PRISMA_CHANGE_ASSURANCE_V1.md. "
            "All source files, tests, workflows and product/runtime files must remain byte-identical during the final promotion. Preserve v1Complete=false and all other checklist item states. "
            "Claim ceiling is LOCAL_VERIFIED bounded edge provenance only; no arbitrary-repository/all-language completeness, runtime/dynamic dependency completeness, production, enterprise, hosted, paid-pilot, legal/privacy or security certification."
          )
          auth=[
            "PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER.json",
            "PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER_AGENT_GATE.md",
            "PRISMA Factory Ledger/PRISMA_CHANGE_INTELLIGENCE_CAPABILITY_MAP.json",
            "PRISMA Factory Ledger/PRISMA_CHANGE_INTELLIGENCE_CAPABILITY_MAP.md",
            "PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py",
            "PRISMA Factory Ledger/tools/verify_change_intelligence_capability_gate.py",
            "tools/code-atlas/CODE_ATLAS_CHANGE_ASSURANCE_CONTRACT.json",
            "tools/code-atlas/docs/PRISMA_CHANGE_ASSURANCE_V1.md",
            "tools/code-atlas/docs/CODE_ATLAS_CUSTOMER_WOW_V1.md",
            "tools/code-atlas/src/code_atlas/intelligence/authority.py",
            "tools/code-atlas/src/code_atlas/intelligence/graphs.py",
            "tools/code-atlas/src/code_atlas/intelligence/edge_provenance.py",
            "tools/code-atlas/src/code_atlas/intelligence/engine.py",
            "tools/code-atlas/tests/test_operational_edge_provenance.py",
            "tools/code-atlas/tests/test_operational_universal_intelligence.py",
            "tools/code-atlas/tests/test_operational_change_intelligence_binding.py"
          ]
          dirs=["PRISMA Factory Ledger","tools/code-atlas/src/code_atlas/intelligence","tools/code-atlas/tests","tools/code-atlas/docs"]
          caps=["code_atlas.change_intelligence.customer_wow_v1","change_intelligence.capability_anti_rework_gate"]
          req={
            "schemaVersion":"prisma_remote_authority_gateway.v2",
            "expectedHead":head,
            "profile":"change-assurance-edge-provenance-c-promotion-v1",
            "tasks":[
              {"id":"edge-c-promotion-status","surface":"governance","task":task+" Resolve whether existing evidence is sufficient for the bounded checklist status promotion with no source changes.","intent":"VERIFY","domain":"governance","requiredAuthorities":auth,"requiredDirectories":dirs,"requiredCapabilities":caps,"minimumCoverage":100,"failOnMissingAuthority":True},
              {"id":"edge-c-promotion-boundaries","surface":"governance","task":task+" Resolve exact three-file governance mutation boundary, source freeze requirements, negative evidence and recertification trigger after promotion.","intent":"VERIFY","domain":"tooling","requiredAuthorities":auth,"requiredDirectories":dirs,"requiredCapabilities":caps,"minimumCoverage":100,"failOnMissingAuthority":True}
            ]
          }
          json.dump(req,open(path,'w',encoding='utf-8'),indent=2)
          PY
          python -m code_atlas.motors.prisma_mesh_gateway preflight --repo . --request "$request" --out "$pre"
          python tools/code-atlas/src/code_atlas/motors/smart_allmesh_parallel.py --repo . --out-root "$par" --task-spec "$pre/legacy_tasks.json" --parallel 2 --workers 18 --shards 54
          python -m code_atlas.motors.prisma_mesh_gateway compose --repo . --request "$request" --preflight "$pre" --mesh-result "$par" --out "$comp" | tee "$comp/compose.stdout.txt"
          grep -Fq PASS_COMPOSED_AUTHORITY_MESH "$comp/compose.stdout.txt"
          cp "$RUNNER_TEMP/prisma-automesh-composed-result.zip" "$comp/prisma-automesh-composed-result.zip"
          test "$(git status --porcelain | wc -l)" -eq 0

      - name: Run governance mutation gates
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          python - "$RUNNER_TEMP/c-promote-pre/PREFLIGHT_MANIFEST.json" "$RUNNER_TEMP/prisma-automesh-composed-result.zip" "$head_sha" "$RUNNER_TEMP/factory-request.json" "$RUNNER_TEMP/ca-request.json" <<'PY'
          import hashlib,json,sys
          pre_path,zip_path,head,factory_path,ca_path=sys.argv[1:]
          pre=json.load(open(pre_path,encoding='utf-8'))
          digest=hashlib.sha256(open(zip_path,'rb').read()).hexdigest()
          coverage=min(float((lane.get('coverage') or {}).get('resolvedPercent',0)) for lane in pre.get('lanes') or [])
          mesh={
            'status':'PASS_COMPOSED_AUTHORITY_MESH',
            'repoHead':head,
            'requiredAuthorityCoveragePct':coverage,
            'blockers':len(pre.get('blockers') or []),
            'requestDigest':pre.get('requestDigest'),
            'artifactDigest':digest,
            'layerMapPresent':False,
          }
          task='Verify bounded governance promotion of checklist C from PARTIAL to DONE using already-merged and independently falsified edge provenance evidence; source stays frozen and v1Complete remains false.'
          factory={
            'schemaVersion':'prisma.factory-ledger.anti-rework-gate.v1',
            'mode':'MUTATION','expectedHead':head,'task':task,
            'capabilities':[
              {'id':'code_atlas.change_intelligence.customer_wow_v1','requestedAction':'VERIFY'},
              {'id':'change_intelligence.capability_anti_rework_gate','requestedAction':'VERIFY'}
            ],
            'authorityMesh':mesh,'visualMutation':False
          }
          ca={'mode':'MUTATION','task':task,'capabilityIds':['ci.core.system_graphs'],'authorityMesh':mesh,'visualMutation':False}
          json.dump(factory,open(factory_path,'w',encoding='utf-8'),indent=2)
          json.dump(ca,open(ca_path,'w',encoding='utf-8'),indent=2)
          PY
          python 'PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py' --request "$RUNNER_TEMP/factory-request.json" | tee "$RUNNER_TEMP/factory-gate.txt"
          grep -Fq PASS_ANTI_REWORK_GATE "$RUNNER_TEMP/factory-gate.txt"
          python 'PRISMA Factory Ledger/tools/verify_change_intelligence_capability_gate.py' --request "$RUNNER_TEMP/ca-request.json" | tee "$RUNNER_TEMP/change-assurance-gate.txt"
          grep -Fq PASS_CHANGE_ASSURANCE_CAPABILITY_GATE "$RUNNER_TEMP/change-assurance-gate.txt"
          test "$(git status --porcelain | wc -l)" -eq 0

      - name: Upload promotion authority evidence
        uses: actions/upload-artifact@v7
        with:
          name: ca-edge-c-promotion-authority
          path: |
            ${{ runner.temp }}/c-promote.request.json
            ${{ runner.temp }}/c-promote-pre/
            ${{ runner.temp }}/c-promote-par/*.zip
            ${{ runner.temp }}/c-promote-comp/
            ${{ runner.temp }}/factory-request.json
            ${{ runner.temp }}/factory-gate.txt
            ${{ runner.temp }}/ca-request.json
            ${{ runner.temp }}/change-assurance-gate.txt
          if-no-files-found: error
          retention-days: 7
