name: AutoMesh Parallel Certification

on:
  pull_request:
    paths:
      - '.github/workflows/automesh-parallel-cert.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: tools/code-atlas/src

jobs:
  promote-prove-h:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout governed promotion branch
        uses: actions/checkout@v6
        with:
          ref: governance/ca-prove-h-promote-2008
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Reverify runner evidence on current source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = '08fa275c14444385b1d1811d712dcf319a38df97'
          python -m py_compile \
            tools/code-atlas/src/code_atlas/change_intelligence/runner_contract.py \
            tools/code-atlas/src/code_atlas/change_intelligence/bundle.py \
            tools/code-atlas/src/code_atlas/change_intelligence/customer_lifecycle.py \
            tools/code-atlas/src/code_atlas/change_intelligence/artifact_hygiene.py \
            tools/code-atlas/tests/test_operational_rental_hardening.py
          python -m unittest -v tools/code-atlas/tests/test_operational_rental_hardening.py
          python - <<'PY'
          from code_atlas.change_intelligence import build_runner_plan, build_rental_runner_plan
          a=build_runner_plan(repository_identity='customer/repo',mode='PORTABLE_EVIDENCE',requested_outputs=['verification','report','verification'])
          b=build_runner_plan(repository_identity='customer/repo',mode='PORTABLE_EVIDENCE',requested_outputs=['report','verification'])
          assert a==b
          assert a['requestedOutputs']==['report','verification']
          assert a['readOnly'] is True and a['sourceCodeEgress'] is False
          assert all(v is False for v in a['mutationPermissions'].values())
          assert a['certifiable'] is False and a['productionCertified'] is False
          r=build_rental_runner_plan(repository_identity='customer/repo',requested_outputs=['verification','report'])
          assert r['readOnly'] is True and r['sourceCodeEgress'] is False
          assert r['artifactContentSanitizationRequired'] is True
          assert r['allExportedArtifactsMustBeInspected'] is True
          assert r['unknownArtifactFormatDecision']=='BLOCKED'
          assert r['cleanupEvidenceRequired'] is True and r['failClosed'] is True
          assert r['productionCertified'] is False
          print('PASS_H_DECLARED_INPUT_REPRODUCIBILITY')
          PY

      - name: Promote H evidence only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          map_path=Path('PRISMA Factory Ledger/PRISMA_CHANGE_INTELLIGENCE_CAPABILITY_MAP.json')
          map_md_path=Path('PRISMA Factory Ledger/PRISMA_CHANGE_INTELLIGENCE_CAPABILITY_MAP.md')
          v1_md_path=Path('tools/code-atlas/docs/PRISMA_CHANGE_ASSURANCE_V1.md')
          cmap=json.loads(map_path.read_text(encoding='utf-8'))
          rows=[x for x in cmap.get('v1DefinitionOfDone',[]) if isinstance(x,dict) and x.get('id')=='H']
          if len(rows)!=1:
              raise SystemExit('BLOCKED_H_CARDINALITY')
          h=rows[0]
          if h.get('stage')!='PROVE' or h.get('title')!='Portable reproducible runner':
              raise SystemExit('BLOCKED_H_CANON_DRIFT')
          if h.get('status')=='DONE':
              if not h.get('evidence') or not h.get('tests') or not h.get('negativeTests') or h.get('doNotRebuild') is not True:
                  raise SystemExit('BLOCKED_H_INVALID_DONE_STATE')
              print('H_ALREADY_DONE')
          else:
              if h.get('status')!='PARTIAL' or h.get('owner')!='code_atlas.change_intelligence' or h.get('doNotRebuild') is not True:
                  raise SystemExit('BLOCKED_H_STATE_DRIFT')
              h['status']='DONE'
              h['claimBoundary']='LOCAL_VERIFIED portable runner contracts replay declared inputs deterministically across fresh Ubuntu, Windows and macOS evidence while preserving read-only, no-source-egress, lifecycle, cleanup and fail-closed boundaries. No production, enterprise, paid-pilot, arbitrary-infrastructure, legal/privacy/security or secure-erase claim.'
              h['evidence']=[
                  'path:tools/code-atlas/src/code_atlas/change_intelligence/runner_contract.py',
                  'path:tools/code-atlas/src/code_atlas/change_intelligence/customer_lifecycle.py',
                  'path:tools/code-atlas/src/code_atlas/change_intelligence/artifact_hygiene.py',
                  'path:tools/code-atlas/tests/test_operational_rental_hardening.py',
                  'H focused cross-platform evidence run 32338490273: Ubuntu/Windows/macOS SUCCESS',
                  'H governance authority run 32338688480 / artifact 9395575133',
                  'Authority Mesh artifact sha256:d52c5d62ae0ac3b1074578b6464156929eafead55aa386e79658ad298f90a611',
                  'Factory gate decision f4dd91099d46b280e4c2f68c7392c6f6c193c69a6e1d7ca050281ad49e556071',
                  'Change Assurance gate PASS_CHANGE_ASSURANCE_CAPABILITY_GATE'
              ]
              h['tests']=[
                  'test_rental_v2_requires_sanitized_bundle_and_matching_lifecycle',
                  'test_ephemeral_workspace_is_expired_and_cleanup_is_verifiable',
                  'PASS_H_DECLARED_INPUT_REPRODUCIBILITY on Ubuntu/Windows/macOS run 32338490273'
              ]
              h['negativeTests']=[
                  'test_source_code_and_unknown_binary_formats_fail_closed',
                  'test_batch_failure_publishes_nothing',
                  'test_hardened_manifest_rejects_attestation_tampering',
                  'test_bounded_retention_is_capped'
              ]
              h['knownBlindSpots']=[
                  'LOCAL_VERIFIED runner evidence does not prove customer production deployment or arbitrary infrastructure/container environments.',
                  'Cleanup evidence proves governed cleanup behavior, not cryptographic secure erase.',
                  'This evidence does not prove enterprise IAM/security, legal/privacy compliance, paid-pilot readiness, human usefulness or independent-agent replication.'
              ]
              h['nextEvidence']='REUSE_DONE_BASELINE; recertify after runner mode, lifecycle, sanitization, bundle, cleanup or portability-contract drift.'
              h['owner']='code_atlas.change_intelligence'
              h['doNotRebuild']=True

          cmap['v1Complete']=all(
              (not bool(x.get('requiredForV1'))) or x.get('status')=='DONE'
              for x in cmap.get('v1DefinitionOfDone',[]) if isinstance(x,dict)
          )
          if cmap['v1Complete']:
              raise SystemExit('BLOCKED_UNEXPECTED_V1_COMPLETE_AFTER_H')
          cmap['lastGovernanceMutation']={
              'kind':'PROVE_H_LOCAL_VERIFICATION_PROMOTION',
              'sourceHead':'08fa275c14444385b1d1811d712dcf319a38df97',
              'technicalEvidenceRunId':32338490273,
              'authorityRunId':32338688480,
              'authorityArtifactId':9395575133,
              'authorityArtifactSha256':'f01a4f838f973ad52ff1a8abab75af9fc5ece48d8f3c7c055b11cba5d1cb7e07',
              'composedAuthoritySha256':'d52c5d62ae0ac3b1074578b6464156929eafead55aa386e79658ad298f90a611',
              'requestDigest':'86e75f366e36eeeabca3b9b0cd720b25909edc8be1ee69ca02ebca4279e6277c',
              'factoryGateDecisionDigest':'f4dd91099d46b280e4c2f68c7392c6f6c193c69a6e1d7ca050281ad49e556071',
              'status':'LOCAL_VERIFIED',
              'productionCertified':False
          }

          map_md=map_md_path.read_text(encoding='utf-8')
          old='| H | PROVE | Portable reproducible runner | `PARTIAL` |'
          new='| H | PROVE | Portable reproducible runner | `DONE` |'
          if old in map_md:
              map_md=map_md.replace(old,new,1)
          elif new not in map_md:
              raise SystemExit('BLOCKED_H_HUMAN_MAP_DRIFT')
          note='H is `DONE / LOCAL_VERIFIED` from the existing protected runner owners. Focused run `32338490273` passed the rental/portability contract on Ubuntu, Windows and macOS, including deterministic declared-input normalization plus fail-closed source-egress, artifact-format, lifecycle, cleanup and retention negatives. Governance authority run `32338688480` passed both anti-rework gates with source bytes unchanged. This does not certify production, enterprise, paid-pilot, arbitrary infrastructure, legal/privacy/security or secure erase.'
          if note not in map_md:
              marker='Therefore `v1Complete=false`.'
              map_md=map_md.replace(marker,marker+'\n\n'+note,1)

          v1_md=v1_md_path.read_text(encoding='utf-8')
          old='| H | PROVE | Portable reproducible runner | `PARTIAL` |'
          new='| H | PROVE | Portable reproducible runner | `DONE` |'
          if old in v1_md:
              v1_md=v1_md.replace(old,new,1)
          elif new not in v1_md:
              raise SystemExit('BLOCKED_H_V1_DOC_DRIFT')
          note2='Checklist H is now `DONE / LOCAL_VERIFIED`: the existing LOCAL_ONLY, PORTABLE_EVIDENCE and rental V2 runner contracts replay declared inputs deterministically, remain read-only, prohibit source-code egress and operational mutations, and require lifecycle/cleanup and fail-closed portable-evidence handling. Focused run `32338490273` passed on Ubuntu, Windows and macOS. Governance authority run `32338688480` passed the universal Factory Ledger and Change Assurance gates with source bytes unchanged. H does not prove customer production deployment, arbitrary infrastructure/container execution, enterprise IAM/security, legal/privacy compliance, paid-pilot readiness or secure erase.'
          if note2 not in v1_md:
              marker='`V1 complete` is therefore **false**. This is intentional.'
              v1_md=v1_md.replace(marker,marker+'\n\n'+note2,1)

          map_path.write_text(json.dumps(cmap,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          map_md_path.write_text(map_md,encoding='utf-8')
          v1_md_path.write_text(v1_md,encoding='utf-8')
          print('PASS_H_PROMOTION_GENERATED')
          PY

      - name: Validate promoted governance truth
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            'PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py' \
            'PRISMA Factory Ledger/tools/verify_change_intelligence_capability_gate.py'
          python 'PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py' --validate
          python 'PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py' --self-test
          python 'PRISMA Factory Ledger/tools/verify_change_intelligence_capability_gate.py' --validate-map
          python 'PRISMA Factory Ledger/tools/verify_change_intelligence_capability_gate.py' --self-test
          python - <<'PY'
          import json
          d=json.load(open('PRISMA Factory Ledger/PRISMA_CHANGE_INTELLIGENCE_CAPABILITY_MAP.json',encoding='utf-8'))
          h=next(x for x in d['v1DefinitionOfDone'] if x['id']=='H')
          assert h['status']=='DONE' and h['doNotRebuild'] is True
          assert h['evidence'] and h['tests'] and h['negativeTests'] and h['knownBlindSpots']
          assert d['v1Complete'] is False
          assert next(x for x in d['v1DefinitionOfDone'] if x['id']=='I')['status']=='PARTIAL'
          assert next(x for x in d['v1DefinitionOfDone'] if x['id']=='J')['status']=='BLOCKED'
          print('PASS_H_LOCAL_VERIFIED_GOVERNANCE')
          PY

      - name: Commit exactly three governance files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'chatgpt-codex-connector[bot]'
          git config user.email 'chatgpt-codex-connector[bot]@users.noreply.github.com'
          paths=(
            'PRISMA Factory Ledger/PRISMA_CHANGE_INTELLIGENCE_CAPABILITY_MAP.json'
            'PRISMA Factory Ledger/PRISMA_CHANGE_INTELLIGENCE_CAPABILITY_MAP.md'
            'tools/code-atlas/docs/PRISMA_CHANGE_ASSURANCE_V1.md'
          )
          git add -- "${paths[@]}"
          git diff --cached --check
          mapfile -t changed < <(git diff --cached --name-only)
          test "${#changed[@]}" -eq 3
          for p in "${paths[@]}"; do printf '%s\n' "${changed[@]}" | grep -Fx "$p"; done
          git commit -m 'governance(ca): certify PROVE portable runner evidence'
          git push origin HEAD:governance/ca-prove-h-promote-2008
