name: Tablet Sync WAVE2 Authorized Finalizer

on:
  pull_request:
    paths:
      - '.github/workflows/automesh-parallel-cert.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  AUTHORIZED_MAIN: 5c805bc2f448af0b2742b52e19055b05f1859bab
  GOV_BRANCH: governance/tablet-sync-wave2-canonical-close-2508-r2
  DOC_BRANCH: docs/prisma-parallel-work-rule-2508

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact authorized main
        uses: actions/checkout@v6
        with:
          ref: 5c805bc2f448af0b2742b52e19055b05f1859bab
          fetch-depth: 0
          persist-credentials: true

      - name: Verify fresh authorized state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_MAIN"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$AUTHORIZED_MAIN"
          test -z "$(git ls-remote --heads origin "refs/heads/$GOV_BRANCH")"
          test -z "$(git ls-remote --heads origin "refs/heads/$DOC_BRANCH")"
          test -z "$(git status --porcelain)"

      - name: Create exact four-file WAVE2 canonical closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "prisma-governance-bot"
          git config user.email "prisma-governance-bot@users.noreply.github.com"
          git switch -c "$GOV_BRANCH"
          python - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          cap_id="tablet.sync.runtime_truth"; marker="PASS_TABLET_SYNC_WAVE2_POSTMERGE_RUNTIME_NO_FAKE_GREEN"; now=datetime.now(timezone(timedelta(hours=-6))).isoformat(timespec="seconds")
          root=Path("PRISMA Factory Ledger"); ledger_p=root/"PRISMA_FACTORY_LEDGER.json"; dnr_p=root/"PRISMA_FACTORY_LEDGER_DO_NOT_REBUILD_MAP.json"; reg_p=root/"PRISMA_FACTORY_LEDGER_REGISTRATION_INDEX.json"; evid_p=root/"PRISMA_EVIDENCE_INDEX.json"
          runtime_evidence=["WAVE2 product PR #377 merge 1a83d5decb4e946021b9acf95f1a49479d6abf19","WAVE2 post-merge runtime run 32866793273 artifact 9570464455 digest sha256:f06087c14951010bb782c6fed46d6620ec2a063cdbcec6b233a387e6f21b35e4","apps/terminal-de-venta-system/products/tablet/app/tools/verify_tablet_sync_panel_truth_1808.mjs 55/55 PASS","WAVE2 isolated browser/runtime evidence 10/10 screenshots; runtime exceptions 0; console errors 0; unexpected network errors 0; intentional unconfirmed panel 503 only","WAVE2 canonical-close Authority run 32868230568 artifact 9571018119 digest sha256:9d35191c7c190d98e916e54668c99666dced6ff5913d36fe96d7d23ad6c60aec"]
          claim_ceiling=["Hosted production deployment","Real deployed PC transport end-to-end certification","Production database end-to-end certification","Distribution/release readiness","Runtime zero-custody or data-egress certification","Runtime or visual certification of unrelated Tablet routes or other PRISMA surfaces","Future runtime behavior after source drift"]
          next_gate="Run final Tablet ScreensQA; then distribution/release readiness; then runtime data-custody/egress certification. WAVE2 itself is closed and must not be rebuilt."
          load=lambda p: json.loads(p.read_text(encoding="utf-8"))
          def save(p,d): p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          ledger=load(ledger_p); matches=[c for c in ledger.get("capabilities",[]) if c.get("id")==cap_id]
          if len(matches)!=1: raise SystemExit(f"LEDGER_CAPABILITY_MATCH_COUNT:{len(matches)}")
          c=matches[0]; c.update({"classification":"DONE","status":"RUNTIME_VERIFIED","stateLabel":marker,"doNotRebuild":True,"nextGate":next_gate})
          for x in runtime_evidence:
              if x not in c.setdefault("evidence",[]): c["evidence"].append(x)
          for x in claim_ceiling:
              if x not in c.setdefault("doesNotProve",[]): c["doesNotProve"].append(x)
          for x in ["final Tablet ScreensQA","distribution/release readiness after final ScreensQA","runtime data-custody/egress certification after release readiness","read-only recertification after relevant drift"]:
              if x not in c.setdefault("allowedActions",[]): c["allowedActions"].append(x)
          save(ledger_p,ledger)
          dnr=load(dnr_p); row=dnr.get("doNotRebuild",{}).get(cap_id)
          if not isinstance(row,dict): raise SystemExit("DNR_CAPABILITY_MISSING")
          row.update({"value":True,"reason":"Tablet Sync WAVE2 is merged and isolated post-merge runtime-certified. Reuse existing Outbox/projection/reconciliation/dispatcher/licensing truth; WAVE1 and WAVE2 are closed and must not be rebuilt.","evidence":"PR #377 merge 1a83d5decb4e946021b9acf95f1a49479d6abf19 / run 32866793273 artifact 9570464455 / closure Authority run 32868230568 artifact 9571018119 / PASS_TABLET_SYNC_WAVE2_POSTMERGE_RUNTIME_NO_FAKE_GREEN","updatedAt":now}); dnr["updatedAt"]=now; save(dnr_p,dnr)
          reg=load(reg_p); row=reg.get("registrations",{}).get(cap_id)
          if not isinstance(row,dict): raise SystemExit("REG_CAPABILITY_MISSING")
          row.update({"status":"DONE_RUNTIME_VERIFIED","updatedAt":now,"evidence":"PR #377 merge 1a83d5decb4e946021b9acf95f1a49479d6abf19 / WAVE2 post-merge runtime run 32866793273 artifact 9570464455 / closure Authority run 32868230568 artifact 9571018119","sourceEvidenceSha256":"F06087C14951010BB782C6FED46D6620EC2A063CDBCEC6B233A387E6F21B35E4","doNotRebuild":True,"nextGate":"TABLET_FINAL_SCREENSQA_THEN_DISTRIBUTION_RELEASE_READINESS_THEN_RUNTIME_DATA_CUSTODY_EGRESS_CERTIFICATION"}); reg["updatedAt"]=now; save(reg_p,reg)
          evid=load(evid_p); artifacts=evid.get("artifacts")
          if not isinstance(artifacts,list): raise SystemExit("EVIDENCE_ARTIFACTS_NOT_LIST")
          artifact_name="Tablet Sync WAVE2 postmerge runtime run 32866793273 / artifact 9570464455"
          if not any(isinstance(a,dict) and a.get("artifact")==artifact_name for a in artifacts): artifacts.append({"artifact":artifact_name,"type":"tablet_sync_wave2_postmerge_runtime_certification","scope":["tablet","sync","outbox","runtime","governance"],"status":marker,"proves":["Merged WAVE2 product source at 1a83d5decb4e946021b9acf95f1a49479d6abf19 passes the focused sync truth verifier 55/55","Isolated Next/Chrome runtime captured 10/10 required /sync states","Per-operation provenance and persisted ACK/conflict evidence are visible without schema invention","Selected retry result truth remains bounded to retryable operations and conflicts stay review-only","PC/Backoffice is the explicit conflict-resolution owner while Tablet remains local-first and review-only","Runtime exceptions, console errors and unexpected network errors are zero; the unconfirmed panel 503 is intentional and fails closed"],"doesNotProve":claim_ceiling,"evidence":["PR #377","merge 1a83d5decb4e946021b9acf95f1a49479d6abf19","run 32866793273","artifact 9570464455","sha256:f06087c14951010bb782c6fed46d6620ec2a063cdbcec6b233a387e6f21b35e4","closure Authority run 32868230568 artifact 9571018119"]})
          save(evid_p,evid)
          for p in [ledger_p,dnr_p,reg_p,evid_p]: json.loads(p.read_text(encoding="utf-8"))
          assert marker in ledger_p.read_text(encoding="utf-8"); assert marker in dnr_p.read_text(encoding="utf-8"); assert "9570464455" in reg_p.read_text(encoding="utf-8"); assert marker in evid_p.read_text(encoding="utf-8")
          PY
          python - <<'PY'
          import subprocess
          expected=sorted(["PRISMA Factory Ledger/PRISMA_EVIDENCE_INDEX.json","PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER.json","PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER_DO_NOT_REBUILD_MAP.json","PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER_REGISTRATION_INDEX.json"])
          actual=sorted(subprocess.check_output(["git","diff","--name-only"],text=True).splitlines())
          if actual!=expected: raise SystemExit(f"GOV_DIFF_SCOPE:{actual}")
          PY
          git diff --check
          git add -- 'PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER.json' 'PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER_DO_NOT_REBUILD_MAP.json' 'PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER_REGISTRATION_INDEX.json' 'PRISMA Factory Ledger/PRISMA_EVIDENCE_INDEX.json'
          git commit -m "governance(tablet): close Sync Operations Center WAVE2"
          test "$(git diff --name-only "$AUTHORIZED_MAIN"..HEAD | wc -l)" -eq 4
          git push origin "HEAD:refs/heads/$GOV_BRANCH"

      - name: Create exact one-file parallelism manual branch
        shell: bash
        run: |
          set -euo pipefail
          git switch --detach "$AUTHORIZED_MAIN"
          git switch -c "$DOC_BRANCH"
          python - <<'PY'
          import base64
          from pathlib import Path
          p=Path("apps/terminal-de-venta-system/docs/ops/PRISMA_FIELD_MANUAL_APRENDIZAJE_OPERATIVO.md"); marker="PARALLEL_WORK_RULE_20260825"; text=p.read_text(encoding="utf-8")
          if marker in text: raise SystemExit("PARALLEL_RULE_ALREADY_PRESENT")
          b64=""
          p.write_text(text.rstrip()+base64.b64decode(b64).decode("utf-8")+"\n",encoding="utf-8")
          PY
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = 'apps/terminal-de-venta-system/docs/ops/PRISMA_FIELD_MANUAL_APRENDIZAJE_OPERATIVO.md'
          grep -Fq 'PARALLEL_WORK_RULE_20260825' 'apps/terminal-de-venta-system/docs/ops/PRISMA_FIELD_MANUAL_APRENDIZAJE_OPERATIVO.md'
          git diff --check
          git add -- 'apps/terminal-de-venta-system/docs/ops/PRISMA_FIELD_MANUAL_APRENDIZAJE_OPERATIVO.md'
          git commit -m "docs(ops): record safe parallel-work rule"
          test "$(git diff --name-only "$AUTHORIZED_MAIN"..HEAD | wc -l)" -eq 1
          git push origin "HEAD:refs/heads/$DOC_BRANCH"

      - name: Final authorized branch gate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(git ls-remote --heads origin "refs/heads/$GOV_BRANCH")"
          test -n "$(git ls-remote --heads origin "refs/heads/$DOC_BRANCH")"
          printf '%s\n' 'PASS_TABLET_SYNC_WAVE2_AUTHORIZED_BRANCHES_CREATED'
