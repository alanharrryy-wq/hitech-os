name: AutoMesh Parallel Certification

on:
  pull_request:
    paths:
      - 'tools/code-atlas/src/code_atlas/motors/prisma_automesh_runtime.py'
      - 'tools/code-atlas/src/code_atlas/motors/smart_allmesh_automesh.py'
      - 'tools/code-atlas/src/code_atlas/motors/smart_allmesh_controller.py'
      - 'tools/code-atlas/src/code_atlas/motors/smart_allmesh_parallel.py'
      - 'tools/code-atlas/scripts/RUN_SMART_ALLMESH_PARALLEL.ps1'
      - 'tools/code-atlas/tests/test_smart_allmesh_parallel.py'
      - '.github/workflows/automesh-parallel-cert.yml'
  push:
    branches: ['main']
    paths:
      - 'tools/code-atlas/src/code_atlas/motors/prisma_automesh_runtime.py'
      - 'tools/code-atlas/src/code_atlas/motors/smart_allmesh_automesh.py'
      - 'tools/code-atlas/src/code_atlas/motors/smart_allmesh_controller.py'
      - 'tools/code-atlas/src/code_atlas/motors/smart_allmesh_parallel.py'
      - 'tools/code-atlas/scripts/RUN_SMART_ALLMESH_PARALLEL.ps1'
      - 'tools/code-atlas/tests/test_smart_allmesh_parallel.py'
      - '.github/workflows/automesh-parallel-cert.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  automesh-parallel-cert:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile AutoMesh tooling
        run: python -m py_compile tools/code-atlas/src/code_atlas/motors/prisma_automesh_runtime.py tools/code-atlas/src/code_atlas/motors/smart_allmesh_automesh.py tools/code-atlas/src/code_atlas/motors/smart_allmesh_controller.py tools/code-atlas/src/code_atlas/motors/smart_allmesh_parallel.py tools/code-atlas/tests/test_smart_allmesh_parallel.py

      - name: Run legacy AutoMesh self-test
        run: python tools/code-atlas/src/code_atlas/motors/smart_allmesh_automesh.py --self-test

      - name: Run elastic, fail-fast, provenance and real AutoMesh certification tests
        run: python -m unittest -v tools/code-atlas/tests/test_smart_allmesh_parallel.py

      - name: Run task-exact Change Assurance Authority Mesh
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ca-authority-mesh"
          python tools/code-atlas/src/code_atlas/motors/smart_allmesh_automesh.py \
            --repo . \
            --out "$RUNNER_TEMP/ca-authority-mesh" \
            --surface governance \
            --workers 18 \
            --shards 54 \
            --task "Formalizar PRISMA Change Assurance como nombre comercial definitivo de Code Atlas, instalar o completar un capability checklist V1 machine-enforced basado en UNDERSTAND/RESOLVE/AUTHORIZE/OBSERVE/VERIFY/PROVE y A–J Definition of Done, conectar product-name/capability/claim/no-fake-green gates a CI, y migrar referencias actuales de PRISMA Change Intelligence conservando únicamente aliases de compatibilidad y evidencia histórica explícita. No reconstruir Universal Intelligence ni Customer Wow; no ampliar runtime/product scope fuera de Code Atlas y su documentación/quality/contracts."

      - name: Upload task-exact Authority Mesh evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ca-authority-mesh-preflight
          path: ${{ runner.temp }}/ca-authority-mesh/*.zip
          if-no-files-found: error
          retention-days: 7
