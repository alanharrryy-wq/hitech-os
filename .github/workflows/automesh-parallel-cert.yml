name: AutoMesh Parallel Certification

on:
  pull_request:
    paths:
      - '.github/workflows/automesh-parallel-cert.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: tools/code-atlas/src

jobs:
  ca-ledger-reconcile-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Compile and self-test authority tooling
        run: |
          python -m py_compile \
            tools/code-atlas/src/code_atlas/motors/prisma_automesh_runtime.py \
            tools/code-atlas/src/code_atlas/motors/smart_allmesh_automesh.py \
            tools/code-atlas/src/code_atlas/motors/smart_allmesh_parallel.py \
            tools/code-atlas/src/code_atlas/motors/prisma_mesh_gateway.py
          python tools/code-atlas/src/code_atlas/motors/smart_allmesh_automesh.py --self-test

      - name: Run task-exact Factory Ledger reconciliation Authority Mesh
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          request="$RUNNER_TEMP/ca-ledger-reconcile.request.json"
          preflight="$RUNNER_TEMP/ca-ledger-preflight"
          parallel="$RUNNER_TEMP/ca-ledger-parallel"
          composed="$RUNNER_TEMP/ca-ledger-composed"
          mkdir -p "$preflight" "$parallel" "$composed/payload"
          python - "$request" "$head_sha" <<'PY'
          import json, sys
          path, head = sys.argv[1], sys.argv[2]
          base = (
            "Governance-only prerequisite for PRISMA Change Assurance V1. Reconcile the Factory Ledger authority needed to evolve the existing Code Atlas / PRISMA Change Intelligence anti-rework capability without rebuilding Universal Intelligence or Customer Wow. "
            "Register the already-merged change_intelligence.capability_anti_rework_gate as a canonical Factory Ledger capability using existing PR #311 evidence, and reconcile the supplemental registration status of code_atlas.change_intelligence.customer_wow_v1 with its canonical VERIFY / LOCAL_VERIFIED classification. "
            "Do not modify Code Atlas product/runtime, Cloud Center, Tablet, PC, Mobile, Chart Lab, Shared UI, DB, Prisma, processes, ports, deploys, or production claims. Preserve PRISMA_FACTORY_LEDGER.json as the sole canonical capability truth and treat DNR/Registration/Evidence as supplemental projections."
          )
          request = {
            "schemaVersion": "prisma_remote_authority_gateway.v2",
            "expectedHead": head,
            "profile": "change-assurance-authority-reconcile-v1",
            "tasks": [
              {
                "id": "ca-authority-reconcile",
                "surface": "governance",
                "task": base + " Resolve the exact canonical row, classification, status, doNotRebuild, evidence, doesNotProve, allowed/forbidden actions and next gate.",
                "intent": "FIX",
                "domain": "governance",
                "requiredAuthorities": [
                  "PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER.json",
                  "PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER_DO_NOT_REBUILD_MAP.json",
                  "PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER_REGISTRATION_INDEX.json",
                  "PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER_AGENT_GATE.md",
                  "PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py",
                  "PRISMA Factory Ledger/PRISMA_CHANGE_INTELLIGENCE_CAPABILITY_MAP.json"
                ],
                "requiredDirectories": ["PRISMA Factory Ledger"],
                "requiredCapabilities": ["code_atlas.change_intelligence.customer_wow_v1"],
                "minimumCoverage": 100,
                "failOnMissingAuthority": True
              },
              {
                "id": "ca-registration-consistency",
                "surface": "governance",
                "task": base + " Audit overlap/contradiction rules and prove the smallest governance-only mutation needed so the universal anti-rework gate can later evaluate the actual Change Assurance V1 implementation without shadow-only or contradictory registration blockers.",
                "intent": "FIX",
                "domain": "governance",
                "requiredAuthorities": [
                  "PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER.json",
                  "PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER_DO_NOT_REBUILD_MAP.json",
                  "PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER_REGISTRATION_INDEX.json",
                  "PRISMA Factory Ledger/PRISMA_EVIDENCE_INDEX.json",
                  ".github/workflows/prisma-factory-anti-rework-gate.yml",
                  "PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py"
                ],
                "requiredDirectories": ["PRISMA Factory Ledger", ".github/workflows"],
                "requiredCapabilities": ["code_atlas.change_intelligence.customer_wow_v1"],
                "minimumCoverage": 100,
                "failOnMissingAuthority": True
              }
            ]
          }
          with open(path, "w", encoding="utf-8") as f:
              json.dump(request, f, indent=2, ensure_ascii=False)
          PY
          python -m code_atlas.motors.prisma_mesh_gateway preflight --repo . --request "$request" --out "$preflight"
          python tools/code-atlas/src/code_atlas/motors/smart_allmesh_parallel.py \
            --repo . --out-root "$parallel" --task-spec "$preflight/legacy_tasks.json" \
            --parallel 2 --workers 18 --shards 54
          python -m code_atlas.motors.prisma_mesh_gateway compose \
            --repo . --request "$request" --preflight "$preflight" --mesh-result "$parallel" --out "$composed/payload"

      - name: Upload reconciliation Authority Mesh evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ca-ledger-reconcile-authority
          path: |
            ${{ runner.temp }}/ca-ledger-reconcile.request.json
            ${{ runner.temp }}/ca-ledger-preflight/
            ${{ runner.temp }}/ca-ledger-parallel/*.zip
            ${{ runner.temp }}/ca-ledger-composed/
          if-no-files-found: error
          retention-days: 7
