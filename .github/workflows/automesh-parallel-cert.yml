name: AutoMesh Parallel Certification

on:
  pull_request:
    paths:
      - '.github/workflows/automesh-parallel-cert.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: tools/code-atlas/src

jobs:
  ca-observe-f-refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Compile authority tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/code-atlas/src/code_atlas/motors/prisma_automesh_runtime.py \
            tools/code-atlas/src/code_atlas/motors/smart_allmesh_automesh.py \
            tools/code-atlas/src/code_atlas/motors/smart_allmesh_parallel.py \
            tools/code-atlas/src/code_atlas/motors/prisma_mesh_gateway.py \
            'PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py' \
            'PRISMA Factory Ledger/tools/verify_change_intelligence_capability_gate.py'
          python tools/code-atlas/src/code_atlas/motors/smart_allmesh_automesh.py --self-test
          test "$(git status --porcelain | wc -l)" -eq 0

      - name: Refresh exact OBSERVE F mutation authority
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          request="$RUNNER_TEMP/ca-observe-f-refresh.request.json"
          preflight="$RUNNER_TEMP/ca-observe-f-refresh-preflight"
          parallel="$RUNNER_TEMP/ca-observe-f-refresh-parallel"
          composed="$RUNNER_TEMP/ca-observe-f-refresh-composed"
          mkdir -p "$preflight" "$parallel" "$composed"
          python - "$request" "$head_sha" <<'PY'
          import json, sys
          path, head = sys.argv[1], sys.argv[2]
          base = (
              "Refresh mutation authority for canonical capability ci.observe.change_comparison after main advanced. "
              "The intended mutation remains a bounded PRISMA Change Assurance OBSERVE change-comparison adapter owned by code_atlas.change_intelligence. "
              "Reuse and do not rebuild ci.core.snapshot_locking, ci.change.architecture_delta, verification, evidence/reporting, graph or runner owners. "
              "Implementation may compare only explicitly supplied same-repository states with explicit snapshot lineage/provenance, deterministic machine-readable added/removed/changed/unchanged deltas, and fail-closed UNKNOWN/BLOCKED behavior for stale, contradictory, unsupported, partial, duplicate-identity, missing-critical-evidence or cross-repository inputs. "
              "No product runtime, Cloud Center, Tablet, PC, Mobile, Chart Lab, Shared UI, DB, Prisma, process, port or deploy mutation."
          )
          common = [
              "PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER.json",
              "PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER_AGENT_GATE.md",
              "PRISMA Factory Ledger/PRISMA_CHANGE_INTELLIGENCE_CAPABILITY_MAP.json",
              "PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py",
              "PRISMA Factory Ledger/tools/verify_change_intelligence_capability_gate.py",
              "tools/code-atlas/CODE_ATLAS_CHANGE_ASSURANCE_CONTRACT.json",
              "tools/code-atlas/docs/PRISMA_CHANGE_ASSURANCE_V1.md",
              "tools/code-atlas/src/code_atlas/change_intelligence/architecture_delta.py",
              "tools/code-atlas/src/code_atlas/change_intelligence/__init__.py",
              "tools/code-atlas/src/code_atlas/change_intelligence/contracts.py",
              "tools/code-atlas/src/code_atlas/intelligence/snapshot.py",
              "tools/code-atlas/tests/test_operational_change_studio.py"
          ]
          request = {
              "schemaVersion": "prisma_remote_authority_gateway.v2",
              "expectedHead": head,
              "profile": "change-assurance-observe-f-refresh-v1",
              "tasks": [
                  {
                      "id": "observe-f-refresh-build",
                      "surface": "governance",
                      "task": base + " Confirm the exact build remains authorized after intervening main changes and resolve any drift affecting F, its owner, protected owners, allowed files, Definition of Done or claim ceiling.",
                      "intent": "BUILD",
                      "domain": "tooling",
                      "requiredAuthorities": common,
                      "requiredDirectories": ["PRISMA Factory Ledger", "tools/code-atlas/src/code_atlas/change_intelligence", "tools/code-atlas/src/code_atlas/intelligence", "tools/code-atlas/tests", "tools/code-atlas/docs"],
                      "requiredCapabilities": ["ci.observe.change_comparison", "change_intelligence.capability_anti_rework_gate", "code_atlas.change_intelligence.customer_wow_v1"],
                      "minimumCoverage": 100,
                      "failOnMissingAuthority": True
                  },
                  {
                      "id": "observe-f-refresh-protected",
                      "surface": "governance",
                      "task": base + " Re-prove that existing snapshot locking and Architecture Delta normalization stay protected and that no intervening main commit authorizes duplicate engines or broadens product scope.",
                      "intent": "VERIFY",
                      "domain": "governance",
                      "requiredAuthorities": common,
                      "requiredDirectories": ["PRISMA Factory Ledger", "tools/code-atlas/src/code_atlas/change_intelligence", "tools/code-atlas/src/code_atlas/intelligence"],
                      "requiredCapabilities": ["ci.observe.change_comparison", "change_intelligence.capability_anti_rework_gate"],
                      "minimumCoverage": 100,
                      "failOnMissingAuthority": True
                  }
              ]
          }
          with open(path, 'w', encoding='utf-8') as f:
              json.dump(request, f, indent=2, ensure_ascii=False)
          PY
          python -m code_atlas.motors.prisma_mesh_gateway preflight --repo . --request "$request" --out "$preflight"
          python tools/code-atlas/src/code_atlas/motors/smart_allmesh_parallel.py \
            --repo . --out-root "$parallel" --task-spec "$preflight/legacy_tasks.json" \
            --parallel 2 --workers 18 --shards 54
          python -m code_atlas.motors.prisma_mesh_gateway compose \
            --repo . --request "$request" --preflight "$preflight" --mesh-result "$parallel" --out "$composed" \
            | tee "$composed/compose.stdout.txt"
          grep -Fq 'PASS_COMPOSED_AUTHORITY_MESH' "$composed/compose.stdout.txt"
          composed_zip="$RUNNER_TEMP/prisma-automesh-composed-result.zip"
          test -f "$composed_zip"
          cp "$composed_zip" "$composed/prisma-automesh-composed-result.zip"
          python - "$preflight/PREFLIGHT_MANIFEST.json" "$composed/PRISMA_MESH_GATEWAY_REPORT.json" "$composed_zip" "$RUNNER_TEMP/factory.request.json" "$RUNNER_TEMP/ca.request.json" <<'PY'
          import hashlib, json, sys
          pf_path, report_path, zip_path, factory_path, ca_path = sys.argv[1:]
          pf=json.load(open(pf_path,encoding='utf-8')); report=json.load(open(report_path,encoding='utf-8'))
          if report.get('status')!='PASS_COMPOSED_AUTHORITY_MESH' or pf.get('status')!='PASS_PREFLIGHT':
              raise SystemExit('BLOCKED_REFRESH_MESH_NOT_PASS')
          coverage=min(float(l['coverage']['resolvedPercent']) for l in pf['lanes'])
          blockers=len(pf.get('blockers') or [])
          artifact='sha256:'+hashlib.sha256(open(zip_path,'rb').read()).hexdigest()
          mesh={'status':'PASS_COMPOSED_AUTHORITY_MESH','repoHead':report['repoHead'],'requiredAuthorityCoveragePct':int(coverage),'blockers':blockers,'requestDigest':report['requestDigest'],'artifactDigest':artifact,'layerMapPresent':True}
          task='Build only ci.observe.change_comparison as the bounded deterministic OBSERVE adapter over protected snapshot locking and Architecture Delta normalization, with native fail-closed tests and no product runtime mutation.'
          json.dump({'schemaVersion':'prisma.factory-ledger.anti-rework-request.v1','mode':'MUTATION','expectedHead':report['repoHead'],'task':task,'capabilities':[{'id':'ci.observe.change_comparison','requestedAction':'BUILD'}],'authorityMesh':mesh,'visualMutation':False},open(factory_path,'w',encoding='utf-8'),indent=2)
          json.dump({'mode':'MUTATION','capabilityIds':['ci.observe.change_comparison'],'task':task,'authorityMesh':mesh,'visualMutation':False},open(ca_path,'w',encoding='utf-8'),indent=2)
          print(json.dumps({'mesh':mesh},indent=2))
          PY
          python 'PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py' --request "$RUNNER_TEMP/factory.request.json" | tee "$RUNNER_TEMP/factory.decision.json"
          grep -Fq 'PASS_ANTI_REWORK_GATE' "$RUNNER_TEMP/factory.decision.json"
          python 'PRISMA Factory Ledger/tools/verify_change_intelligence_capability_gate.py' --request "$RUNNER_TEMP/ca.request.json" | tee "$RUNNER_TEMP/ca.decision.json"
          grep -Fq 'PASS_CHANGE_ASSURANCE_CAPABILITY_GATE' "$RUNNER_TEMP/ca.decision.json"
          test "$(git status --porcelain | wc -l)" -eq 0
          echo 'PASS_OBSERVE_F_REFRESHED_MUTATION_AUTHORITY'

      - name: Upload refreshed OBSERVE F authority
        uses: actions/upload-artifact@v7
        with:
          name: ca-observe-f-refresh-authority
          path: |
            ${{ runner.temp }}/ca-observe-f-refresh.request.json
            ${{ runner.temp }}/ca-observe-f-refresh-preflight/
            ${{ runner.temp }}/ca-observe-f-refresh-parallel/*.zip
            ${{ runner.temp }}/ca-observe-f-refresh-composed/
            ${{ runner.temp }}/factory.request.json
            ${{ runner.temp }}/factory.decision.json
            ${{ runner.temp }}/ca.request.json
            ${{ runner.temp }}/ca.decision.json
          if-no-files-found: error
          retention-days: 7
