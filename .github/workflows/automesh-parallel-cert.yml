name: AutoMesh Parallel Certification

on:
  pull_request:
    paths:
      - '.github/workflows/automesh-parallel-cert.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: tools/code-atlas/src

jobs:
  a-governance-promotion:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout governed branch
        uses: actions/checkout@v6
        with:
          ref: governance/ca-understand-a-promote-2008
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Apply deterministic A governance promotion
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = '4696cfb09cd86697272d2ae6c8414b6f68bf689a'
          python - <<'PY'
          import json
          from pathlib import Path

          map_json=Path('PRISMA Factory Ledger/PRISMA_CHANGE_INTELLIGENCE_CAPABILITY_MAP.json')
          map_md=Path('PRISMA Factory Ledger/PRISMA_CHANGE_INTELLIGENCE_CAPABILITY_MAP.md')
          v1_md=Path('tools/code-atlas/docs/PRISMA_CHANGE_ASSURANCE_V1.md')
          data=json.loads(map_json.read_text(encoding='utf-8'))
          dod=data.get('v1DefinitionOfDone') or []
          by={row.get('id'):row for row in dod if isinstance(row,dict)}
          if set('ABCDEFGHIJ')-set(by): raise SystemExit('BLOCKED_V1_DOD_INCOMPLETE')
          a=by['A']
          if (a.get('stage'),a.get('title'),a.get('status'),a.get('owner'),a.get('doNotRebuild')) != ('UNDERSTAND','Universal bounded repository understanding','PARTIAL','code_atlas.intelligence',True):
              raise SystemExit('BLOCKED_A_CANON_DRIFT_REEVALUATE')
          expected={'B':'PARTIAL','C':'PARTIAL','D':'PARTIAL','E':'DONE','F':'DONE','G':'PARTIAL','H':'DONE','I':'PARTIAL','J':'BLOCKED'}
          for key,state in expected.items():
              if by[key].get('status')!=state: raise SystemExit(f'BLOCKED_NEIGHBOR_STATUS_DRIFT:{key}:{by[key].get("status")}')

          a.update({
              'status':'DONE',
              'claimBoundary':'LOCAL_VERIFIED bounded repository understanding from existing protected Universal Intelligence owners: neutral read-only discovery exposes explicit physical/semantic coverage; supported repository-local relationships carry bounded evidence and confidence; unresolved relationships remain explicit unresolved facts; unproven architecture remains unclassified with confidence unknown; sensitive-content boundaries are preserved; profiles, derived indexes, projections and semantic retrieval cannot invent authority or truth. This does not prove arbitrary-repository completeness, complete semantics for every language/stack, production, enterprise, paid-pilot, hosted, legal/privacy/security or universal semantic completeness.',
              'evidence':[
                  'path:tools/code-atlas/src/code_atlas/intelligence/repository.py',
                  'path:tools/code-atlas/src/code_atlas/intelligence/authority.py',
                  'path:tools/code-atlas/src/code_atlas/intelligence/graphs.py',
                  'path:tools/code-atlas/src/code_atlas/intelligence/snapshot.py',
                  'path:tools/code-atlas/src/code_atlas/intelligence/engine.py',
                  'path:tools/code-atlas/tests/test_operational_universal_intelligence.py',
                  'path:tools/code-atlas/tests/test_operational_change_intelligence_binding.py',
                  'A focused evidence run 32343790105 / artifact 9397298558',
                  'A focused artifact sha256:bc02dd95e08df5514a4e3e841a5f25946a2763ac3405dcc8291e7551cffb44fc',
                  'A focused composed Authority Mesh sha256:822564dd715b839e2ef7de9a96ec8681c0d311d0174ddf911f5b0c987cc7571d',
                  'A promotion authority run 32344110362 / artifact 9397402597',
                  'A promotion artifact sha256:2efed86736438909bf9537c2a14689e39a2c9e3c7860312b0e797edc7c6d22da',
                  'A promotion composed Authority Mesh sha256:8be5152e3ae7a30fb084f17981f157f58b4caa15373cfe7cfd5d5f23e6d98bde',
                  'Factory gate decision 1803aafdc371a4c40cca514f387b2ef2bfe47ae09ddbb0e1e6ec3a86149900e0',
                  'Change Assurance gate PASS_CHANGE_ASSURANCE_CAPABILITY_GATE',
                  'bounded external diversity: 7 pinned unrelated repositories on Ubuntu and Windows with read-only/repeatability and explicit zero-edge cases recorded rather than fabricated'
              ],
              'tests':[
                  'test_unknown_repository_discovery_is_neutral_and_read_only',
                  'test_system_graphs_keep_architecture_distinct_from_visual',
                  'test_engine_builds_portable_bundle_without_repo_mutation',
                  'PASS_UNDERSTAND_A_BOUNDED_NATIVE_PROBE on run 32343790105'
              ],
              'negativeTests':[
                  'test_profile_hint_cannot_invent_authority',
                  'test_candidate_is_not_authority_without_repo_declaration',
                  'test_structured_universal_context_is_public_and_non_authoritative_by_projection',
                  'unresolved local import remains unresolved with repository-fact reason instead of invented edge',
                  'unproven architecture remains layer=unclassified / confidence=unknown / evidence=[]',
                  'sensitive-name content remains unread and unhashed',
                  'derived index, semantic retrieval and profile hints remain non-authoritative'
              ],
              'knownBlindSpots':[
                  'Bounded evidence does not prove arbitrary-repository or all-language semantic completeness.',
                  'External diversity is pinned and finite; zero dependency edges on some repositories are recorded as a limitation rather than promoted to completeness.',
                  'Static repository understanding does not prove complete dynamic/runtime behavior or companion-path recall.',
                  'This evidence does not prove production, enterprise IAM/security, hosted multi-tenant, legal/privacy, paid-pilot or customer deployment readiness.'
              ],
              'nextEvidence':'REUSE_DONE_BASELINE; recertify only after repository discovery, authority resolution, graph extraction/provenance/coverage, snapshot locking, query/retrieval, profile semantics, sensitive-content handling or drift logic changes. Do not rebuild Universal Intelligence core.'
          })
          data['v1Complete']=False
          data['lastGovernanceMutation']={
              'kind':'UNDERSTAND_A_LOCAL_VERIFICATION_PROMOTION',
              'sourceHead':'4696cfb09cd86697272d2ae6c8414b6f68bf689a',
              'technicalEvidenceRunId':32343790105,
              'technicalEvidenceArtifactId':9397298558,
              'technicalEvidenceArtifactSha256':'bc02dd95e08df5514a4e3e841a5f25946a2763ac3405dcc8291e7551cffb44fc',
              'technicalEvidenceComposedSha256':'822564dd715b839e2ef7de9a96ec8681c0d311d0174ddf911f5b0c987cc7571d',
              'authorityRunId':32344110362,
              'authorityArtifactId':9397402597,
              'authorityArtifactSha256':'2efed86736438909bf9537c2a14689e39a2c9e3c7860312b0e797edc7c6d22da',
              'composedAuthoritySha256':'8be5152e3ae7a30fb084f17981f157f58b4caa15373cfe7cfd5d5f23e6d98bde',
              'requestDigest':'af4d8a8e79cccbcadb12479ededf85e3020e6958132eeac617e4add88ea3ea02',
              'factoryGateDecisionDigest':'1803aafdc371a4c40cca514f387b2ef2bfe47ae09ddbb0e1e6ec3a86149900e0',
              'status':'LOCAL_VERIFIED',
              'productionCertified':False
          }
          map_json.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          p=('A is `DONE / LOCAL_VERIFIED` from the existing protected Universal Intelligence owners. Focused run `32343790105` proved neutral read-only discovery, explicit coverage, evidence/confidence on supported repository-local relationships, explicit unresolved relationships, `unclassified / confidence=unknown` for unproven architecture, sensitive-content boundaries, and non-authoritative profiles/index/retrieval projections. Promotion authority run `32344110362` passed both anti-rework gates with source bytes unchanged. Existing external diversity remains bounded and explicitly records zero-edge cases rather than fabricating relationships. This does not certify arbitrary-repository completeness, all-language semantic completeness, production, enterprise, paid-pilot, hosted, legal/privacy or security readiness.\n\n')
          text=map_md.read_text(encoding='utf-8')
          old='| A | UNDERSTAND | Universal bounded repository understanding | `PARTIAL` |'; new='| A | UNDERSTAND | Universal bounded repository understanding | `DONE` |'
          if text.count(old)!=1 or p in text: raise SystemExit('BLOCKED_MAP_MD_A_ANCHOR_DRIFT')
          text=text.replace(old,new,1)
          anchor='Therefore `v1Complete=false`.\n\n'
          if text.count(anchor)!=1: raise SystemExit('BLOCKED_MAP_MD_V1_ANCHOR_DRIFT')
          text=text.replace(anchor,anchor+p,1)
          map_md.write_text(text,encoding='utf-8')

          p=('Checklist A is now `DONE / LOCAL_VERIFIED`: existing Universal Intelligence owners provide neutral read-only repository discovery, explicit coverage, supported relationship evidence/confidence, explicit unresolved relationships, and `unclassified / confidence=unknown` for architecture not proven by repository facts. Sensitive-content boundaries remain intact, and profiles, derived indexes, projections and semantic retrieval cannot invent authority or truth. Focused run `32343790105` and promotion authority run `32344110362` passed with source bytes unchanged. Bounded external diversity is supporting evidence only and explicitly preserves zero-edge limitations. A does not prove arbitrary-repository completeness, complete semantics for every stack, production, enterprise, paid-pilot, hosted, legal/privacy or security readiness.\n\n')
          text=v1_md.read_text(encoding='utf-8')
          old='| A | UNDERSTAND | Universal bounded repository understanding | `PARTIAL` |'; new='| A | UNDERSTAND | Universal bounded repository understanding | `DONE` |'
          if text.count(old)!=1 or p in text: raise SystemExit('BLOCKED_V1_MD_A_ANCHOR_DRIFT')
          text=text.replace(old,new,1)
          anchor='`V1 complete` is therefore **false**. This is intentional.\n\n'
          if text.count(anchor)!=1: raise SystemExit('BLOCKED_V1_MD_STATUS_ANCHOR_DRIFT')
          text=text.replace(anchor,anchor+p,1)
          v1_md.write_text(text,encoding='utf-8')
          print('PASS_A_GOVERNANCE_TRANSFORM')
          PY

      - name: Validate promotion and source immutability
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile 'PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py' 'PRISMA Factory Ledger/tools/verify_change_intelligence_capability_gate.py'
          python 'PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py' --validate
          python 'PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py' --self-test
          python 'PRISMA Factory Ledger/tools/verify_change_intelligence_capability_gate.py' --validate-map
          python 'PRISMA Factory Ledger/tools/verify_change_intelligence_capability_gate.py' --self-test
          python -m unittest -v \
            tools.code-atlas.tests.test_operational_universal_intelligence.UniversalIntelligenceTests.test_unknown_repository_discovery_is_neutral_and_read_only \
            tools.code-atlas.tests.test_operational_universal_intelligence.UniversalIntelligenceTests.test_profile_hint_cannot_invent_authority \
            tools.code-atlas.tests.test_operational_universal_intelligence.UniversalIntelligenceTests.test_candidate_is_not_authority_without_repo_declaration \
            tools.code-atlas.tests.test_operational_universal_intelligence.UniversalIntelligenceTests.test_system_graphs_keep_architecture_distinct_from_visual \
            tools.code-atlas.tests.test_operational_universal_intelligence.UniversalIntelligenceTests.test_engine_builds_portable_bundle_without_repo_mutation \
            tools.code-atlas.tests.test_operational_change_intelligence_binding.UniversalCustomerWowBindingTests.test_structured_universal_context_is_public_and_non_authoritative_by_projection
          git diff --exit-code origin/main -- tools/code-atlas/src/code_atlas
          git diff --check
          python - <<'PY'
          import json
          d=json.load(open('PRISMA Factory Ledger/PRISMA_CHANGE_INTELLIGENCE_CAPABILITY_MAP.json',encoding='utf-8'))
          by={x['id']:x for x in d['v1DefinitionOfDone']}
          assert by['A']['status']=='DONE' and by['A']['doNotRebuild'] is True and by['A']['owner']=='code_atlas.intelligence'
          assert by['A']['evidence'] and by['A']['tests'] and by['A']['negativeTests']
          assert by['B']['status']=='PARTIAL' and by['C']['status']=='PARTIAL' and by['D']['status']=='PARTIAL'
          assert by['E']['status']=='DONE' and by['F']['status']=='DONE' and by['H']['status']=='DONE'
          assert by['G']['status']=='PARTIAL' and by['I']['status']=='PARTIAL' and by['J']['status']=='BLOCKED'
          assert d['v1Complete'] is False
          assert d['lastGovernanceMutation']['kind']=='UNDERSTAND_A_LOCAL_VERIFICATION_PROMOTION'
          print('PASS_A_CANONICAL_PROMOTION_VALIDATION')
          PY

      - name: Commit only three governance files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'chatgpt-codex-connector[bot]'
          git config user.email 'chatgpt-codex-connector[bot]@users.noreply.github.com'
          git add -- \
            'PRISMA Factory Ledger/PRISMA_CHANGE_INTELLIGENCE_CAPABILITY_MAP.json' \
            'PRISMA Factory Ledger/PRISMA_CHANGE_INTELLIGENCE_CAPABILITY_MAP.md' \
            'tools/code-atlas/docs/PRISMA_CHANGE_ASSURANCE_V1.md'
          git diff --cached --check
          mapfile -t changed < <(git diff --cached --name-only)
          test "${#changed[@]}" -eq 3
          printf '%s\n' "${changed[@]}" | grep -Fx 'PRISMA Factory Ledger/PRISMA_CHANGE_INTELLIGENCE_CAPABILITY_MAP.json'
          printf '%s\n' "${changed[@]}" | grep -Fx 'PRISMA Factory Ledger/PRISMA_CHANGE_INTELLIGENCE_CAPABILITY_MAP.md'
          printf '%s\n' "${changed[@]}" | grep -Fx 'tools/code-atlas/docs/PRISMA_CHANGE_ASSURANCE_V1.md'
          git commit -m 'governance(ca): certify bounded repository understanding'
          git push origin HEAD:governance/ca-understand-a-promote-2008
