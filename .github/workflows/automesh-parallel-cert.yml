name: AutoMesh Parallel Certification

on:
  pull_request:
    paths:
      - '.github/workflows/automesh-parallel-cert.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  sync-ca-reconciliation-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v6
        with:
          ref: governance/ca-authority-reconcile-1908
          fetch-depth: 0

      - name: Merge exact current main and validate scope
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'chatgpt-codex-connector[bot]'
          git config user.email 'chatgpt-codex-connector[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-ff --no-edit origin/main
          python 'PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py' --validate
          python 'PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py' --self-test
          base="$(git merge-base HEAD origin/main)"
          mapfile -t changed < <(git diff --name-only "$base"..HEAD)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 3
          printf '%s\n' "${changed[@]}" | grep -Fx '.github/workflows/automesh-parallel-cert.yml'
          printf '%s\n' "${changed[@]}" | grep -Fx 'PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER.json'
          printf '%s\n' "${changed[@]}" | grep -Fx 'PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER_REGISTRATION_INDEX.json'
          git push origin HEAD:governance/ca-authority-reconcile-1908
