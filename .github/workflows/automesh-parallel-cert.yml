name: AutoMesh Parallel Certification

on:
  pull_request:
    paths:
      - 'tools/code-atlas/src/code_atlas/motors/prisma_automesh_runtime.py'
      - 'tools/code-atlas/src/code_atlas/motors/smart_allmesh_automesh.py'
      - 'tools/code-atlas/src/code_atlas/motors/smart_allmesh_controller.py'
      - 'tools/code-atlas/src/code_atlas/motors/smart_allmesh_parallel.py'
      - 'tools/code-atlas/scripts/RUN_SMART_ALLMESH_PARALLEL.ps1'
      - 'tools/code-atlas/tests/test_smart_allmesh_parallel.py'
      - '.github/workflows/automesh-parallel-cert.yml'
  push:
    branches: ['main']
    paths:
      - 'tools/code-atlas/src/code_atlas/motors/prisma_automesh_runtime.py'
      - 'tools/code-atlas/src/code_atlas/motors/smart_allmesh_automesh.py'
      - 'tools/code-atlas/src/code_atlas/motors/smart_allmesh_controller.py'
      - 'tools/code-atlas/src/code_atlas/motors/smart_allmesh_parallel.py'
      - 'tools/code-atlas/scripts/RUN_SMART_ALLMESH_PARALLEL.ps1'
      - 'tools/code-atlas/tests/test_smart_allmesh_parallel.py'
      - '.github/workflows/automesh-parallel-cert.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  automesh-parallel-cert:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile AutoMesh tooling
        run: python -m py_compile tools/code-atlas/src/code_atlas/motors/prisma_automesh_runtime.py tools/code-atlas/src/code_atlas/motors/smart_allmesh_automesh.py tools/code-atlas/src/code_atlas/motors/smart_allmesh_controller.py tools/code-atlas/src/code_atlas/motors/smart_allmesh_parallel.py tools/code-atlas/tests/test_smart_allmesh_parallel.py

      - name: Run legacy AutoMesh self-test
        run: python tools/code-atlas/src/code_atlas/motors/smart_allmesh_automesh.py --self-test

      - name: Run elastic, fail-fast, provenance and real AutoMesh certification tests
        run: python -m unittest -v tools/code-atlas/tests/test_smart_allmesh_parallel.py

  caext-usefulness-mesh:
    name: Code Atlas External Agent Usefulness Pilot mesh
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Generate task-exact Authority Mesh
        run: >-
          python apps/terminal-de-venta-system/tools/prisma-governance/authority_mesh.py
          --repo apps/terminal-de-venta-system
          --output .governance/current
          --task "CODE ATLAS HUMAN/AGENT USEFULNESS PILOT: clasificación VERIFY / EXTERNAL EVIDENCE sobre main 0d42fe65ff4fcfb14ab15df6450830a96ef8285b después de PR #282/#284. Construir exclusivamente un piloto de utilidad post-target, no un rebuild ni una autocertificación. Mutaciones autorizadas únicamente en .github/scripts/caext_usefulness_pilot_v1.py, .github/workflows/caext-usefulness-pilot-v1.yml y .github/evidence/caext_usefulness_agent_responses_v1.json. Mantener tools/code-atlas/src/code_atlas/** read-only y doNotRebuild=true. Human usefulness debe quedar NOT_MEASURED porque no existe evaluación humana en esta sesión. Agent usefulness sólo puede etiquetarse SINGLE_EXTERNAL_AGENT_PILOT; el evaluador externo es ChatGPT/GPT-5.6 Sol operando por GitHub connector, distinto del motor Code Atlas, pero no constituye evidencia multi-agent independiente. Usar seis tareas históricas frescas seleccionadas por metadata sin abrir diff al evaluador: fastapi/fastapi aadfcce76380ab169fe172d5cda21722e53c4924, go-chi/chi 878fe71fc9e506a63ea6957ed09c9ce84f789e97, django/django 616e8c52ded7f4c7b00cae5a95f5a5d12a6a39b9, aio-libs/aiohttp 26fde219b38ab0416f47b8165769d9df3f2ffece, astral-sh/ruff 8f703fcb76f06f5ca0a5aac7771f8735709ec965 y pydantic/pydantic cc13d1b8c978eaf78ed5308329cd41f03ecc3144. Asignar condición determinísticamente por paridad del último dígito hexadecimal del commit: even=ASSISTED, odd=BASELINE, sin cherry-picking. Generar paquetes sólo desde el first-parent pre-change. El ground truth diff debe quedar separado y no exponerse al evaluador hasta después de persistir sus respuestas. Ambos grupos reciben el mismo evaluator-provided target seleccionado mecánicamente del diff sólo como precondición controlada; target discovery autónomo permanece fuera de alcance/NOT_MEASURED. BASELINE recibe evidencia repo-native equivalente del parent; ASSISTED recibe esa misma evidencia más Code Atlas prepare_change Authority Pack, Impact Radius, unknowns/blockers, coverage/retrieval/report. Medir mecánicamente calidad sin ampliar autorización: editable scope violation rate, companion inspection recall, changed-test recall, evidence completeness, protected/unknown handling, blocked-before-change cuando aplique y traceability. Usar roi.py únicamente para raw observed ROI metrics existentes; no inventar métricas ni financial estimates. contextDiscoveryTime/changeScopeIdentificationTime/humanSupervisionTime/evidenceAssemblyTime/reopenedWorkRate/workerPeak permanecen NOT_MEASURED salvo observación explícita fiable. No inferir hidden reasoning. External repos read-only, commits/trees pinneados, no dependency install, no tests de terceros, no push/mutation externa. Historia sirve como ground truth de evaluación, nunca como autorización. Si aparece defecto reproducible de producto, detener el piloto y abrir FIX separado con nuevo Authority Mesh. PR #273 reserva tools/code-atlas/src/code_atlas/ui_bridge/** y tools/code-atlas/src/code_atlas/app_map/uimap/**. Excluir Tablet, PC, Mobile, Chart Lab, Shared UI, DB/Prisma, deploys, puertos y procesos. Cero fake green."

      - name: Validate mesh and emit pilot scope lock
        shell: python
        run: |
          import json
          from pathlib import Path

          root = Path('apps/terminal-de-venta-system/.governance/current')
          required = [
              'AUTHORITY_READSET.lock.json',
              'APP_IMPACT_MATRIX.md',
              'CONTRACT_AND_GATE_MATRIX.json',
              'MISSING_OR_UNMAPPED_RISK.md',
              'AGENT_PROMPT_ENVELOPE.md',
              'AUTHORITY_MESH_REPORT.md',
          ]
          missing = [name for name in required if not (root / name).exists()]
          if missing:
              raise SystemExit('Missing Authority Mesh outputs: ' + ', '.join(missing))
          lock = json.loads((root / 'AUTHORITY_READSET.lock.json').read_text(encoding='utf-8'))
          if lock.get('status') != 'PASS':
              raise SystemExit('Authority Mesh status is not PASS')
          if lock.get('full_mode') is not False:
              raise SystemExit('Usefulness pilot unexpectedly ran full-mode Mesh')
          task = str(lock.get('task', ''))
          required_identity = (
              'HUMAN/AGENT USEFULNESS PILOT',
              '0d42fe65ff4fcfb14ab15df6450830a96ef8285b',
              'SINGLE_EXTERNAL_AGENT_PILOT',
              'Human usefulness debe quedar NOT_MEASURED',
              'aadfcce76380ab169fe172d5cda21722e53c4924',
              'cc13d1b8c978eaf78ed5308329cd41f03ecc3144',
              'PR #273',
          )
          if not all(token in task for token in required_identity):
              raise SystemExit('Task-exact usefulness identity missing')

          scope = {
              'schemaVersion': 'caext.usefulness-pilot-scope-lock.v1',
              'authorityMeshStatus': lock.get('status'),
              'baseCommit': '0d42fe65ff4fcfb14ab15df6450830a96ef8285b',
              'classification': 'VERIFY / EXTERNAL EVIDENCE',
              'allowedFiles': [
                  '.github/scripts/caext_usefulness_pilot_v1.py',
                  '.github/workflows/caext-usefulness-pilot-v1.yml',
                  '.github/evidence/caext_usefulness_agent_responses_v1.json',
              ],
              'productCoreReadOnly': 'tools/code-atlas/src/code_atlas/**',
              'humanUsefulness': 'NOT_MEASURED',
              'agentUsefulnessMaximumClaim': 'SINGLE_EXTERNAL_AGENT_PILOT',
              'selfCertificationAllowed': False,
              'targetDiscoveryMeasured': False,
              'groundTruthHiddenUntilResponsesPersisted': True,
              'historyIsAuthorization': False,
              'externalReposReadOnly': True,
              'reservedByPr273': [
                  'tools/code-atlas/src/code_atlas/ui_bridge/**',
                  'tools/code-atlas/src/code_atlas/app_map/uimap/**',
              ],
              'stopOnProductDefect': True,
              'financialEstimateAllowed': False,
          }
          (root / 'CAEXT_USEFULNESS_SCOPE_LOCK.json').write_text(json.dumps(scope, indent=2) + '\n', encoding='utf-8')
          print('PASS_CAEXT_USEFULNESS_TASK_EXACT_AUTHORITY_MESH')

      - name: Verify ephemeral mesh bootstrap is isolated
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only origin/main...HEAD)"
          expected='.github/workflows/automesh-parallel-cert.yml'
          if [ "$changed" != "$expected" ]; then
            echo 'Unexpected bootstrap diff:'
            printf '%s\n' "$changed"
            exit 1
          fi
          echo 'PASS_CAEXT_USEFULNESS_BOOTSTRAP_SCOPE_ONLY'

      - name: Upload task-exact Authority Mesh artifact
        uses: actions/upload-artifact@v7
        with:
          name: caext-usefulness-pilot-mesh
          if-no-files-found: error
          path: |
            apps/terminal-de-venta-system/.governance/current/AUTHORITY_READSET.lock.json
            apps/terminal-de-venta-system/.governance/current/APP_IMPACT_MATRIX.md
            apps/terminal-de-venta-system/.governance/current/CONTRACT_AND_GATE_MATRIX.json
            apps/terminal-de-venta-system/.governance/current/MISSING_OR_UNMAPPED_RISK.md
            apps/terminal-de-venta-system/.governance/current/AGENT_PROMPT_ENVELOPE.md
            apps/terminal-de-venta-system/.governance/current/AUTHORITY_MESH_REPORT.md
            apps/terminal-de-venta-system/.governance/current/CAEXT_USEFULNESS_SCOPE_LOCK.json
