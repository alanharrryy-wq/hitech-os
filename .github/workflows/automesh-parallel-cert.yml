name: AutoMesh Parallel Certification

on:
  pull_request:
    paths:
      - '.github/workflows/automesh-parallel-cert.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: tools/code-atlas/src

jobs:
  ca-observe-f-build-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Compile authority and gate tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/code-atlas/src/code_atlas/motors/prisma_automesh_runtime.py \
            tools/code-atlas/src/code_atlas/motors/smart_allmesh_automesh.py \
            tools/code-atlas/src/code_atlas/motors/smart_allmesh_parallel.py \
            tools/code-atlas/src/code_atlas/motors/prisma_mesh_gateway.py \
            'PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py' \
            'PRISMA Factory Ledger/tools/verify_change_intelligence_capability_gate.py'
          python tools/code-atlas/src/code_atlas/motors/smart_allmesh_automesh.py --self-test
          test "$(git status --porcelain | wc -l)" -eq 0

      - name: Run fresh task-exact mutation Authority Mesh and both anti-rework gates
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          request="$RUNNER_TEMP/ca-observe-f-build.request.json"
          preflight="$RUNNER_TEMP/ca-observe-f-build-preflight"
          parallel="$RUNNER_TEMP/ca-observe-f-build-parallel"
          composed="$RUNNER_TEMP/ca-observe-f-build-composed"
          mkdir -p "$preflight" "$parallel" "$composed"
          python - "$request" "$head_sha" <<'PY'
          import json, sys
          path, head = sys.argv[1], sys.argv[2]
          base = (
              "Implement only PRISMA Change Assurance V1 checklist F / OBSERVE / Change comparison through canonical capability ci.observe.change_comparison. "
              "The capability is BUILD / NOT_STARTED / doNotRebuild=false and owned by code_atlas.change_intelligence. Reuse protected ci.core.snapshot_locking and ci.change.architecture_delta; do not rebuild snapshot, graph, Architecture Delta normalization, verification, evidence/reporting or runner owners. "
              "Bound the first implementation to deterministic comparison of two explicitly supplied comparable states from the same repository identity and explicit snapshot/provenance lineage. Emit machine-readable added/removed/changed/unchanged plus unknown/blocking reasons without converting Impact Radius to authorization or retrieval to proof. "
              "Native negative behavior must fail closed for cross-repository identity, missing lineage/provenance, stale/contradictory/unsupported/partial state, duplicate identities with contradictory payloads, and insufficient critical evidence. No product runtime, Cloud Center, Tablet, PC, Mobile, Chart Lab, Shared UI, DB, Prisma, process, port or deploy mutation."
          )
          request = {
              "schemaVersion": "prisma_remote_authority_gateway.v2",
              "expectedHead": head,
              "profile": "change-assurance-observe-f-build-v1",
              "tasks": [
                  {
                      "id": "observe-f-bounded-build",
                      "surface": "governance",
                      "task": base + " Resolve exact allowed source/test/governance files, interface contract, evidence boundary and claim ceiling for the bounded implementation. Determine what evidence is sufficient for F DONE versus PARTIAL.",
                      "intent": "BUILD",
                      "domain": "tooling",
                      "requiredAuthorities": [
                          "PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER.json",
                          "PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER_AGENT_GATE.md",
                          "PRISMA Factory Ledger/PRISMA_CHANGE_INTELLIGENCE_CAPABILITY_MAP.json",
                          "PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py",
                          "PRISMA Factory Ledger/tools/verify_change_intelligence_capability_gate.py",
                          "tools/code-atlas/CODE_ATLAS_CHANGE_ASSURANCE_CONTRACT.json",
                          "tools/code-atlas/docs/PRISMA_CHANGE_ASSURANCE_V1.md",
                          "tools/code-atlas/src/code_atlas/change_intelligence/architecture_delta.py",
                          "tools/code-atlas/src/code_atlas/change_intelligence/__init__.py",
                          "tools/code-atlas/src/code_atlas/change_intelligence/contracts.py",
                          "tools/code-atlas/src/code_atlas/intelligence/snapshot.py",
                          "tools/code-atlas/tests/test_operational_change_studio.py"
                      ],
                      "requiredDirectories": [
                          "PRISMA Factory Ledger",
                          "tools/code-atlas/src/code_atlas/change_intelligence",
                          "tools/code-atlas/src/code_atlas/intelligence",
                          "tools/code-atlas/tests",
                          "tools/code-atlas/docs"
                      ],
                      "requiredCapabilities": [
                          "ci.observe.change_comparison",
                          "change_intelligence.capability_anti_rework_gate",
                          "code_atlas.change_intelligence.customer_wow_v1"
                      ],
                      "minimumCoverage": 100,
                      "failOnMissingAuthority": True
                  },
                  {
                      "id": "observe-f-protected-owner-proof",
                      "surface": "governance",
                      "task": base + " Prove protected-owner reuse and reject duplicate engines. Verify that the implementation may extend only the customer-facing Architecture Delta composition boundary while snapshot and normalization owners remain authoritative and unrebuilt.",
                      "intent": "VERIFY",
                      "domain": "governance",
                      "requiredAuthorities": [
                          "PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER.json",
                          "PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER_DO_NOT_REBUILD_MAP.json",
                          "PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER_REGISTRATION_INDEX.json",
                          "PRISMA Factory Ledger/PRISMA_CHANGE_INTELLIGENCE_CAPABILITY_MAP.json",
                          "PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py",
                          "PRISMA Factory Ledger/tools/verify_change_intelligence_capability_gate.py",
                          "tools/code-atlas/CODE_ATLAS_CHANGE_ASSURANCE_CONTRACT.json",
                          "tools/code-atlas/src/code_atlas/change_intelligence/architecture_delta.py",
                          "tools/code-atlas/src/code_atlas/intelligence/snapshot.py"
                      ],
                      "requiredDirectories": [
                          "PRISMA Factory Ledger",
                          "tools/code-atlas/src/code_atlas/change_intelligence",
                          "tools/code-atlas/src/code_atlas/intelligence"
                      ],
                      "requiredCapabilities": [
                          "ci.observe.change_comparison",
                          "change_intelligence.capability_anti_rework_gate"
                      ],
                      "minimumCoverage": 100,
                      "failOnMissingAuthority": True
                  }
              ]
          }
          with open(path, 'w', encoding='utf-8') as f:
              json.dump(request, f, indent=2, ensure_ascii=False)
          PY

          python -m code_atlas.motors.prisma_mesh_gateway preflight --repo . --request "$request" --out "$preflight"
          python tools/code-atlas/src/code_atlas/motors/smart_allmesh_parallel.py \
            --repo . --out-root "$parallel" --task-spec "$preflight/legacy_tasks.json" \
            --parallel 2 --workers 18 --shards 54
          python -m code_atlas.motors.prisma_mesh_gateway compose \
            --repo . --request "$request" --preflight "$preflight" --mesh-result "$parallel" --out "$composed" \
            | tee "$composed/compose.stdout.txt"
          grep -Fq 'PASS_COMPOSED_AUTHORITY_MESH' "$composed/compose.stdout.txt"
          composed_zip="$RUNNER_TEMP/prisma-automesh-composed-result.zip"
          test -f "$composed_zip"
          cp "$composed_zip" "$composed/prisma-automesh-composed-result.zip"

          python - "$preflight/PREFLIGHT_MANIFEST.json" "$composed/PRISMA_MESH_GATEWAY_REPORT.json" "$composed_zip" "$RUNNER_TEMP/factory-gate.request.json" "$RUNNER_TEMP/change-assurance-gate.request.json" <<'PY'
          import hashlib, json, sys
          pf_path, report_path, zip_path, factory_path, ca_path = sys.argv[1:]
          pf=json.load(open(pf_path,encoding='utf-8'))
          report=json.load(open(report_path,encoding='utf-8'))
          if report.get('status')!='PASS_COMPOSED_AUTHORITY_MESH' or pf.get('status')!='PASS_PREFLIGHT':
              raise SystemExit('BLOCKED_MESH_NOT_PASS')
          coverage=min(float(lane['coverage']['resolvedPercent']) for lane in pf['lanes'])
          blockers=len(pf.get('blockers') or [])
          h=hashlib.sha256(open(zip_path,'rb').read()).hexdigest()
          mesh={
              'status':'PASS_COMPOSED_AUTHORITY_MESH',
              'repoHead':report['repoHead'],
              'requiredAuthorityCoveragePct':int(coverage),
              'blockers':blockers,
              'requestDigest':report['requestDigest'],
              'artifactDigest':'sha256:'+h,
              'layerMapPresent':True
          }
          task=(
              'Build only ci.observe.change_comparison as a bounded deterministic OBSERVE adapter over existing snapshot locking and Architecture Delta normalization, '
              'with positive and native negative tests; no protected-owner rebuild and no product runtime mutation.'
          )
          factory={
              'schemaVersion':'prisma.factory-ledger.anti-rework-request.v1',
              'mode':'MUTATION',
              'expectedHead':report['repoHead'],
              'task':task,
              'capabilities':[{'id':'ci.observe.change_comparison','requestedAction':'BUILD'}],
              'authorityMesh':mesh,
              'visualMutation':False
          }
          ca={
              'mode':'MUTATION',
              'capabilityIds':['ci.observe.change_comparison'],
              'task':task,
              'authorityMesh':mesh,
              'visualMutation':False
          }
          json.dump(factory,open(factory_path,'w',encoding='utf-8'),indent=2)
          json.dump(ca,open(ca_path,'w',encoding='utf-8'),indent=2)
          print(json.dumps({'mesh':mesh},indent=2))
          PY

          python 'PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py' --request "$RUNNER_TEMP/factory-gate.request.json" | tee "$RUNNER_TEMP/factory-gate.decision.json"
          grep -Fq 'PASS_ANTI_REWORK_GATE' "$RUNNER_TEMP/factory-gate.decision.json"
          python 'PRISMA Factory Ledger/tools/verify_change_intelligence_capability_gate.py' --request "$RUNNER_TEMP/change-assurance-gate.request.json" | tee "$RUNNER_TEMP/change-assurance-gate.decision.json"
          grep -Fq 'PASS_CHANGE_ASSURANCE_CAPABILITY_GATE' "$RUNNER_TEMP/change-assurance-gate.decision.json"
          test "$(git status --porcelain | wc -l)" -eq 0
          echo 'PASS_OBSERVE_F_BUILD_MUTATION_AUTHORITY'

      - name: Upload OBSERVE F build authority and gate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ca-observe-f-build-authority
          path: |
            ${{ runner.temp }}/ca-observe-f-build.request.json
            ${{ runner.temp }}/ca-observe-f-build-preflight/
            ${{ runner.temp }}/ca-observe-f-build-parallel/*.zip
            ${{ runner.temp }}/ca-observe-f-build-composed/
            ${{ runner.temp }}/factory-gate.request.json
            ${{ runner.temp }}/factory-gate.decision.json
            ${{ runner.temp }}/change-assurance-gate.request.json
            ${{ runner.temp }}/change-assurance-gate.decision.json
          if-no-files-found: error
          retention-days: 7
