name: AutoMesh Parallel Certification

on:
  pull_request:
    paths:
      - '.github/workflows/automesh-parallel-cert.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: tools/code-atlas/src

jobs:
  ca-prove-i-register-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Compile and self-test authority tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/code-atlas/src/code_atlas/motors/prisma_automesh_runtime.py \
            tools/code-atlas/src/code_atlas/motors/smart_allmesh_automesh.py \
            tools/code-atlas/src/code_atlas/motors/smart_allmesh_parallel.py \
            tools/code-atlas/src/code_atlas/motors/prisma_mesh_gateway.py
          python tools/code-atlas/src/code_atlas/motors/smart_allmesh_automesh.py --self-test
          test "$(git status --porcelain | wc -l)" -eq 0

      - name: Run task-exact Evidence Bundle semantic-gap Authority Mesh
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          request="$RUNNER_TEMP/ca-prove-i-register.request.json"
          preflight="$RUNNER_TEMP/ca-prove-i-register-preflight"
          parallel="$RUNNER_TEMP/ca-prove-i-register-parallel"
          composed="$RUNNER_TEMP/ca-prove-i-register-composed"
          mkdir -p "$preflight" "$parallel" "$composed"
          python - "$request" "$head_sha" <<'PY'
          import json, sys
          path, head = sys.argv[1], sys.argv[2]
          common = (
              "PRISMA Change Assurance V1 checklist I / PROVE / Evidence Bundle is PARTIAL and doNotRebuild=true under owner code_atlas.change_intelligence. "
              "Current protected ci.evidence.report_bundle plus bundle/reporting/authority-pack/sanitization/runner owners already preserve snapshot provenance, artifact descriptors and digests, sanitization attestations, lifecycle, no-source-egress and fail-closed tamper behavior. "
              "The remaining evidence-backed gap is semantic completeness: the current hardened portable bundle accepts an arbitrary artifact set and does not require typed roles proving that gaps/unknowns, decision/classification state, and replay/handoff context travel in the bundle. reporting.py may render those states, but the bundle contract does not require them. "
              "Resolve the smallest additive semantic hardening capability layered over the existing bundle/report composition boundary. It must not replace or fork ci.evidence.report_bundle, authority pack, reporting, sanitization, runner, graph, snapshot or verification owners. "
              "This is read-only authority work only. Checklist I remains PARTIAL. Do not modify repository source, governance, runtime, Cloud Center, Tablet, PC, Mobile, Chart Lab, Shared UI, DB, Prisma, processes, ports or deploys."
          )
          authorities = [
              "PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER.json",
              "PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER_DO_NOT_REBUILD_MAP.json",
              "PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER_REGISTRATION_INDEX.json",
              "PRISMA Factory Ledger/PRISMA_CHANGE_INTELLIGENCE_CAPABILITY_MAP.json",
              "PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER_AGENT_GATE.md",
              "PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py",
              "PRISMA Factory Ledger/tools/verify_change_intelligence_capability_gate.py",
              "tools/code-atlas/CODE_ATLAS_CHANGE_ASSURANCE_CONTRACT.json",
              "tools/code-atlas/docs/PRISMA_CHANGE_ASSURANCE_V1.md",
              "tools/code-atlas/src/code_atlas/change_intelligence/bundle.py",
              "tools/code-atlas/src/code_atlas/change_intelligence/reporting.py",
              "tools/code-atlas/src/code_atlas/change_intelligence/authority_pack.py",
              "tools/code-atlas/src/code_atlas/change_intelligence/artifact_hygiene.py",
              "tools/code-atlas/src/code_atlas/change_intelligence/runner_contract.py",
              "tools/code-atlas/src/code_atlas/change_intelligence/contracts.py",
              "tools/code-atlas/tests/test_operational_rental_hardening.py",
              "tools/code-atlas/tests/test_operational_change_intelligence.py",
              ".github/workflows/code-atlas-operational-hardening.yml"
          ]
          dirs = [
              "PRISMA Factory Ledger",
              "tools/code-atlas/src/code_atlas/change_intelligence",
              "tools/code-atlas/tests",
              "tools/code-atlas/docs",
              ".github/workflows"
          ]
          request={
              "schemaVersion":"prisma_remote_authority_gateway.v2",
              "expectedHead":head,
              "profile":"change-assurance-prove-i-semantic-hardening-v1",
              "tasks":[
                  {
                      "id":"prove-i-semantic-gap-contract",
                      "surface":"governance",
                      "task":common + " Resolve an exact additive capability ID, classification/status/doNotRebuild, protected owners, allowed source/test/governance files, required semantic roles, positive/native-negative evidence, and the claim ceiling required before I can become DONE.",
                      "intent":"BUILD",
                      "domain":"tooling",
                      "requiredAuthorities":authorities,
                      "requiredDirectories":dirs,
                      "requiredCapabilities":[
                          "code_atlas.change_intelligence.customer_wow_v1",
                          "change_intelligence.capability_anti_rework_gate"
                      ],
                      "minimumCoverage":100,
                      "failOnMissingAuthority":True
                  },
                  {
                      "id":"prove-i-protected-owner-proof",
                      "surface":"governance",
                      "task":common + " Prove anti-duplication boundaries. The new capability may only add typed semantic role/envelope validation over the existing bundle/report composition boundary. Explicitly protect ci.evidence.report_bundle, ci.change.authority_pack, ci.change.verify, ci.runner.portable_evidence and artifact sanitization owners from replacement or parallel truth.",
                      "intent":"VERIFY",
                      "domain":"governance",
                      "requiredAuthorities":authorities,
                      "requiredDirectories":dirs,
                      "requiredCapabilities":[
                          "code_atlas.change_intelligence.customer_wow_v1",
                          "change_intelligence.capability_anti_rework_gate"
                      ],
                      "minimumCoverage":100,
                      "failOnMissingAuthority":True
                  }
              ]
          }
          with open(path,'w',encoding='utf-8') as f:
              json.dump(request,f,indent=2,ensure_ascii=False)
          PY

          python -m code_atlas.motors.prisma_mesh_gateway preflight --repo . --request "$request" --out "$preflight"
          python tools/code-atlas/src/code_atlas/motors/smart_allmesh_parallel.py \
            --repo . --out-root "$parallel" --task-spec "$preflight/legacy_tasks.json" \
            --parallel 2 --workers 18 --shards 54
          python -m code_atlas.motors.prisma_mesh_gateway compose \
            --repo . --request "$request" --preflight "$preflight" --mesh-result "$parallel" --out "$composed" \
            | tee "$composed/compose.stdout.txt"
          grep -Fq 'PASS_COMPOSED_AUTHORITY_MESH' "$composed/compose.stdout.txt"
          composed_zip="$RUNNER_TEMP/prisma-automesh-composed-result.zip"
          test -f "$composed_zip"
          cp "$composed_zip" "$composed/prisma-automesh-composed-result.zip"
          test "$(git status --porcelain | wc -l)" -eq 0
          echo 'PASS_PROVE_I_SEMANTIC_REGISTRATION_AUTHORITY'

      - name: Upload I registration authority evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ca-prove-i-register-authority
          path: |
            ${{ runner.temp }}/ca-prove-i-register.request.json
            ${{ runner.temp }}/ca-prove-i-register-preflight/
            ${{ runner.temp }}/ca-prove-i-register-parallel/*.zip
            ${{ runner.temp }}/ca-prove-i-register-composed/
          if-no-files-found: error
          retention-days: 7
