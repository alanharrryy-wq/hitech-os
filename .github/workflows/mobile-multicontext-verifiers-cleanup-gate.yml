name: PRISMA Mobile MultiContext + Verifier Cleanup Gate
on:
  push:
    branches: [fix/mobile-multicontext-verifiers-cleanup-3008]
    paths: ['.github/workflows/mobile-multicontext-verifiers-cleanup-gate.yml']
permissions:
  contents: write
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  AUTHORITY_HEAD: '5d9dc64bbf30cd8858219dccff6815565d6b1a77'
  AUTHORITY_REQUEST_DIGEST: '42bcb973c3aab5882bbd0ee4b33bf271e12fea4ca4a06f05f484258d8e4a2009'
  AUTHORITY_ARTIFACT_DIGEST: 'sha256:0bc62c30ad82a3a0966a7758d0b4b89a8650a80891d5c7a8c15fea5742736a02'
  AUTHORITY_RUN_ID: '33314261732'
  AUTHORITY_ARTIFACT_ID: '9732952649'
  WORK_BRANCH: 'fix/mobile-multicontext-verifiers-cleanup-3008'
  MOBILE_ROOT: 'apps/terminal-de-venta-system/products/mobile/app'
jobs:
  governed-cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.AUTHORITY_HEAD }}
          fetch-depth: 0
      - name: Prove clean carrier
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$WORK_BRANCH"
          mapfile -t changed < <(git diff --name-only "$AUTHORITY_HEAD" "origin/$WORK_BRANCH")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = '.github/workflows/mobile-multicontext-verifiers-cleanup-gate.yml'
      - name: Authority and MUTATION gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mobile-cleanup"
          python -m py_compile 'PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py'
          python 'PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py' --validate
          python 'PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py' --self-test
          python - <<'PY'
          import json, os
          from pathlib import Path
          req={'schemaVersion':'prisma.factory-ledger.anti-rework-gate.v1','mode':'MUTATION','expectedHead':os.environ['AUTHORITY_HEAD'],'task':'Remove proven-dead PRISMA Mobile MultiContext source residue and reconcile claims.verifiersAligned to true with a fail-closed canonical verifier invariant. Preserve seven-section canon and all other claims. No redesign, replacement selector, API deletion or non-Mobile changes.','capabilities':[{'id':'mobile.interface_specification_canon','requestedAction':'ADVANCE'}],'visualMutation':True,'authorityMesh':{'status':'PASS_COMPOSED_AUTHORITY_MESH','repoHead':os.environ['AUTHORITY_HEAD'],'requiredAuthorityCoveragePct':100,'blockers':0,'requestDigest':os.environ['AUTHORITY_REQUEST_DIGEST'],'artifactDigest':os.environ['AUTHORITY_ARTIFACT_DIGEST'],'layerMapPresent':True,'runId':os.environ['AUTHORITY_RUN_ID'],'artifactId':os.environ['AUTHORITY_ARTIFACT_ID']}}
          p=Path(os.environ['RUNNER_TEMP'])/'mobile-cleanup'/'mutation-request.json'; p.write_text(json.dumps(req,indent=2)+'\n')
          PY
          python 'PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py' --request "$RUNNER_TEMP/mobile-cleanup/mutation-request.json" | tee "$RUNNER_TEMP/mobile-cleanup/mutation-decision.json"
          grep -Fq '"result": "PASS_ANTI_REWORK_GATE"' "$RUNNER_TEMP/mobile-cleanup/mutation-decision.json"
      - name: Consumer proof and exact mutation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['MOBILE_ROOT']); terms=['PrismaMobileMultiContextSwitcher','prisma-mobile-multi-context-switcher','multiContextRoot','mobile-multi-context-switcher']; refs=[]
          for base in [root/'src',root/'app']:
            for p in base.rglob('*'):
              if p.is_file() and p.suffix.lower() in {'.ts','.tsx','.js','.jsx','.mjs','.css','.json'}:
                t=p.read_text(encoding='utf-8',errors='replace'); hits=[x for x in terms if x in t]
                if hits: refs.append({'path':p.as_posix(),'terms':hits})
          allowed={(root/'src/components/prisma-app/PrismaMobileMultiContextSwitcher.tsx').as_posix(),(root/'src/components/prisma-app/prisma-mobile-multi-context-switcher.module.css').as_posix(),(root/'src/components/prisma-app/prisma-mobile-dashboard.module.css').as_posix(),(root/'src/components/prisma-app/index.ts').as_posix()}
          unexpected=[r for r in refs if r['path'] not in allowed]; branches=root/'app/api/mobile/branches/route.ts'
          proof={'references':refs,'unexpectedRuntimeConsumers':unexpected,'branchesApiExistsAndIsOutOfScope':branches.is_file(),'verdict':'PASS_NO_EXTERNAL_RUNTIME_CONSUMERS' if not unexpected else 'FAIL'}
          (Path(os.environ['RUNNER_TEMP'])/'mobile-cleanup'/'MULTICONTEXT_CONSUMER_PROOF.json').write_text(json.dumps(proof,indent=2)+'\n')
          print(json.dumps(proof,indent=2))
          if unexpected or not branches.is_file(): raise SystemExit(2)
          PY
          git switch -C "$WORK_BRANCH" "origin/$WORK_BRANCH"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['MOBILE_ROOT']); report={'deleted':[],'updated':[],'preserved':[]}
          comp=root/'src/components/prisma-app/PrismaMobileMultiContextSwitcher.tsx'; own=root/'src/components/prisma-app/prisma-mobile-multi-context-switcher.module.css'; idx=root/'src/components/prisma-app/index.ts'; css=root/'src/components/prisma-app/prisma-mobile-dashboard.module.css'; contract=root/'docs/prisma-app/PRISMA_MOBILE_INTERFACE_CANON.contract.json'; verifier=root/'tools/verify_prisma_mobile_interface_canon.mjs'; branches=root/'app/api/mobile/branches/route.ts'
          for p in (comp,own):
            if not p.is_file(): raise SystemExit('MISSING:'+p.as_posix())
            report['deleted'].append(p.as_posix()); p.unlink()
          s=idx.read_text(); needle='export { PrismaMobileMultiContextSwitcher } from "./PrismaMobileMultiContextSwitcher";\n'; assert s.count(needle)==1; idx.write_text(s.replace(needle,'')); report['updated'].append(idx.as_posix())
          s=css.read_text(); needle='.crystalCommand,\n.multiContextRoot {\n  display: grid;\n  gap: 9px;\n}'; repl='.crystalCommand {\n  display: grid;\n  gap: 9px;\n}'; assert s.count(needle)==1; css.write_text(s.replace(needle,repl)); report['updated'].append(css.as_posix())
          s=contract.read_text(); needle='"verifiersAligned": false'; assert s.count(needle)==1; contract.write_text(s.replace(needle,'"verifiersAligned": true')); report['updated'].append(contract.as_posix())
          s=verifier.read_text(); anchor='for (const key of ["staleOrPartialIsHealthy", "componentExistsMeansMounted", "historicalVerifierMeansCurrentAuthority", "offlineRouteMeansOfflineDataCertified"]) {\n  if (noFakeGreen[key] !== false) fail("No-fake-green contract must stay false", { key, value: noFakeGreen[key] });\n}\n\n'; add=anchor+'if (contract.claims?.verifiersAligned !== true) {\n  fail("Canon contract must declare reconciled verifier alignment", { verifiersAligned: contract.claims?.verifiersAligned });\n}\n\n'; assert s.count(anchor)==1; verifier.write_text(s.replace(anchor,add)); report['updated'].append(verifier.as_posix())
          data=json.loads(contract.read_text()); claims=data['claims']; assert claims['verifiersAligned'] is True
          for k in ['runtimeCertified','visualCertified','hostedProductionCertified','offlineOperationalDataCertified']: assert claims[k] is False
          assert branches.is_file(); report['preserved'].append(branches.as_posix())
          (Path(os.environ['RUNNER_TEMP'])/'mobile-cleanup'/'MUTATION_REPORT.json').write_text(json.dumps(report,indent=2)+'\n'); print(json.dumps(report,indent=2))
          PY
      - name: Focused invariants
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$MOBILE_ROOT/src/components/prisma-app/PrismaMobileMultiContextSwitcher.tsx"
          test ! -e "$MOBILE_ROOT/src/components/prisma-app/prisma-mobile-multi-context-switcher.module.css"
          test -f "$MOBILE_ROOT/app/api/mobile/branches/route.ts"
          ! grep -R -n --exclude-dir=node_modules -E 'PrismaMobileMultiContextSwitcher|prisma-mobile-multi-context-switcher|multiContextRoot|mobile-multi-context-switcher' "$MOBILE_ROOT/src" "$MOBILE_ROOT/app"
          ! grep -n '!important' "$MOBILE_ROOT/src/components/prisma-app/prisma-mobile-dashboard.module.css"
          cd "$MOBILE_ROOT" && node tools/verify_prisma_mobile_interface_canon.mjs
      - name: Install, focused verifiers, typecheck and build
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm -C "$MOBILE_ROOT" verify:interface-canon
          pnpm -C "$MOBILE_ROOT" verify:premium-navigation
          pnpm -C "$MOBILE_ROOT" verify:data-readiness
          pnpm -C "$MOBILE_ROOT" verify:source-states
          pnpm -C "$MOBILE_ROOT" verify:zero-important
          pnpm -C "$MOBILE_ROOT" typecheck
          pnpm -C "$MOBILE_ROOT" build
      - name: Exact scope, commit and push
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,subprocess
          allowed={'.github/workflows/mobile-multicontext-verifiers-cleanup-gate.yml','apps/terminal-de-venta-system/products/mobile/app/src/components/prisma-app/PrismaMobileMultiContextSwitcher.tsx','apps/terminal-de-venta-system/products/mobile/app/src/components/prisma-app/prisma-mobile-multi-context-switcher.module.css','apps/terminal-de-venta-system/products/mobile/app/src/components/prisma-app/index.ts','apps/terminal-de-venta-system/products/mobile/app/src/components/prisma-app/prisma-mobile-dashboard.module.css','apps/terminal-de-venta-system/products/mobile/app/docs/prisma-app/PRISMA_MOBILE_INTERFACE_CANON.contract.json','apps/terminal-de-venta-system/products/mobile/app/tools/verify_prisma_mobile_interface_canon.mjs'}
          changed=set(subprocess.check_output(['git','diff','--name-only',os.environ['AUTHORITY_HEAD']],text=True).splitlines()); print('\n'.join(sorted(changed)))
          if changed!=allowed: raise SystemExit('SCOPE_MISMATCH:'+','.join(sorted(changed^allowed)))
          PY
          git diff --name-status "$AUTHORITY_HEAD" | tee "$RUNNER_TEMP/mobile-cleanup/FINAL_CHANGED_FILES.txt"
          git config user.name 'prisma-governed-bot'
          git config user.email 'prisma-governed-bot@users.noreply.github.com'
          git add -A
          git commit -m 'chore(mobile): remove retired MultiContext residue and align canon verifier'
          git push origin "$WORK_BRANCH"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-multicontext-verifier-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/mobile-cleanup/**
