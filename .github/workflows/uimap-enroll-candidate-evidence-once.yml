name: UIMAP Enroll Candidate Evidence Once

on:
  push:
    branches:
      - agent/prisma-html-three-app-visual-closure
    paths:
      - .github/workflows/uimap-enroll-candidate-evidence-once.yml

permissions:
  contents: write

env:
  EXPECTED_PARENT: 0f1f7bd09ebb2050b65aea28acad139c60775229
  EXPECTED_WORKFLOW_BLOB: 50f2a6eea532e12ba5c78d3eec70b9530078de85

jobs:
  enroll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transaction branch
        uses: actions/checkout@v6
        with:
          ref: agent/prisma-html-three-app-visual-closure
          fetch-depth: 2
          persist-credentials: true

      - name: Fail closed on preimage drift
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git hash-object .github/workflows/prisma-three-app-visual-map.yml)" = "$EXPECTED_WORKFLOW_BLOB"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Enroll candidate-evidence test in permanent gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/prisma-three-app-visual-map.yml')
          text = path.read_text(encoding='utf-8')
          needle = '            tools/code-atlas/tests/test_operational_uimap_route_projection.py \\\n'
          addition = needle + '            tools/code-atlas/tests/test_operational_uimap_candidate_evidence.py \\\n'
          count = text.count(needle)
          if count != 2:
              raise SystemExit(f'ROUTE_TEST_ANCHOR_COUNT_MISMATCH:{count}')
          if 'test_operational_uimap_candidate_evidence.py' in text:
              raise SystemExit('CANDIDATE_EVIDENCE_TEST_ALREADY_ENROLLED')
          text = text.replace(needle, addition)
          if text.count('test_operational_uimap_candidate_evidence.py') != 2:
              raise SystemExit('CANDIDATE_EVIDENCE_ENROLLMENT_COUNT_MISMATCH')
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Prove scope and commit transaction
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = '.github/workflows/prisma-three-app-visual-map.yml'
          grep -c 'test_operational_uimap_candidate_evidence.py' .github/workflows/prisma-three-app-visual-map.yml | grep -Fx 2

          git config user.name 'alanharrryy-wq'
          git config user.email 'alanharrryy@gmail.com'
          git add .github/workflows/prisma-three-app-visual-map.yml
          git rm .github/workflows/uimap-enroll-candidate-evidence-once.yml
          git commit -m 'ci(uimap): enroll governed candidate evidence regression'
          git push origin HEAD:agent/prisma-html-three-app-visual-closure
