name: Mobile Verifier Reconciliation Final V4

on:
  pull_request:
    paths:
      - '.github/workflows/mobile-verifier-reconciliation-final-v4.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: tools/code-atlas/src
  TARGET_HEAD: 0b2c552a4170ad7fa2be856cd308e1d699d7b802
  TARGET_BASE: bef71b7d092ef43580498988b09c1d56fd0ff474
  APP_ROOT: apps/terminal-de-venta-system
  MOBILE_ROOT: apps/terminal-de-venta-system/products/mobile/app

jobs:
  final-v4:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout exact target
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_HEAD }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: apps/terminal-de-venta-system/pnpm-lock.yaml

      - name: Exact-head bounded scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
          python - <<'PY'
          import os, subprocess
          base, head = os.environ['TARGET_BASE'], os.environ['TARGET_HEAD']
          m = 'apps/terminal-de-venta-system/products/mobile/app/'
          docs = {
            m+'docs/prisma-app/PRISMA_MOBILE_INTERFACE_CANON.md',
            m+'docs/prisma-app/PRISMA_MOBILE_INTERFACE_CANON.contract.json',
            m+'docs/prisma-app/PRISMA_APP_MOBILE_41_MULTI_CONTEXT_SWITCHER_RENDER_GRADE.md',
          }
          changed = subprocess.check_output(['git','diff','--name-only',base,head], text=True).splitlines()
          bad = [p for p in changed if not (p in docs or p == m+'package.json' or (p.startswith(m+'tools/verify') and p.endswith('.mjs')))]
          if len(changed) != 17 or bad:
              raise SystemExit('SCOPE_GUARD_FAIL:'+','.join(bad)+f':count={len(changed)}')
          if any(p.endswith(('.tsx','.css')) for p in changed):
              raise SystemExit('PRODUCT_SOURCE_OR_CSS_MUTATION_FORBIDDEN')
          print('CHANGE_BOUNDARY_PASS', len(changed))
          PY
          test -z "$(git status --porcelain)"

      - name: Governance self-test and fresh Authority Mesh
        shell: bash
        run: |
          set -euo pipefail
          python "PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py" --self-test
          python - "$RUNNER_TEMP/mobile-v4.request.json" <<'PY'
          import json, os, sys
          a='apps/terminal-de-venta-system/'
          m=a+'products/mobile/app/'
          l='PRISMA Factory Ledger/'
          authorities=[
            l+'PRISMA_FACTORY_LEDGER.json',
            l+'PRISMA_FACTORY_LEDGER_AGENT_GATE.md',
            l+'PRISMA_EVIDENCE_INDEX.json',
            l+'tools/verify_prisma_anti_rework_gate.py',
            a+'docs/ops/PRISMA_FIELD_MANUAL_APRENDIZAJE_OPERATIVO.md',
            a+'quality/contracts/no-fake-green.contract.json',
            a+'pnpm-workspace.yaml',
            a+'pnpm-lock.yaml',
            m+'docs/prisma-app/PRISMA_MOBILE_INTERFACE_CANON.md',
            m+'docs/prisma-app/PRISMA_MOBILE_INTERFACE_CANON.contract.json',
            m+'docs/prisma-app/archive/interface-history/PRISMA_APP_MOBILE_41_MULTI_CONTEXT_SWITCHER_RENDER_GRADE.md',
            m+'package.json',
            m+'tools/verify_prisma_mobile_interface_canon.mjs',
            m+'tools/verify_prisma_app_mobile_28_data_readiness.mjs',
            m+'tools/verify_prisma_app_mobile_32_source_states.mjs'
          ]
          tasks=[
            {
              'id':'mobile-final-v4-conformance',
              'surface':'mobile','intent':'VERIFY','domain':'testing',
              'task':'Verify final Mobile interface and verifier reconciliation on current main authority. Seven canonical tabs remain. MultiContextSwitcher is absent from normative Mobile product intent with no replacement. Data Readiness and Source States verifiers follow current semantic contracts. No Mobile product source/runtime/API/PWA/data/sync/security/licensing/CSS mutation.',
              'requiredAuthorities':authorities,
              'requiredDirectories':[m+'tools',m+'docs/prisma-app'],
              'requiredCapabilities':['mobile.interface_specification_canon'],
              'minimumCoverage':100,'failOnMissingAuthority':True
            },
            {
              'id':'mobile-final-v4-closure',
              'surface':'governance','intent':'VERIFY','domain':'governance',
              'task':'Require no-fake-green closure against current authority: bounded docs/package/verifier scope only; active iteration-41 spec and verifier absent; historical archive preserved; all current Mobile technical gates, canonical typecheck and production build must pass using the terminal-de-venta-system pnpm workspace.',
              'requiredAuthorities':authorities,
              'requiredDirectories':[a+'quality/contracts'],
              'requiredCapabilities':['mobile.interface_specification_canon'],
              'minimumCoverage':100,'failOnMissingAuthority':True
            }
          ]
          json.dump({'schemaVersion':'v2','profile':'mobile-final-no-multicontext-v4','expectedHead':os.environ['TARGET_HEAD'],'tasks':tasks},open(sys.argv[1],'w',encoding='utf-8'),ensure_ascii=False,indent=2)
          PY
          pre="$RUNNER_TEMP/mobile-v4-pre"
          par="$RUNNER_TEMP/mobile-v4-par"
          comp="$RUNNER_TEMP/mobile-v4-comp/payload"
          mkdir -p "$pre" "$par" "$comp"
          python -m code_atlas.motors.prisma_mesh_gateway preflight --repo "$GITHUB_WORKSPACE" --request "$RUNNER_TEMP/mobile-v4.request.json" --out "$pre"
          python tools/code-atlas/src/code_atlas/motors/smart_allmesh_parallel.py --repo "$GITHUB_WORKSPACE" --out-root "$par" --task-spec "$pre/legacy_tasks.json" --parallel 2 --workers 18 --shards 54 --max-files 160 --max-mb 48
          python -m code_atlas.motors.prisma_mesh_gateway compose --repo "$GITHUB_WORKSPACE" --request "$RUNNER_TEMP/mobile-v4.request.json" --preflight "$pre" --mesh-result "$par" --out "$comp" | tee "$RUNNER_TEMP/mobile-v4-compose.txt"
          grep -Fq PASS_COMPOSED_AUTHORITY_MESH "$RUNNER_TEMP/mobile-v4-compose.txt"
          test -f "$RUNNER_TEMP/mobile-v4-comp/prisma-automesh-composed-result.zip"

      - name: Factory Ledger MUTATION gate
        shell: bash
        run: |
          set -euo pipefail
          request="$RUNNER_TEMP/mobile-v4-mutation.request.json"
          decision="$RUNNER_TEMP/mobile-v4-mutation.decision.json"
          python - "$RUNNER_TEMP/mobile-v4-comp/payload/PRISMA_MESH_GATEWAY_REPORT.json" "$RUNNER_TEMP/mobile-v4-pre/PREFLIGHT_MANIFEST.json" "$RUNNER_TEMP/mobile-v4-comp/prisma-automesh-composed-result.zip" "$request" <<'PY'
          import hashlib, json, os, sys
          report=json.load(open(sys.argv[1],encoding='utf-8'))
          pre=json.load(open(sys.argv[2],encoding='utf-8'))
          digest=hashlib.sha256(open(sys.argv[3],'rb').read()).hexdigest()
          coverage=min(float((x.get('coverage') or {}).get('resolvedPercent',0)) for x in pre['lanes'])
          payload={
            'schemaVersion':'prisma.factory-ledger.anti-rework-gate.v1',
            'mode':'MUTATION','expectedHead':os.environ['TARGET_HEAD'],
            'task':'Advance mobile.interface_specification_canon through final bounded verifier/spec reconciliation on current main authority. Retire MultiContextSwitcher normative concept and align stale verifier assertions. No Mobile product source/runtime mutation.',
            'capabilities':[{'id':'mobile.interface_specification_canon','requestedAction':'ADVANCE'}],
            'authorityMesh':{'status':report['status'],'repoHead':report['repoHead'],'requiredAuthorityCoveragePct':coverage,'blockers':len(pre.get('blockers') or []),'requestDigest':report['requestDigest'],'artifactDigest':digest,'layerMapPresent':False},
            'visualMutation':False
          }
          json.dump(payload,open(sys.argv[4],'w',encoding='utf-8'),ensure_ascii=False,indent=2)
          PY
          python "PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py" --request "$request" | tee "$decision"
          python - "$decision" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          assert d.get('result')=='PASS_ANTI_REWORK_GATE' and d.get('errors')==[], d
          print('PASS_ANTI_REWORK_GATE')
          PY

      - name: Install terminal workspace dependencies
        working-directory: ${{ env.APP_ROOT }}
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Canon and current Mobile technical gates
        working-directory: ${{ env.MOBILE_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          test ! -e tools/verify_prisma_app_mobile_41_multi_context_switcher.mjs
          test ! -e docs/prisma-app/PRISMA_APP_MOBILE_41_MULTI_CONTEXT_SWITCHER_RENDER_GRADE.md
          test -e docs/prisma-app/archive/interface-history/PRISMA_APP_MOBILE_41_MULTI_CONTEXT_SWITCHER_RENDER_GRADE.md
          pnpm run verify:interface-canon
          node tools/verify_prisma_app_mobile_20_command_center.mjs
          node tools/verify_prisma_app_mobile_21_owner_action_inbox.mjs
          node tools/verify_prisma_app_mobile_22_daily_brief.mjs
          node tools/verify_prisma_app_mobile_23_decision_ledger.mjs
          node tools/verify_prisma_app_mobile_24_pulse_timeline.mjs
          node tools/verify_prisma_app_mobile_33_mando_contracts.mjs
          node tools/verify_prisma_app_mobile_37_release_hardening.mjs
          pnpm run verify:health-radar
          pnpm run verify:health-radar-compat
          pnpm run verify:data-readiness
          pnpm run verify:premium-navigation
          pnpm run verify:crystal-intelligence
          pnpm run verify:secure-projection-gateway
          pnpm run verify:source-states
          pnpm run verify:runtime-error-guard

      - name: Typecheck Mobile
        working-directory: ${{ env.MOBILE_ROOT }}
        run: pnpm run typecheck

      - name: Production build Mobile
        working-directory: ${{ env.MOBILE_ROOT }}
        run: pnpm run build

      - name: Stage evidence
        if: always()
        shell: bash
        run: |
          out="$RUNNER_TEMP/mobile-v4-evidence"
          mkdir -p "$out"
          git diff --name-status "$TARGET_BASE" "$TARGET_HEAD" > "$out/changed-files.txt"
          git log -1 --format='%H%n%T%n%s' "$TARGET_HEAD" > "$out/target-head.txt"
          for p in "$RUNNER_TEMP/mobile-v4.request.json" "$RUNNER_TEMP/mobile-v4-pre/PREFLIGHT_MANIFEST.json" "$RUNNER_TEMP/mobile-v4-comp/payload/PRISMA_MESH_GATEWAY_REPORT.json" "$RUNNER_TEMP/mobile-v4-comp/prisma-automesh-composed-result.zip" "$RUNNER_TEMP/mobile-v4-mutation.request.json" "$RUNNER_TEMP/mobile-v4-mutation.decision.json"; do
            [ ! -f "$p" ] || cp "$p" "$out/$(basename "$p")"
          done

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-verifier-reconciliation-final-v4-evidence
          path: ${{ runner.temp }}/mobile-v4-evidence/**
          if-no-files-found: error
          retention-days: 14
