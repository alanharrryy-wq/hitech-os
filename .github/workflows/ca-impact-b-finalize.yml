name: CA Impact B One-Shot Finalizer

on:
  pull_request:
    paths:
      - '.github/workflows/ca-impact-b-finalize.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: tools/code-atlas/src

jobs:
  finalize-b-governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_MAIN: 124e76b4f107d0d74ab5ede7c7b0d8c0407a276a
      BRANCH: preflight/ca-impact-b-promote-2508
      MESH_RUN_ID: '32843157359'
      MESH_ARTIFACT_ID: '9561305782'
      MESH_ARTIFACT_SHA256: '17a1e3e11a2e940a3af5f0e527b31f1f28e676085d1453cb861dd182cadb7d1f'
      MESH_COMPOSED_SHA256: 'df695d287c368632937235ab6d5ce18b212e2c7191a504ecd33b5a3d70a15d2e'
      MESH_REQUEST_DIGEST: '7db6c183aa533219ecbf908599a8233540abe13b66033a4cf451eb8b63cf0c02'
    steps:
      - name: Checkout finalizer branch
        uses: actions/checkout@v6
        with:
          ref: preflight/ca-impact-b-promote-2508
          fetch-depth: 0

      - name: Validate frozen B authority baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git merge-base HEAD origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse origin/main:'PRISMA Factory Ledger/PRISMA_CHANGE_INTELLIGENCE_CAPABILITY_MAP.json')" = "178e883adb6dfdc72c4c9fe728391430b9ea5232"
          test "$(git rev-parse origin/main:'PRISMA Factory Ledger/PRISMA_CHANGE_INTELLIGENCE_CAPABILITY_MAP.md')" = "a3e4e5ba43d326fe3824998c975a28aa07ca25e3"
          test "$(git rev-parse origin/main:'tools/code-atlas/docs/PRISMA_CHANGE_ASSURANCE_V1.md')" = "510da22143d11720b9d4d7d884ebd6a12dea55ae"
          test "$(git rev-parse origin/main:'tools/code-atlas/src/code_atlas/intelligence/graphs.py')" = "a595fe69b33e297e89259c76349e73d9aec89325"
          test "$(git rev-parse origin/main:'tools/code-atlas/src/code_atlas/intelligence/language_dependencies.py')" = "807236a0bfe4ed6bd504237b86e1547ba5a8091d"
          test "$(git rev-parse origin/main:'tools/code-atlas/src/code_atlas/change_intelligence/universal_binding.py')" = "13cced1fbbd904f651471acff0c95749fec73a48"
          test "$(git rev-parse origin/main:'tools/code-atlas/tests/test_operational_rental_hardening.py')" = "a427d6dc9f686e32c61637283cf696ae8e75f1a8"
          changed="$(git diff --name-only origin/main...HEAD)"
          test "$changed" = ".github/workflows/ca-impact-b-finalize.yml"

      - name: Run universal Factory Ledger mutation gate on frozen main
        shell: bash
        run: |
          set -euo pipefail
          gate_root="$RUNNER_TEMP/b-gate-main"
          git worktree add --detach "$gate_root" origin/main
          echo "GATE_ROOT=$gate_root" >> "$GITHUB_ENV"
          request="$RUNNER_TEMP/b-factory-request.json"
          result="$RUNNER_TEMP/b-factory-result.json"
          python - "$request" <<'PY'
          import json, os, sys
          head=os.environ['EXPECTED_MAIN']
          request={
            "schemaVersion":"prisma.factory-ledger.anti-rework-gate.v1",
            "mode":"MUTATION",
            "expectedHead":head,
            "task":"Promote PRISMA Change Assurance checklist B Useful Impact Radius from PARTIAL to DONE LOCAL_VERIFIED using existing bounded implementation and current cross-platform historical real-diff evidence. Only the three canonical Change Assurance governance projections may change. Preserve conservative impact, Impact Radius != Authorization, mixed-stack blind spots, G PARTIAL, J BLOCKED and v1Complete=false.",
            "capabilities":[
              {"id":"change_intelligence.capability_anti_rework_gate","requestedAction":"ADVANCE"},
              {"id":"code_atlas.change_intelligence.customer_wow_v1","requestedAction":"VERIFY"}
            ],
            "visualMutation":False,
            "authorityMesh":{
              "status":"PASS_COMPOSED_AUTHORITY_MESH",
              "repoHead":head,
              "requiredAuthorityCoveragePct":100,
              "blockers":0,
              "requestDigest":os.environ['MESH_REQUEST_DIGEST'],
              "artifactDigest":"sha256:"+os.environ['MESH_ARTIFACT_SHA256'],
              "layerMapPresent":True
            }
          }
          with open(sys.argv[1],'w',encoding='utf-8') as f: json.dump(request,f,indent=2)
          PY
          (cd "$gate_root" && python 'PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py' --request "$request") | tee "$result"
          python - "$result" >> "$GITHUB_ENV" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          if d.get('result')!='PASS_ANTI_REWORK_GATE': raise SystemExit(d)
          digest=d.get('decisionDigest')
          if not digest: raise SystemExit('FACTORY_DECISION_DIGEST_MISSING')
          print('FACTORY_DECISION_DIGEST='+digest)
          PY

      - name: Apply authorized B promotion and validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy, json, os
          from pathlib import Path
          registry=Path('PRISMA Factory Ledger/PRISMA_CHANGE_INTELLIGENCE_CAPABILITY_MAP.json')
          map_md=Path('PRISMA Factory Ledger/PRISMA_CHANGE_INTELLIGENCE_CAPABILITY_MAP.md')
          v1_md=Path('tools/code-atlas/docs/PRISMA_CHANGE_ASSURANCE_V1.md')
          data=json.loads(registry.read_text(encoding='utf-8'))
          before=copy.deepcopy(data)
          rows=[]
          def walk(node):
              if isinstance(node,dict):
                  if node.get('id')=='B' and node.get('stage')=='RESOLVE' and node.get('title')=='Useful Impact Radius': rows.append(node)
                  for v in node.values(): walk(v)
              elif isinstance(node,list):
                  for v in node: walk(v)
          walk(data)
          if len(rows)!=1: raise SystemExit(f'EXPECTED_ONE_B_ROW_GOT_{len(rows)}')
          item=rows[0]
          if item.get('status')!='PARTIAL': raise SystemExit(f'B_STATUS_NOT_PARTIAL:{item.get("status")}')
          item['status']='DONE'
          item['claimBoundary']='LOCAL_VERIFIED bounded Useful Impact Radius only: canonical static reverse-dependency impact remains conservative and informational, while the additive GO_BOUNDED_V1 actionableReview separates exact direct Go relationships and test-companion closure without weakening or deleting structural evidence. Current-code historical replay is deterministic and read-only across Ubuntu/Windows: Spring Java is 100/100/100 recall/precision/companion recall; Cobra full conservative radius remains 75% recall / 9.38% precision / 66.67% companion recall while the bounded actionable projection is 75% recall / 75% precision; pybind remains an explicit 33.33% recall / 100% precision / 0% companion-recall blind spot; a Kubernetes missing-parent new path fails closed. Impact Radius != Authorization. This does not prove arbitrary-repository, all-language or dynamic-runtime completeness, generalized companion recall, production, enterprise, hosted, paid-pilot, human usefulness or independent-agent verification.'
          item['evidence']=[
              'path:tools/code-atlas/src/code_atlas/intelligence/graphs.py',
              'path:tools/code-atlas/src/code_atlas/intelligence/language_dependencies.py',
              'path:tools/code-atlas/src/code_atlas/change_intelligence/universal_binding.py',
              'path:tools/code-atlas/tests/test_operational_rental_hardening.py',
              'PR #308 merged bounded Go actionableReview without weakening conservative impact',
              'PR #309 historical replay evidence: Cobra actionableReview 75% recall / 75% precision; full conservative radius preserved',
              'Current-code historical real-diff run 32807231102: Ubuntu and Windows SUCCESS, read-only and repeatable',
              'Current-code Ubuntu artifact 9548560256 sha256:f0c8dcba653bdc0991f76441b264ccafde25c996244bfd0b41e594299168555f',
              'Current-code Windows artifact 9548564709 sha256:712e17013a6e758ef95fb10469671cc688451809e827f1789945400af50b454b',
              'B promotion Authority Mesh run '+os.environ['MESH_RUN_ID']+' / artifact '+os.environ['MESH_ARTIFACT_ID'],
              'B promotion artifact sha256:'+os.environ['MESH_ARTIFACT_SHA256'],
              'B promotion composed Authority Mesh sha256:'+os.environ['MESH_COMPOSED_SHA256'],
              'B promotion request digest '+os.environ['MESH_REQUEST_DIGEST'],
              'Factory gate decision '+os.environ['FACTORY_DECISION_DIGEST'],
              'Change Assurance gate PASS_CHANGE_ASSURANCE_CAPABILITY_GATE for ci.core.system_graphs, ci.change.prepare, ci.impact.go_java_dependency and ci.impact.go_actionable_review'
          ]
          item['tests']=[
              'test_go_local_module_import_and_same_basename_test_are_precise',
              'test_go_mutual_file_cohesion_and_test_companion_avoid_package_fanout',
              'current-code Spring PetClinic Java historical replay 100/100/100 on Ubuntu/Windows',
              'current-code Cobra bounded actionableReview historical replay 75/75 on Ubuntu/Windows',
              'current-code historical replay repeatability PASS on Ubuntu/Windows'
          ]
          item['negativeTests']=[
              'Kubernetes new target missing from parent remains BLOCKED/UNKNOWN with no Authority Pack',
              'structural-only Go relationships remain visible in conservative impact and are not silently promoted into actionableReview',
              'pybind false negatives remain explicit rather than being painted green',
              'Impact Radius never expands allowed edit scope or authorization',
              'missing/contradictory/unsupported evidence must not become green'
          ]
          item['knownBlindSpots']=[
              'Mixed C++/Python pybind historical evidence remains weak at 33.33% recall and 0% companion recall; B DONE does not claim mixed-stack completeness.',
              'Cobra still misses the documentation companion site/content/completions/_index.md; the bounded actionable projection is useful but not complete.',
              'Static repository evidence does not prove dynamic/runtime dependencies, generated relationships, reflection/plugin wiring or arbitrary-stack completeness.',
              'Measured historical fixtures are finite and do not establish a universal accuracy threshold or generalized usefulness.',
              'This evidence does not prove production, enterprise IAM/security, hosted multi-tenant, legal/privacy, paid-pilot, human usefulness or independent-agent success.'
          ]
          item['nextEvidence']='REUSE_DONE_BASELINE; recertify after dependency extraction, changeImpact semantics, actionableReview taxonomy, companion discovery, prepare_change impact binding or authorization-boundary drift. Expand stack-specific actionability only from fresh external evidence; do not weaken conservative impact or benchmark-chase known false negatives.'
          data['lastGovernanceMutation']={
              'kind':'RESOLVE_B_USEFUL_IMPACT_RADIUS_LOCAL_VERIFICATION_PROMOTION',
              'sourceHead':os.environ['EXPECTED_MAIN'],
              'technicalEvidenceRunId':32807231102,
              'authorityRunId':int(os.environ['MESH_RUN_ID']),
              'authorityArtifactId':int(os.environ['MESH_ARTIFACT_ID']),
              'authorityArtifactSha256':os.environ['MESH_ARTIFACT_SHA256'],
              'composedAuthoritySha256':os.environ['MESH_COMPOSED_SHA256'],
              'requestDigest':os.environ['MESH_REQUEST_DIGEST'],
              'factoryGateDecisionDigest':os.environ['FACTORY_DECISION_DIGEST'],
              'status':'LOCAL_VERIFIED',
              'productionCertified':False
          }
          def statuses(root):
              out={}
              def rec(n):
                  if isinstance(n,dict):
                      if n.get('id') in set('ABCDEFGHIJ') and 'stage' in n and 'status' in n: out[n['id']]=n['status']
                      for v in n.values(): rec(v)
                  elif isinstance(n,list):
                      for v in n: rec(v)
              rec(root); return out
          b,a=statuses(before),statuses(data)
          if b.get('B')!='PARTIAL' or a.get('B')!='DONE': raise SystemExit('B_STATUS_TRANSITION_INVALID')
          for ident,status in b.items():
              if ident!='B' and a.get(ident)!=status: raise SystemExit(f'UNAUTHORIZED_STATUS_CHANGE:{ident}:{status}->{a.get(ident)}')
          if a.get('G')!='PARTIAL' or a.get('J')!='BLOCKED': raise SystemExit('G_J_STATUS_DRIFT')
          if data.get('v1Complete') is not False: raise SystemExit('V1_COMPLETE_NOT_FALSE')
          registry.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          old='| B | RESOLVE | Useful Impact Radius | `PARTIAL` |'
          new='| B | RESOLVE | Useful Impact Radius | `DONE` |'
          text=map_md.read_text(encoding='utf-8')
          if text.count(old)!=1 or new in text: raise SystemExit('MAP_B_TABLE_ANCHOR_INVALID')
          text=text.replace(old,new,1)
          anchor='C is `DONE / LOCAL_VERIFIED` from the canonical fail-closed edge-provenance view'
          if text.count(anchor)!=1 or 'B is `DONE / LOCAL_VERIFIED` from the existing conservative impact owner' in text: raise SystemExit('MAP_B_PARAGRAPH_ANCHOR_INVALID')
          paragraph=('B is `DONE / LOCAL_VERIFIED` from the existing conservative impact owner plus its additive bounded Go actionable-review projection. The full static transitive reverse-dependency radius remains conservative and informational; `GO_BOUNDED_V1` separates exact direct Go relationships and test companions without deleting structural evidence or expanding edit authority. Current-code historical real-diff run `32807231102` passed read-only/repeatability on Ubuntu and Windows: Spring Java measured 100/100/100 recall/precision/companion recall; Cobra full radius remained 75% / 9.38% / 66.67% while bounded actionable review measured 75% recall / 75% precision; pybind remained explicitly weak at 33.33% recall / 100% precision / 0% companion recall; and the Kubernetes missing-parent new-path case remained fail-closed. Promotion Authority Mesh run `32843157359` passed the frozen main head. `Impact Radius != Authorization` remains invariant. This does not certify arbitrary-repository or all-language completeness, generalized companion recall, dynamic runtime dependencies, production, enterprise, hosted, paid-pilot, human usefulness or independent-agent verification.\n\n')
          text=text.replace(anchor,paragraph+anchor,1)
          map_md.write_text(text,encoding='utf-8')
          text=v1_md.read_text(encoding='utf-8')
          if text.count(old)!=1 or new in text: raise SystemExit('V1_B_TABLE_ANCHOR_INVALID')
          text=text.replace(old,new,1)
          anchor='Checklist C is now `DONE / LOCAL_VERIFIED`:'
          if text.count(anchor)!=1 or 'Checklist B is now `DONE / LOCAL_VERIFIED`:' in text: raise SystemExit('V1_B_PARAGRAPH_ANCHOR_INVALID')
          paragraph=('Checklist B is now `DONE / LOCAL_VERIFIED`: the canonical conservative impact radius remains the static transitive reverse-dependency inspection view, while the existing additive `GO_BOUNDED_V1` actionable review separates exact direct Go relationships and test companions without converting impact into edit authorization. Current-code historical real-diff run `32807231102` passed read-only and repeatability on Ubuntu/Windows. Spring Java measured 100/100/100 recall/precision/companion recall; Cobra retained its conservative full-radius 75% / 9.38% / 66.67% result while bounded actionable review measured 75% recall / 75% precision; pybind remains an explicit 33.33% recall / 100% precision / 0% companion-recall blind spot; and the Kubernetes missing-parent new-path case stayed fail-closed. Promotion Authority Mesh run `32843157359` passed against the exact frozen main head. B is bounded usefulness, not universal completeness or an accuracy SLA; `Impact Radius != Authorization` remains invariant. This does not prove production, enterprise, hosted, paid-pilot, human usefulness or independent-agent verification.\n\n')
          text=text.replace(anchor,paragraph+anchor,1)
          v1_md.write_text(text,encoding='utf-8')
          PY
          python 'PRISMA Factory Ledger/tools/verify_change_intelligence_capability_gate.py' --validate-map
          python 'PRISMA Factory Ledger/tools/verify_change_intelligence_capability_gate.py' --self-test
          python tools/code-atlas/tests/test_operational_rental_hardening.py
          cp 'PRISMA Factory Ledger/PRISMA_CHANGE_INTELLIGENCE_CAPABILITY_MAP.json' "$GATE_ROOT/PRISMA Factory Ledger/PRISMA_CHANGE_INTELLIGENCE_CAPABILITY_MAP.json"
          cp 'PRISMA Factory Ledger/PRISMA_CHANGE_INTELLIGENCE_CAPABILITY_MAP.md' "$GATE_ROOT/PRISMA Factory Ledger/PRISMA_CHANGE_INTELLIGENCE_CAPABILITY_MAP.md"
          cp 'tools/code-atlas/docs/PRISMA_CHANGE_ASSURANCE_V1.md' "$GATE_ROOT/tools/code-atlas/docs/PRISMA_CHANGE_ASSURANCE_V1.md"
          ca_request="$RUNNER_TEMP/b-ca-request.json"
          ca_result="$RUNNER_TEMP/b-ca-result.json"
          python - "$ca_request" <<'PY'
          import json, os, sys
          head=os.environ['EXPECTED_MAIN']
          request={
            "mode":"MUTATION",
            "capabilityIds":["ci.core.system_graphs","ci.change.prepare","ci.impact.go_java_dependency","ci.impact.go_actionable_review"],
            "task":"Promote checklist B Useful Impact Radius to DONE LOCAL_VERIFIED from current bounded implementation and current cross-platform historical replay evidence while preserving conservative impact, explicit blind spots and Impact Radius != Authorization.",
            "visualMutation":False,
            "authorityMesh":{
              "status":"PASS_COMPOSED_AUTHORITY_MESH",
              "repoHead":head,
              "requiredAuthorityCoveragePct":100,
              "blockers":0,
              "requestDigest":os.environ['MESH_REQUEST_DIGEST'],
              "artifactDigest":"sha256:"+os.environ['MESH_ARTIFACT_SHA256'],
              "layerMapPresent":True
            }
          }
          with open(sys.argv[1],'w',encoding='utf-8') as f: json.dump(request,f,indent=2)
          PY
          (cd "$GATE_ROOT" && python 'PRISMA Factory Ledger/tools/verify_change_intelligence_capability_gate.py' --validate-map)
          (cd "$GATE_ROOT" && python 'PRISMA Factory Ledger/tools/verify_change_intelligence_capability_gate.py' --self-test)
          (cd "$GATE_ROOT" && python 'PRISMA Factory Ledger/tools/verify_change_intelligence_capability_gate.py' --request "$ca_request") | tee "$ca_result"
          python - "$ca_result" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          if d.get('result')!='PASS_CHANGE_ASSURANCE_CAPABILITY_GATE': raise SystemExit(d)
          PY
          factory_result2="$RUNNER_TEMP/b-factory-result-after.json"
          (cd "$GATE_ROOT" && python 'PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py' --request "$RUNNER_TEMP/b-factory-request.json") | tee "$factory_result2"
          python - "$factory_result2" <<'PY'
          import json, os, sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          if d.get('result')!='PASS_ANTI_REWORK_GATE': raise SystemExit(d)
          if d.get('decisionDigest')!=os.environ['FACTORY_DECISION_DIGEST']: raise SystemExit('FACTORY_DECISION_DRIFT')
          PY
          git worktree remove --force "$GATE_ROOT"

      - name: Prove exact final diff and push atomically
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ca-impact-b-finalize.yml
          expected=$(printf '%s\n' 'PRISMA Factory Ledger/PRISMA_CHANGE_INTELLIGENCE_CAPABILITY_MAP.json' 'PRISMA Factory Ledger/PRISMA_CHANGE_INTELLIGENCE_CAPABILITY_MAP.md' 'tools/code-atlas/docs/PRISMA_CHANGE_ASSURANCE_V1.md' | sort)
          actual=$(git diff --name-only origin/main | sort)
          test "$actual" = "$expected"
          test "$(git rev-parse origin/main:tools/code-atlas/src/code_atlas/intelligence/graphs.py)" = "$(git hash-object tools/code-atlas/src/code_atlas/intelligence/graphs.py)"
          test "$(git rev-parse origin/main:tools/code-atlas/src/code_atlas/intelligence/language_dependencies.py)" = "$(git hash-object tools/code-atlas/src/code_atlas/intelligence/language_dependencies.py)"
          test "$(git rev-parse origin/main:tools/code-atlas/src/code_atlas/change_intelligence/universal_binding.py)" = "$(git hash-object tools/code-atlas/src/code_atlas/change_intelligence/universal_binding.py)"
          test "$(git rev-parse origin/main:tools/code-atlas/tests/test_operational_rental_hardening.py)" = "$(git hash-object tools/code-atlas/tests/test_operational_rental_hardening.py)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'governance(ca): certify Useful Impact Radius'
          final=$(git diff --name-only origin/main...HEAD | sort)
          test "$final" = "$expected"
          git push origin "HEAD:$BRANCH"
