name: PC Catalog Structural Binding Author

on:
  push:
    branches:
      - feat/pc-catalog-viscore-fullscreen-20260830

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  author-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: feat/pc-catalog-viscore-fullscreen-20260830

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Assert current authority baseline
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 2baf39d81a160737da77e4bdd428dd41e3313d9d HEAD
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "6f5b3df2ccd4b83a613648fef8e0874df3e1ac09"

      - name: Install isolated parser dependency
        shell: bash
        run: |
          set -euo pipefail
          PARSER_ROOT="$RUNNER_TEMP/prisma-visual-parser"
          mkdir -p "$PARSER_ROOT"
          npm install --prefix "$PARSER_ROOT" --package-lock=false --ignore-scripts postcss@8
          APP_ROOT="$GITHUB_WORKSPACE/apps/terminal-de-venta-system"
          test ! -e "$APP_ROOT/node_modules"
          ln -s "$PARSER_ROOT/node_modules" "$APP_ROOT/node_modules"

      - name: Author and validate source-only PC catalog binding
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/implementation = next((x for x in layers.get("layerSamples"/d; /assert implementation and implementation.get("selector")/d' .github/scripts/pc_catalog_structural_binding_author.py
          python .github/scripts/pc_catalog_structural_binding_author.py --vc-out "$RUNNER_TEMP/pc-catalog-vc"
          rm -f apps/terminal-de-venta-system/node_modules

      - name: Prove no visual APPLY and commit governed authority
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only HEAD -- apps/terminal-de-venta-system/products/pc/app || true)"
          test -z "$(git diff --name-only HEAD -- apps/terminal-de-venta-system/products/tablet apps/terminal-de-venta-system/products/mobile apps/terminal-de-venta-system/products/chart-lab apps/terminal-de-venta-system/products/web || true)"
          git rm .github/workflows/pc-catalog-structural-binding-author.yml
          git rm .github/scripts/pc_catalog_structural_binding_author.py
          git add \
            apps/terminal-de-venta-system/tools/quality/ui-visual-control.mjs \
            apps/terminal-de-venta-system/config/prisma-visual/identity-layer-certifications.registry.json \
            prisma-html/tools/identity_binding_resolver_core.py \
            prisma-html/authority/rifat/identity/registries/bindings.registry.json \
            prisma-html/authority/rifat/identity/registries/element-bindings.registry.json \
            prisma-html/authority/rifat/identity/bindings/reports/BINDING_COVERAGE.json \
            prisma-html/authority/rifat/identity/bindings/examples/preview-primary-tablet.binding-envelope.json \
            prisma-html/authority/rifat/prisma-ui/visual-control/pc
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(viscore): bind PC catalog workspace source authority'
          git push origin HEAD:feat/pc-catalog-viscore-fullscreen-20260830
