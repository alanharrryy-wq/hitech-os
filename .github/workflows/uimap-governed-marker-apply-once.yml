name: UIMAP Governed Marker Apply Once

on:
  push:
    branches:
      - agent/prisma-html-three-app-visual-closure
    paths:
      - .github/workflows/uimap-governed-marker-apply-once.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: tools/code-atlas/src
  EXPECTED_PARENT: 42fc591f41c629a569bbb1ee7d551a67382ec4a2
  EXPECTED_RUNNER_BLOB: 76ec89e8339e933a587bd625909341853117ef8e
  EXPECTED_HELPER_SHA256: e7ee4890ec95b1c2e400587a2861d2a01c8a3a571c72c9fa37f1d4d909e82eb3

jobs:
  apply-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact transaction branch
        uses: actions/checkout@v6
        with:
          ref: agent/prisma-html-three-app-visual-closure
          fetch-depth: 2
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Fail closed on preimage drift
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git hash-object tools/code-atlas/src/code_atlas/app_map/uimap/runner.py)" = "$EXPECTED_RUNNER_BLOB"
          echo "$EXPECTED_HELPER_SHA256  tools/code-atlas/src/code_atlas/app_map/uimap/governed_markers.py" | sha256sum -c -
          test ! -e tools/code-atlas/tests/test_operational_uimap_governed_marker_reconciliation.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Apply exact runner patch
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > "$RUNNER_TEMP/runner.patch"
          git apply --check "$RUNNER_TEMP/runner.patch"
          git apply "$RUNNER_TEMP/runner.patch"
          test "$(sha256sum tools/code-atlas/src/code_atlas/app_map/uimap/runner.py | awk '{print $1}')" = 'eccda7f9ded8aa07755261a5bb9af86948f025192f1ccb3dd0aacc7885e32e65'

      - name: Materialize focused regression test
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > tools/code-atlas/tests/test_operational_uimap_governed_marker_reconciliation.py
          test "$(sha256sum tools/code-atlas/tests/test_operational_uimap_governed_marker_reconciliation.py | awk '{print $1}')" = '8d8b6f65c4c819adc8b4ebbd3879bf76d438939fba45ee60d7e298cc28347f83'

      - name: Compile and run focused tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/code-atlas/src/code_atlas/app_map/uimap/governed_markers.py \
            tools/code-atlas/src/code_atlas/app_map/uimap/runner.py \
            tools/code-atlas/tests/test_operational_uimap_governed_marker_reconciliation.py \
            tools/code-atlas/tests/test_operational_uimap_candidate_evidence.py \
            tools/code-atlas/tests/test_operational_uimap_route_projection.py
          python -m unittest -v \
            tools/code-atlas/tests/test_operational_uimap_governed_marker_reconciliation.py \
            tools/code-atlas/tests/test_operational_uimap_candidate_evidence.py \
            tools/code-atlas/tests/test_operational_uimap_route_projection.py

      - name: Generate real three-app mapping evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/marker-reconciliation"
          python -m code_atlas.cli.main ui-bridge refresh-three-app-map \
            --product-root "$GITHUB_WORKSPACE" \
            --governor-root "$GITHUB_WORKSPACE/prisma-html" \
            --output-root "$RUNNER_TEMP/marker-reconciliation" \
            --binding-registry "$GITHUB_WORKSPACE/prisma-html/authority/rifat/identity/registries/element-bindings.registry.json" \
            --pilot-contract "$GITHUB_WORKSPACE/apps/terminal-de-venta-system/products/pc/app/docs/visual-pilots/PC_STOCK_FICHA_TABLET_LICENSES_VISUAL_PILOT_V1.contract.json" \
            --workers 18

      - name: Prove exact StockFicha visual trace without fake semantic green
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'marker-reconciliation'
          projection = json.loads((root / 'PRISMA_UI_MULTI_SURFACE_PROJECTION.json').read_text(encoding='utf-8'))
          gaps = json.loads((root / 'PRISMA_UI_BRIDGE_BINDING_GAP_MATRIX.json').read_text(encoding='utf-8'))

          rows = [row for row in projection.get('components', []) if row.get('componentUiId') == 'PC-STOCK-FICHA-PANEL-01']
          if len(rows) != 1:
              raise SystemExit(f'STOCK_FICHA_EXACT_COMPONENT_COUNT:{len(rows)}')
          row = rows[0]
          trace = row.get('trace') or {}
          expected = {
              'surfaceId': 'SURF.pc.backoffice',
              'routeId': 'ROUTE.pc.stock',
              'ownerId': 'OWN.pc.inventory.stock_ficha',
              'regionId': 'ZONE.pc.stock.detail',
              'slotId': 'SLOT.pc.stock.detail.primary',
              'componentUiId': 'PC-STOCK-FICHA-PANEL-01',
              'bindingId': 'BND.SURFACE.OPERATIONAL.PC.STOCK.FICHA.V1',
              'layerId': 'LYR.SURFACE.OPERATIONAL.DETAIL',
              'implementationLayerId': 'products.pc.app.components.inventory.pc.inventory.master.detail.module.css.productficha',
              'adapterId': 'ADP.PC.DENSE.CLOUDGLASS.V1',
          }
          mismatches = {key: [trace.get(key), value] for key, value in expected.items() if trace.get(key) != value}
          if mismatches:
              raise SystemExit('STOCK_FICHA_TRACE_MISMATCH:' + json.dumps(mismatches, sort_keys=True))
          if row.get('neutralMeaningId') is not None:
              raise SystemExit('STOCK_FICHA_NEUTRAL_MEANING_MUST_REMAIN_UNRESOLVED')
          if row.get('targetResolutionStatus') == 'SOURCE_RESOLVED':
              raise SystemExit('STOCK_FICHA_MUST_NOT_FAKE_SOURCE_RESOLVED')
          if row.get('applicationReadiness') != 'BLOCKED':
              raise SystemExit('STOCK_FICHA_MUST_REMAIN_APPLICATION_BLOCKED')
          if row.get('confidence') != 'HIGH':
              raise SystemExit('STOCK_FICHA_CERTIFIED_VISUAL_TRACE_MUST_BE_HIGH_CONFIDENCE')
          blockers = set(row.get('blockingReasons') or [])
          if 'NEUTRAL_MEANING_NOT_PROVEN' not in blockers:
              raise SystemExit('STOCK_FICHA_NEUTRAL_MEANING_BLOCKER_MISSING')
          forbidden = {'MISSING_CERTIFIED_LAYER','MISSING_IMPLEMENTATION_LAYER','MISSING_VISUAL_BINDING','MISSING_TRACE:bindingId','MISSING_TRACE:layerId','MISSING_TRACE:implementationLayerId'}
          if blockers & forbidden:
              raise SystemExit('STOCK_FICHA_VISUAL_TRACE_STILL_MISSING:' + ','.join(sorted(blockers & forbidden)))
          if 'REC.panel.operational.cloudglass' not in (row.get('compatibleRecipeIds') or []):
              raise SystemExit('STOCK_FICHA_CERTIFIED_RECIPE_NOT_PRESERVED')

          gap_rows = [item for item in gaps.get('rows', []) if item.get('componentUiId') == 'PC-STOCK-FICHA-PANEL-01']
          if len(gap_rows) != 1:
              raise SystemExit(f'STOCK_FICHA_GAP_ROW_COUNT:{len(gap_rows)}')
          gap = gap_rows[0]
          alignment = gap.get('pilotAlignment') or {}
          if alignment.get('aligned') is not True or alignment.get('mismatches') not in ([], None):
              raise SystemExit('STOCK_FICHA_PILOT_ALIGNMENT_NOT_EXACT:' + json.dumps(alignment, sort_keys=True))
          gap_blockers = set(gap.get('blockingReasons') or [])
          if 'MISSING_COORDINATE:neutralMeaningId' not in gap_blockers:
              raise SystemExit('STOCK_FICHA_PROMOTION_MUST_REMAIN_BLOCKED_ON_NEUTRAL_MEANING')
          extra_missing = sorted(value for value in gap_blockers if value.startswith('MISSING_COORDINATE:') and value != 'MISSING_COORDINATE:neutralMeaningId')
          if extra_missing:
              raise SystemExit('STOCK_FICHA_OTHER_COORDINATES_STILL_MISSING:' + ','.join(extra_missing))

          cobrar = [item for item in projection.get('components', []) if item.get('componentUiId') == 'TB-POS-PAY-COBRAR-BTN-01']
          if len(cobrar) != 1 or cobrar[0].get('targetResolutionStatus') != 'SOURCE_RESOLVED':
              raise SystemExit('COBRAR_GOLDEN_REGRESSION')

          print(json.dumps({
              'stockFichaTrace': trace,
              'stockFichaBlockers': sorted(blockers),
              'promotionBlockers': sorted(gap_blockers),
              'pilotAlignment': alignment,
              'cobrarStatus': cobrar[0].get('targetResolutionStatus'),
          }, indent=2, sort_keys=True))
          PY

      - name: Prove source-only scope and commit repair
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only -- prisma-html apps/terminal-de-venta-system/products/tablet apps/terminal-de-venta-system/products/pc apps/terminal-de-venta-system/products/mobile)"
          changed="$(git diff --name-only; git ls-files --others --exclude-standard)"
          printf '%s\n' "$changed"
          printf '%s\n' "$changed" | grep -Fx 'tools/code-atlas/src/code_atlas/app_map/uimap/runner.py'
          printf '%s\n' "$changed" | grep -Fx 'tools/code-atlas/tests/test_operational_uimap_governed_marker_reconciliation.py'
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | sort -u | wc -l)" -eq 2

          git config user.name 'prisma-uimap-bot'
          git config user.email 'prisma-uimap-bot@users.noreply.github.com'
          git add \
            tools/code-atlas/src/code_atlas/app_map/uimap/runner.py \
            tools/code-atlas/tests/test_operational_uimap_governed_marker_reconciliation.py
          git commit -m 'fix(uimap): reconcile certified governed marker trace'
          git push origin HEAD:agent/prisma-html-three-app-visual-closure
