PAYLOAD
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          raw = ''.join(Path('/tmp/caext_multiagent.b64').read_text().split())
          data = gzip.decompress(base64.b64decode(raw))
          expected = '6046bd87ebfa6061ab4266aec2bfc2d08537299c9fe0a1f9c3a9f8944100461e'
          actual = hashlib.sha256(data).hexdigest()
          if actual != expected:
              raise SystemExit(f'SCRIPT_DIGEST_MISMATCH:{actual}')
          path = Path('.github/scripts/caext_multiagent_replication_v1.py')
          path.write_bytes(data)
          print('PASS_CAEXT_MULTIAGENT_SCRIPT_DECODED', actual)
          PY

      - name: Compile and self-test decoded script
        run: |
          python -m py_compile .github/scripts/caext_multiagent_replication_v1.py
          python .github/scripts/caext_multiagent_replication_v1.py selftest

      - name: Commit script only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/scripts/caext_multiagent_replication_v1.py; then
            echo 'PASS_CAEXT_MULTIAGENT_SCRIPT_ALREADY_COMMITTED'
            exit 0
          fi
          changed="$(git diff --name-only)"
          if [ "$changed" != '.github/scripts/caext_multiagent_replication_v1.py' ]; then
            echo "Unexpected bootstrap diff: $changed"
            exit 1
          fi
          git config user.name 'CAEXT Multiagent Bootstrap'
          git config user.email 'caext-multiagent@example.invalid'
          git add -- .github/scripts/caext_multiagent_replication_v1.py
          git diff --cached --check
          git commit -m 'test(code-atlas): add governed multiagent replication harness'
          git push origin HEAD:verify/caext-multiagent-v1-1508
