name: Code Atlas Copilot Actions Availability Probe

on:
  push:
    branches:
      - 'verify/caext-multiagent-v1-1508'

permissions:
  contents: read
  copilot-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  availability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install and invoke Copilot CLI with GITHUB_TOKEN
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          npm install -g @github/copilot
          copilot --version
          copilot -s --no-ask-user --deny-tool='shell,write,read,url,memory' -p 'Return exactly this JSON object and no other content: {"status":"COPILOT_AVAILABLE"}' | tee copilot-availability.txt
          python - <<'PY'
          import json
          from pathlib import Path
          text = Path('copilot-availability.txt').read_text(encoding='utf-8', errors='replace')
          start = text.find('{')
          if start < 0:
              raise SystemExit('COPILOT_AVAILABILITY_NO_JSON')
          value, _ = json.JSONDecoder().raw_decode(text[start:])
          if value != {'status': 'COPILOT_AVAILABLE'}:
              raise SystemExit(f'COPILOT_AVAILABILITY_BAD_RESPONSE:{value!r}')
          print('PASS_CAEXT_COPILOT_GITHUB_TOKEN_AVAILABLE')
          PY
      - name: Upload availability evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: caext-copilot-actions-availability
          path: copilot-availability.txt
          if-no-files-found: warn
