name: CA Cloud P3 Reanchor Finalizer R3

on:
  push:
    branches:
      - feature/ca-cloud-p3-authority-evidence-r2-2508

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    env:
      BASE_HEAD: 0916227707aa65b673195d554297bf8f8565d356
    steps:
      - name: Checkout P3 branch
        uses: actions/checkout@v6
        with:
          ref: feature/ca-cloud-p3-authority-evidence-r2-2508
          fetch-depth: 0

      - name: Assert exact governed base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_HEAD"
          git merge-base --is-ancestor "$BASE_HEAD" HEAD
          test -z "$(git status --porcelain)"

      - name: Execute the already-reviewed P3 patch payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/ca-cloud-p3-finalize-r2.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(src) if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(src)) if src[i].strip() == 'PY')
          body = src[start:end]
          indent = min((len(line) - len(line.lstrip()) for line in body if line.strip()), default=0)
          payload = '\n'.join(line[indent:] for line in body) + '\n'
          Path('/tmp/p3_patch.py').write_text(payload, encoding='utf-8')
          compile(payload, '/tmp/p3_patch.py', 'exec')
          PY
          python /tmp/p3_patch.py

      - name: Remove both one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/ca-cloud-p3-finalize-r2.yml
          git rm .github/workflows/ca-cloud-p3-finalize-r3.yml

      - name: Assert uncommitted product scope
        shell: bash
        run: |
          set -euo pipefail
          expected=$(printf '%s\n' \
            'apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/config/change_intelligence_cloud.json' \
            'apps/terminal-de-venta-system/docs/productization/PRISMA_CHANGE_INTELLIGENCE_CLOUD_CENTER_VERTICAL_CONTRACT.md' \
            'apps/terminal-de-venta-system/tools/verify-cloud-center-change-intelligence-01.py' | sort)
          actual=$(git diff --name-only | sort)
          test "$actual" = "$expected"
          python -m py_compile apps/terminal-de-venta-system/tools/verify-cloud-center-change-intelligence-01.py
          python -m json.tool 'apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/config/change_intelligence_cloud.json' >/dev/null

      - name: Commit locally before diff-aware verification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat(ca): project Authority Pack and Evidence references"
          actual=$(git diff --name-only "$BASE_HEAD"...HEAD | sort)
          expected=$(printf '%s\n' \
            'apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/config/change_intelligence_cloud.json' \
            'apps/terminal-de-venta-system/docs/productization/PRISMA_CHANGE_INTELLIGENCE_CLOUD_CENTER_VERTICAL_CONTRACT.md' \
            'apps/terminal-de-venta-system/tools/verify-cloud-center-change-intelligence-01.py' | sort)
          test "$actual" = "$expected"
          test -z "$(git status --porcelain)"

      - name: Run diff-aware source verifier on final local commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "$BASE_HEAD"
          python apps/terminal-de-venta-system/tools/verify-cloud-center-change-intelligence-01.py

      - name: Push exact validated P3 head
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:feature/ca-cloud-p3-authority-evidence-r2-2508
