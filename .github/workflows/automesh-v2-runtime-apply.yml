name: AutoMesh v2 Runtime Apply

on:
  push:
    branches:
      - fix/automesh-parallel-v2-1208
    paths:
      - '.github/workflows/automesh-v2-runtime-apply.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  apply-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: fix/automesh-parallel-v2-1208

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Patch runtime and child manifests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{label} anchor missing')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          runtime = Path('tools/code-atlas/src/code_atlas/motors/prisma_automesh_runtime.py')
          replace_once(
              runtime,
              '    env: Mapping[str, str] | None = None,\n) -> dict[str, Any]:',
              '    env: Mapping[str, str] | None = None,\n    cancel_event: threading.Event | None = None,\n) -> dict[str, Any]:',
              'runtime-signature',
          )
          replace_once(
              runtime,
              '        last_output = time.monotonic()\n        reader_done = False\n        try:\n            while True:\n                try:\n                    item = line_queue.get(timeout=0.25)',
              '        last_output = time.monotonic()\n        reader_done = False\n        cancelled = False\n        try:\n            while True:\n                if cancel_event is not None and cancel_event.is_set() and proc.poll() is None and not cancelled:\n                    cancelled = True\n                    log.write("\\n[runtime] cooperative cancellation requested for owned child\\n")\n                    log.flush()\n                    _terminate_process_tree(proc)\n                try:\n                    item = line_queue.get(timeout=0.25)',
              'runtime-cancel-loop',
          )
          replace_once(
              runtime,
              '        returncode = proc.wait()\n        log.write(f"\\n[returncode] {returncode}\\n")',
              '        returncode = proc.wait()\n        try:\n            if proc.stdout is not None:\n                proc.stdout.close()\n        except Exception:\n            pass\n        log.write(f"\\n[returncode] {returncode}\\n")',
              'runtime-stdout-close',
          )
          replace_once(
              runtime,
              '        "cmd": list(command),\n        "pid": proc.pid,\n    }',
              '        "cmd": list(command),\n        "pid": proc.pid,\n        "cancelled": cancelled,\n    }',
              'runtime-return',
          )

          automesh = Path('tools/code-atlas/src/code_atlas/motors/smart_allmesh_automesh.py')
          replace_once(
              automesh,
              '    executor: cf.ThreadPoolExecutor | None = None\n\n    try:\n        _REPORTER.emit(3, "detectando repo")',
              '    executor: cf.ThreadPoolExecutor | None = None\n    repo: Path | None = None\n    git_state: Dict[str, Any] = {}\n\n    try:\n        _REPORTER.emit(3, "detectando repo")',
              'automesh-state',
          )
          replace_once(
              automesh,
              '        _REPORTER.emit(89, "escribiendo matrices y reportes", done=len(layers))\n        write_reports(out_dir, repo, args, surfaces, hits, selected, layers, git_state)\n        run_manifest = {',
              '        _REPORTER.emit(89, "escribiendo matrices y reportes", done=len(layers))\n        write_reports(out_dir, repo, args, surfaces, hits, selected, layers, git_state)\n        required_evidence = [\n            ".governance/current/AUTHORITY_READSET.lock.json",\n            "reports/APP_IMPACT_MATRIX.md",\n            "reports/CONTRACT_AND_GATE_MATRIX.json",\n            "reports/MISSING_OR_UNMAPPED_RISK.md",\n            "reports/AGENT_PROMPT_ENVELOPE.md",\n            "reports/AUTHORITY_MESH_REPORT.md",\n            "reports/LAYERS_MAP.json",\n            "reports/LAYERS_MAP.md",\n        ]\n        evidence_hashes: Dict[str, str] = {}\n        for evidence_rel in required_evidence:\n            evidence_path = out_dir / evidence_rel\n            if not evidence_path.exists() or not evidence_path.is_file():\n                raise RuntimeError(f"REQUIRED_EVIDENCE_MISSING:{evidence_rel}")\n            evidence_hashes[evidence_rel] = sha256(evidence_path).upper()\n        run_manifest = {',
              'automesh-evidence',
          )
          replace_once(
              automesh,
              '            "status": "PASS",\n            "run_id": run_id,\n            "generated_at": _dt.datetime.now().isoformat(),\n            "repo": str(repo),\n            "workers_local_cap": args.workers,',
              '            "status": "PASS",\n            "run_id": run_id,\n            "generated_at": _dt.datetime.now().isoformat(),\n            "task": args.task,\n            "surface_argument": args.surface,\n            "repo": str(repo),\n            "repo_git_head": git_state.get("head", {}).get("stdout", "").strip(),\n            "repo_git_status_sha256": hashlib.sha256(\n                git_state.get("status_short", {}).get("stdout", "").encode("utf-8", errors="replace")\n            ).hexdigest().upper(),\n            "workers_local_cap": args.workers,',
              'automesh-success-manifest',
          )
          replace_once(
              automesh,
              '            "budget_root": str(args.budget_root),\n            "collision_proof_workspace": str(work_root),\n            "atomic_zip_publication": True,',
              '            "budget_root": str(Path(args.budget_root).expanduser().resolve()),\n            "collision_proof_workspace": str(work_root),\n            "atomic_zip_publication": True,\n            "evidence_hashes": evidence_hashes,',
              'automesh-evidence-hashes',
          )
          replace_once(
              automesh,
              '                        "status": status,\n                        "run_id": run_id,\n                        "generated_at": _dt.datetime.now().isoformat(),\n                        "workers_local_cap": args.workers,\n                        "global_worker_budget": 18,\n                        "shards": args.shards,\n                        "budget_root": str(args.budget_root),\n                        "error": error,',
              '                        "status": status,\n                        "run_id": run_id,\n                        "generated_at": _dt.datetime.now().isoformat(),\n                        "task": args.task,\n                        "surface_argument": args.surface,\n                        "repo": str(repo) if repo is not None else "",\n                        "repo_git_head": git_state.get("head", {}).get("stdout", "").strip(),\n                        "workers_local_cap": args.workers,\n                        "global_worker_budget": 18,\n                        "shards": args.shards,\n                        "budget_root": str(Path(args.budget_root).expanduser().resolve()),\n                        "error": error,',
              'automesh-fail-manifest',
          )
          PY

          python -m py_compile \
            tools/code-atlas/src/code_atlas/motors/prisma_automesh_runtime.py \
            tools/code-atlas/src/code_atlas/motors/smart_allmesh_automesh.py \
            tools/code-atlas/src/code_atlas/motors/smart_allmesh_parallel.py \
            tools/code-atlas/tests/test_smart_allmesh_parallel.py
          python tools/code-atlas/src/code_atlas/motors/smart_allmesh_automesh.py --self-test
          PYTHONWARNINGS=error::ResourceWarning python -m unittest -v tools/code-atlas/tests/test_smart_allmesh_parallel.py

      - name: Commit verified non-workflow files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/code-atlas/src/code_atlas/motors/prisma_automesh_runtime.py \
            tools/code-atlas/src/code_atlas/motors/smart_allmesh_automesh.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'fix: add fail-fast and provenance to AutoMesh runtime'
          git push origin HEAD:fix/automesh-parallel-v2-1208
