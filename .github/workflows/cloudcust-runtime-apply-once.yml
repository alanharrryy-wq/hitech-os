name: Cloud Center Customer Runtime Apply Once

on:
  push:
    branches: ['cloudcust-runtime-20260814']
    paths:
      - '.github/workflows/cloudcust-runtime-apply-once.yml'
      - 'apps/terminal-de-venta-system/tools/_cloudcust_patch_part*.txt'
      - 'apps/terminal-de-venta-system/tools/verify-cloud-center-customer-runtime-02.py'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  apply-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}

      - name: Reassemble exact patch
        shell: python
        run: |
          import base64, hashlib, zlib
          from pathlib import Path
          chunks=[]
          for i in range(1,6):
              p=Path(f'apps/terminal-de-venta-system/tools/_cloudcust_patch_part{i}.txt')
              if not p.exists(): raise SystemExit(f'PATCH_PART_MISSING:{i}')
              d=b''.join(p.read_bytes().split()); print(f'PART_{i}_SHA256={hashlib.sha256(d).hexdigest()}'); chunks.append(d)
          patch=zlib.decompress(base64.b64decode(b''.join(chunks),validate=True))
          if not patch.startswith(b'--- a/apps/terminal-de-venta-system/') or b'\x00' in patch or not patch.endswith(b'\n'): raise SystemExit('PATCH_STRUCTURE_INVALID')
          Path('/tmp/cloudcust.patch').write_bytes(patch)
          print(f'PATCH_BYTES={len(patch)} PATCH_SHA256={hashlib.sha256(patch).hexdigest()}')

      - name: Apply exact runtime patch
        shell: bash
        run: |
          set -euo pipefail
          EX1='apps/terminal-de-venta-system/tools/verify-cloud-center-customer-registration-01.py'
          EX2='apps/terminal-de-venta-system/tools/verify-cloud-center-customer-runtime-02.py'
          git apply --check --exclude="$EX1" --exclude="$EX2" /tmp/cloudcust.patch
          git apply --exclude="$EX1" --exclude="$EX2" /tmp/cloudcust.patch

      - name: Make background refresh operator-safe
        shell: python
        run: |
          from pathlib import Path
          p=Path('apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/web/cloud_command_center.js')
          t=p.read_text(encoding='utf-8')
          a='''  function render() {\n    updateChrome();\n    updateSurfaceHeader();\n    const renderer = renderers[state.surface] || renderCommand;\n    $("surfaceRoot").innerHTML = renderer();\n  }\n\n  async function loadAll() {'''
          b='''  function render() {\n    updateChrome();\n    updateSurfaceHeader();\n    const renderer = renderers[state.surface] || renderCommand;\n    $("surfaceRoot").innerHTML = renderer();\n  }\n\n  // Background refresh must never replace the form underneath an operator.\n  function operatorIsInteracting() {\n    const root = $("surfaceRoot");\n    const active = document.activeElement;\n    const focusedControl = !!(root && active && root.contains(active) && active.matches("input, select, textarea, button, [contenteditable='true']"));\n    return focusedControl || !!state.openPicker;\n  }\n\n  function renderAfterRefresh() {\n    if (operatorIsInteracting()) { state.refreshRenderPending = true; return; }\n    state.refreshRenderPending = false;\n    render();\n  }\n\n  async function loadAll() {'''
          if t.count(a)!=1: raise SystemExit(f'RENDER_LOAD_ANCHOR_DRIFT:{t.count(a)}')
          t=t.replace(a,b,1)
          a='''    state.supportCatalog = supportCatalogPayload;\n    state.supportSearch = supportSearchPayload;\n    state.lastLoadedAt = new Date().toLocaleString();\n    render();\n  }'''
          if t.count(a)!=1: raise SystemExit(f'LOAD_RENDER_ANCHOR_DRIFT:{t.count(a)}')
          t=t.replace(a,'''    state.supportCatalog = supportCatalogPayload;\n    state.supportSearch = supportSearchPayload;\n    state.lastLoadedAt = new Date().toLocaleString();\n    renderAfterRefresh();\n  }''',1)
          a='''      const field=event.target.closest("[data-flow-field]");\n      if(field){ state.flow[field.dataset.flowField]=field.value; render(); return; }'''
          if t.count(a)!=1: raise SystemExit(f'INPUT_RENDER_ANCHOR_DRIFT:{t.count(a)}')
          t=t.replace(a,'''      const field=event.target.closest("[data-flow-field]");\n      if(field){ state.flow[field.dataset.flowField]=field.value; return; }''',1)
          a='''    document.addEventListener("click", (event) => {\n      const pickerToggleNode = event.target.closest("[data-picker-toggle]");'''
          if t.count(a)!=1: raise SystemExit(f'CLICK_ANCHOR_DRIFT:{t.count(a)}')
          t=t.replace(a,'''    document.addEventListener("focusout", (event) => {\n      const root = $("surfaceRoot");\n      const next = event.relatedTarget;\n      if (root && next && root.contains(next)) return;\n      setTimeout(() => {\n        if (state.refreshRenderPending && !operatorIsInteracting()) { state.refreshRenderPending = false; render(); }\n      }, 80);\n    });\n    document.addEventListener("click", (event) => {\n      const pickerToggleNode = event.target.closest("[data-picker-toggle]");''',1)
          if t.count('function operatorIsInteracting()')!=1 or t.count('renderAfterRefresh();')!=1: raise SystemExit('OPERATOR_SAFE_REFRESH_INVALID')
          p.write_text(t,encoding='utf-8')
          print('PASS_OPERATOR_SAFE_REFRESH')

      - name: Preserve all captured customer fields across governed renders
        shell: python
        run: |
          from pathlib import Path
          p=Path('apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/web/cloud_command_center.js')
          t=p.read_text(encoding='utf-8')
          anchor='''  function operatorIsInteracting() {\n    const root = $("surfaceRoot");'''
          helper='''  function syncFlowFromDom() {\n    const root = $("surfaceRoot");\n    if (!root) return;\n    root.querySelectorAll("[data-flow-field]").forEach((field) => {\n      const key = field.dataset.flowField || "";\n      if (key) state.flow[key] = field.value;\n    });\n  }\n\n  function operatorIsInteracting() {\n    const root = $("surfaceRoot");'''
          if t.count(anchor)!=1: raise SystemExit(f'FLOW_SYNC_HELPER_ANCHOR_DRIFT:{t.count(anchor)}')
          t=t.replace(anchor,helper,1)

          change='''    document.addEventListener("change", (event) => { const field=event.target.closest("[data-flow-field]"); if(field){ const key=field.dataset.flowField; state.flow[key]=field.value; if(key==="vertical") state.flow.subvertical=""; if(key==="country" && field.value!=="MX") state.flow.state=""; if(key==="deviceType") state.flow.deviceRole=""; if(key==="targetKind") state.flow.targetCode=""; render(); } });'''
          change_new='''    document.addEventListener("change", (event) => { const field=event.target.closest("[data-flow-field]"); if(field){ syncFlowFromDom(); const key=field.dataset.flowField; state.flow[key]=field.value; if(key==="vertical") state.flow.subvertical=""; if(key==="country" && field.value!=="MX") state.flow.state=""; if(key==="deviceType") state.flow.deviceRole=""; if(key==="targetKind") state.flow.targetCode=""; render(); } });'''
          if t.count(change)!=1: raise SystemExit(f'FLOW_CHANGE_ANCHOR_DRIFT:{t.count(change)}')
          t=t.replace(change,change_new,1)

          pick='''      const pickNode = event.target.closest("[data-pick-flow]");\n      if (pickNode) {\n        const field = pickNode.dataset.pickFlow;\n        const value = pickNode.dataset.value || "";\n        if (field) {'''
          pick_new='''      const pickNode = event.target.closest("[data-pick-flow]");\n      if (pickNode) {\n        const field = pickNode.dataset.pickFlow;\n        const value = pickNode.dataset.value || "";\n        syncFlowFromDom();\n        if (field) {'''
          if t.count(pick)!=1: raise SystemExit(f'FLOW_PICK_ANCHOR_DRIFT:{t.count(pick)}')
          t=t.replace(pick,pick_new,1)

          action='''  async function handleAction(action, button) {\n    if (state.busy) return;'''
          action_new='''  async function handleAction(action, button) {\n    syncFlowFromDom();\n    if (state.busy) return;'''
          if t.count(action)!=1: raise SystemExit(f'FLOW_ACTION_ANCHOR_DRIFT:{t.count(action)}')
          t=t.replace(action,action_new,1)

          if t.count('function syncFlowFromDom()')!=1 or t.count('syncFlowFromDom();')!=3:
              raise SystemExit(f'FLOW_SYNC_GUARD_INVALID:{t.count("syncFlowFromDom();")}')
          p.write_text(t,encoding='utf-8')
          print('PASS_FLOW_SNAPSHOT_BEFORE_RENDER_AND_ACTION')

      - name: Validate scope authority and syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          from pathlib import Path
          expected={'apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/py/command_center_store.py','apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/py/prisma_unified_lab_v3.py','apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/web/cloud_command_center.html','apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/web/cloud_command_center.js'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          if changed!=expected: raise SystemExit(f'PATCH_SCOPE_DRIFT:{sorted(changed ^ expected)}')
          js=Path('apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/web/cloud_command_center.js').read_text(encoding='utf-8')
          store=Path('apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/py/command_center_store.py').read_text(encoding='utf-8')
          html=Path('apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/web/cloud_command_center.html').read_text(encoding='utf-8')
          for token in ['FALLBACK_CATALOGS','"suggestedPlan":"starter"','"suggestedPlan":"business"','"suggestedPlan":"enterprise"']:
              if token in js or token in store: raise SystemExit('LEGACY_AUTHORITY_REMAINS:'+token)
          if '<html lang="es-MX">' not in html or 'data-surface="billing">Cobranza<' not in html: raise SystemExit('NAVIGATION_HOMOLOGATION_MISSING')
          if 'cityZone' in js[js.find('function clientWizard'):js.find('function deviceWizard')]: raise SystemExit('CLIENT_CITY_ZONE_LEGACY_VISIBLE')
          if js.count('const actionButtonNode = event.target.closest("[data-action]")') != 1: raise SystemExit('ACTION_DELEGATION_DRIFT')
          if js.count('action === "prepare-client"') != 1: raise SystemExit('PREPARE_CLIENT_ACTION_DRIFT')
          if js.count('function syncFlowFromDom()') != 1: raise SystemExit('FLOW_SNAPSHOT_MISSING')
          print('PASS_EXACT_SCOPE_AUTHORITY_NAV_ACTION_AND_FLOW')
          PY
          python -m json.tool "apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/config/customer_registration_catalogs.canonical.json" >/dev/null
          python -m py_compile "apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/py/customer_registration.py" "apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/py/command_center_store.py" "apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/py/prisma_unified_lab_v3.py" apps/terminal-de-venta-system/tools/verify-cloud-center-customer-registration-01.py apps/terminal-de-venta-system/tools/verify-cloud-center-customer-runtime-02.py
          node --check "apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/web/cloud_command_center.js"
          git diff --check

      - name: Run customer registration behavior suite
        run: python apps/terminal-de-venta-system/tools/verify-cloud-center-customer-registration-01.py --out-dir apps/terminal-de-venta-system/.governance/customer-runtime

      - name: Prepare browser runtime verifier
        run: |
          google-chrome --version
          python -m pip install --disable-pip-version-check --no-input 'playwright==1.54.0'

      - name: Run isolated Cloud Center browser runtime
        run: python apps/terminal-de-venta-system/tools/verify-cloud-center-customer-runtime-02.py --out-dir apps/terminal-de-venta-system/.governance/customer-runtime

      - name: Final cross-surface guard
        shell: python
        run: |
          import subprocess
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          forbidden=('apps/terminal-de-venta-system/products/tablet/','apps/terminal-de-venta-system/products/pc/','apps/terminal-de-venta-system/products/mobile/','apps/terminal-de-venta-system/prisma/','apps/terminal-de-venta-system/cloudflare/')
          bad=[p for p in changed if p.startswith(forbidden) or p.lower().endswith('.css')]
          if bad: raise SystemExit('FORBIDDEN_SCOPE:'+','.join(bad))
          print('PASS_CLOUD_CENTER_CUSTOMER_SCOPE')

      - name: Upload runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: cloud-center-customer-runtime
          if-no-files-found: error
          path: apps/terminal-de-venta-system/.governance/customer-runtime/**

      - name: Commit verified runtime only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PRISMA Customer Runtime Gate'
          git config user.email 'actions@users.noreply.github.com'
          git add -- "apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/py/command_center_store.py" "apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/py/prisma_unified_lab_v3.py" "apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/web/cloud_command_center.html" "apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/web/cloud_command_center.js"
          git diff --cached --check
          git commit -m 'Cloud Center: homologate customer registration runtime'
          git push origin HEAD:cloudcust-runtime-20260814
