name: cloudcust cleanup gate once

on:
  push:
    branches: [cloudcust-runtime-20260814]
    paths: [.github/workflows/cloudcust-cleanup-gate-once.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudcust-runtime-20260814
          fetch-depth: 0
      - name: Patch only the false-positive cleanup validators
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/cloudcust-close-v10.yml')
          s=p.read_text(encoding='utf-8')
          old_cleanup='''          git diff --check\n          bad=$(git status --short | grep -E '(_cloudcust_|cloudcust-source-finalize|cloudcust-runtime-diagnose|cloudcust-click-inspect|cloudcust-runtime-apply-once|cloudcust-final-v9|cloudcust-close-v10)' || true)\n          if [ -n "$bad" ]; then echo "$bad"; echo TEMP_TRANSPORT_REMAINS; exit 1; fi\n          echo PASS_ZERO_TEMP_TRANSPORT\n'''
          new_cleanup='''          git diff --check\n          TEMP_PATHS=(\n            '.github/workflows/cloudcust-click-inspect.yml' '.github/workflows/cloudcust-runtime-apply-once.yml'\n            '.github/workflows/cloudcust-source-finalize.yml' '.github/workflows/cloudcust-source-finalize-v2.yml'\n            '.github/workflows/cloudcust-source-finalize-v3.yml' '.github/workflows/cloudcust-source-finalize-v4.yml'\n            '.github/workflows/cloudcust-source-finalize-v5.yml' '.github/workflows/cloudcust-runtime-diagnose-v6.yml'\n            '.github/workflows/cloudcust-source-finalize-v7.yml' '.github/workflows/cloudcust-source-finalize-v8.yml'\n            '.github/workflows/cloudcust-final-v9.yml' '.github/workflows/cloudcust-close-v10.yml'\n            'apps/terminal-de-venta-system/tools/_cloudcust_patch_part1.txt' 'apps/terminal-de-venta-system/tools/_cloudcust_patch_part2.txt'\n            'apps/terminal-de-venta-system/tools/_cloudcust_patch_part3.txt' 'apps/terminal-de-venta-system/tools/_cloudcust_patch_part4.txt'\n            'apps/terminal-de-venta-system/tools/_cloudcust_patch_part5.txt' 'apps/terminal-de-venta-system/tools/_cloudcust_runtime_patch.zb64'\n            'apps/terminal-de-venta-system/tools/_cloudcust_finalize_source_v2.py'\n          )\n          for item in "${TEMP_PATHS[@]}"; do\n            test ! -e "$item" || { echo "TEMP_STILL_EXISTS:$item"; exit 1; }\n          done\n          echo PASS_ZERO_TEMP_TRANSPORT\n'''
          old_commit='''          git diff --cached --check\n          bad=$(git diff --cached --name-only | grep -E '(_cloudcust_|cloudcust-source-finalize|cloudcust-runtime-diagnose|cloudcust-click-inspect|cloudcust-runtime-apply-once|cloudcust-final-v9|cloudcust-close-v10)' || true)\n          if [ -n "$bad" ]; then echo "$bad"; echo TEMP_FILE_STAGED; exit 1; fi\n          git diff --cached --quiet && { echo NO_FINAL_DIFF; exit 1; }\n'''
          new_commit='''          git diff --cached --check\n          TEMP_PATHS=(\n            '.github/workflows/cloudcust-click-inspect.yml' '.github/workflows/cloudcust-runtime-apply-once.yml'\n            '.github/workflows/cloudcust-source-finalize.yml' '.github/workflows/cloudcust-source-finalize-v2.yml'\n            '.github/workflows/cloudcust-source-finalize-v3.yml' '.github/workflows/cloudcust-source-finalize-v4.yml'\n            '.github/workflows/cloudcust-source-finalize-v5.yml' '.github/workflows/cloudcust-runtime-diagnose-v6.yml'\n            '.github/workflows/cloudcust-source-finalize-v7.yml' '.github/workflows/cloudcust-source-finalize-v8.yml'\n            '.github/workflows/cloudcust-final-v9.yml' '.github/workflows/cloudcust-close-v10.yml'\n            'apps/terminal-de-venta-system/tools/_cloudcust_patch_part1.txt' 'apps/terminal-de-venta-system/tools/_cloudcust_patch_part2.txt'\n            'apps/terminal-de-venta-system/tools/_cloudcust_patch_part3.txt' 'apps/terminal-de-venta-system/tools/_cloudcust_patch_part4.txt'\n            'apps/terminal-de-venta-system/tools/_cloudcust_patch_part5.txt' 'apps/terminal-de-venta-system/tools/_cloudcust_runtime_patch.zb64'\n            'apps/terminal-de-venta-system/tools/_cloudcust_finalize_source_v2.py'\n          )\n          for item in "${TEMP_PATHS[@]}"; do\n            test ! -e "$item" || { echo "TEMP_REAPPEARED:$item"; exit 1; }\n          done\n          tracked_temp=$(git ls-files -- "${TEMP_PATHS[@]}" || true)\n          if [ -n "$tracked_temp" ]; then echo "$tracked_temp"; echo TEMP_PATH_STILL_IN_FINAL_INDEX; exit 1; fi\n          git diff --cached --quiet && { echo NO_FINAL_DIFF; exit 1; }\n'''
          if s.count(old_cleanup)!=1: raise SystemExit(f'CLEANUP_ANCHOR_COUNT:{s.count(old_cleanup)}')
          if s.count(old_commit)!=1: raise SystemExit(f'COMMIT_ANCHOR_COUNT:{s.count(old_commit)}')
          s=s.replace(old_cleanup,new_cleanup,1).replace(old_commit,new_commit,1)
          p.write_text(s,encoding='utf-8')
          print('PASS_CLEANUP_GATE_PATCHED')
          PY
          git diff --check
      - name: Remove one-shot and push patched v10
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PRISMA Cloud Center Bot'
          git config user.email 'prisma-cloud-center-bot@users.noreply.github.com'
          git rm '.github/workflows/cloudcust-cleanup-gate-once.yml'
          git add '.github/workflows/cloudcust-close-v10.yml'
          git diff --cached --check
          git commit -m 'ci(cloud-center): fix final cleanup gate semantics'
          git push origin HEAD:cloudcust-runtime-20260814
          echo "PATCHED_HEAD=$(git rev-parse HEAD)"
