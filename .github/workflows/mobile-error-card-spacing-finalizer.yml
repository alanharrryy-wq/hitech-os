name: PRISMA Mobile Error Card Spacing Finalizer

on:
  push:
    branches: ['fix/mobile-runtime-visual-conformance-3008']

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  BASE_SHA: '0ef7e0c67edac5d0e8166c2b952dd423cbb1841f'
  MOBILE_ROOT: 'apps/terminal-de-venta-system/products/mobile/app'
  BASE_URL: 'http://127.0.0.1:3140'
  OLD_CARRIER_SHA: '3f9ba377d020451932e4a9228b157aadcb95ad3a'
  AUTH_REQUEST_DIGEST: 'cd5785ab6ecf414ed1961e72001a13f2fc4fbd09536e72f96b53770120bf5d09'
  AUTH_ARTIFACT_DIGEST: 'fccdc063ab26b6a7bcaa3bdca970086ad886a1a951a4f05225d04eb5b1e9dd92'
  ANTI_REWORK_DIGEST: '615d5e97807fb7838936bf581c9dab1c4c783b5be3aa5bf3daa1702802b53361'

jobs:
  finalizer:
    if: >-
      github.event.head_commit.message == 'test(mobile): stage error card spacing finalizer'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Fail closed on exact base, prior repair and fresh authority
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git merge-base --is-ancestor 55e4e2de74c121c6e1b268f9206a4fa746bb7cf8 HEAD
          E="$RUNNER_TEMP/mobile-spacing-final"
          mkdir -p "$E/screenshots"
          cat > "$RUNNER_TEMP/spacing-anti-rework.request.json" <<JSON
          {
            "schemaVersion":"prisma.factory-ledger.anti-rework-gate.v1",
            "mode":"MUTATION",
            "expectedHead":"$BASE_SHA",
            "task":"Repair only the remaining runtime-evidenced PRISMA Mobile /prisma-app HTTP-503 recovery-card label/title spacing defect using selector-level CSS on errorSignalGrid article children; preserve copy, actions, single-column layout and every other Mobile screen.",
            "capabilities":[{"id":"mobile.interface_specification_canon","requestedAction":"ADVANCE"}],
            "authorityMesh":{"status":"PASS_COMPOSED_AUTHORITY_MESH","repoHead":"$BASE_SHA","requiredAuthorityCoveragePct":100,"blockers":0,"requestDigest":"$AUTH_REQUEST_DIGEST","artifactDigest":"$AUTH_ARTIFACT_DIGEST","layerMapPresent":true},
            "visualMutation":true
          }
          JSON
          git worktree add --detach "$RUNNER_TEMP/spacing-authority-base" "$BASE_SHA"
          (cd "$RUNNER_TEMP/spacing-authority-base" && python "PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py" --request "$RUNNER_TEMP/spacing-anti-rework.request.json" > "$E/anti-rework.recheck.json")
          git worktree remove "$RUNNER_TEMP/spacing-authority-base" --force
          python - "$E/anti-rework.recheck.json" "$ANTI_REWORK_DIGEST" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          assert d.get('result')=='PASS_ANTI_REWORK_GATE',d
          assert d.get('errors')==[],d
          assert d.get('decisionDigest')==sys.argv[2],(d.get('decisionDigest'),sys.argv[2])
          PY

      - name: Apply exact recovery-card spacing repair
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/terminal-de-venta-system/products/mobile/app/src/components/prisma-app/prisma-mobile-dashboard.module.css')
          text=p.read_text(encoding='utf-8')
          anchor='.errorSignalGrid {\n  grid-template-columns: minmax(0, 1fr);\n}\n\n'
          addition='.errorSignalGrid article {\n  display: grid;\n  gap: 5px;\n}\n\n'
          if addition in text:
              raise SystemExit('ERROR_CARD_SPACING_ALREADY_PRESENT')
          if text.count(anchor)!=1:
              raise SystemExit(f'ERROR_SIGNAL_GRID_ANCHOR_COUNT_{text.count(anchor)}')
          p.write_text(text.replace(anchor,anchor+addition,1),encoding='utf-8')
          PY
          test -z "$(git diff --check)"
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" = 1
          test "${changed[0]}" = "$MOBILE_ROOT/src/components/prisma-app/prisma-mobile-dashboard.module.css"
          git diff -- "$MOBILE_ROOT" > "$RUNNER_TEMP/mobile-spacing-final/spacing-fix.patch"

      - name: Commit exact spacing repair
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$MOBILE_ROOT/src/components/prisma-app/prisma-mobile-dashboard.module.css"
          git commit -m 'fix(mobile): separate error recovery card content'
          git push origin HEAD:fix/mobile-runtime-visual-conformance-3008
          git rev-parse HEAD | tee "$RUNNER_TEMP/mobile-spacing-final/fix-sha.txt"

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Run Mobile source gates and build
        id: static
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/mobile-spacing-final"
          npm install --global pnpm@9.15.0
          pnpm install --frozen-lockfile --ignore-scripts
          cd "$MOBILE_ROOT"
          npm install --ignore-scripts --no-package-lock --legacy-peer-deps
          cd "$GITHUB_WORKSPACE"
          pnpm -C "$MOBILE_ROOT" run verify:interface-canon | tee "$E/verify-interface-canon.log"
          pnpm -C "$MOBILE_ROOT" run verify:premium-navigation | tee "$E/verify-premium-navigation.log"
          pnpm -C "$MOBILE_ROOT" run verify:data-readiness | tee "$E/verify-data-readiness.log"
          pnpm -C "$MOBILE_ROOT" run verify:source-states | tee "$E/verify-source-states.log"
          pnpm -C "$MOBILE_ROOT" run verify:zero-important | tee "$E/verify-zero-important.log"
          pnpm -C "$MOBILE_ROOT" run typecheck | tee "$E/typecheck.log"
          pnpm -C "$MOBILE_ROOT" run build | tee "$E/build.log"
          find "$MOBILE_ROOT" -maxdepth 1 -type d -name 'zero-important-gate *' -prune -exec rm -rf {} +
          rm -rf "$MOBILE_ROOT/.next"

      - name: Install isolated browser harness
        id: browser
        shell: bash
        run: |
          set -euo pipefail
          PW="$RUNNER_TEMP/mobile-pw-spacing"
          mkdir -p "$PW"; cd "$PW"; npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.0 axe-core@4.10.3
          npx playwright install --with-deps chromium

      - name: Start only runner-owned Mobile runtime
        id: server
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/mobile-spacing-final"
          (cd "$MOBILE_ROOT" && nohup ./node_modules/.bin/next dev --webpack -H 127.0.0.1 -p 3140 >"$E/mobile-dev.log" 2>&1 & echo $! > "$RUNNER_TEMP/mobile.pid")
          for i in $(seq 1 90); do if curl -fsS "$BASE_URL/prisma-app" >/dev/null 2>&1; then exit 0; fi; sleep 1; done
          cat "$E/mobile-dev.log"; exit 1

      - name: Materialize corrected immutable full runtime verifier
        id: materialize
        shell: bash
        run: |
          set -euo pipefail
          PW="$RUNNER_TEMP/mobile-pw-spacing"
          curl -fsSL "https://raw.githubusercontent.com/prismahitech/hitech-os/$OLD_CARRIER_SHA/.github/workflows/mobile-runtime-visual-verify-carrier.yml" -o "$RUNNER_TEMP/old-carrier.yml"
          python - "$RUNNER_TEMP/old-carrier.yml" "$PW/verify.mjs" <<'PY'
          import sys
          src=open(sys.argv[1],encoding='utf-8').read(); marker="cat > \"$RUNNER_TEMP/mobile-pw/verify.mjs\" <<'JS'\n"; start=src.index(marker)+len(marker); end=src.index('\n          JS\n',start)
          lines=[line[10:] if line.startswith('          ') else line for line in src[start:end].splitlines()]; out=[]; c={'labels':0,'first':0,'active':0,'loop':0,'tab':0}
          for line in lines:
              if 'async function tabLabels(page)' in line: out.append(line[:len(line)-len(line.lstrip())]+"async function tabLabels(page) { return (await page.locator('[role=\"tab\"] > span').allTextContents()).map(clean); }"); c['labels']+=1; continue
              if "const first = page.getByRole('tab'" in line: out.append(line[:len(line)-len(line.lstrip())]+"const first = page.locator('#prisma-mobile-tab-inicio');"); c['first']+=1; continue
              if 'document.activeElement?.textContent' in line: out.append(line.replace('document.activeElement?.textContent',"document.activeElement?.querySelector('span')?.textContent")); c['active']+=1; continue
              if 'for (const label of EXPECTED) {' in line: out.append(line[:len(line)-len(line.lstrip())]+"const TAB_IDS = { Inicio: 'inicio', Ventas: 'ventas', 'Operación': 'operacion', Licencias: 'licencias', Alertas: 'alertas', Stock: 'stock', Sistema: 'sistema' };"); out.append(line); c['loop']+=1; continue
              if "const tab = page.getByRole('tab', { name: label, exact: true });" in line: out.append(line[:len(line)-len(line.lstrip())]+"const tab = page.locator(`#prisma-mobile-tab-${TAB_IDS[label]}`);"); c['tab']+=1; continue
              out.append(line)
          assert c['labels']==1 and c['first']==1 and c['loop']==1 and c['tab']==1 and c['active']>=3,c
          open(sys.argv[2],'w',encoding='utf-8').write('\n'.join(out)+'\n')
          PY
          node --check "$PW/verify.mjs"

      - name: Run full runtime conformance and spacing guard
        id: visual
        shell: bash
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/mobile-spacing-final
        run: |
          set -euo pipefail
          PW="$RUNNER_TEMP/mobile-pw-spacing"; cd "$PW"; node verify.mjs
          cat > spacing-guard.mjs <<'JS'
          import { chromium } from 'playwright'; import fs from 'node:fs'; import path from 'node:path';
          const BASE=process.env.BASE_URL,OUT=process.env.EVIDENCE_DIR; const result={viewports:[],failures:[]}; const browser=await chromium.launch({headless:true});
          for(const vp of [{name:'phone390',width:390,height:844},{name:'phone430',width:430,height:932}]){
            const c=await browser.newContext({viewport:{width:vp.width,height:vp.height},reducedMotion:'reduce'}); await c.route('**/api/mobile/snapshot',r=>r.fulfill({status:503,contentType:'application/json',body:'{"ok":false,"error":{"code":"FIXTURE_503"}}'})); const p=await c.newPage(); await p.goto(`${BASE}/prisma-app`,{waitUntil:'domcontentloaded'}); await p.waitForSelector('[data-prisma-state="error"]',{timeout:15000});
            const m=await p.locator('[aria-label="Que puede hacer el usuario ahora"]').evaluate(grid=>{const gs=getComputedStyle(grid);const cards=[...grid.querySelectorAll(':scope > article')];return{columns:gs.gridTemplateColumns.split(' ').filter(Boolean).length,overflow:grid.scrollWidth>grid.clientWidth+1,cards:cards.map(card=>{const r=card.getBoundingClientRect();const kids=[...card.children].map(x=>{const q=x.getBoundingClientRect();return{tag:x.tagName,y:q.y,bottom:q.bottom,text:x.textContent}});return{width:r.width,overflow:card.scrollWidth>card.clientWidth+1,display:getComputedStyle(card).display,rowGap:getComputedStyle(card).rowGap,kids}})}});
            if(m.columns!==1||m.overflow||m.cards.length!==3)result.failures.push({vp:vp.name,kind:'grid',m});
            for(const [i,card] of m.cards.entries()){if(card.overflow||card.width<300||card.display!=='grid')result.failures.push({vp:vp.name,kind:'card',i,card}); if(card.kids.length<3)result.failures.push({vp:vp.name,kind:'children',i,card}); for(let k=1;k<card.kids.length;k++){if(card.kids[k].y<=card.kids[k-1].bottom)result.failures.push({vp:vp.name,kind:'separation',i,k,card});}}
            await p.screenshot({path:path.join(OUT,'screenshots',`${vp.name}-error-spacing-final.png`),fullPage:true}); result.viewports.push({vp,m}); await c.close();
          }
          await browser.close(); fs.writeFileSync(path.join(OUT,'ERROR_CARD_SPACING.json'),JSON.stringify(result,null,2)); console.log(JSON.stringify(result,null,2)); if(result.failures.length)process.exit(1);
          JS
          node spacing-guard.mjs
          python - "$EVIDENCE_DIR/RESULT.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8')); assert d.get('verdict')=='PASS_MOBILE_RUNTIME_VISUAL_CONFORMANCE_ISOLATED',d.get('hardFailures'); assert not d.get('hardFailures'); assert all(not r.get('violations') for r in d.get('accessibility',[])),d.get('accessibility')
          PY

      - name: Prove final product diff and rollback
        id: guard
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/mobile-spacing-final"
          find "$MOBILE_ROOT" -maxdepth 1 -type d -name 'zero-important-gate *' -prune -exec rm -rf {} + 2>/dev/null || true
          rm -rf "$MOBILE_ROOT/.next" 2>/dev/null || true
          mapfile -t p < <(git diff --name-only "$BASE_SHA"..HEAD -- "$MOBILE_ROOT")
          test "${#p[@]}" = 3
          printf '%s\n' "${p[@]}" > "$E/product-files.txt"
          git diff "$BASE_SHA"..HEAD -- "$MOBILE_ROOT" > "$E/final-product.diff"
          printf '{"rollbackBase":"%s","fixHead":"%s","mainMutated":false,"beforeMerge":"close PR","afterMerge":"revert merge commit; never reset protected main"}\n' "$BASE_SHA" "$(git rev-parse HEAD)" > "$E/ROLLBACK.json"

      - name: Stop runner-owned Mobile
        if: always()
        shell: bash
        run: |
          set +e; if [ -f "$RUNNER_TEMP/mobile.pid" ]; then kill "$(cat "$RUNNER_TEMP/mobile.pid")" 2>/dev/null || true; fi; exit 0

      - name: Upload final spacing evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-error-card-spacing-final-${{ github.run_id }}
          path: ${{ runner.temp }}/mobile-spacing-final/**
          if-no-files-found: error
          retention-days: 14

      - name: Remove disposable finalizer after PASS
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/mobile-error-card-spacing-finalizer.yml
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(mobile): remove error card spacing finalizer'
          git push origin HEAD:fix/mobile-runtime-visual-conformance-3008
