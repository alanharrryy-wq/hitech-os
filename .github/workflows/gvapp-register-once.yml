name: PRISMA GVAE V1 Canonical Registration Once

on:
  push:
    branches:
      - gov/generic-visual-application-engine-v1-3108

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout registration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: gov/generic-visual-application-engine-v1-3108

      - name: Fail closed unless canonical main is unchanged
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          ACTUAL_MAIN="$(git rev-parse origin/main)"
          EXPECTED_MAIN="0400c7cbc307d156a0c5cd0e10b253deac9bf318"
          test "$ACTUAL_MAIN" = "$EXPECTED_MAIN"

      - name: Register canonical capability and evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          ledger_path = Path('PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER.json')
          evidence_path = Path('PRISMA Factory Ledger/PRISMA_EVIDENCE_INDEX.json')

          ledger = json.loads(ledger_path.read_text(encoding='utf-8'))
          evidence = json.loads(evidence_path.read_text(encoding='utf-8'))

          capability_id = 'visual.generic_application_engine_v1'
          matches = [row for row in ledger.get('capabilities', []) if row.get('id') == capability_id]
          if len(matches) > 1:
              raise SystemExit('BLOCKED_DUPLICATE_CAPABILITY')

          capability = {
              'id': capability_id,
              'displayName': 'PRISMA Generic Visual Application Engine V1 and generated Visual Target Index',
              'domain': 'visual',
              'surfaces': ['prisma-html','tablet','pc','mobile','web','chart-lab','control-center','shared-ui','governance','quality'],
              'classification': 'BUILD',
              'status': 'NOT_STARTED',
              'stateLabel': 'GENERIC_VISUAL_APPLICATION_ENGINE_V1_REGISTERED_BUILD_NOT_STARTED',
              'doNotRebuild': False,
              'nextGate': 'On exact current main, run the universal anti-rework PROPOSAL gate for visual.generic_application_engine_v1, obtain a fresh task-exact Authority Mesh with mandatory Layer Map covering only the authorized prisma-html engine/target-index/contracts/tests/CI/docs scope, then run the anti-rework MUTATION gate before any source or visual-authority write.',
              'evidence': [
                  'Governance preflight issue #513 and draft registration PR #514',
                  'PRISMA Remote AutoMesh run 33416410140 artifact 9767220861; PASS_COMPOSED_AUTHORITY_MESH at main 0400c7cbc307d156a0c5cd0e10b253deac9bf318; requestDigest efab1ba6c1276b4b8abea0290bde2ba2c57d3dcc8a52b50da634a7887be9d2fd; composed artifact sha256 33908c0bfc2e200483d0601f2302aea95f227c96b840b1954ea5eee0233f6a8d',
                  'Existing frozen visual foundations reused by design: Code Atlas UI Bridge read-only guard, visual.atlasfin.tablet_pos_cobrar golden transaction, NDC, RIFAT/prisma-ui, Identity Dictionary, Visual Source Manifest, Visual Core and Change Assurance'
              ],
              'doesNotProve': [
                  'Generic Visual Application Engine V1 source implementation exists or passes tests',
                  'Generated Visual Target Index exists, is complete or is deterministic',
                  'Any CSS, CSS Module, JSON token or projection writer is implemented',
                  'Cobrar parity, idempotency, rollback or negative-test certification',
                  'Any source application or product projection has occurred',
                  'Any runtime visual certification for Tablet, PC, Mobile, Web, Chart Lab, Control Center or Shared UI',
                  'Hosted production, distribution or customer deployment readiness'
              ],
              'allowedActions': [
                  'reuse all already-certified visual authority and census foundations',
                  'perform the next exact anti-rework and Authority Mesh gates for the bounded V1 build',
                  'build the generic engine only under prisma-html with declarative authority consumption',
                  'generate the target index from existing machine-readable census/authority evidence',
                  'add source/static CI and golden Cobrar parity without deleting the certified historical runner'
              ],
              'forbiddenActions': [
                  'mutate prisma-html or product visual source before the fresh exact MUTATION gate passes',
                  'turn Code Atlas UI Bridge into a generic writer',
                  'turn Atlasfin browser UI into a product writer',
                  'manually edit generated product projections',
                  'invent missing target, binding, layer, neutral meaning or projection authority',
                  'use !important as an application mechanism',
                  'claim runtime visual certification from static/source evidence'
              ]
          }

          if not matches:
              ledger.setdefault('capabilities', []).append(capability)
          elif matches[0] != capability:
              raise SystemExit('BLOCKED_CONFLICTING_EXISTING_CAPABILITY')
          ledger['updatedAt'] = '2026-08-31T17:00:00Z'

          artifact_name = 'PR #514 / PRISMA Remote AutoMesh 33416410140 artifact 9767220861'
          artifact = {
              'artifact': artifact_name,
              'type': 'generic_visual_application_engine_v1_capability_registration_authority',
              'scope': ['factory_ledger','governance','prisma-html','visual_application'],
              'status': 'PASS_REGISTRATION_AUTHORITY_ONLY',
              'proves': [
                  'The missing Generic Visual Application Engine V1 capability was classified for canonical Factory Ledger registration on exact main 0400c7cbc307d156a0c5cd0e10b253deac9bf318',
                  'Task-exact composed Authority Mesh passed with governance scope, mandatory Layer Map, 100% required authority coverage and zero blockers',
                  'The registration preserves Code Atlas UI Bridge as read-only and preserves certified Cobrar evidence as a golden reference'
              ],
              'doesNotProve': [
                  'Engine implementation, target-index generation, writers, schemas or CI exist',
                  'Anti-rework PROPOSAL or MUTATION has passed for the newly registered BUILD capability',
                  'Cobrar parity, rollback, idempotency or native negative tests',
                  'Any product/source/runtime visual mutation',
                  'Any runtime visual or production certification'
              ]
          }
          artifact_matches = [row for row in evidence.get('artifacts', []) if row.get('artifact') == artifact_name]
          if len(artifact_matches) > 1:
              raise SystemExit('BLOCKED_DUPLICATE_EVIDENCE_ARTIFACT')
          if not artifact_matches:
              evidence.setdefault('artifacts', []).append(artifact)
          elif artifact_matches[0] != artifact:
              raise SystemExit('BLOCKED_CONFLICTING_EVIDENCE_ARTIFACT')

          entry = {
              'capabilityId': capability_id,
              'status': 'BUILD_NOT_STARTED',
              'runId': '33416410140',
              'evidence': [
                  'artifact 9767220861',
                  'requestDigest efab1ba6c1276b4b8abea0290bde2ba2c57d3dcc8a52b50da634a7887be9d2fd',
                  'composed sha256 33908c0bfc2e200483d0601f2302aea95f227c96b840b1954ea5eee0233f6a8d',
                  'issue #513',
                  'PR #514'
              ]
          }
          entry_matches = [row for row in evidence.get('entries', []) if row.get('capabilityId') == capability_id]
          if len(entry_matches) > 1:
              raise SystemExit('BLOCKED_DUPLICATE_EVIDENCE_ENTRY')
          if not entry_matches:
              evidence.setdefault('entries', []).append(entry)
          elif entry_matches[0] != entry:
              raise SystemExit('BLOCKED_CONFLICTING_EVIDENCE_ENTRY')
          evidence['updatedAt'] = '2026-08-31T17:00:00Z'

          ledger_path.write_text(json.dumps(ledger, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          evidence_path.write_text(json.dumps(evidence, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          # Native fail-closed checks for the registration transaction.
          ledger2 = json.loads(ledger_path.read_text(encoding='utf-8'))
          evidence2 = json.loads(evidence_path.read_text(encoding='utf-8'))
          resolved = [row for row in ledger2['capabilities'] if row.get('id') == capability_id]
          assert len(resolved) == 1
          assert resolved[0]['classification'] == 'BUILD'
          assert resolved[0]['status'] == 'NOT_STARTED'
          assert resolved[0]['doNotRebuild'] is False
          assert any(row.get('artifact') == artifact_name for row in evidence2['artifacts'])
          assert any(row.get('capabilityId') == capability_id for row in evidence2['entries'])
          PY

      - name: Remove one-shot carrier and workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/prisma-carriers/generic-visual-application-engine-v1.md
          git rm -f .github/workflows/gvapp-register-once.yml

      - name: Validate and push registration commit
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool 'PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER.json' >/dev/null
          python -m json.tool 'PRISMA Factory Ledger/PRISMA_EVIDENCE_INDEX.json' >/dev/null
          git diff --check
          git config user.name 'prisma-governance-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER.json' 'PRISMA Factory Ledger/PRISMA_EVIDENCE_INDEX.json'
          git status --short
          git commit -m 'governance: register Generic Visual Application Engine V1'
          git push origin HEAD:gov/generic-visual-application-engine-v1-3108
