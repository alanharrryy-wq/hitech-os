name: Repair Tablet POS Atlasfin Composition Carrier

on:
  push:
    branches:
      - feat/tablet-pos-atlasfin-composition-governed

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  repair-and-retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact governed branch
        uses: actions/checkout@v6
        with:
          ref: feat/tablet-pos-atlasfin-composition-governed
          fetch-depth: 0

      - name: Lock authorized main and carrier-only history
        shell: bash
        run: |
          set -euo pipefail
          expected_main='bef71b7d092ef43580498988b09c1d56fd0ff474'
          git fetch origin main
          actual_main="$(git rev-parse origin/main)"
          echo "EXPECTED_MAIN=$expected_main"
          echo "ACTUAL_MAIN=$actual_main"
          test "$actual_main" = "$expected_main" || { echo "STALE_AUTHORITY_MAIN_MOVED:$actual_main:$expected_main"; exit 41; }
          mapfile -t changed < <(git diff --name-only "$expected_main"..HEAD)
          printf 'CARRIER_DIFF=%s\n' "${changed[*]}"
          for file in "${changed[@]}"; do
            case "$file" in
              '.github/workflows/tablet-pos-atlasfin-composition-apply.yml'|'.github/workflows/tablet-pos-atlasfin-composition-repair.yml') ;;
              *) echo "CARRIER_HISTORY_CONTAMINATION:$file"; exit 42 ;;
            esac
          done

      - name: Harden retry semantics and clean verifier report debris
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/tablet-pos-atlasfin-composition-apply.yml')
          lines = path.read_text(encoding='utf-8').splitlines()

          parent_hits = [i for i, line in enumerate(lines) if 'CARRIER_PARENT_NOT_AUTHORIZED_MAIN' in line]
          if len(parent_hits) != 1:
              raise SystemExit(f'CARRIER_PARENT_GUARD_HITS:{parent_hits}')
          i = parent_hits[0]
          indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
          replacement = [
              indent + 'mapfile -t carrier_diff < <(git diff --name-only "$expected_main"..HEAD)',
              indent + 'printf \'CARRIER_DIFF=%s\\n\' "${carrier_diff[*]}"',
              indent + 'for file in "${carrier_diff[@]}"; do',
              indent + '  case "$file" in',
              indent + "    '.github/workflows/tablet-pos-atlasfin-composition-apply.yml'|'.github/workflows/tablet-pos-atlasfin-composition-repair.yml') ;;",
              indent + '    *) echo "CARRIER_HISTORY_CONTAMINATION:$file"; exit 42 ;;',
              indent + '  esac',
              indent + 'done',
          ]
          lines[i:i+1] = replacement

          gate_hits = [i for i, line in enumerate(lines) if line.strip() == 'node tools/quality/verify-zero-important.mjs --mode repo-tree --format text']
          if len(gate_hits) != 1:
              raise SystemExit(f'ZERO_IMPORTANT_GATE_HITS:{gate_hits}')
          j = gate_hits[0]
          gate_indent = lines[j][:len(lines[j]) - len(lines[j].lstrip())]
          cleanup = gate_indent + "find . -maxdepth 1 -type d -name 'zero-important-gate *' -print -exec rm -rf -- {} +"
          if cleanup not in lines:
              lines.insert(j + 1, cleanup)

          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print('PASS_CARRIER_REPAIR')
          PY
          git diff --check

      - name: Retire repair carrier and push hardened one-shot runner
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/tablet-pos-atlasfin-composition-repair.yml
          git add .github/workflows/tablet-pos-atlasfin-composition-apply.yml .github/workflows/tablet-pos-atlasfin-composition-repair.yml
          mapfile -t staged < <(git diff --cached --name-only)
          printf 'STAGED=%s\n' "${staged[*]}"
          for file in "${staged[@]}"; do
            case "$file" in
              '.github/workflows/tablet-pos-atlasfin-composition-apply.yml'|'.github/workflows/tablet-pos-atlasfin-composition-repair.yml') ;;
              *) echo "REPAIR_SCOPE_VIOLATION:$file"; exit 51 ;;
            esac
          done
          git diff --cached --check
          git config user.name 'PRISMA Governed Carrier'
          git config user.email 'governance@local.invalid'
          git commit -m 'ci(tablet): harden governed POS composition carrier retry'
          git push origin HEAD:feat/tablet-pos-atlasfin-composition-governed
