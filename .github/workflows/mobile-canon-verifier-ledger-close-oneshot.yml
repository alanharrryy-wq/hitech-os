name: Mobile Canon Verifier Ledger Close One-shot

on:
  push:
    branches:
      - governance/mobile-canon-verifier-close-2808

permissions:
  contents: write

jobs:
  close-ledger:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_BASE: 28b7d782906003e2ac399ae89d81e824d3268d53
      BRANCH: governance/mobile-canon-verifier-close-2808
    steps:
      - name: Checkout closure branch
        uses: actions/checkout@v6
        with:
          ref: governance/mobile-canon-verifier-close-2808
          fetch-depth: 0

      - name: Fail closed on main drift
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE"
          test "$(git merge-base HEAD origin/main)" = "$EXPECTED_BASE"

      - name: Update canonical evidence only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          lp = Path('PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER.json')
          ep = Path('PRISMA Factory Ledger/PRISMA_EVIDENCE_INDEX.json')
          cid = 'mobile.interface_specification_canon'

          ledger = json.loads(lp.read_text(encoding='utf-8'))
          caps = [x for x in ledger.get('capabilities', []) if x.get('id') == cid]
          if len(caps) != 1:
              raise SystemExit(f'expected one {cid}, got {len(caps)}')
          cap = caps[0]
          if (cap.get('classification'), cap.get('status'), cap.get('doNotRebuild')) != ('DONE', 'SOURCE_READY', True):
              raise SystemExit('unexpected canonical capability state')
          if 'Reconcile legacy Mobile verifiers' not in str(cap.get('nextGate', '')):
              raise SystemExit('expected stale verifier nextGate is absent; refusing blind rewrite')

          cap['stateLabel'] = 'PASS_MOBILE_INTERFACE_CANON_VERIFIERS_RECONCILED_SOURCE_READY'
          cap['nextGate'] = (
              'Run a separate runtime/visual conformance VERIFY against the canonical seven-section /prisma-app interface under fresh '
              'task-exact authority. Do not mutate Mobile product source unless runtime/visual evidence demonstrates a real defect. '
              'Hosted production, PWA/offline operational data, signed-session auth, customer setup, sync, licensing, data-custody and '
              'zero-egress certification remain separate gates.'
          )
          for item in [
              'PR #424 Mobile verifier reconciliation merge 28b7d782906003e2ac399ae89d81e824d3268d53',
              'Final V4 certification run 33148746934 artifact 9676872731 sha256:afb6f28c01a7991f862fbfe87aff509b5e8a84d5d5e72327f420f1bfe2f88a48',
              'Post-merge governance close run 33149246082 artifact 9677044001 sha256:f1381c6779c55e758db0da1ad8b0db4b82466c24c029d59f9762d9fbc01f7c01',
              'PR #424 V4 PASS: fresh Authority Mesh, Factory Ledger MUTATION gate, canonical/current Mobile technical gates, Mobile typecheck and production build'
          ]:
              if item not in cap.setdefault('evidence', []):
                  cap['evidence'].append(item)
          if 'Legacy Mobile verifier alignment' in cap.setdefault('doesNotProve', []):
              cap['doesNotProve'].remove('Legacy Mobile verifier alignment')
          stale_action = 'reconcile stale Mobile verifier expectations in a separate bounded quality/tooling task under fresh authority'
          if stale_action in cap.setdefault('allowedActions', []):
              i = cap['allowedActions'].index(stale_action)
              cap['allowedActions'][i] = 're-run verifier reconciliation only after evidence-backed canon/verifier drift under fresh authority'

          index = json.loads(ep.read_text(encoding='utf-8'))
          artifacts = index.get('artifacts')
          entries = index.get('entries')
          if not isinstance(artifacts, list) or not isinstance(entries, list):
              raise SystemExit('Evidence Index structure missing artifacts/entries lists')

          artifact_name = 'PR #424 Mobile verifier reconciliation + V4 + post-merge governance close'
          if not any(isinstance(a, dict) and a.get('artifact') == artifact_name for a in artifacts):
              artifacts.append({
                  'artifact': artifact_name,
                  'type': 'mobile_interface_verifier_reconciliation',
                  'scope': ['mobile', 'governance', 'quality', 'verifiers'],
                  'status': 'PASS_SOURCE_READY_VERIFIERS_RECONCILED',
                  'proves': [
                      'Legacy Mobile verifier expectations that conflicted with the canonical seven-section interface were reconciled without remounting dormant historical UI',
                      'The active iteration-41 MultiContext specification and verifier entrypoints are absent while historical archive evidence remains preserved',
                      'The canonical Mobile interface verifier and current focused Mobile technical gates passed',
                      'Mobile typecheck and production build passed after installing dependencies from the correct terminal workspace',
                      'Fresh post-merge Authority Mesh and Factory Ledger MUTATION gate passed against main@28b7d782906003e2ac399ae89d81e824d3268d53'
                  ],
                  'doesNotProve': [
                      'Runtime or visual conformance certification',
                      'Hosted production readiness, PWA runtime or offline operational-data capability',
                      'Signed-session auth, customer setup, sync, licensing, data-custody or zero-egress certification',
                      'Dormant historical interfaces should be remounted'
                  ],
                  'evidence': [
                      'PR #424 merge 28b7d782906003e2ac399ae89d81e824d3268d53',
                      'V4 run 33148746934 artifact 9676872731 sha256:afb6f28c01a7991f862fbfe87aff509b5e8a84d5d5e72327f420f1bfe2f88a48',
                      'post-merge run 33149246082 artifact 9677044001 sha256:f1381c6779c55e758db0da1ad8b0db4b82466c24c029d59f9762d9fbc01f7c01'
                  ]
              })

          matches = [x for x in entries if isinstance(x, dict) and x.get('capabilityId') == cid]
          if len(matches) != 1:
              raise SystemExit(f'expected one Evidence Index entry for {cid}, got {len(matches)}')
          entry = matches[0]
          entry['status'] = 'SOURCE_READY'
          entry['runId'] = 'PR424_MOBILE_VERIFIER_RECONCILIATION_SOURCE_READY'
          for item in [
              'PR #424 merge 28b7d782906003e2ac399ae89d81e824d3268d53',
              'V4 run 33148746934 artifact 9676872731',
              'post-merge close run 33149246082 artifact 9677044001'
          ]:
              if item not in entry.setdefault('evidence', []):
                  entry['evidence'].append(item)

          lp.write_text(json.dumps(ledger, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          ep.write_text(json.dumps(index, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python -m json.tool 'PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER.json' >/dev/null
          python -m json.tool 'PRISMA Factory Ledger/PRISMA_EVIDENCE_INDEX.json' >/dev/null

      - name: Commit exact two-file final tree
        shell: bash
        run: |
          set -euo pipefail
          git rm '.github/workflows/mobile-canon-verifier-ledger-close-oneshot.yml'
          git add 'PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER.json' 'PRISMA Factory Ledger/PRISMA_EVIDENCE_INDEX.json'
          mapfile -t staged < <(git diff --cached --name-only | sort)
          mapfile -t wanted < <(printf '%s\n' \
            '.github/workflows/mobile-canon-verifier-ledger-close-oneshot.yml' \
            'PRISMA Factory Ledger/PRISMA_EVIDENCE_INDEX.json' \
            'PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER.json' | sort)
          test "$(printf '%s\n' "${staged[@]}")" = "$(printf '%s\n' "${wanted[@]}")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'governance(mobile): record verifier reconciliation closure'
          mapfile -t final_diff < <(git diff --name-only "$EXPECTED_BASE"..HEAD | sort)
          mapfile -t wanted_final < <(printf '%s\n' \
            'PRISMA Factory Ledger/PRISMA_EVIDENCE_INDEX.json' \
            'PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER.json' | sort)
          test "$(printf '%s\n' "${final_diff[@]}")" = "$(printf '%s\n' "${wanted_final[@]}")"
          git push origin "HEAD:$BRANCH"
