name: CA Cloud P5 Governance Finalizer

on:
  push:
    branches:
      - governance/ca-cloud-p5-roi-close-2608

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    env:
      SOURCE_HEAD: 01b1d2f6c3f654fbe51d2336bb2d7fc4741563eb
      FINALIZER_PATH: .github/workflows/ca-cloud-p5-governance-finalize.yml
    steps:
      - name: Checkout governance branch
        uses: actions/checkout@v6
        with:
          ref: governance/ca-cloud-p5-roi-close-2608
          fetch-depth: 0

      - name: Assert exact governed base and carrier scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$SOURCE_HEAD"
          test "$(git merge-base HEAD origin/main)" = "$SOURCE_HEAD"
          python - <<'PY'
          import os, subprocess
          expected={os.environ['FINALIZER_PATH']}
          raw=subprocess.check_output(['git','diff','--name-only','-z',os.environ['SOURCE_HEAD']+'...HEAD'])
          actual={p.decode() for p in raw.split(b'\0') if p}
          if actual != expected:
              raise SystemExit(f'CARRIER_SCOPE_MISMATCH actual={sorted(actual)!r} expected={sorted(expected)!r}')
          PY

      - name: Promote only P5 capability row
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          map_path=Path('PRISMA Factory Ledger/PRISMA_CHANGE_INTELLIGENCE_CAPABILITY_MAP.json')
          md_path=Path('PRISMA Factory Ledger/PRISMA_CHANGE_INTELLIGENCE_CAPABILITY_MAP.md')
          data=json.loads(map_path.read_text(encoding='utf-8'))
          fields=data.get('rowFields')
          rows=data.get('rows')
          if not isinstance(fields,list) or not isinstance(rows,list):
              raise SystemExit('CAPABILITY_MAP_ROWS_INVALID')
          idx={name:i for i,name in enumerate(fields)}
          required={'id','classification','status','doNotRebuild','evidence','nextGate','proposalRule','protectedExistingOwners'}
          if not required.issubset(idx):
              raise SystemExit(f'CAPABILITY_MAP_FIELDS_MISSING:{sorted(required-set(idx))}')

          matches=[r for r in rows if isinstance(r,list) and len(r)==len(fields) and r[idx['id']]=='ci.cloud.roi_projection']
          if len(matches)!=1:
              raise SystemExit(f'P5_ROW_COUNT:{len(matches)}')
          row=matches[0]
          if row[idx['classification']]!='BUILD':
              raise SystemExit(f'P5_CLASSIFICATION_UNEXPECTED:{row[idx["classification"]]}')
          if row[idx['status']]!='NOT_CONNECTED':
              raise SystemExit(f'P5_STATUS_UNEXPECTED:{row[idx["status"]]}')
          if row[idx['doNotRebuild']] is not False:
              raise SystemExit('P5_DNR_EXPECTED_FALSE_BEFORE_PROMOTION')

          evidence=row[idx['evidence']]
          if not isinstance(evidence,list):
              raise SystemExit('P5_EVIDENCE_NOT_LIST')
          additions=[
              'pr:417',
              'merge:01b1d2f6c3f654fbe51d2336bb2d7fc4741563eb',
              'path:apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/config/change_intelligence_cloud.json',
              'path:apps/terminal-de-venta-system/tools/verify-cloud-center-change-intelligence-01.py',
              'authorityMesh:run:32941908100',
              'authorityArtifact:9596838433',
              'governanceGates:run:32963041762',
              'governanceGatesArtifact:9604613061'
          ]
          for item in additions:
              if item not in evidence:
                  evidence.append(item)

          row[idx['classification']]='DONE'
          row[idx['status']]='RUNTIME_VERIFIED_SLICE'
          row[idx['doNotRebuild']]=True
          row[idx['evidence']]=evidence
          row[idx['nextGate']]='CUSTOMER_BASELINE_INPUT_AND_MEASURED_PROJECTION'
          row[idx['proposalRule']]=('Reuse the canonical Code Atlas ROI owner and the merged fail-closed Cloud projection. '
                                    'Do not build a second ROI, billing, pricing, or customer-measurement owner. '
                                    'A financial estimate requires real customer baseline inputs plus observed canonical ROI events; '
                                    'this capability does not prove realized savings, profit, willingness to pay, human usefulness, '
                                    'production readiness, hosted multi-tenant readiness, or enterprise readiness.')
          row[idx['protectedExistingOwners']]=[]

          if data.get('v1Complete') is not False:
              raise SystemExit('V1_COMPLETE_MUST_REMAIN_FALSE')
          dod={x.get('id'):x for x in data.get('v1DefinitionOfDone',[]) if isinstance(x,dict)}
          if dod.get('G',{}).get('status')!='PARTIAL' or dod.get('J',{}).get('status')!='BLOCKED':
              raise SystemExit('G_J_BOUNDARY_DRIFT')
          map_path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          md=md_path.read_text(encoding='utf-8')
          old='Cloud Center projection work is not part of this governance mutation and remains separately governed. The human usefulness study kit is reuse-only; missing human measurement is external evidence. Independent-agent replication remains blocked until an actually independent evaluator exists. Hosted multi-tenant execution and enterprise IAM/security remain separate future productization gates.'
          new=('Cloud Center projection work remains separately governed by capability. `ci.cloud.roi_projection` is now `DONE / RUNTIME_VERIFIED_SLICE / doNotRebuild=true` from merged PR #417, the permanent source verifier and desktop/mobile browser runtime evidence, fresh post-merge Authority Mesh run `32941908100` / artifact `9596838433`, and fresh mutation-gate run `32963041762` / artifact `9604613061`. Its next gate is `CUSTOMER_BASELINE_INPUT_AND_MEASURED_PROJECTION`; absent real customer baselines and observed ROI events, it remains `INPUT_REQUIRED_NO_ESTIMATE` with `financialEstimate=null`. This does not prove realized savings, profit, willingness to pay, human usefulness, production readiness, hosted multi-tenant readiness or enterprise readiness. The human usefulness study kit is reuse-only; missing human measurement is external evidence. Independent-agent replication remains blocked until an actually independent evaluator exists. Hosted multi-tenant execution and enterprise IAM/security remain separate future productization gates.')
          if old not in md:
              raise SystemExit('P5_MD_ANCHOR_MISSING')
          md=md.replace(old,new,1)
          md_path.write_text(md,encoding='utf-8')
          PY

      - name: Remove one-shot finalizer
        shell: bash
        run: |
          set -euo pipefail
          git rm -- "$FINALIZER_PATH"

      - name: Assert exact governance scope and validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          expected={
            'PRISMA Factory Ledger/PRISMA_CHANGE_INTELLIGENCE_CAPABILITY_MAP.json',
            'PRISMA Factory Ledger/PRISMA_CHANGE_INTELLIGENCE_CAPABILITY_MAP.md'
          }
          raw=subprocess.check_output(['git','diff','--name-only','-z'])
          actual={p.decode() for p in raw.split(b'\0') if p}
          if actual != expected:
              raise SystemExit(f'FINAL_SCOPE_MISMATCH actual={sorted(actual)!r} expected={sorted(expected)!r}')
          PY
          python 'PRISMA Factory Ledger/tools/verify_change_intelligence_capability_gate.py' --validate-map
          python 'PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py' --validate

      - name: Commit governance plate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'prisma-ca-governor[bot]'
          git config user.email 'prisma-ca-governor[bot]@users.noreply.github.com'
          git add -- 'PRISMA Factory Ledger/PRISMA_CHANGE_INTELLIGENCE_CAPABILITY_MAP.json' 'PRISMA Factory Ledger/PRISMA_CHANGE_INTELLIGENCE_CAPABILITY_MAP.md'
          git commit -m 'chore(ca): register Cloud ROI projection closure'

      - name: Verify committed net scope and push
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$SOURCE_HEAD"
          python - <<'PY'
          import os, subprocess
          expected={
            'PRISMA Factory Ledger/PRISMA_CHANGE_INTELLIGENCE_CAPABILITY_MAP.json',
            'PRISMA Factory Ledger/PRISMA_CHANGE_INTELLIGENCE_CAPABILITY_MAP.md'
          }
          raw=subprocess.check_output(['git','diff','--name-only','-z',os.environ['SOURCE_HEAD']+'...HEAD'])
          actual={p.decode() for p in raw.split(b'\0') if p}
          if actual != expected:
              raise SystemExit(f'COMMITTED_SCOPE_MISMATCH actual={sorted(actual)!r} expected={sorted(expected)!r}')
          PY
          git push origin HEAD:governance/ca-cloud-p5-roi-close-2608
