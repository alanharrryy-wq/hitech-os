name: Code Atlas Usefulness ROI API Bootstrap

on:
  pull_request:
    paths:
      - '.github/scripts/caext_usefulness_pilot_v1.py'
      - '.github/workflows/caext-usefulness-pilot-v1.yml'
      - '.github/evidence/caext_usefulness_agent_responses_v1.json'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONUTF8: '1'
  PYTHONPATH: tools/code-atlas/src

jobs:
  repair-roi-api-call:
    name: Repair raw ROI event API call
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Patch scorer to canonical build_roi_event signature
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/scripts/caext_usefulness_pilot_v1.py')
          text = path.read_text(encoding='utf-8')
          if '"observedRawRoiEvents": observed_roi' in text:
              print('PASS_CAEXT_USEFULNESS_ROI_API_ALREADY_PATCHED')
              raise SystemExit(0)
          old = '''    observed_roi = build_roi_event(
              metric_values={
                  "outOfScopeChangeRate": round(all_violations / max(1, all_edit_entries), 6),
                  "evidenceCompletenessRate": round(sum(evidence_rates) / max(1, len(evidence_rates)) / 100, 6),
              },
              source="caext.single_external_agent_pilot.v1",
          )
'''
          new = '''    observed_roi = [
              build_roi_event(
                  metric="outOfScopeChangeRate",
                  value=round(all_violations / max(1, all_edit_entries), 6),
                  unit="ratio",
                  repository_identity="caext-usefulness-pilot-v1-six-task-controlled",
                  source="caext.single_external_agent_pilot.v1",
                  context={"taskCount": len(scored), "claimCeiling": "SINGLE_EXTERNAL_AGENT_PILOT"},
              ),
              build_roi_event(
                  metric="evidenceCompletenessRate",
                  value=round(sum(evidence_rates) / max(1, len(evidence_rates)) / 100, 6),
                  unit="ratio",
                  repository_identity="caext-usefulness-pilot-v1-six-task-controlled",
                  source="caext.single_external_agent_pilot.v1",
                  context={"taskCount": len(scored), "claimCeiling": "SINGLE_EXTERNAL_AGENT_PILOT"},
              ),
          ]
'''
          if old not in text:
              raise SystemExit('ROI_CALL_PREIMAGE_MISSING')
          text = text.replace(old, new, 1)
          old_key = '        "observedRawRoiEvent": observed_roi,\n'
          new_key = '        "observedRawRoiEvents": observed_roi,\n'
          if old_key not in text:
              raise SystemExit('ROI_RESULT_KEY_PREIMAGE_MISSING')
          text = text.replace(old_key, new_key, 1)

          self_anchor = '''    assert packet_digest(volatile_a) != packet_digest(semantic_change)\n    print("PASS_CAEXT_USEFULNESS_PILOT_SELFTEST")\n'''
          self_new = '''    assert packet_digest(volatile_a) != packet_digest(semantic_change)\n    roi_probe = build_roi_event(\n        metric="outOfScopeChangeRate",\n        value=0.0,\n        unit="ratio",\n        repository_identity="caext-usefulness-selftest",\n        source="caext.usefulness.selftest",\n        context={"financialEstimateAllowed": False},\n    )\n    assert roi_probe["metric"] == "outOfScopeChangeRate"\n    assert roi_probe["financialEstimate"] is None\n    assert roi_probe["observedMetric"] is True\n    print("PASS_CAEXT_USEFULNESS_PILOT_SELFTEST")\n'''
          if self_anchor not in text:
              raise SystemExit('ROI_SELFTEST_ANCHOR_MISSING')
          text = text.replace(self_anchor, self_new, 1)
          path.write_text(text, encoding='utf-8')
          print('PASS_CAEXT_USEFULNESS_ROI_API_PATCHED')

      - name: Compile and exercise canonical ROI API
        run: |
          python -m py_compile .github/scripts/caext_usefulness_pilot_v1.py
          python .github/scripts/caext_usefulness_pilot_v1.py selftest

      - name: Commit script only if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/scripts/caext_usefulness_pilot_v1.py; then
            echo 'PASS_CAEXT_USEFULNESS_ROI_REPAIR_ALREADY_COMMITTED'
            exit 0
          fi
          changed="$(git diff --name-only)"
          if [ "$changed" != '.github/scripts/caext_usefulness_pilot_v1.py' ]; then
            echo "Unexpected ROI repair diff: $changed"
            exit 1
          fi
          git config user.name 'CAEXT Usefulness Pilot'
          git config user.email 'caext-usefulness@example.invalid'
          git add -- .github/scripts/caext_usefulness_pilot_v1.py
          git commit -m 'test(code-atlas): fix usefulness raw ROI event API'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
