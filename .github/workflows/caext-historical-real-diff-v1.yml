name: Code Atlas Historical Real-Diff V1

on:
  pull_request:
    paths:
      - '.github/scripts/caext_historical_real_diff_v1.py'
      - '.github/workflows/caext-historical-real-diff-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONUTF8: '1'
  PYTHONPATH: tools/code-atlas/src
  CAEXT_HISTORICAL_CODE_ATLAS_PIN: d14effee1a1223cc772247ea9d7ec8547dc15c78
  CAEXT_WORKERS: '18'

jobs:
  historical-real-diff:
    name: Historical real-diff / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Compile and self-test historical runner
        run: |
          python -m py_compile .github/scripts/caext_historical_real_diff_v1.py
          python .github/scripts/caext_historical_real_diff_v1.py --self-test

      - name: Guard Code Atlas core and PR 273 reserved paths
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet "$CAEXT_HISTORICAL_CODE_ATLAS_PIN" -- tools/code-atlas/src/code_atlas; then
            echo 'Code Atlas core differs from governed historical-evidence pin.'
            git diff --name-only "$CAEXT_HISTORICAL_CODE_ATLAS_PIN" -- tools/code-atlas/src/code_atlas
            exit 1
          fi
          if git diff --name-only origin/main...HEAD | grep -E '^tools/code-atlas/src/code_atlas/(ui_bridge/|app_map/uimap/)'; then
            echo 'PR #273 reserved paths were touched.'
            exit 1
          fi
          changed="$(git diff --name-only origin/main...HEAD)"
          allowed1='.github/scripts/caext_historical_real_diff_v1.py'
          allowed2='.github/workflows/caext-historical-real-diff-v1.yml'
          allowed3='.github/workflows/caext-external-diversity-v2.yml'
          unexpected="$(printf '%s\n' "$changed" | grep -v -F -e "$allowed1" -e "$allowed2" -e "$allowed3" || true)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected Phase D diff:'
            printf '%s\n' "$unexpected"
            exit 1
          fi
          echo 'PASS_CAEXT_HISTORICAL_SCOPE_ONLY'

      - name: Run pinned historical real-diff evidence
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/caext-historical"
          mkdir -p "$out"
          python .github/scripts/caext_historical_real_diff_v1.py --output "$out" --hitech-root .

      - name: Upload historical evidence even when gate is red
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: caext-historical-${{ matrix.os }}
          if-no-files-found: error
          path: ${{ runner.temp }}/caext-historical/*.zip
