name: CA Cloud P2 R2 Finalizer

on:
  push:
    branches:
      - feature/ca-cloud-analysis-p2-r2-2508

permissions:
  contents: write

env:
  EXPECTED_MAIN: 28b0821d4a3c2b07041a0c4dfe18004f4f7d52ab
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v6
        with:
          ref: feature/ca-cloud-analysis-p2-r2-2508
          fetch-depth: 0

      - name: Assert fresh main and patch provenance
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git merge-base HEAD origin/main)" = "$EXPECTED_MAIN"
          python - <<'PY'
          from pathlib import Path

          targets = [
              Path('apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/config/change_intelligence_cloud.json'),
              Path('apps/terminal-de-venta-system/docs/productization/PRISMA_CHANGE_INTELLIGENCE_CLOUD_CENTER_VERTICAL_CONTRACT.md'),
              Path('apps/terminal-de-venta-system/tools/verify-cloud-center-change-intelligence-01.py'),
          ]
          replacements = {
              '1a83d5decb4e946021b9acf95f1a49479d6abf19': '28b0821d4a3c2b07041a0c4dfe18004f4f7d52ab',
              'aef9288e64471d0f93b46bf1a83b1b3761a7ed87': 'f02a5c495d982155d18febc0b81d8a11c0201144',
              'ci-cloud-analysis-p2-v1': 'ci-cloud-analysis-run-projection-p2-v2',
              '32857996548': '32865050216',
              '9567071237': '9569864211',
              'sha256:57ecf78ed943207dd9863656bdf0691973a9b6ab55dbe27b7337dde033f75f98': 'sha256:677d5e2d93d9a5b23c5cc683e9572645bdd2763f575752af2c628dcb1df9d4ed',
              '2b7f419913ed27976aa58020fd2d0dabd4847f7aa24259a3eace3e5e1f4c1613': 'bb146156461837525776f6f40e637a1215ba38581759da4ebb448aea97a08769',
              '32858536493': '32865503690',
              '9567186079': '9569959132',
              'sha256:4696ca6b5d9bd9ee5672a0ce876607e5359d78a73d8142a7a64441c36eabc86c': 'sha256:cd8cd3b5f35a81e9608c0d8aae42fde76a9a822122d292a6a19c2a4973cf0868',
              '7dc6034b34638f3d3a699d52cf53c3357f0296f6d5630a156582548e2644e826': '2630c723aaa6d2f692218cb30648020fd41a5eade35d10f4d49129d0c5304103',
              'c431cdbae2097a1b66b5ecece80c5851c757186babd3d7e749299c8252622a2a': '7a2893d86119ad6d49bc7bb3bdff08689a6abcbb2c77343399a9cc671bc08913',
              'code-atlas-discover-1a83d5de': 'code-atlas-discover-28b0821d',
          }
          combined = '\n'.join(path.read_text(encoding='utf-8') for path in targets)
          missing = [old for old in replacements if old not in combined]
          if missing:
              raise SystemExit('EXPECTED_STALE_TOKEN_MISSING:' + ','.join(missing))
          for path in targets:
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          combined_after = '\n'.join(path.read_text(encoding='utf-8') for path in targets)
          stale = [old for old in replacements if old in combined_after]
          if stale:
              raise SystemExit('STALE_TOKEN_REMAINS:' + ','.join(stale))
          PY
          python -m json.tool 'apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/config/change_intelligence_cloud.json' >/dev/null
          python -m py_compile apps/terminal-de-venta-system/tools/verify-cloud-center-change-intelligence-01.py
          git rm .github/workflows/ca-cloud-p2-r2-finalizer.yml
          git add \
            'apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/config/change_intelligence_cloud.json' \
            'apps/terminal-de-venta-system/docs/productization/PRISMA_CHANGE_INTELLIGENCE_CLOUD_CENTER_VERTICAL_CONTRACT.md' \
            'apps/terminal-de-venta-system/tools/verify-cloud-center-change-intelligence-01.py'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(ca): bind Analysis Runs P2 to fresh evidence'

      - name: Verify final source contract and exact diff
        shell: bash
        run: |
          set -euo pipefail
          python apps/terminal-de-venta-system/tools/verify-cloud-center-change-intelligence-01.py
          python - <<'PY'
          import subprocess
          expected = {
              'apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/config/change_intelligence_cloud.json',
              'apps/terminal-de-venta-system/docs/productization/PRISMA_CHANGE_INTELLIGENCE_CLOUD_CENTER_VERTICAL_CONTRACT.md',
              'apps/terminal-de-venta-system/tools/verify-cloud-center-change-intelligence-01.py',
          }
          changed = set(subprocess.check_output(['git','diff','--name-only','origin/main...HEAD'], text=True).splitlines())
          if changed != expected:
              raise SystemExit(f'FINAL_DIFF_MISMATCH:{sorted(changed)}')
          if subprocess.check_output(['git','status','--porcelain'], text=True).strip():
              raise SystemExit('DIRTY_AFTER_FINALIZE')
          print('PASS_CA_CLOUD_P2_R2_FINAL_DIFF')
          PY

      - name: Push finalized branch
        shell: bash
        run: git push origin HEAD:feature/ca-cloud-analysis-p2-r2-2508
