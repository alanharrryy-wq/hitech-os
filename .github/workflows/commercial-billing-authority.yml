name: Commercial Billing Authority

on:
  pull_request:
    paths:
      - '.github/workflows/commercial-billing-authority.yml'
      - 'apps/terminal-de-venta-system/Prisma Cloud Ctr/**'
      - 'apps/terminal-de-venta-system/docs/productization/**'
      - 'apps/terminal-de-venta-system/tools/verify-commercial-billing-cfdi-01.py'
      - 'PRISMA Factory Ledger/**'
  push:
    branches: ['main']
    paths:
      - 'apps/terminal-de-venta-system/Prisma Cloud Ctr/**'
      - 'apps/terminal-de-venta-system/docs/productization/**'
      - 'apps/terminal-de-venta-system/tools/verify-commercial-billing-cfdi-01.py'
      - 'PRISMA Factory Ledger/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  commercial-billing-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run exact Authority Mesh preflight
        run: >-
          python apps/terminal-de-venta-system/tools/prisma-governance/authority_mesh.py
          --repo apps/terminal-de-venta-system
          --output .governance/current
          --full
          --task "CONSTRUIR COBRANZA Y FACTURACION COMERCIAL PRISMA SOBRE EL CONTRATO COMERCIAL CANONICO YA EXISTENTE: en Prisma Cloud Center agregar fiscal profile del cliente, cargos por periodo, vencimientos, estados open/partially_paid/paid/past_due/void, pagos idempotentes y asignaciones parciales, recibos internos, aging/reconciliacion, borradores CFDI 4.0 de ingreso, PUE/PPD, Complemento de Pagos 2.0, registro de UUID timbrado externo, solicitud de cancelacion con motivos SAT 01/02/03/04 y gateway PAC/SAT fail-closed sin secretos; preservar como autoridades do-not-rebuild licensing, plan-catalog.canonical.json, CommercialContract, LICFLOW3, Customer Setup y pricing-policy de mercancia; no inferir datos fiscales del primer cliente ni emitir/timbrar/cancelar CFDI real sin configuracion fiscal, CSD/PAC y autorizacion externa; incluir Cloud Center/Governance/Quality/Productization y excluir Tablet/PC/Mobile/Chart Lab/Shared UI/Prisma DB/Cloudflare/D1; UI limitada a contenido y controles usando estilos existentes, sin CSS ni Visual OS; exigir layer map, auditoria, rollback conceptual, no fake green y evidencia local deterministica."

      - name: Require Authority Mesh outputs and billing layers map
        shell: python
        run: |
          import json
          from pathlib import Path

          root = Path('apps/terminal-de-venta-system/.governance/current')
          required = [
              'AUTHORITY_READSET.lock.json',
              'APP_IMPACT_MATRIX.md',
              'CONTRACT_AND_GATE_MATRIX.json',
              'MISSING_OR_UNMAPPED_RISK.md',
              'AGENT_PROMPT_ENVELOPE.md',
              'AUTHORITY_MESH_REPORT.md',
          ]
          missing = [name for name in required if not (root / name).exists()]
          if missing:
              raise SystemExit('Missing Authority Mesh outputs: ' + ', '.join(missing))

          lock = json.loads((root / 'AUTHORITY_READSET.lock.json').read_text(encoding='utf-8'))
          tokens = ('visual', 'layer', 'cloud', 'licens', 'contract', 'quality', 'productization', 'authority-map')
          entries = [item for item in lock.get('readset', []) if any(token in str(item.get('path', '')).lower() for token in tokens)]
          if not entries:
              raise SystemExit('No relevant authority/layer entries found in fresh readset')

          lines = [
              '# PRISMA Commercial Billing Layers Map',
              '',
              '- Change class: commercial collections + fiscal-document orchestration.',
              '- Included surface: Prisma Cloud Center + governance/quality/productization.',
              '- Excluded product surfaces: Tablet, PC, Mobile, Chart Lab, Shared UI.',
              '- Style mutation: none. Existing Cloud Center classes/components only.',
              '- Fiscal mutation: local drafts/records only; live CFDI stamping/cancellation remains external and fail-closed.',
              '- Pricing authority remains shared/licensing/plan-catalog.canonical.json through CommercialContract snapshots.',
              '',
              '| Authority path | Reason |',
              '|---|---|',
          ]
          for item in entries[:100]:
              path = str(item.get('path', '')).replace('|', '/')
              reason = str(item.get('reason', '')).replace('|', '/')
              lines.append(f'| `{path}` | {reason} |')
          (root / 'COMMERCIAL_BILLING_LAYERS_MAP.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')

      - name: Factory Ledger anti-rework gate
        shell: python
        run: |
          import json
          from pathlib import Path
          ledger = json.loads(Path('PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER.json').read_text(encoding='utf-8'))
          caps = {item.get('id'): item for item in ledger.get('capabilities', [])}
          protected = [
              'licensing.source_contract_alignment',
              'licensing.customer_setup.plan_based_onboarding',
              'licensing.cloudflare_d1_oauth',
          ]
          for cap_id in protected:
              item = caps.get(cap_id)
              if not item or item.get('doNotRebuild') is not True:
                  raise SystemExit(f'Protected Factory Ledger capability missing/doNotRebuild=false: {cap_id}')
          print('PASS_FACTORY_LEDGER_PROTECTED_CAPABILITIES')

      - name: Guard excluded source surfaces
        shell: python
        run: |
          import subprocess
          changed = subprocess.check_output(['git','diff','--name-only','origin/main...HEAD'], text=True).splitlines()
          forbidden = (
              'apps/terminal-de-venta-system/products/tablet/',
              'apps/terminal-de-venta-system/products/pc/',
              'apps/terminal-de-venta-system/products/mobile/',
              'apps/terminal-de-venta-system/prisma/',
          )
          bad = [path for path in changed if path.startswith(forbidden)]
          if bad:
              raise SystemExit('Forbidden billing scope files changed: ' + ', '.join(bad))
          print('PASS_BILLING_SCOPE_BOUNDARY')

      - name: Upload governance evidence
        uses: actions/upload-artifact@v4
        with:
          name: commercial-billing-authority
          path: |
            apps/terminal-de-venta-system/.governance/current/AUTHORITY_READSET.lock.json
            apps/terminal-de-venta-system/.governance/current/APP_IMPACT_MATRIX.md
            apps/terminal-de-venta-system/.governance/current/CONTRACT_AND_GATE_MATRIX.json
            apps/terminal-de-venta-system/.governance/current/MISSING_OR_UNMAPPED_RISK.md
            apps/terminal-de-venta-system/.governance/current/AGENT_PROMPT_ENVELOPE.md
            apps/terminal-de-venta-system/.governance/current/AUTHORITY_MESH_REPORT.md
            apps/terminal-de-venta-system/.governance/current/COMMERCIAL_BILLING_LAYERS_MAP.md
