name: PRISMA Mobile Runtime Visual Conformance Carrier

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  BASE_SHA: '71387e06aab700c14745a4e42d799ecd82d61b5d'
  MOBILE_ROOT: 'apps/terminal-de-venta-system/products/mobile/app'
  BASE_URL: 'http://127.0.0.1:3140'

jobs:
  runtime-visual-conformance:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gate/mobile-runtime-visual-cert-2908'
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout disposable carrier
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Fail closed on base drift and carrier scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          mapfile -t files < <(git diff --name-only origin/main...HEAD)
          test "${#files[@]}" = "1"
          test "${files[0]}" = ".github/workflows/mobile-runtime-visual-cert-carrier.yml"

      - name: Detach exact canonical Mobile source
        id: detach
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Initialize evidence boundary
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/mobile-runtime-visual-evidence"
          mkdir -p "$E/screenshots"
          cat > "$E/AUTHORITY.json" <<'JSON'
          {
            "schemaVersion": "prisma.mobile.runtime-visual-authority.v1",
            "canonicalHead": "71387e06aab700c14745a4e42d799ecd82d61b5d",
            "authorityMeshRun": 33245611088,
            "authorityMeshResult": "PASS_COMPOSED_AUTHORITY_MESH",
            "authorityMeshRequestDigest": "88ba63f1b9b7f53303959fe5787d9797d80b9d040a9ec3dce9226e9ec858d366",
            "authorityMeshArtifact": 9712748475,
            "authorityMeshArtifactDigest": "17a6962fbb0effcdae367c6edd63e19f4f1443fe5bc87e5e593ac9647d506483",
            "mutationGateRun": 33245809384,
            "mutationGateResult": "PASS_ANTI_REWORK_GATE",
            "mutationGateDecisionDigest": "7b80ceb3d9ead090d8b6819e5ac077f5121e45a9fb892e086974a6075ac37b7b",
            "productSourceMutation": false,
            "productionCertified": false
          }
          JSON
          cat > "$E/EVIDENCE_BOUNDARY.md" <<'EOF'
          # PRISMA Mobile runtime/visual conformance evidence boundary

          This disposable GitHub Actions carrier verifies exact canonical source `main@71387e06aab700c14745a4e42d799ecd82d61b5d` on an ephemeral loopback runner.

          It may prove isolated runtime rendering, the canonical seven-tab navigation, responsive layout observations, loading/error/stale client behavior, contract-fixture rendering for readiness levels, keyboard/ARIA behavior, source invariants, and captured browser diagnostics.

          It does **not** prove hosted production, customer production data, signed-session production auth, offline operational data, real Tablet/PC upstream availability, sync correctness, licensing correctness, custody/zero-egress, deployment, distribution, or production certification.

          Deterministic readiness fixtures are marked `fixture=true`. They are derived from the runner's own contract-valid snapshot and exercise rendering only. They do not certify upstream business semantics.
          EOF

      - name: Setup Node 24
        id: node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install pnpm 9.15 runner-only
        id: pnpm
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@9.15.0
          node --version
          pnpm --version

      - name: Install repository dependencies without lifecycle scripts
        id: install
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Run current Mobile source gates
        id: static
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/mobile-runtime-visual-evidence"
          pnpm -C "$MOBILE_ROOT" run verify:interface-canon | tee "$E/verify-interface-canon.log"
          pnpm -C "$MOBILE_ROOT" run verify:premium-navigation | tee "$E/verify-premium-navigation.log"
          pnpm -C "$MOBILE_ROOT" run verify:data-readiness | tee "$E/verify-data-readiness.log"
          pnpm -C "$MOBILE_ROOT" run verify:source-states | tee "$E/verify-source-states.log"
          pnpm -C "$MOBILE_ROOT" run typecheck | tee "$E/typecheck.log"
          pnpm -C "$MOBILE_ROOT" run build | tee "$E/build.log"
          rm -rf "$MOBILE_ROOT/.next"

      - name: Install isolated browser harness
        id: browser_install
        shell: bash
        run: |
          set -euo pipefail
          PW="$RUNNER_TEMP/mobile-pw"
          mkdir -p "$PW"
          cd "$PW"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.0 axe-core@4.10.3
          npx playwright install --with-deps chromium

      - name: Start only runner-owned Mobile dev server
        id: server
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/mobile-runtime-visual-evidence"
          (
            cd "$MOBILE_ROOT"
            nohup pnpm exec next dev --webpack -H 127.0.0.1 -p 3140 >"$E/mobile-dev.log" 2>&1 &
            echo $! > "$RUNNER_TEMP/mobile.pid"
          )
          for i in $(seq 1 90); do
            if curl -fsS "$BASE_URL/prisma-app" >/dev/null 2>&1; then
              echo "MOBILE_LOOPBACK_READY"
              exit 0
            fi
            sleep 1
          done
          echo "MOBILE_LOOPBACK_NOT_READY"
          cat "$E/mobile-dev.log" || true
          exit 1

      - name: Materialize ephemeral Playwright verifier
        id: materialize
        shell: bash
        run: |
          set -euo pipefail
          PW="$RUNNER_TEMP/mobile-pw"
          cat > "$PW/mobile-runtime-visual-cert.mjs" <<'JS'
          import { chromium } from 'playwright';
          import { createHash } from 'node:crypto';
          import { createRequire } from 'node:module';
          import fs from 'node:fs';
          import path from 'node:path';

          const require = createRequire(import.meta.url);
          const axeSource = fs.readFileSync(require.resolve('axe-core/axe.min.js'), 'utf8');
          const BASE = process.env.BASE_URL || 'http://127.0.0.1:3140';
          const OUT = process.env.EVIDENCE_DIR;
          const SHOTS = path.join(OUT, 'screenshots');
          fs.mkdirSync(SHOTS, { recursive: true });

          const EXPECTED_TABS = ['Inicio', 'Ventas', 'Operación', 'Licencias', 'Alertas', 'Stock', 'Sistema'];
          const RETIRED_TOP_LEVEL = ['Hoy', 'Caja', 'Inventario', 'Reportes', 'MultiSucursal', 'Resumen', 'Sync', 'Mando', 'Command Center', 'Action Inbox', 'Daily Brief', 'Decision Ledger', 'Pulse Timeline', 'Health Radar'];
          const VIEWPORTS = [
            { name: 'phone390', width: 390, height: 844 },
            { name: 'phone430', width: 430, height: 932 }
          ];

          const report = {
            schemaVersion: 'prisma.mobile.runtime-visual-conformance.v1',
            canonicalHead: process.env.BASE_SHA,
            runner: 'github-actions-ubuntu-24.04',
            productionCertified: false,
            sourceMutation: false,
            expectedTabs: EXPECTED_TABS,
            actualRuntimeApi: null,
            scenarios: [],
            diagnostics: { consoleErrors: [], pageErrors: [], requestFailures: [], httpFailures: [] },
            accessibility: [],
            hardFailures: [],
            findings: [],
            verdict: 'UNKNOWN'
          };

          const clean = (v) => String(v ?? '').replace(/\s+/g, ' ').trim();
          const short = (v) => clean(v).slice(0, 700);
          const fail = (code, detail = '') => report.hardFailures.push({ code, detail: short(detail) });
          const finding = (code, detail = '') => report.findings.push({ code, detail: short(detail) });
          const safePath = (raw) => {
            try {
              const u = new URL(raw);
              return u.origin === new URL(BASE).origin ? `${u.pathname}${u.search}` : `${u.origin}${u.pathname}`;
            } catch { return short(raw); }
          };

          async function realEnvelope() {
            const response = await fetch(`${BASE}/api/mobile/snapshot`, { headers: { Accept: 'application/json' } });
            const text = await response.text();
            const digest = createHash('sha256').update(text).digest('hex');
            let body = null;
            try { body = JSON.parse(text); } catch {}
            report.actualRuntimeApi = {
              status: response.status,
              ok: response.ok,
              contentType: response.headers.get('content-type'),
              bodySha256: digest,
              contractOk: body?.ok === true,
              source: body?.meta?.source ?? null,
              runtimeMode: body?.meta?.runtimeMode ?? null,
              readinessLevel: body?.data?.summary?.dataReadiness?.level ?? null,
              rawPayloadPersisted: false
            };
            fs.writeFileSync(path.join(OUT, 'runtime-api-meta.json'), JSON.stringify(report.actualRuntimeApi, null, 2));
            if (!response.ok || body?.ok !== true || !body?.data?.summary?.dataReadiness) {
              fail('REAL_SNAPSHOT_CONTRACT_UNAVAILABLE', `HTTP ${response.status}`);
              return null;
            }
            return body;
          }

          function fixtureFrom(baseEnvelope, level) {
            const f = structuredClone(baseEnvelope);
            f.meta.generatedAt = new Date().toISOString();
            f.meta.source = 'api-snapshot';
            f.meta.runtimeMode = level === 'partial' ? 'partial' : 'live';
            const r = f.data.summary.dataReadiness;
            const copy = {
              ready: ['Datos listos', 'Lectura operativa disponible', 'Fixture contractual de render listo.'],
              partial: ['Lectura parcial', 'Hay señales parciales', 'Fixture contractual de render parcial.'],
              empty: ['Sin actividad disponible', 'No hay actividad en la lectura', 'Fixture contractual de render vacío.']
            }[level];
            r.level = level;
            r.label = copy[0];
            r.headline = copy[1];
            r.detail = copy[2];
            r.sourceSummary = `Fixture contractual ${level}; no certifica upstreams reales.`;
            return f;
          }

          function diagnostics(page, scenarioId) {
            page.on('console', (msg) => {
              if (msg.type() === 'error') report.diagnostics.consoleErrors.push({ scenarioId, text: short(msg.text()) });
            });
            page.on('pageerror', (error) => report.diagnostics.pageErrors.push({ scenarioId, text: short(error?.message || error) }));
            page.on('requestfailed', (request) => report.diagnostics.requestFailures.push({ scenarioId, url: safePath(request.url()), error: short(request.failure()?.errorText) }));
            page.on('response', (response) => {
              if (response.status() >= 400) report.diagnostics.httpFailures.push({ scenarioId, status: response.status(), url: safePath(response.url()) });
            });
          }

          async function waitNavigator(page) {
            await page.waitForFunction(() => document.querySelectorAll('[role="tab"]').length === 7 || Boolean(document.querySelector('[data-prisma-zone="mobile-error-state"]')), null, { timeout: 25000 });
          }

          async function tabs(page) {
            return (await page.locator('[role="tab"]').allTextContents()).map(clean);
          }

          async function layout(page, scenarioId, viewportName) {
            const m = await page.evaluate(() => ({
              innerWidth: window.innerWidth,
              documentScrollWidth: document.documentElement.scrollWidth,
              bodyScrollWidth: document.body?.scrollWidth ?? 0,
              readiness: document.querySelector('[data-prisma-product="mobile"]')?.getAttribute('data-prisma-readiness') ?? null,
              stale: document.querySelector('[data-prisma-product="mobile"]')?.getAttribute('data-prisma-stale') ?? null
            }));
            if (m.documentScrollWidth > m.innerWidth + 1 || m.bodyScrollWidth > m.innerWidth + 1) fail('HORIZONTAL_OVERFLOW', `${scenarioId}/${viewportName}: ${JSON.stringify(m)}`);
            return m;
          }

          async function axe(page, scenarioId, viewportName) {
            await page.addScriptTag({ content: axeSource });
            const violations = await page.evaluate(async () => {
              const r = await window.axe.run(document, { resultTypes: ['violations'] });
              return r.violations.map((v) => ({ id: v.id, impact: v.impact, help: v.help, nodeCount: v.nodes.length, targets: v.nodes.slice(0, 5).map((n) => n.target) }));
            });
            report.accessibility.push({ scenarioId, viewportName, violations });
            for (const v of violations.filter((x) => x.impact === 'critical')) fail('AXE_CRITICAL', `${scenarioId}/${viewportName}: ${v.id} (${v.nodeCount})`);
            for (const v of violations.filter((x) => x.impact === 'serious')) finding('AXE_SERIOUS', `${scenarioId}/${viewportName}: ${v.id} (${v.nodeCount})`);
          }

          async function certifyRealViewport(browser, viewport) {
            const id = `real-runtime-${viewport.name}`;
            const context = await browser.newContext({ viewport: { width: viewport.width, height: viewport.height }, reducedMotion: 'reduce' });
            const page = await context.newPage();
            diagnostics(page, id);
            await page.goto(`${BASE}/prisma-app`, { waitUntil: 'domcontentloaded', timeout: 30000 });
            await waitNavigator(page);
            const actualTabs = await tabs(page);
            if (JSON.stringify(actualTabs) !== JSON.stringify(EXPECTED_TABS)) fail('CANONICAL_TAB_ORDER_MISMATCH', `${id}: ${JSON.stringify(actualTabs)}`);
            const retired = actualTabs.filter((x) => RETIRED_TOP_LEVEL.includes(x));
            if (retired.length) fail('RETIRED_TOP_LEVEL_TAB_MOUNTED', retired.join(', '));
            if (await page.getByText('Todas las sucursales', { exact: true }).count()) fail('RETIRED_MULTICONTEXT_VISIBLE', id);

            const first = page.getByRole('tab', { name: 'Inicio', exact: true });
            await first.focus();
            await page.keyboard.press('ArrowRight');
            if (clean(await page.evaluate(() => document.activeElement?.textContent)) !== 'Ventas') fail('TAB_KEYBOARD_ARROW_RIGHT', id);
            await page.keyboard.press('Home');
            if (clean(await page.evaluate(() => document.activeElement?.textContent)) !== 'Inicio') fail('TAB_KEYBOARD_HOME', id);
            await page.keyboard.press('End');
            if (clean(await page.evaluate(() => document.activeElement?.textContent)) !== 'Sistema') fail('TAB_KEYBOARD_END', id);

            const screenshots = [];
            for (const label of EXPECTED_TABS) {
              const tab = page.getByRole('tab', { name: label, exact: true });
              await tab.click();
              await page.waitForTimeout(140);
              if (await tab.getAttribute('aria-selected') !== 'true') fail('TAB_ARIA_SELECTED_MISMATCH', `${id}/${label}`);
              const slug = label.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-');
              const file = `${id}-${slug}.png`;
              await page.screenshot({ path: path.join(SHOTS, file), fullPage: true });
              screenshots.push(file);
            }
            const metrics = await layout(page, id, viewport.name);
            await axe(page, id, viewport.name);
            report.scenarios.push({ id, fixture: false, kind: 'isolated-real-runtime', viewport, tabs: actualTabs, screenshots, metrics });
            await context.close();
          }

          async function captureReadinessFixture(browser, envelope, level) {
            const viewport = VIEWPORTS[0];
            const id = `contract-fixture-${level}`;
            const context = await browser.newContext({ viewport: { width: viewport.width, height: viewport.height }, reducedMotion: 'reduce' });
            const f = fixtureFrom(envelope, level);
            await context.route('**/api/mobile/snapshot', (route) => route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify(f) }));
            const page = await context.newPage();
            diagnostics(page, id);
            await page.goto(`${BASE}/prisma-app`, { waitUntil: 'domcontentloaded', timeout: 30000 });
            await waitNavigator(page);
            if ((await tabs(page)).length !== 7) fail('FIXTURE_NAVIGATOR_NOT_RENDERED', id);
            const observed = await page.locator('[data-prisma-product="mobile"]').getAttribute('data-prisma-readiness');
            if (observed !== level) fail('FIXTURE_READINESS_NOT_PROJECTED', `${id}: ${observed}`);
            const file = `${id}.png`;
            await page.screenshot({ path: path.join(SHOTS, file), fullPage: true });
            const metrics = await layout(page, id, viewport.name);
            report.scenarios.push({ id, fixture: true, claim: 'render-only-contract-fixture', requestedLevel: level, observedLevel: observed, screenshot: file, metrics });
            await context.close();
          }

          async function captureLoading(browser, envelope) {
            const id = 'loading-delayed-snapshot-fixture';
            const context = await browser.newContext({ viewport: { width: 390, height: 844 }, reducedMotion: 'reduce' });
            await context.route('**/api/mobile/snapshot', async (route) => {
              await new Promise((r) => setTimeout(r, 2600));
              await route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify(envelope) });
            });
            const page = await context.newPage();
            diagnostics(page, id);
            await page.goto(`${BASE}/prisma-app`, { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForSelector('[data-prisma-state="loading"]', { timeout: 5000 });
            const file = `${id}.png`;
            await page.screenshot({ path: path.join(SHOTS, file), fullPage: true });
            await page.waitForFunction(() => document.querySelectorAll('[role="tab"]').length === 7, null, { timeout: 10000 });
            report.scenarios.push({ id, fixture: true, claim: 'loading-boundary-render', screenshot: file });
            await context.close();
          }

          async function captureError(browser) {
            const id = 'error-snapshot-503-fixture';
            const context = await browser.newContext({ viewport: { width: 390, height: 844 }, reducedMotion: 'reduce' });
            await context.route('**/api/mobile/snapshot', (route) => route.fulfill({ status: 503, contentType: 'application/json', body: '{"ok":false,"error":{"code":"FIXTURE_503"}}' }));
            const page = await context.newPage();
            diagnostics(page, id);
            await page.goto(`${BASE}/prisma-app`, { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForSelector('[data-prisma-state="error"]', { timeout: 15000 });
            if (await page.getByRole('button', { name: 'Reintentar snapshot' }).count() !== 1) fail('ERROR_RETRY_ACTION_MISSING', id);
            if (await page.getByRole('button', { name: 'Limpiar cache y reintentar' }).count() !== 1) fail('ERROR_CLEAR_CACHE_ACTION_MISSING', id);
            const file = `${id}.png`;
            await page.screenshot({ path: path.join(SHOTS, file), fullPage: true });
            report.scenarios.push({ id, fixture: true, claim: 'error-boundary-render', screenshot: file, expectedHttp503: true });
            await context.close();
          }

          async function captureStale(browser) {
            const id = 'stale-memory-cache-after-refresh-failure';
            const context = await browser.newContext({ viewport: { width: 390, height: 844 }, reducedMotion: 'reduce' });
            const page = await context.newPage();
            diagnostics(page, id);
            await page.goto(`${BASE}/prisma-app`, { waitUntil: 'domcontentloaded', timeout: 30000 });
            await waitNavigator(page);
            await page.route('**/api/mobile/snapshot', (route) => route.fulfill({ status: 503, contentType: 'application/json', body: '{"ok":false,"error":{"code":"FIXTURE_REFRESH_503"}}' }));
            await page.getByRole('button', { name: 'Actualizar', exact: true }).first().click();
            await page.waitForFunction(() => document.querySelector('[data-prisma-product="mobile"]')?.getAttribute('data-prisma-stale') === 'true', null, { timeout: 12000 });
            const stale = await page.locator('[data-prisma-product="mobile"]').getAttribute('data-prisma-stale');
            if (stale !== 'true') fail('STALE_CACHE_NOT_EXPOSED', id);
            const file = `${id}.png`;
            await page.screenshot({ path: path.join(SHOTS, file), fullPage: true });
            report.scenarios.push({ id, fixture: true, claim: 'client-memory-cache-fallback-after-injected-refresh-failure', screenshot: file, stale });
            await context.close();
          }

          let browser;
          try {
            const envelope = await realEnvelope();
            if (!envelope) throw new Error('real snapshot unavailable');
            browser = await chromium.launch({ headless: true });
            for (const viewport of VIEWPORTS) await certifyRealViewport(browser, viewport);
            for (const level of ['ready', 'partial', 'empty']) await captureReadinessFixture(browser, envelope, level);
            await captureLoading(browser, envelope);
            await captureError(browser);
            await captureStale(browser);
          } catch (error) {
            fail('HARNESS_EXCEPTION', error?.stack || error?.message || String(error));
          } finally {
            if (browser) await browser.close();
          }

          const intentional = new Set(['error-snapshot-503-fixture', 'stale-memory-cache-after-refresh-failure']);
          const realOrNormal = (item) => !intentional.has(item.scenarioId) && item.scenarioId !== 'loading-delayed-snapshot-fixture';
          const unexpectedConsole = report.diagnostics.consoleErrors.filter(realOrNormal);
          const unexpectedPages = report.diagnostics.pageErrors.filter(realOrNormal);
          const unexpectedRequests = report.diagnostics.requestFailures.filter(realOrNormal);
          const unexpectedHttp = report.diagnostics.httpFailures.filter(realOrNormal);
          if (unexpectedConsole.length) fail('UNEXPECTED_CONSOLE_ERROR', JSON.stringify(unexpectedConsole));
          if (unexpectedPages.length) fail('UNEXPECTED_PAGEERROR', JSON.stringify(unexpectedPages));
          if (unexpectedRequests.length) fail('UNEXPECTED_REQUEST_FAILURE', JSON.stringify(unexpectedRequests));
          if (unexpectedHttp.length) fail('UNEXPECTED_HTTP_FAILURE', JSON.stringify(unexpectedHttp));

          report.verdict = report.hardFailures.length === 0 ? 'PASS_MOBILE_RUNTIME_VISUAL_CONFORMANCE_ISOLATED' : 'FAIL_MOBILE_RUNTIME_VISUAL_CONFORMANCE';
          fs.writeFileSync(path.join(OUT, 'RESULT.json'), JSON.stringify(report, null, 2));
          fs.writeFileSync(path.join(OUT, 'RESULT.md'), [
            '# PRISMA Mobile runtime/visual conformance',
            '',
            `**Verdict:** ${report.verdict}`,
            `**Canonical head:** ${report.canonicalHead}`,
            `**Actual isolated runtime mode:** ${report.actualRuntimeApi?.runtimeMode ?? 'unknown'}`,
            `**Actual readiness:** ${report.actualRuntimeApi?.readinessLevel ?? 'unknown'}`,
            `**Scenarios:** ${report.scenarios.length}`,
            `**Hard failures:** ${report.hardFailures.length}`,
            `**Non-blocking findings:** ${report.findings.length}`,
            '',
            'Isolated runtime/visual evidence only. No hosted-production, auth, sync, licensing, custody, zero-egress, offline operational-data, deployment or distribution certification is claimed.'
          ].join('\n') + '\n');
          console.log(JSON.stringify({ verdict: report.verdict, scenarios: report.scenarios.length, hardFailures: report.hardFailures, findings: report.findings }, null, 2));
          if (report.hardFailures.length) process.exit(1);
          JS

      - name: Run isolated runtime and visual certification
        id: visual
        continue-on-error: true
        shell: bash
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/mobile-runtime-visual-evidence
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mobile-pw"
          node mobile-runtime-visual-cert.mjs

      - name: Prove Mobile product source remained untouched
        id: source_guard
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          E="$RUNNER_TEMP/mobile-runtime-visual-evidence"
          mkdir -p "$E"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git diff --exit-code -- "$MOBILE_ROOT"
          test -z "$(git status --porcelain --untracked-files=no -- "$MOBILE_ROOT")"
          git status --short --branch > "$E/git-status.txt"
          git diff --name-only > "$E/source-diff.txt"

      - name: Stop only runner-owned Mobile process
        if: always()
        shell: bash
        run: |
          set +e
          if [ -f "$RUNNER_TEMP/mobile.pid" ]; then
            PID="$(cat "$RUNNER_TEMP/mobile.pid")"
            if kill -0 "$PID" 2>/dev/null; then
              kill "$PID"
              for i in $(seq 1 10); do
                kill -0 "$PID" 2>/dev/null || break
                sleep 1
              done
            fi
          fi
          exit 0

      - name: Upload single evidence artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-runtime-visual-conformance-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/mobile-runtime-visual-evidence/**

      - name: Fail closed unless every required gate passed
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.scope.outcome }}" = "success"
          test "${{ steps.detach.outcome }}" = "success"
