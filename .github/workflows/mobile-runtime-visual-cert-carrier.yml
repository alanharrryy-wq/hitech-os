name: PRISMA Mobile Runtime Visual Conformance Carrier

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  BASE_SHA: '71387e06aab700c14745a4e42d799ecd82d61b5d'
  MOBILE_ROOT: 'apps/terminal-de-venta-system/products/mobile/app'
  BASE_URL: 'http://127.0.0.1:3140'

jobs:
  runtime-visual-conformance:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gate/mobile-runtime-visual-cert-2908'
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout disposable carrier
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Fail closed on base drift and carrier scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          mapfile -t files < <(git diff --name-only origin/main...HEAD)
          test "${#files[@]}" = "1"
          test "${files[0]}" = ".github/workflows/mobile-runtime-visual-cert-carrier.yml"

      - name: Detach exact canonical Mobile source
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Setup Node 24 and pnpm 9.15
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Activate pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.15.0 --activate
          node --version
          pnpm --version

      - name: Initialize evidence boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mobile-runtime-visual-evidence/screenshots"
          cat > "$RUNNER_TEMP/mobile-runtime-visual-evidence/AUTHORITY.json" <<'JSON'
          {
            "schemaVersion": "prisma.mobile.runtime-visual-authority.v1",
            "canonicalHead": "71387e06aab700c14745a4e42d799ecd82d61b5d",
            "authorityMeshRun": 33245611088,
            "authorityMeshResult": "PASS_COMPOSED_AUTHORITY_MESH",
            "authorityMeshRequestDigest": "88ba63f1b9b7f53303959fe5787d9797d80b9d040a9ec3dce9226e9ec858d366",
            "authorityMeshArtifact": 9712748475,
            "authorityMeshArtifactDigest": "17a6962fbb0effcdae367c6edd63e19f4f1443fe5bc87e5e593ac9647d506483",
            "mutationGateRun": 33245809384,
            "mutationGateResult": "PASS_ANTI_REWORK_GATE",
            "mutationGateDecisionDigest": "7b80ceb3d9ead090d8b6819e5ac077f5121e45a9fb892e086974a6075ac37b7b",
            "productSourceMutation": false,
            "productionCertified": false
          }
          JSON
          cat > "$RUNNER_TEMP/mobile-runtime-visual-evidence/EVIDENCE_BOUNDARY.md" <<'EOF'
          # PRISMA Mobile runtime/visual conformance evidence boundary

          This disposable GitHub Actions carrier verifies the exact canonical source at `main@71387e06aab700c14745a4e42d799ecd82d61b5d` on an ephemeral loopback runner.

          It may prove isolated runtime rendering, canonical seven-tab navigation, responsive layout observations, loading/error/stale runtime behavior, deterministic contract-fixture rendering for readiness levels, basic keyboard/ARIA behavior, source invariants, and captured browser diagnostics.

          It does **not** prove hosted production, customer production data, signed-session production auth, offline operational data, real Tablet/PC upstream availability, sync correctness, licensing correctness, custody/zero-egress, deployment, distribution, or production certification.

          Deterministic readiness fixtures are explicitly marked `fixture=true`; they exercise the current runtime UI against a contract-valid envelope derived from the runner's own real snapshot response. They do not certify upstream business semantics.
          EOF

      - name: Install repository dependencies
        id: install
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      - name: Run current Mobile source gates
        id: static
        shell: bash
        run: |
          set -euo pipefail
          pnpm -C "$MOBILE_ROOT" run verify:interface-canon | tee "$RUNNER_TEMP/mobile-runtime-visual-evidence/verify-interface-canon.log"
          pnpm -C "$MOBILE_ROOT" run verify:premium-navigation | tee "$RUNNER_TEMP/mobile-runtime-visual-evidence/verify-premium-navigation.log"
          pnpm -C "$MOBILE_ROOT" run verify:data-readiness | tee "$RUNNER_TEMP/mobile-runtime-visual-evidence/verify-data-readiness.log"
          pnpm -C "$MOBILE_ROOT" run verify:source-states | tee "$RUNNER_TEMP/mobile-runtime-visual-evidence/verify-source-states.log"
          pnpm -C "$MOBILE_ROOT" run typecheck | tee "$RUNNER_TEMP/mobile-runtime-visual-evidence/typecheck.log"
          pnpm -C "$MOBILE_ROOT" run build | tee "$RUNNER_TEMP/mobile-runtime-visual-evidence/build.log"
          rm -rf "$MOBILE_ROOT/.next"

      - name: Install isolated browser harness
        id: browser_install
        shell: bash
        run: |
          set -euo pipefail
          PW_ROOT="$RUNNER_TEMP/mobile-pw"
          mkdir -p "$PW_ROOT"
          cd "$PW_ROOT"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.0 axe-core@4.10.3
          npx playwright install --with-deps chromium

      - name: Start only runner-owned Mobile dev server
        id: server
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/mobile-runtime-visual-evidence/mobile-dev.log"
          (
            cd "$MOBILE_ROOT"
            nohup pnpm exec next dev --webpack -H 127.0.0.1 -p 3140 >"$LOG" 2>&1 &
            echo $! > "$RUNNER_TEMP/mobile.pid"
          )
          for i in $(seq 1 90); do
            if curl -fsS "$BASE_URL/prisma-app" >/dev/null 2>&1; then
              echo "MOBILE_LOOPBACK_READY"
              exit 0
            fi
            sleep 1
          done
          echo "MOBILE_LOOPBACK_NOT_READY"
          cat "$LOG" || true
          exit 1

      - name: Materialize ephemeral Playwright verifier
        id: materialize
        shell: bash
        run: |
          set -euo pipefail
          PW_ROOT="$RUNNER_TEMP/mobile-pw"
          cat > "$PW_ROOT/mobile-runtime-visual-cert.mjs" <<'JS'
          import { chromium } from 'playwright';
          import { createHash } from 'node:crypto';
          import { createRequire } from 'node:module';
          import fs from 'node:fs';
          import path from 'node:path';

          const require = createRequire(import.meta.url);
          const axePath = require.resolve('axe-core/axe.min.js');
          const axeSource = fs.readFileSync(axePath, 'utf8');
          const BASE = process.env.BASE_URL || 'http://127.0.0.1:3140';
          const OUT = process.env.EVIDENCE_DIR;
          const SHOTS = path.join(OUT, 'screenshots');
          fs.mkdirSync(SHOTS, { recursive: true });

          const EXPECTED_TABS = ['Inicio', 'Ventas', 'Operación', 'Licencias', 'Alertas', 'Stock', 'Sistema'];
          const RETIRED_TOP_LEVEL = ['Hoy', 'Caja', 'Inventario', 'Reportes', 'MultiSucursal', 'Resumen', 'Sync', 'Mando', 'Command Center', 'Action Inbox', 'Daily Brief', 'Decision Ledger', 'Pulse Timeline', 'Health Radar'];
          const VIEWPORTS = [
            { name: 'phone390', width: 390, height: 844 },
            { name: 'phone430', width: 430, height: 932 }
          ];

          const report = {
            schemaVersion: 'prisma.mobile.runtime-visual-conformance.v1',
            canonicalHead: process.env.BASE_SHA,
            runner: 'github-actions-ubuntu-24.04',
            productionCertified: false,
            sourceMutation: false,
            expectedTabs: EXPECTED_TABS,
            actualRuntimeApi: null,
            scenarios: [],
            diagnostics: { consoleErrors: [], pageErrors: [], requestFailures: [], httpFailures: [] },
            accessibility: [],
            hardFailures: [],
            verdict: 'UNKNOWN'
          };

          const clean = (value) => String(value ?? '').replace(/\s+/g, ' ').trim();
          const short = (value) => clean(value).slice(0, 700);
          const pushFailure = (code, detail = '') => report.hardFailures.push({ code, detail: short(detail) });
          const safePath = (raw) => {
            try {
              const u = new URL(raw);
              return u.origin === new URL(BASE).origin ? `${u.pathname}${u.search}` : `${u.origin}${u.pathname}`;
            } catch { return short(raw); }
          };

          async function fetchRealEnvelope() {
            const response = await fetch(`${BASE}/api/mobile/snapshot`, { headers: { Accept: 'application/json' } });
            const text = await response.text();
            const digest = createHash('sha256').update(text).digest('hex');
            let body = null;
            try { body = JSON.parse(text); } catch {}
            report.actualRuntimeApi = {
              status: response.status,
              ok: response.ok,
              contentType: response.headers.get('content-type'),
              bodySha256: digest,
              contractOk: body?.ok === true,
              source: body?.meta?.source ?? null,
              runtimeMode: body?.meta?.runtimeMode ?? null,
              readinessLevel: body?.data?.summary?.dataReadiness?.level ?? null,
              rawPayloadPersisted: false
            };
            fs.writeFileSync(path.join(OUT, 'runtime-api-meta.json'), JSON.stringify(report.actualRuntimeApi, null, 2));
            if (!response.ok || body?.ok !== true || !body?.data?.summary?.dataReadiness) {
              pushFailure('REAL_SNAPSHOT_CONTRACT_UNAVAILABLE', `HTTP ${response.status}`);
              return null;
            }
            return body;
          }

          function stateFixture(baseEnvelope, level) {
            const fixture = structuredClone(baseEnvelope);
            fixture.meta.generatedAt = new Date().toISOString();
            fixture.meta.source = 'api-snapshot';
            fixture.meta.runtimeMode = level === 'partial' ? 'partial' : 'live';
            const r = fixture.data.summary.dataReadiness;
            r.level = level;
            const copy = {
              ready: ['Datos listos', 'Lectura operativa disponible', 'Fixture contractual de render listo.'],
              partial: ['Lectura parcial', 'Hay señales parciales', 'Fixture contractual de render parcial.'],
              empty: ['Sin actividad disponible', 'No hay actividad en la lectura', 'Fixture contractual de render vacío.']
            }[level];
            r.label = copy[0];
            r.headline = copy[1];
            r.detail = copy[2];
            r.sourceSummary = `Fixture contractual ${level}; no certifica upstreams reales.`;
            return fixture;
          }

          function wireDiagnostics(page, scenarioId) {
            page.on('console', (msg) => {
              if (msg.type() === 'error') report.diagnostics.consoleErrors.push({ scenarioId, text: short(msg.text()) });
            });
            page.on('pageerror', (error) => report.diagnostics.pageErrors.push({ scenarioId, text: short(error?.message || error) }));
            page.on('requestfailed', (request) => report.diagnostics.requestFailures.push({ scenarioId, url: safePath(request.url()), error: short(request.failure()?.errorText) }));
            page.on('response', (response) => {
              const status = response.status();
              if (status >= 400) report.diagnostics.httpFailures.push({ scenarioId, status, url: safePath(response.url()) });
            });
          }

          async function waitForNavigator(page) {
            await page.waitForFunction(() => {
              const tabs = document.querySelectorAll('[role="tab"]');
              return tabs.length === 7 || Boolean(document.querySelector('[data-prisma-zone="mobile-error-state"]'));
            }, null, { timeout: 25000 });
          }

          async function readTabs(page) {
            return page.locator('[role="tab"]').allTextContents().then((items) => items.map(clean));
          }

          async function assertLayout(page, viewportName, scenarioId) {
            const metrics = await page.evaluate(() => ({
              innerWidth: window.innerWidth,
              scrollWidth: document.documentElement.scrollWidth,
              bodyScrollWidth: document.body?.scrollWidth ?? 0,
              rootState: document.querySelector('[data-prisma-product="mobile"]')?.getAttribute('data-prisma-state') ?? null,
              stale: document.querySelector('[data-prisma-product="mobile"]')?.getAttribute('data-prisma-stale') ?? null,
              readiness: document.querySelector('[data-prisma-product="mobile"]')?.getAttribute('data-prisma-readiness') ?? null
            }));
            if (metrics.scrollWidth > metrics.innerWidth + 1 || metrics.bodyScrollWidth > metrics.innerWidth + 1) {
              pushFailure('HORIZONTAL_OVERFLOW', `${scenarioId}/${viewportName}: ${JSON.stringify(metrics)}`);
            }
            return metrics;
          }

          async function runAxe(page, scenarioId, viewportName) {
            await page.addScriptTag({ content: axeSource });
            const result = await page.evaluate(async () => {
              const r = await window.axe.run(document, { resultTypes: ['violations'] });
              return r.violations.map((v) => ({
                id: v.id,
                impact: v.impact,
                help: v.help,
                nodeCount: v.nodes.length,
                targets: v.nodes.slice(0, 5).map((n) => n.target)
              }));
            });
            report.accessibility.push({ scenarioId, viewportName, violations: result });
            for (const v of result.filter((item) => item.impact === 'serious' || item.impact === 'critical')) {
              pushFailure('AXE_SERIOUS_OR_CRITICAL', `${scenarioId}/${viewportName}: ${v.id} (${v.nodeCount})`);
            }
          }

          async function certifySevenTabs(browser, envelope, viewport) {
            const scenarioId = `real-runtime-${viewport.name}`;
            const context = await browser.newContext({ viewport: { width: viewport.width, height: viewport.height }, reducedMotion: 'reduce' });
            const page = await context.newPage();
            wireDiagnostics(page, scenarioId);
            await page.goto(`${BASE}/prisma-app`, { waitUntil: 'domcontentloaded', timeout: 30000 });
            await waitForNavigator(page);
            const tabs = await readTabs(page);
            if (JSON.stringify(tabs) !== JSON.stringify(EXPECTED_TABS)) pushFailure('CANONICAL_TAB_ORDER_MISMATCH', `${scenarioId}: ${JSON.stringify(tabs)}`);
            const retiredMounted = tabs.filter((tab) => RETIRED_TOP_LEVEL.includes(tab));
            if (retiredMounted.length) pushFailure('RETIRED_TOP_LEVEL_TAB_MOUNTED', retiredMounted.join(', '));
            const forbiddenText = await page.getByText('Todas las sucursales', { exact: true }).count();
            if (forbiddenText) pushFailure('RETIRED_MULTICONTEXT_VISIBLE', `${scenarioId}: Todas las sucursales`);

            const firstTab = page.getByRole('tab', { name: 'Inicio', exact: true });
            await firstTab.focus();
            await page.keyboard.press('ArrowRight');
            const focusedAfterRight = clean(await page.evaluate(() => document.activeElement?.textContent));
            if (focusedAfterRight !== 'Ventas') pushFailure('TAB_KEYBOARD_ARROW_RIGHT', `${scenarioId}: focused=${focusedAfterRight}`);
            await page.keyboard.press('Home');
            const focusedAfterHome = clean(await page.evaluate(() => document.activeElement?.textContent));
            if (focusedAfterHome !== 'Inicio') pushFailure('TAB_KEYBOARD_HOME', `${scenarioId}: focused=${focusedAfterHome}`);
            await page.keyboard.press('End');
            const focusedAfterEnd = clean(await page.evaluate(() => document.activeElement?.textContent));
            if (focusedAfterEnd !== 'Sistema') pushFailure('TAB_KEYBOARD_END', `${scenarioId}: focused=${focusedAfterEnd}`);

            const shots = [];
            for (const label of EXPECTED_TABS) {
              const tab = page.getByRole('tab', { name: label, exact: true });
              await tab.click();
              await page.waitForTimeout(120);
              const selected = await tab.getAttribute('aria-selected');
              if (selected !== 'true') pushFailure('TAB_ARIA_SELECTED_MISMATCH', `${scenarioId}/${label}: ${selected}`);
              const file = `${scenarioId}-${label.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-')}.png`;
              await page.screenshot({ path: path.join(SHOTS, file), fullPage: true });
              shots.push(file);
            }
            const metrics = await assertLayout(page, viewport.name, scenarioId);
            await runAxe(page, scenarioId, viewport.name);
            report.scenarios.push({ id: scenarioId, fixture: false, kind: 'isolated-real-runtime', viewport, tabs, screenshots: shots, metrics, pass: true });
            await context.close();
          }

          async function captureFixtureState(browser, baseEnvelope, level) {
            const viewport = VIEWPORTS[0];
            const scenarioId = `contract-fixture-${level}`;
            const fixture = stateFixture(baseEnvelope, level);
            const context = await browser.newContext({ viewport: { width: viewport.width, height: viewport.height } });
            await context.route('**/api/mobile/snapshot', async (route) => {
              await route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify(fixture) });
            });
            const page = await context.newPage();
            wireDiagnostics(page, scenarioId);
            await page.goto(`${BASE}/prisma-app`, { waitUntil: 'domcontentloaded', timeout: 30000 });
            await waitForNavigator(page);
            const tabs = await readTabs(page);
            if (tabs.length !== 7) pushFailure('FIXTURE_NAVIGATOR_NOT_RENDERED', `${scenarioId}: ${JSON.stringify(tabs)}`);
            const rootReadiness = await page.locator('[data-prisma-product="mobile"]').getAttribute('data-prisma-readiness');
            if (rootReadiness !== level) pushFailure('FIXTURE_READINESS_NOT_PROJECTED', `${scenarioId}: ${rootReadiness}`);
            const file = `${scenarioId}.png`;
            await page.screenshot({ path: path.join(SHOTS, file), fullPage: true });
            const metrics = await assertLayout(page, viewport.name, scenarioId);
            report.scenarios.push({ id: scenarioId, fixture: true, claim: 'render-only-contract-fixture', requestedLevel: level, observedLevel: rootReadiness, screenshot: file, metrics });
            await context.close();
          }

          async function captureLoading(browser, baseEnvelope) {
            const viewport = VIEWPORTS[0];
            const scenarioId = 'loading-delayed-snapshot-fixture';
            const context = await browser.newContext({ viewport: { width: viewport.width, height: viewport.height } });
            await context.route('**/api/mobile/snapshot', async (route) => {
              await new Promise((resolve) => setTimeout(resolve, 2600));
              await route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify(baseEnvelope) });
            });
            const page = await context.newPage();
            wireDiagnostics(page, scenarioId);
            await page.goto(`${BASE}/prisma-app`, { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForSelector('[data-prisma-state="loading"]', { timeout: 5000 });
            const file = `${scenarioId}.png`;
            await page.screenshot({ path: path.join(SHOTS, file), fullPage: true });
            report.scenarios.push({ id: scenarioId, fixture: true, claim: 'loading-boundary-render', screenshot: file });
            await page.waitForFunction(() => document.querySelectorAll('[role="tab"]').length === 7, null, { timeout: 10000 });
            await context.close();
          }

          async function captureError(browser) {
            const viewport = VIEWPORTS[0];
            const scenarioId = 'error-snapshot-503-fixture';
            const context = await browser.newContext({ viewport: { width: viewport.width, height: viewport.height } });
            await context.route('**/api/mobile/snapshot', (route) => route.fulfill({ status: 503, contentType: 'application/json', body: JSON.stringify({ ok: false, error: { code: 'FIXTURE_503' } }) }));
            const page = await context.newPage();
            wireDiagnostics(page, scenarioId);
            await page.goto(`${BASE}/prisma-app`, { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForSelector('[data-prisma-state="error"]', { timeout: 15000 });
            const file = `${scenarioId}.png`;
            await page.screenshot({ path: path.join(SHOTS, file), fullPage: true });
            const retryCount = await page.getByRole('button', { name: 'Reintentar snapshot' }).count();
            const clearCount = await page.getByRole('button', { name: 'Limpiar cache y reintentar' }).count();
            if (retryCount !== 1 || clearCount !== 1) pushFailure('ERROR_RECOVERY_ACTIONS_MISSING', `retry=${retryCount} clear=${clearCount}`);
            report.scenarios.push({ id: scenarioId, fixture: true, claim: 'error-boundary-render', screenshot: file, expectedHttp503: true });
            await context.close();
          }

          async function captureStale(browser, baseEnvelope) {
            const viewport = VIEWPORTS[0];
            const scenarioId = 'stale-memory-cache-after-refresh-failure';
            const context = await browser.newContext({ viewport: { width: viewport.width, height: viewport.height } });
            const page = await context.newPage();
            wireDiagnostics(page, scenarioId);
            await page.goto(`${BASE}/prisma-app`, { waitUntil: 'domcontentloaded', timeout: 30000 });
            await waitForNavigator(page);
            await page.route('**/api/mobile/snapshot', (route) => route.fulfill({ status: 503, contentType: 'application/json', body: JSON.stringify({ ok: false, error: { code: 'FIXTURE_REFRESH_503' } }) }));
            await page.getByRole('button', { name: 'Actualizar', exact: true }).first().click();
            await page.waitForFunction(() => document.querySelector('[data-prisma-product="mobile"]')?.getAttribute('data-prisma-stale') === 'true', null, { timeout: 12000 });
            const stale = await page.locator('[data-prisma-product="mobile"]').getAttribute('data-prisma-stale');
            const file = `${scenarioId}.png`;
            await page.screenshot({ path: path.join(SHOTS, file), fullPage: true });
            if (stale !== 'true') pushFailure('STALE_CACHE_NOT_EXPOSED', `observed=${stale}`);
            report.scenarios.push({ id: scenarioId, fixture: true, claim: 'real-client-memory-cache-fallback-after-injected-refresh-failure', screenshot: file, stale });
            await context.close();
          }

          let browser;
          try {
            const realEnvelope = await fetchRealEnvelope();
            if (!realEnvelope) throw new Error('real snapshot unavailable');
            browser = await chromium.launch({ headless: true });
            for (const viewport of VIEWPORTS) await certifySevenTabs(browser, realEnvelope, viewport);
            for (const level of ['ready', 'partial', 'empty']) await captureFixtureState(browser, realEnvelope, level);
            await captureLoading(browser, realEnvelope);
            await captureError(browser);
            await captureStale(browser, realEnvelope);
          } catch (error) {
            pushFailure('HARNESS_EXCEPTION', error?.stack || error?.message || String(error));
          } finally {
            if (browser) await browser.close();
          }

          const expectedFixtureHttpFailures = report.diagnostics.httpFailures.filter((item) =>
            ['error-snapshot-503-fixture', 'stale-memory-cache-after-refresh-failure'].includes(item.scenarioId) && item.status === 503 && item.url.includes('/api/mobile/snapshot')
          );
          const unexpectedHttpFailures = report.diagnostics.httpFailures.filter((item) => !expectedFixtureHttpFailures.includes(item));
          const unexpectedRequestFailures = report.diagnostics.requestFailures.filter((item) => item.scenarioId !== 'loading-delayed-snapshot-fixture');
          if (report.diagnostics.pageErrors.length) pushFailure('UNEXPECTED_PAGEERROR', JSON.stringify(report.diagnostics.pageErrors));
          if (report.diagnostics.consoleErrors.length) pushFailure('UNEXPECTED_CONSOLE_ERROR', JSON.stringify(report.diagnostics.consoleErrors));
          if (unexpectedRequestFailures.length) pushFailure('UNEXPECTED_REQUEST_FAILURE', JSON.stringify(unexpectedRequestFailures));
          if (unexpectedHttpFailures.length) pushFailure('UNEXPECTED_HTTP_FAILURE', JSON.stringify(unexpectedHttpFailures));

          report.diagnostics.expectedFixtureHttpFailures = expectedFixtureHttpFailures;
          report.verdict = report.hardFailures.length === 0 ? 'PASS_MOBILE_RUNTIME_VISUAL_CONFORMANCE_ISOLATED' : 'FAIL_MOBILE_RUNTIME_VISUAL_CONFORMANCE';
          fs.writeFileSync(path.join(OUT, 'RESULT.json'), JSON.stringify(report, null, 2));
          fs.writeFileSync(path.join(OUT, 'RESULT.md'), [
            '# PRISMA Mobile runtime/visual conformance',
            '',
            `**Verdict:** ${report.verdict}`,
            `**Canonical head:** ${report.canonicalHead}`,
            `**Actual isolated runtime mode:** ${report.actualRuntimeApi?.runtimeMode ?? 'unknown'}`,
            `**Actual readiness:** ${report.actualRuntimeApi?.readinessLevel ?? 'unknown'}`,
            `**Scenarios:** ${report.scenarios.length}`,
            `**Hard failures:** ${report.hardFailures.length}`,
            '',
            'This result is isolated runtime/visual evidence only. It is not hosted-production certification and does not certify auth, sync, licensing, custody, zero-egress, offline operational data, or deployment.'
          ].join('\n') + '\n');
          console.log(JSON.stringify({ verdict: report.verdict, scenarios: report.scenarios.length, hardFailures: report.hardFailures }, null, 2));
          if (report.hardFailures.length) process.exit(1);
          JS

      - name: Run isolated runtime and visual certification
        id: visual
        continue-on-error: true
        shell: bash
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/mobile-runtime-visual-evidence
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mobile-pw"
          node mobile-runtime-visual-cert.mjs

      - name: Prove Mobile product source remained untouched
        id: source_guard
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git diff --exit-code -- "$MOBILE_ROOT"
          test -z "$(git status --porcelain --untracked-files=no -- "$MOBILE_ROOT")"
          git status --short --branch > "$RUNNER_TEMP/mobile-runtime-visual-evidence/git-status.txt"
          git diff --name-only > "$RUNNER_TEMP/mobile-runtime-visual-evidence/source-diff.txt"

      - name: Stop only runner-owned Mobile process
        if: always()
        shell: bash
        run: |
          set +e
          if [ -f "$RUNNER_TEMP/mobile.pid" ]; then
            PID="$(cat "$RUNNER_TEMP/mobile.pid")"
            if kill -0 "$PID" 2>/dev/null; then
              kill "$PID"
              for i in $(seq 1 10); do
                kill -0 "$PID" 2>/dev/null || break
                sleep 1
              done
            fi
          fi
          exit 0

      - name: Upload single evidence artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-runtime-visual-conformance-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/mobile-runtime-visual-evidence/**

      - name: Fail closed unless every required gate passed
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.scope.outcome }}" = "success"
          test "${{ steps.install.outcome }}" = "success"
          test "${{ steps.static.outcome }}" = "success"
          test "${{ steps.browser_install.outcome }}" = "success"
          test "${{ steps.server.outcome }}" = "success"
          test "${{ steps.materialize.outcome }}" = "success"
          test "${{ steps.visual.outcome }}" = "success"
          test "${{ steps.source_guard.outcome }}" = "success"
          grep -F '"verdict": "PASS_MOBILE_RUNTIME_VISUAL_CONFORMANCE_ISOLATED"' "$RUNNER_TEMP/mobile-runtime-visual-evidence/RESULT.json"
