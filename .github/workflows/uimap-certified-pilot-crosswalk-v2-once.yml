name: UIMAP Certified Pilot Crosswalk V2 Once

on:
  push:
    branches:
      - agent/prisma-html-three-app-visual-closure
    paths:
      - .github/workflows/uimap-certified-pilot-crosswalk-v2-once.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: tools/code-atlas/src
  EXPECTED_PARENT: f49c73118abb7a9a26d115755e7291219d77e243
  EXPECTED_RUNNER_BLOB: 76ec89e8339e933a587bd625909341853117ef8e
  EXPECTED_PROMOTION_BLOB: f0f84e4b3c38585bb4ee0dbe4dc20d0ea075a420
  EXPECTED_HELPER_BLOB: 66f13ee5612037e46310bfdf24f0b119d4685eff

jobs:
  crosswalk-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact transaction branch
        uses: actions/checkout@v6
        with:
          ref: agent/prisma-html-three-app-visual-closure
          fetch-depth: 2
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Fail closed on preimage drift
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git hash-object tools/code-atlas/src/code_atlas/app_map/uimap/runner.py)" = "$EXPECTED_RUNNER_BLOB"
          test "$(git hash-object tools/code-atlas/src/code_atlas/ui_bridge/binding_promotion.py)" = "$EXPECTED_PROMOTION_BLOB"
          test "$(git hash-object tools/code-atlas/src/code_atlas/app_map/uimap/governed_markers.py)" = "$EXPECTED_HELPER_BLOB"
          test ! -e tools/code-atlas/tests/test_operational_uimap_certified_pilot_crosswalk.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Replace helper with certified pilot alias crosswalk producer
        shell: bash
        run: |
          set -euo pipefail
          cat > tools/code-atlas/src/code_atlas/app_map/uimap/governed_markers.py <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path
          from typing import Any, Iterable

          CERTIFIED_PILOT_STATUSES = {"EXACT_TARGET_AUTHORIZED_FOR_GOVERNED_APPLICATION"}

          MARKER_TO_PILOT_FIELD = {
              "data-prisma-route": "runtimeRoute",
              "data-prisma-owner": "ownerSymbol",
              "data-prisma-region": "regionId",
              "data-prisma-slot": "slotId",
              "data-prisma-component-ui-id": "componentUiId",
              "data-prisma-recipe": "recipeId",
              "data-prisma-visual-stack": "visualStackId",
              "data-prisma-binding": "bindingId",
              "data-prisma-adapter": "adapterId",
              "data-prisma-neutral-layer": "neutralLayerId",
          }


          def _sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest().upper()


          def _repo_rel(root: Path, path: Path) -> str:
              try:
                  return path.resolve().relative_to(root.resolve()).as_posix()
              except Exception:
                  return path.as_posix()


          def _pilot_contract_paths(product_root: Path) -> Iterable[Path]:
              seen: set[Path] = set()
              for products in (
                  product_root / "apps/terminal-de-venta-system/products",
                  product_root / "products",
              ):
                  if not products.is_dir():
                      continue
                  for path in sorted(products.glob("*/app/docs/visual-pilots/*.contract.json")):
                      resolved = path.resolve()
                      if resolved in seen or not resolved.is_file():
                          continue
                      seen.add(resolved)
                      yield resolved


          def load_certified_pilot_contracts(product_root: Path) -> dict[str, list[dict[str, Any]]]:
              root = product_root.resolve()
              index: dict[str, list[dict[str, Any]]] = {}
              for path in _pilot_contract_paths(root):
                  try:
                      payload = json.loads(path.read_text(encoding="utf-8"))
                  except Exception:
                      continue
                  if not isinstance(payload, dict) or payload.get("status") not in CERTIFIED_PILOT_STATUSES:
                      continue
                  pilot = payload.get("pilot")
                  if not isinstance(pilot, dict):
                      continue
                  alias_id = str(pilot.get("componentUiId") or "").strip()
                  if not alias_id:
                      continue
                  index.setdefault(alias_id, []).append({
                      "contractPath": _repo_rel(root, path),
                      "contractHash": _sha256(path),
                      "contractSchema": payload.get("schema"),
                      "contractStatus": payload.get("status"),
                      "taskId": payload.get("taskId"),
                      "pilot": pilot,
                  })
              for alias_id in list(index):
                  index[alias_id] = sorted(index[alias_id], key=lambda row: (str(row["contractPath"]), str(row["contractHash"])))
              return index


          def _conflict(alias_id: str, candidate: Any, reasons: list[str]) -> dict[str, Any]:
              return {
                  "conflictType": "CERTIFIED_VISUAL_PILOT_CROSSWALK_BLOCKED",
                  "aliasId": alias_id,
                  "runtimeAlias": str(getattr(candidate, "runtime_alias", "") or ""),
                  "routePath": str(getattr(candidate, "route_path", "") or ""),
                  "ownerFile": str(getattr(candidate, "owner_file", "") or ""),
                  "blockingReasons": sorted(set(reasons)),
                  "resolution": "ALIAS_WITHHELD",
              }


          def certified_pilot_alias_for_candidate(
              candidate: Any,
              css_targets: list[Any],
              canonical_record: dict[str, Any],
              pilot_index: dict[str, list[dict[str, Any]]],
          ) -> tuple[dict[str, Any] | None, dict[str, Any] | None]:
              """Crosswalk one certified visual-pilot identity to canonical UIMAP.

              The pilot ID never replaces canonical UIMAP identity. Raw markers only
              activate validation; exact source/route/style/contract agreement is
              required before an alias is emitted.
              """
              attrs = dict(getattr(candidate, "data_attributes", {}) or {})
              pilot_ref = str(attrs.get("data-prisma-visual-pilot") or "").strip()
              if not pilot_ref:
                  return None, None

              marker_route = str(attrs.get("data-prisma-route") or "").strip()
              candidate_route = str(getattr(candidate, "route_path", "") or "")
              if marker_route and marker_route != candidate_route:
                  # Shared source legitimately projected through a different route.
                  return None, None

              alias_id = str(attrs.get("data-prisma-component-ui-id") or "").strip()
              if not alias_id:
                  return None, _conflict("", candidate, ["CERTIFIED_PILOT_COMPONENT_UI_ID_MARKER_MISSING"])

              matches = list(pilot_index.get(alias_id) or [])
              if not matches:
                  return None, _conflict(alias_id, candidate, ["CERTIFIED_PILOT_CONTRACT_NOT_FOUND"])
              if len(matches) != 1:
                  return None, _conflict(alias_id, candidate, ["CERTIFIED_PILOT_CONTRACT_AMBIGUOUS"])

              contract = matches[0]
              pilot = dict(contract.get("pilot") or {})
              blockers: list[str] = []
              for marker, field in MARKER_TO_PILOT_FIELD.items():
                  actual = str(attrs.get(marker) or "").strip()
                  expected = str(pilot.get(field) or "").strip()
                  if not actual:
                      blockers.append(f"CERTIFIED_PILOT_MARKER_MISSING:{marker}")
                  elif not expected or actual != expected:
                      blockers.append(f"CERTIFIED_PILOT_MARKER_MISMATCH:{marker}")

              runtime_alias = str(getattr(candidate, "runtime_alias", "") or "")
              if str(attrs.get("data-prisma-surface") or "").strip() != runtime_alias:
                  blockers.append("CERTIFIED_PILOT_SURFACE_MARKER_MISMATCH")
              if not str(pilot.get("surfaceId") or "").startswith(f"SURF.{runtime_alias}."):
                  blockers.append("CERTIFIED_PILOT_SURFACE_RUNTIME_MISMATCH")
              if candidate_route != str(pilot.get("runtimeRoute") or ""):
                  blockers.append("CERTIFIED_PILOT_ROUTE_PATH_MISMATCH")
              if str(getattr(candidate, "route_id", "") or "") != str(pilot.get("routeId") or ""):
                  blockers.append("CERTIFIED_PILOT_ROUTE_ID_MISMATCH")
              if str(getattr(candidate, "owner_file", "") or "") != str(pilot.get("sourceOwner") or ""):
                  blockers.append("CERTIFIED_PILOT_SOURCE_OWNER_MISMATCH")

              source_owner_marker = str(attrs.get("data-prisma-source-owner") or "").strip()
              if source_owner_marker != Path(str(pilot.get("sourceOwner") or "")).name:
                  blockers.append("CERTIFIED_PILOT_SOURCE_OWNER_MARKER_MISMATCH")
              css_owner_marker = str(attrs.get("data-prisma-css-owner") or "").strip()
              if css_owner_marker != Path(str(pilot.get("cssOwner") or "")).name:
                  blockers.append("CERTIFIED_PILOT_CSS_OWNER_MARKER_MISMATCH")
              style_sources = {str(getattr(target, "source_file", "") or "") for target in css_targets}
              if str(pilot.get("cssOwner") or "") not in style_sources:
                  blockers.append("CERTIFIED_PILOT_CSS_OWNER_NOT_OBSERVED")

              if str(canonical_record.get("runtimeAlias") or "") != runtime_alias:
                  blockers.append("CERTIFIED_PILOT_CANONICAL_RUNTIME_MISMATCH")
              if str(canonical_record.get("routeId") or "") != str(pilot.get("routeId") or ""):
                  blockers.append("CERTIFIED_PILOT_CANONICAL_ROUTE_MISMATCH")
              if str(canonical_record.get("ownerFile") or "") != str(pilot.get("sourceOwner") or ""):
                  blockers.append("CERTIFIED_PILOT_CANONICAL_SOURCE_OWNER_MISMATCH")

              canonical_ui_id = str(canonical_record.get("componentUiId") or "").strip()
              canonical_component_id = str(canonical_record.get("componentId") or "").strip()
              if not canonical_ui_id or not canonical_component_id:
                  blockers.append("CERTIFIED_PILOT_CANONICAL_TARGET_INCOMPLETE")
              if alias_id == canonical_ui_id:
                  blockers.append("CERTIFIED_PILOT_ALIAS_EQUALS_CANONICAL_ID")

              if blockers:
                  return None, _conflict(alias_id, candidate, blockers)

              evidence_refs = [{
                  "evidenceType": "CERTIFIED_VISUAL_PILOT_CONTRACT",
                  "sourceFile": str(contract["contractPath"]),
                  "sourceHash": str(contract["contractHash"]),
              }, {
                  "evidenceType": "RENDER_SOURCE",
                  "sourceFile": str(getattr(candidate, "render_source_file", "") or ""),
                  "sourceHash": str(getattr(candidate, "source_hash", "") or ""),
              }]
              for target in sorted(css_targets, key=lambda item: (str(getattr(item, "source_file", "")), str(getattr(item, "selector", "")))):
                  if str(getattr(target, "source_file", "") or "") == str(pilot.get("cssOwner") or ""):
                      evidence_refs.append({
                          "evidenceType": "STYLE_SOURCE",
                          "sourceFile": str(getattr(target, "source_file", "") or ""),
                          "sourceHash": str(getattr(target, "source_hash", "") or ""),
                          "selector": str(getattr(target, "selector", "") or ""),
                      })

              return {
                  "aliasId": alias_id,
                  "aliasKind": "componentUiId",
                  "canonicalComponentUiId": canonical_ui_id,
                  "canonicalId": canonical_ui_id,
                  "canonicalComponentId": canonical_component_id,
                  "canonicalOwnerFile": str(canonical_record.get("ownerFile") or ""),
                  "reason": "CERTIFIED_VISUAL_PILOT_CROSSWALK",
                  "status": "CERTIFIED",
                  "pilotRef": pilot_ref,
                  "pilotContractPath": str(contract["contractPath"]),
                  "pilotContractHash": str(contract["contractHash"]),
                  "evidenceRefs": evidence_refs,
                  "pilotTrace": {
                      "surfaceId": pilot.get("surfaceId"),
                      "routeId": pilot.get("routeId"),
                      "runtimeRoute": pilot.get("runtimeRoute"),
                      "ownerId": pilot.get("ownerId"),
                      "ownerSymbol": pilot.get("ownerSymbol"),
                      "regionId": pilot.get("regionId"),
                      "slotId": pilot.get("slotId"),
                      "componentUiId": pilot.get("componentUiId"),
                      "bindingId": pilot.get("bindingId"),
                      "layerId": pilot.get("neutralLayerId"),
                      "implementationLayerId": pilot.get("implementationLayerId"),
                      "adapterId": pilot.get("adapterId"),
                      "recipeId": pilot.get("recipeId"),
                      "visualStackId": pilot.get("visualStackId"),
                      "runtimeSelector": pilot.get("runtimeSelector"),
                      "sourceOwner": pilot.get("sourceOwner"),
                      "cssOwner": pilot.get("cssOwner"),
                  },
                  "canonicalTrace": {
                      "runtimeAlias": canonical_record.get("runtimeAlias"),
                      "surfaceId": canonical_record.get("surfaceId"),
                      "routeId": canonical_record.get("routeId"),
                      "routePath": canonical_record.get("routePath"),
                      "ownerId": canonical_record.get("ownerId"),
                      "regionId": canonical_record.get("regionId"),
                      "slotId": canonical_record.get("slotId"),
                      "componentId": canonical_record.get("componentId"),
                      "componentUiId": canonical_record.get("componentUiId"),
                      "adapterId": canonical_record.get("adapterId"),
                  },
              }, None
          PY

      - name: Patch UIMAP alias emission
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/code-atlas/src/code_atlas/app_map/uimap/runner.py')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}_PREIMAGE_MISMATCH:{count}')
              text = text.replace(old, new, 1)

          replace_once(
              '''    widget_type_id,\n)\n\nGOLDEN_BINDING_ID''',
              '''    widget_type_id,\n)\nfrom .governed_markers import (\n    certified_pilot_alias_for_candidate,\n    load_certified_pilot_contracts,\n)\n\nGOLDEN_BINDING_ID''',
              'IMPORT',
          )
          replace_once(
              '''    authority_index = build_authority_indexes(product, governor)\n    golden_trace, golden_evidence = discover_golden_trace(''',
              '''    authority_index = build_authority_indexes(product, governor)\n    certified_pilot_index = load_certified_pilot_contracts(product)\n    certified_pilot_aliases: list[dict[str, Any]] = []\n    certified_pilot_conflicts: list[dict[str, Any]] = []\n    golden_trace, golden_evidence = discover_golden_trace(''',
              'LOAD_PILOTS',
          )
          replace_once(
              '''            all_records.append(record)\n        for route in result["routes"]:''',
              '''            pilot_alias, pilot_conflict = certified_pilot_alias_for_candidate(\n                candidate,\n                targets,\n                record,\n                certified_pilot_index,\n            )\n            if pilot_alias:\n                certified_pilot_aliases.append(pilot_alias)\n            if pilot_conflict:\n                certified_pilot_conflicts.append(pilot_conflict)\n            all_records.append(record)\n        for route in result["routes"]:''',
              'CANDIDATE_CROSSWALK',
          )
          replace_once(
              '''    records, aliases, conflicts = deduplicate_records(all_records)\n    aliases = sorted(\n        aliases + golden_legacy_aliases(golden_trace),\n        key=lambda row: (str(row.get("aliasKind", "")), str(row.get("aliasId", ""))),\n    )''',
              '''    records, aliases, conflicts = deduplicate_records(all_records)\n    conflicts.extend(certified_pilot_conflicts)\n    canonical_records_by_ui = {\n        str(record["componentUiId"]): record\n        for record in records\n        if record.get("componentUiId")\n    }\n    certified_pilot_aliases = _normalize_aliases(\n        certified_pilot_aliases,\n        {},\n        canonical_records_by_ui,\n        conflicts,\n    )\n    aliases = sorted(\n        aliases + golden_legacy_aliases(golden_trace) + certified_pilot_aliases,\n        key=lambda row: (str(row.get("aliasKind", "")), str(row.get("aliasId", ""))),\n    )''',
              'ALIAS_COMPOSE',
          )
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Patch binding promotion alias awareness
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/code-atlas/src/code_atlas/ui_bridge/binding_promotion.py')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}_PREIMAGE_MISMATCH:{count}')
              text = text.replace(old, new, 1)

          replace_once(
              '''    return out\n\n\ndef _visual_target_errors''',
              '''    return out\n\n\ndef resolve_pilot_contracts(\n    repository: BridgeRepository,\n    pilot_contracts: dict[str, dict[str, Any]],\n) -> dict[str, dict[str, Any]]:\n    alias_rows: dict[str, list[dict[str, Any]]] = {}\n    for batch in repository.batches:\n        for alias in batch.get("aliases", []):\n            if not isinstance(alias, dict):\n                continue\n            alias_id = str(alias.get("aliasId") or "")\n            if alias_id:\n                alias_rows.setdefault(alias_id, []).append(alias)\n\n    buckets: dict[str, list[dict[str, Any]]] = {}\n    for pilot_component_ui_id, raw in sorted(pilot_contracts.items()):\n        canonical = repository.resolve_alias(pilot_component_ui_id)\n        certified = [\n            row for row in alias_rows.get(pilot_component_ui_id, [])\n            if row.get("reason") == "CERTIFIED_VISUAL_PILOT_CROSSWALK"\n            and str(row.get("canonicalComponentUiId") or "") == canonical\n        ]\n        row = dict(raw)\n        row["pilotComponentUiId"] = pilot_component_ui_id\n        row["canonicalComponentUiId"] = canonical\n        if canonical == pilot_component_ui_id:\n            row["identityResolution"] = "DIRECT_CANONICAL_ID"\n            row["aliasEvidence"] = []\n        elif len(certified) == 1:\n            row["identityResolution"] = "CERTIFIED_ALIAS_CROSSWALK"\n            row["aliasEvidence"] = certified\n        elif len(certified) > 1:\n            row["identityResolution"] = "AMBIGUOUS_CERTIFIED_ALIAS_CROSSWALK"\n            row["aliasEvidence"] = certified\n        else:\n            row["identityResolution"] = "UNVERIFIED_ALIAS_CROSSWALK"\n            row["aliasEvidence"] = []\n        buckets.setdefault(canonical, []).append(row)\n\n    resolved: dict[str, dict[str, Any]] = {}\n    for canonical, rows in sorted(buckets.items()):\n        if len(rows) == 1:\n            resolved[canonical] = rows[0]\n        else:\n            resolved[canonical] = {\n                "ambiguous": True,\n                "canonicalComponentUiId": canonical,\n                "pilots": rows,\n            }\n    return resolved\n\n\ndef _visual_target_errors''',
              'RESOLVE_PILOTS',
          )

          old_block = '''    component_ui_id = str(component.get("componentUiId") or "")\n    pilot = pilot_contracts.get(component_ui_id)\n    pilot_alignment: dict[str, Any] | None = None\n    if pilot:\n        pilot_row = pilot["pilot"]\n        comparisons = {\n            "routeId": (component.get("routeId"), pilot_row.get("routeId")),\n            "ownerId": (component.get("ownerId"), pilot_row.get("ownerId")),\n            "regionId": (component.get("regionId"), pilot_row.get("regionId")),\n            "slotId": (component.get("slotId"), pilot_row.get("slotId")),\n            "componentUiId": (\n                component.get("componentUiId"),\n                pilot_row.get("componentUiId"),\n            ),\n            "bindingId": (component.get("bindingId"), pilot_row.get("bindingId")),\n            "implementationLayerId": (\n                component.get("implementationLayerId"),\n                pilot_row.get("implementationLayerId"),\n            ),\n        }\n        mismatches = [\n            key\n            for key, (uimap_value, pilot_value) in comparisons.items()\n            if pilot_value is not None and uimap_value != pilot_value\n        ]\n        pilot_alignment = {\n            "contractPath": pilot["path"],\n            "contractSchema": pilot.get("schema"),\n            "contractStatus": pilot.get("status"),\n            "mismatches": mismatches,\n            "aligned": not mismatches,\n        }\n        if mismatches:\n            blockers.append("PILOT_CONTRACT_DRIFT:" + ",".join(sorted(mismatches)))\n'''
          new_block = '''    component_ui_id = str(component.get("componentUiId") or "")\n    pilot = pilot_contracts.get(component_ui_id)\n    pilot_alignment: dict[str, Any] | None = None\n    if pilot:\n        if pilot.get("ambiguous"):\n            pilot_alignment = {\n                "canonicalComponentUiId": component_ui_id,\n                "identityResolution": "AMBIGUOUS_PILOT_CROSSWALK",\n                "mismatches": ["ambiguousPilotCrosswalk"],\n                "aligned": False,\n            }\n            blockers.append("PILOT_ALIAS_CROSSWALK_AMBIGUOUS")\n        else:\n            pilot_row = pilot["pilot"]\n            visual_sources = {\n                str(target.get("styleSourceFile") or "")\n                for target in component.get("visualTargets", [])\n                if isinstance(target, dict)\n            }\n            identity_resolution = str(pilot.get("identityResolution") or "")\n            checks = {\n                "identityResolution": identity_resolution in {"DIRECT_CANONICAL_ID", "CERTIFIED_ALIAS_CROSSWALK"},\n                "routeId": component.get("routeId") == pilot_row.get("routeId"),\n                "routePath": component.get("routePath") == pilot_row.get("runtimeRoute"),\n                "ownerFile": component.get("ownerFile") == pilot_row.get("sourceOwner"),\n                "cssOwner": str(pilot_row.get("cssOwner") or "") in visual_sources,\n                "runtimeAlias": str(pilot_row.get("surfaceId") or "").startswith(f"SURF.{component.get('runtimeAlias')}."),\n                "aliasTarget": str(pilot.get("canonicalComponentUiId") or "") == component_ui_id,\n            }\n            mismatches = sorted(key for key, passed in checks.items() if not passed)\n            pilot_alignment = {\n                "contractPath": pilot["path"],\n                "contractSchema": pilot.get("schema"),\n                "contractStatus": pilot.get("status"),\n                "identityResolution": identity_resolution,\n                "pilotComponentUiId": pilot.get("pilotComponentUiId"),\n                "canonicalComponentUiId": pilot.get("canonicalComponentUiId"),\n                "canonicalCrosscheck": checks,\n                "pilotProjectionTrace": {\n                    "surfaceId": pilot_row.get("surfaceId"),\n                    "ownerId": pilot_row.get("ownerId"),\n                    "regionId": pilot_row.get("regionId"),\n                    "slotId": pilot_row.get("slotId"),\n                    "componentUiId": pilot_row.get("componentUiId"),\n                    "bindingId": pilot_row.get("bindingId"),\n                    "layerId": pilot_row.get("neutralLayerId"),\n                    "implementationLayerId": pilot_row.get("implementationLayerId"),\n                    "adapterId": pilot_row.get("adapterId"),\n                    "recipeId": pilot_row.get("recipeId"),\n                    "visualStackId": pilot_row.get("visualStackId"),\n                },\n                "mismatches": mismatches,\n                "aligned": not mismatches,\n            }\n            if mismatches:\n                blockers.append("PILOT_CONTRACT_DRIFT:" + ",".join(mismatches))\n'''
          replace_once(old_block, new_block, 'PILOT_ALIGNMENT')
          replace_once(
              '''    pilots = load_pilot_contracts(pilot_contract_paths)\n    rows = [''',
              '''    pilots = resolve_pilot_contracts(\n        repository,\n        load_pilot_contracts(pilot_contract_paths),\n    )\n    rows = [''',
              'BUILD_RESOLVED_PILOTS',
          )
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Add focused crosswalk regression
        shell: bash
        run: |
          set -euo pipefail
          cat > tools/code-atlas/tests/test_operational_uimap_certified_pilot_crosswalk.py <<'PY'
          from __future__ import annotations

          import json
          import tempfile
          import unittest
          from pathlib import Path

          from code_atlas.app_map.uimap.discovery import CssTarget, UiCandidate
          from code_atlas.app_map.uimap.governed_markers import (
              certified_pilot_alias_for_candidate,
              load_certified_pilot_contracts,
          )
          from code_atlas.ui_bridge.binding_promotion import evaluate_component, resolve_pilot_contracts
          from code_atlas.ui_bridge.repository import BridgeRepository

          SOURCE_OWNER = "apps/terminal-de-venta-system/products/pc/app/components/inventory/inventory-workspace.tsx"
          CSS_OWNER = "apps/terminal-de-venta-system/products/pc/app/components/inventory/pc-inventory-master-detail.module.css"
          PILOT_UI = "PC-STOCK-FICHA-PANEL-01"
          CANONICAL_UI = "PC-STOCK-MAIN-COMPONENTS-INVENTORY-INVENTORY-WORKSPACE-PRODUCT-FICHA-TAB-01"


          def pilot_payload() -> dict:
              return {
