      - name: Prove certified alias crosswalk without canonical drift
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from code_atlas.ui_bridge.repository import BridgeRepository

          root = Path(os.environ['RUNNER_TEMP']) / 'certified-crosswalk-v2'
          refresh = json.loads((root / 'PRISMA_THREE_APP_VISUAL_MAPPING_REFRESH.json').read_text(encoding='utf-8'))
          if refresh.get('status') == 'BLOCKED_BY_UIMAP':
              raise SystemExit('CROSSWALK_BLOCKED_UIMAP')

          repository = BridgeRepository.load([root / 'uimap' / 'batches'])
          pilot_id = 'PC-STOCK-FICHA-PANEL-01'
          canonical_id = repository.resolve_alias(pilot_id)
          if canonical_id == pilot_id:
              raise SystemExit('STOCK_FICHA_CERTIFIED_ALIAS_NOT_RESOLVED')
          component = repository.component(pilot_id)
          if not component or component.get('componentUiId') != canonical_id:
              raise SystemExit('STOCK_FICHA_CANONICAL_COMPONENT_NOT_FOUND')
          if component.get('runtimeAlias') != 'pc' or component.get('routeId') != 'ROUTE.pc.stock' or component.get('routePath') != '/stock':
              raise SystemExit('STOCK_FICHA_CANONICAL_ROUTE_DRIFT')
          if component.get('ownerFile') != 'apps/terminal-de-venta-system/products/pc/app/components/inventory/inventory-workspace.tsx':
              raise SystemExit('STOCK_FICHA_CANONICAL_OWNER_DRIFT')
          if component.get('adapterId') != 'ADP.PC.ADMIN.V2':
              raise SystemExit('STOCK_FICHA_CANONICAL_ADAPTER_DRIFT')
          if component.get('neutralMeaningId') is not None or component.get('targetResolutionStatus') == 'SOURCE_RESOLVED' or component.get('applicationReadiness') != 'BLOCKED':
              raise SystemExit('STOCK_FICHA_FAKE_SEMANTIC_GREEN')

          alias_rows = [alias for batch in repository.batches for alias in batch.get('aliases', []) if alias.get('aliasId') == pilot_id and alias.get('reason') == 'CERTIFIED_VISUAL_PILOT_CROSSWALK']
          if len(alias_rows) != 1:
              raise SystemExit(f'STOCK_FICHA_CERTIFIED_ALIAS_COUNT:{len(alias_rows)}')
          alias = alias_rows[0]
          if alias.get('canonicalComponentUiId') != canonical_id:
              raise SystemExit('STOCK_FICHA_ALIAS_TARGET_DRIFT')
          if (alias.get('pilotTrace') or {}).get('adapterId') != 'ADP.PC.DENSE.CLOUDGLASS.V1':
              raise SystemExit('STOCK_FICHA_PILOT_ADAPTER_PROVENANCE_MISSING')
          if (alias.get('canonicalTrace') or {}).get('adapterId') != 'ADP.PC.ADMIN.V2':
              raise SystemExit('STOCK_FICHA_CANONICAL_ADAPTER_PROVENANCE_MISSING')

          gaps = json.loads((root / 'PRISMA_UI_BRIDGE_BINDING_GAP_MATRIX.json').read_text(encoding='utf-8'))
          gap_rows = [row for row in gaps.get('rows', []) if row.get('componentUiId') == canonical_id]
          if len(gap_rows) != 1:
              raise SystemExit(f'STOCK_FICHA_GAP_ROW_COUNT:{len(gap_rows)}')
          gap = gap_rows[0]
          alignment = gap.get('pilotAlignment') or {}
          if alignment.get('aligned') is not True or alignment.get('identityResolution') != 'CERTIFIED_ALIAS_CROSSWALK':
              raise SystemExit('STOCK_FICHA_PILOT_ALIGNMENT_NOT_CERTIFIED:' + json.dumps(alignment, sort_keys=True))
          if alignment.get('pilotComponentUiId') != pilot_id or alignment.get('canonicalComponentUiId') != canonical_id:
              raise SystemExit('STOCK_FICHA_CROSSWALK_IDS_WRONG')
          if 'MISSING_COORDINATE:neutralMeaningId' not in set(gap.get('blockingReasons') or []):
              raise SystemExit('STOCK_FICHA_NEUTRAL_MEANING_BLOCKER_MISSING')

          cobrar = repository.component('TB-POS-PAY-COBRAR-BTN-01')
          if not cobrar or cobrar.get('targetResolutionStatus') != 'SOURCE_RESOLVED':
              raise SystemExit('COBRAR_GOLDEN_REGRESSION')

          print(json.dumps({
              'pilotAliasId': pilot_id,
              'canonicalComponentUiId': canonical_id,
              'canonicalAdapterId': component.get('adapterId'),
              'pilotAdapterId': (alias.get('pilotTrace') or {}).get('adapterId'),
              'pilotAlignment': alignment,
              'blockingReasons': gap.get('blockingReasons'),
              'cobrarStatus': cobrar.get('targetResolutionStatus'),
          }, indent=2, sort_keys=True))
          PY

