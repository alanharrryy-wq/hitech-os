name: CA Evidence Bundle I One-Shot Finalizer

on:
  pull_request:
    paths:
      - '.github/workflows/ca-evidence-bundle-i-finalize.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: tools/code-atlas/src

jobs:
  finalize-i-governance:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      EXPECTED_MAIN: ce1bda5d4e6765d9927f33c16f0a08472427e4ba
      BRANCH: governance/ca-evidence-bundle-i-final-2508
      MESH_RUN_ID: '32838245862'
      MESH_ARTIFACT_ID: '9559506266'
      MESH_ARTIFACT_SHA256: '3567eafc2ab9b893ec17d0ff93eefbc4e8e254e6f035f1a57784edacbe86a2bf'
      MESH_COMPOSED_SHA256: 'c5a3114cc46853697d31dba085edb525d991749386a8e83c5708f73eb615c6e5'
      MESH_REQUEST_DIGEST: '01b08aaaff3e0da278583fc4596b7b914392967cdabbd8a7987b3fe529949423'
    steps:
      - name: Checkout finalizer branch
        uses: actions/checkout@v6
        with:
          ref: governance/ca-evidence-bundle-i-final-2508
          fetch-depth: 0

      - name: Validate frozen authority baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git merge-base HEAD origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse origin/main:'PRISMA Factory Ledger/PRISMA_CHANGE_INTELLIGENCE_CAPABILITY_MAP.json')" = "82efc6a26b5dec3e72f837696bffca4a26434cb3"
          test "$(git rev-parse origin/main:'PRISMA Factory Ledger/PRISMA_CHANGE_INTELLIGENCE_CAPABILITY_MAP.md')" = "1ed1c017ce927e541e446cc17b95974119e8824a"
          test "$(git rev-parse origin/main:'tools/code-atlas/docs/PRISMA_CHANGE_ASSURANCE_V1.md')" = "6586c014773174d9f359be492f418e4b2673ed80"
          test "$(git rev-parse origin/main:'tools/code-atlas/src/code_atlas/change_intelligence/bundle.py')" = "e897a4e58f89402fea5cb1e9c4c3506a0515b895"
          test "$(git rev-parse origin/main:'tools/code-atlas/tests/test_operational_evidence_bundle_semantics.py')" = "40a5f67403b3eefbe60be8b4332b5c976bf8c01d"
          changed="$(git diff --name-only origin/main...HEAD)"
          test "$changed" = ".github/workflows/ca-evidence-bundle-i-finalize.yml"

      - name: Run universal Factory Ledger mutation gate on frozen main
        shell: bash
        run: |
          set -euo pipefail
          gate_root="$RUNNER_TEMP/i-gate-main"
          git worktree add --detach "$gate_root" origin/main
          echo "GATE_ROOT=$gate_root" >> "$GITHUB_ENV"
          request="$RUNNER_TEMP/i-factory-request.json"
          result="$RUNNER_TEMP/i-factory-result.json"
          python - "$request" <<'PY'
          import json, os, sys
          path=sys.argv[1]
          head=os.environ['EXPECTED_MAIN']
          request={
            "schemaVersion":"prisma.factory-ledger.anti-rework-gate.v1",
            "mode":"MUTATION",
            "expectedHead":head,
            "task":"Promote PRISMA Change Assurance checklist I Evidence Bundle governance maturity from PARTIAL to DONE LOCAL_VERIFIED using merged verified evidence. Only the three canonical Change Assurance governance projections may change; source and product behavior stay unchanged.",
            "capabilities":[
              {"id":"change_intelligence.capability_anti_rework_gate","requestedAction":"ADVANCE"},
              {"id":"code_atlas.change_intelligence.customer_wow_v1","requestedAction":"VERIFY"}
            ],
            "visualMutation":False,
            "authorityMesh":{
              "status":"PASS_COMPOSED_AUTHORITY_MESH",
              "repoHead":head,
              "requiredAuthorityCoveragePct":100,
              "blockers":0,
              "requestDigest":os.environ['MESH_REQUEST_DIGEST'],
              "artifactDigest":"sha256:"+os.environ['MESH_ARTIFACT_SHA256'],
              "layerMapPresent":True
            }
          }
          with open(path,'w',encoding='utf-8') as f: json.dump(request,f,indent=2)
          PY
          (cd "$gate_root" && python 'PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py' --request "$request") | tee "$result"
          python - "$result" >> "$GITHUB_ENV" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          if d.get('result')!='PASS_ANTI_REWORK_GATE': raise SystemExit(d)
          digest=d.get('decisionDigest')
          if not digest: raise SystemExit('FACTORY_DECISION_DIGEST_MISSING')
          print('FACTORY_DECISION_DIGEST='+digest)
          PY

      - name: Apply authorized I promotion and validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy, json, os
          from pathlib import Path

          registry=Path('PRISMA Factory Ledger/PRISMA_CHANGE_INTELLIGENCE_CAPABILITY_MAP.json')
          map_md=Path('PRISMA Factory Ledger/PRISMA_CHANGE_INTELLIGENCE_CAPABILITY_MAP.md')
          v1_md=Path('tools/code-atlas/docs/PRISMA_CHANGE_ASSURANCE_V1.md')
          data=json.loads(registry.read_text(encoding='utf-8'))
          before=copy.deepcopy(data)

          rows=[]
          def walk(node):
              if isinstance(node,dict):
                  if node.get('id')=='I' and node.get('stage')=='PROVE' and node.get('title')=='Evidence Bundle': rows.append(node)
                  for v in node.values(): walk(v)
              elif isinstance(node,list):
                  for v in node: walk(v)
          walk(data)
          if len(rows)!=1: raise SystemExit(f'EXPECTED_ONE_I_ROW_GOT_{len(rows)}')
          item=rows[0]
          if item.get('status')!='PARTIAL': raise SystemExit(f'I_STATUS_NOT_PARTIAL:{item.get("status")}')
          item['status']='DONE'
          item['claimBoundary']='LOCAL_VERIFIED bounded Evidence Bundle semantics only: the existing hardened portable bundle optionally binds typed decision/classification, gaps/unknowns, and replay/handoff roles to current sanitized artifacts and the exact repository snapshot. Missing, duplicate, contradictory, stale or tampered semantic evidence fails closed; UNKNOWN remains UNKNOWN; packaging cannot promote decisions or create certification; legacy hardened V2 manifests remain compatible when semantic roles are omitted. This does not prove arbitrary-repository completeness, production, enterprise, hosted, paid-pilot, human usefulness, independent-agent verification, legal/privacy/security readiness or secure erase.'
          item['evidence']=[
              'path:tools/code-atlas/src/code_atlas/change_intelligence/bundle.py',
              'path:tools/code-atlas/tests/test_operational_evidence_bundle_semantics.py',
              'path:tools/code-atlas/tests/test_operational_rental_hardening.py',
              'PR #366 / merge ce1bda5d4e6765d9927f33c16f0a08472427e4ba',
              'Code Atlas Operational Hardening run 32829741184: 155/155 tests PASS on Ubuntu including seven focused Evidence Bundle semantic tests; Windows/macOS lanes green; neutrality blockingCount=0',
              'I promotion authority run 32838245862 / artifact 9559506266',
              'I promotion artifact sha256:3567eafc2ab9b893ec17d0ff93eefbc4e8e254e6f035f1a57784edacbe86a2bf',
              'I promotion composed Authority Mesh sha256:c5a3114cc46853697d31dba085edb525d991749386a8e83c5708f73eb615c6e5',
              'I promotion request digest 01b08aaaff3e0da278583fc4596b7b914392967cdabbd8a7987b3fe529949423',
              'Factory gate decision '+os.environ['FACTORY_DECISION_DIGEST'],
              'Change Assurance gate PASS_CHANGE_ASSURANCE_CAPABILITY_GATE for ci.evidence.report_bundle'
          ]
          item['tests']=[
              'test_valid_semantic_roles_are_complete_canonical_and_replayable',
              'test_unknown_decision_is_preserved_and_never_promoted_by_packaging',
              'test_legacy_hardened_v2_shape_remains_compatible_without_semantic_roles'
          ]
          item['negativeTests']=[
              'test_each_missing_required_semantic_role_fails_closed',
              'test_duplicate_or_contradictory_semantic_roles_fail_closed',
              'test_stale_semantic_snapshot_fails_closed',
              'test_tampered_artifact_descriptor_still_fails_before_semantic_acceptance'
          ]
          item['knownBlindSpots']=[
              'Typed semantic roles prove bounded packaging semantics, not truth or completeness of the underlying evidence.',
              'Caller-supplied replay/handoff identifiers and digests must refer to real evidence; package binding does not execute an independent replay.',
              'Backward-compatible omission keeps legacy hardened V2 manifests valid but does not claim semantic-role completeness for those manifests.',
              'This evidence does not prove production, enterprise IAM/security, hosted multi-tenant, legal/privacy, paid-pilot, human usefulness, independent-agent success or secure erase.'
          ]
          item['nextEvidence']='REUSE_DONE_BASELINE; recertify after portable-bundle schema, semantic-role taxonomy, snapshot/artifact binding, sanitization, decision-preservation, replay/handoff or compatibility-contract drift. Do not duplicate report/bundle, Authority Pack, Verify, runner, snapshot or sanitization owners.'
          data['lastGovernanceMutation']={
              'kind':'PROVE_I_EVIDENCE_BUNDLE_LOCAL_VERIFICATION_PROMOTION',
              'sourceHead':os.environ['EXPECTED_MAIN'],
              'technicalEvidenceRunId':32829741184,
              'authorityRunId':int(os.environ['MESH_RUN_ID']),
              'authorityArtifactId':int(os.environ['MESH_ARTIFACT_ID']),
              'authorityArtifactSha256':os.environ['MESH_ARTIFACT_SHA256'],
              'composedAuthoritySha256':os.environ['MESH_COMPOSED_SHA256'],
              'requestDigest':os.environ['MESH_REQUEST_DIGEST'],
              'factoryGateDecisionDigest':os.environ['FACTORY_DECISION_DIGEST'],
              'status':'LOCAL_VERIFIED',
              'productionCertified':False
          }

          def statuses(root):
              out={}
              def rec(n):
                  if isinstance(n,dict):
                      if n.get('id') in set('ABCDEFGHIJ') and 'stage' in n and 'status' in n: out[n['id']]=n['status']
                      for v in n.values(): rec(v)
                  elif isinstance(n,list):
                      for v in n: rec(v)
              rec(root); return out
          b,a=statuses(before),statuses(data)
          if b.get('I')!='PARTIAL' or a.get('I')!='DONE': raise SystemExit('I_STATUS_TRANSITION_INVALID')
          for ident,status in b.items():
              if ident!='I' and a.get(ident)!=status: raise SystemExit(f'UNAUTHORIZED_STATUS_CHANGE:{ident}:{status}->{a.get(ident)}')
          if a.get('B')!='PARTIAL' or a.get('G')!='PARTIAL' or a.get('J')!='BLOCKED': raise SystemExit('B_G_J_STATUS_DRIFT')
          if data.get('v1Complete') is not False: raise SystemExit('V1_COMPLETE_NOT_FALSE')
          registry.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          old='| I | PROVE | Evidence Bundle | `PARTIAL` |'
          new='| I | PROVE | Evidence Bundle | `DONE` |'
          text=map_md.read_text(encoding='utf-8')
          if text.count(old)!=1 or new in text: raise SystemExit('MAP_I_TABLE_ANCHOR_INVALID')
          text=text.replace(old,new,1)
          anchor='F is `DONE / LOCAL_VERIFIED` from `compare_observed_states`'
          if text.count(anchor)!=1 or 'I is `DONE / LOCAL_VERIFIED`' in text: raise SystemExit('MAP_I_PARAGRAPH_ANCHOR_INVALID')
          paragraph=('I is `DONE / LOCAL_VERIFIED` from the additive semantic-role hardening merged in PR #366 over the existing protected Evidence Reports and portable-bundle owner. The hardened bundle can bind `decision_classification`, `gaps_unknowns`, and `replay_handoff` to sanitized artifacts and the exact repository snapshot; missing, duplicate, contradictory, stale or tampered semantic evidence fails closed, UNKNOWN is preserved, packaging cannot promote decisions or create certification, and legacy hardened V2 manifests remain compatible when roles are omitted. Operational Hardening run `32829741184` passed 155/155 tests on Ubuntu including all seven focused Evidence Bundle semantic tests, with Windows/macOS lanes green and neutrality blockers at zero. Promotion authority run `32838245862` passed exact-head Authority Mesh. This does not certify arbitrary-repository completeness, production, enterprise, hosted, paid-pilot, human usefulness, independent-agent verification, legal/privacy/security readiness or secure erase.\n\n')
          text=text.replace(anchor,paragraph+anchor,1)
          map_md.write_text(text,encoding='utf-8')

          text=v1_md.read_text(encoding='utf-8')
          if text.count(old)!=1 or new in text: raise SystemExit('V1_I_TABLE_ANCHOR_INVALID')
          text=text.replace(old,new,1)
          anchor='Checklist F is now `DONE / LOCAL_VERIFIED`:'
          if text.count(anchor)!=1 or 'Checklist I is now `DONE / LOCAL_VERIFIED`:' in text: raise SystemExit('V1_I_PARAGRAPH_ANCHOR_INVALID')
          paragraph=('Checklist I is now `DONE / LOCAL_VERIFIED`: the existing hardened portable Evidence Bundle gained additive typed semantic roles for decision/classification, gaps/unknowns, and replay/handoff, each bound to current sanitized artifacts and the exact repository snapshot. Missing, duplicate, contradictory, stale or tampered semantic evidence fails closed; UNKNOWN remains UNKNOWN; packaging cannot promote decisions or create certification; and omission of semantic roles preserves the legacy hardened V2 manifest shape for compatibility without claiming semantic completeness. PR #366 merged at `ce1bda5d4e6765d9927f33c16f0a08472427e4ba`; Operational Hardening run `32829741184` passed 155/155 Ubuntu tests including all seven focused Evidence Bundle semantic tests, with Windows/macOS lanes green. Promotion authority run `32838245862` passed the exact-head Authority Mesh. I does not prove arbitrary-repository completeness, production, enterprise, hosted, paid-pilot, human usefulness, independent-agent verification, legal/privacy/security readiness or secure erase.\n\n')
          text=text.replace(anchor,paragraph+anchor,1)
          v1_md.write_text(text,encoding='utf-8')
          PY

          python 'PRISMA Factory Ledger/tools/verify_change_intelligence_capability_gate.py' --validate-map
          python 'PRISMA Factory Ledger/tools/verify_change_intelligence_capability_gate.py' --self-test
          python tools/code-atlas/tests/test_operational_evidence_bundle_semantics.py
          python tools/code-atlas/tests/test_operational_rental_hardening.py

          cp 'PRISMA Factory Ledger/PRISMA_CHANGE_INTELLIGENCE_CAPABILITY_MAP.json' "$GATE_ROOT/PRISMA Factory Ledger/PRISMA_CHANGE_INTELLIGENCE_CAPABILITY_MAP.json"
          cp 'PRISMA Factory Ledger/PRISMA_CHANGE_INTELLIGENCE_CAPABILITY_MAP.md' "$GATE_ROOT/PRISMA Factory Ledger/PRISMA_CHANGE_INTELLIGENCE_CAPABILITY_MAP.md"
          cp 'tools/code-atlas/docs/PRISMA_CHANGE_ASSURANCE_V1.md' "$GATE_ROOT/tools/code-atlas/docs/PRISMA_CHANGE_ASSURANCE_V1.md"

          ca_request="$RUNNER_TEMP/i-ca-request.json"
          ca_result="$RUNNER_TEMP/i-ca-result.json"
          python - "$ca_request" <<'PY'
          import json, os, sys
          head=os.environ['EXPECTED_MAIN']
          request={
            "mode":"MUTATION",
            "capabilityIds":["ci.evidence.report_bundle"],
            "task":"Promote checklist I Evidence Bundle governance maturity to DONE LOCAL_VERIFIED from current verified package semantics while preserving the existing evidence owner and all stronger claim boundaries.",
            "visualMutation":False,
            "authorityMesh":{
              "status":"PASS_COMPOSED_AUTHORITY_MESH",
              "repoHead":head,
              "requiredAuthorityCoveragePct":100,
              "blockers":0,
              "requestDigest":os.environ['MESH_REQUEST_DIGEST'],
              "artifactDigest":"sha256:"+os.environ['MESH_ARTIFACT_SHA256'],
              "layerMapPresent":True
            }
          }
          with open(sys.argv[1],'w',encoding='utf-8') as f: json.dump(request,f,indent=2)
          PY
          (cd "$GATE_ROOT" && python 'PRISMA Factory Ledger/tools/verify_change_intelligence_capability_gate.py' --validate-map)
          (cd "$GATE_ROOT" && python 'PRISMA Factory Ledger/tools/verify_change_intelligence_capability_gate.py' --self-test)
          (cd "$GATE_ROOT" && python 'PRISMA Factory Ledger/tools/verify_change_intelligence_capability_gate.py' --request "$ca_request") | tee "$ca_result"
          python - "$ca_result" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          if d.get('result')!='PASS_CHANGE_ASSURANCE_CAPABILITY_GATE': raise SystemExit(d)
          PY

          factory_request="$RUNNER_TEMP/i-factory-request.json"
          factory_result2="$RUNNER_TEMP/i-factory-result-after.json"
          (cd "$GATE_ROOT" && python 'PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py' --request "$factory_request") | tee "$factory_result2"
          python - "$factory_result2" <<'PY'
          import json, os, sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          if d.get('result')!='PASS_ANTI_REWORK_GATE': raise SystemExit(d)
          if d.get('decisionDigest')!=os.environ['FACTORY_DECISION_DIGEST']: raise SystemExit('FACTORY_DECISION_DRIFT')
          PY
          git worktree remove --force "$GATE_ROOT"
          echo 'Factory Ledger files intentionally unchanged: this promotion changes only the canonical Change Assurance V1 checklist projection, as authorized by the task-exact Mesh.'

      - name: Prove exact final diff and push atomically
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ca-evidence-bundle-i-finalize.yml
          expected=$(printf '%s\n' 'PRISMA Factory Ledger/PRISMA_CHANGE_INTELLIGENCE_CAPABILITY_MAP.json' 'PRISMA Factory Ledger/PRISMA_CHANGE_INTELLIGENCE_CAPABILITY_MAP.md' 'tools/code-atlas/docs/PRISMA_CHANGE_ASSURANCE_V1.md' | sort)
          actual=$(git diff --name-only origin/main | sort)
          test "$actual" = "$expected"
          test "$(git rev-parse origin/main:tools/code-atlas/src/code_atlas/change_intelligence/bundle.py)" = "$(git hash-object tools/code-atlas/src/code_atlas/change_intelligence/bundle.py)"
          test "$(git rev-parse origin/main:tools/code-atlas/tests/test_operational_evidence_bundle_semantics.py)" = "$(git hash-object tools/code-atlas/tests/test_operational_evidence_bundle_semantics.py)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'governance(ca): certify Evidence Bundle'
          final=$(git diff --name-only origin/main...HEAD | sort)
          test "$final" = "$expected"
          git push origin "HEAD:$BRANCH"
