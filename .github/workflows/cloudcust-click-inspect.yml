name: Cloud Center Click Inspect

on:
  push:
    branches: ['cloudcust-runtime-20260814']
    paths:
      - '.github/workflows/cloudcust-click-inspect.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}

      - name: Reconstruct and apply intended runtime patch
        shell: python
        run: |
          import base64, subprocess, zlib
          from pathlib import Path
          chunks=[]
          for i in range(1,6):
              p=Path(f'apps/terminal-de-venta-system/tools/_cloudcust_patch_part{i}.txt')
              chunks.append(b''.join(p.read_bytes().split()))
          patch=zlib.decompress(base64.b64decode(b''.join(chunks),validate=True))
          Path('/tmp/cloudcust.patch').write_bytes(patch)
          subprocess.run([
              'git','apply','--check',
              '--exclude=apps/terminal-de-venta-system/tools/verify-cloud-center-customer-registration-01.py',
              '--exclude=apps/terminal-de-venta-system/tools/verify-cloud-center-customer-runtime-02.py',
              '/tmp/cloudcust.patch'
          ],check=True)
          subprocess.run([
              'git','apply',
              '--exclude=apps/terminal-de-venta-system/tools/verify-cloud-center-customer-registration-01.py',
              '--exclude=apps/terminal-de-venta-system/tools/verify-cloud-center-customer-runtime-02.py',
              '/tmp/cloudcust.patch'
          ],check=True)

      - name: Inspect patched click/action ownership
        shell: python
        run: |
          from pathlib import Path
          path=Path('apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/web/cloud_command_center.js')
          text=path.read_text(encoding='utf-8')
          probes={
            'document_click':'document.addEventListener("click", (event) => {',
            'action_lookup':'const actionButtonNode = event.target.closest("[data-action]")',
            'action_dispatch':'handleAction(actionButtonNode.dataset.action',
            'prepare_branch':'action === "prepare-client"',
            'collect_other':'collectOtherValues()',
            'post_draft':'/api/command-center/draft-client',
          }
          for name,token in probes.items():
              print(f'COUNT {name}={text.count(token)}')
          for name in ('action_lookup','prepare_branch','collect_other'):
              token=probes[name]; pos=text.find(token)
              print(f'POSITION {name}={pos}')
              if pos>=0:
                  lo=max(0,pos-1800); hi=min(len(text),pos+4200)
                  print(f'--- {name} CONTEXT START ---')
                  print(text[lo:hi])
                  print(f'--- {name} CONTEXT END ---')
          if text.count(probes['action_lookup']) != 1:
              raise SystemExit('ACTION_DELEGATION_COUNT_INVALID')
          if text.count(probes['prepare_branch']) != 1:
              raise SystemExit('PREPARE_CLIENT_BRANCH_COUNT_INVALID')
          if text.count(probes['post_draft']) != 1:
              raise SystemExit('DRAFT_ENDPOINT_COUNT_INVALID')
