name: Cloud Center Click Inspect

on:
  push:
    branches: ['cloudcust-runtime-20260814']
    paths:
      - '.github/workflows/cloudcust-click-inspect.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}

      - name: Reconstruct and apply intended runtime patch
        shell: python
        run: |
          import base64, subprocess, zlib
          from pathlib import Path
          chunks=[]
          for i in range(1,6):
              p=Path(f'apps/terminal-de-venta-system/tools/_cloudcust_patch_part{i}.txt')
              chunks.append(b''.join(p.read_bytes().split()))
          patch=zlib.decompress(base64.b64decode(b''.join(chunks),validate=True))
          Path('/tmp/cloudcust.patch').write_bytes(patch)
          exclusions=[
              '--exclude=apps/terminal-de-venta-system/tools/verify-cloud-center-customer-registration-01.py',
              '--exclude=apps/terminal-de-venta-system/tools/verify-cloud-center-customer-runtime-02.py',
          ]
          subprocess.run(['git','apply','--check',*exclusions,'/tmp/cloudcust.patch'],check=True)
          subprocess.run(['git','apply',*exclusions,'/tmp/cloudcust.patch'],check=True)

      - name: Inspect exact flow/action anchors
        shell: python
        run: |
          from pathlib import Path
          text=Path('apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/web/cloud_command_center.js').read_text(encoding='utf-8')
          probes={
            'change':'document.addEventListener("change"',
            'pick_flow':'const pickFlowNode',
            'handle_action':'async function handleAction',
            'flow_input':'const field=event.target.closest("[data-flow-field]")',
            'prepare_branch':'action === "prepare-client"',
          }
          for name,token in probes.items():
              print(f'COUNT {name}={text.count(token)}')
              pos=text.find(token)
              print(f'POSITION {name}={pos}')
              if pos>=0:
                  lo=max(0,pos-900); hi=min(len(text),pos+2200)
                  print(f'--- {name} CONTEXT START ---')
                  print(text[lo:hi])
                  print(f'--- {name} CONTEXT END ---')
          if text.count(probes['change']) != 1: raise SystemExit('CHANGE_HANDLER_COUNT_INVALID')
          if text.count(probes['pick_flow']) != 1: raise SystemExit('PICK_FLOW_COUNT_INVALID')
          if text.count(probes['handle_action']) != 1: raise SystemExit('HANDLE_ACTION_COUNT_INVALID')
