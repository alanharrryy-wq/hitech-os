name: PC Wave 3 Canonical Close Authority

on:
  pull_request:
    paths:
      - '.github/workflows/pc-wave3-canonical-close-authority.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: tools/code-atlas/src
  PINNED_MAIN: d55e421d8379ce53279a1c60ebca679602fd904d
  CERTIFIED_TREE: bf339ae4c19150548c2a265532233acfd0533693
  CERT_RUN: '32988854842'
  CERT_ARTIFACT: '9613949893'
  CERT_ARTIFACT_DIGEST: 'sha256:97821a53de7941b160ec330ba7e9659474525f302de5f402823482fba599599b'

jobs:
  authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout carrier with full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Freeze exact post-merge canonical main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          current="$(git rev-parse origin/main)"
          test "$current" = "$PINNED_MAIN"
          git checkout --detach "$PINNED_MAIN"
          test "$(git rev-parse HEAD)" = "$PINNED_MAIN"
          test "$(git rev-parse HEAD^{tree})" = "$CERTIFIED_TREE"
          test -f "apps/terminal-de-venta-system/docs/ops/PRISMA_FIELD_MANUAL_APRENDIZAJE_OPERATIVO.md"
          test -f "PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER_AGENT_GATE.md"
          test -f "PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER.json"
          test -f "PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER_DO_NOT_REBUILD_MAP.json"
          test -f "PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER_REGISTRATION_INDEX.json"
          test -f "PRISMA Factory Ledger/PRISMA_EVIDENCE_INDEX.json"
          test -f ".github/workflows/pc-wave3-certification.yml"
          test -f "apps/terminal-de-venta-system/products/pc/app/tools/run_pc_wave3_ci.py"
          test -f "apps/terminal-de-venta-system/products/pc/app/tools/visual/verify_pc_enterprise_mutations_wave3_runtime.mjs"
          python tools/code-atlas/src/code_atlas/motors/smart_allmesh_automesh.py --self-test
          python "PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py" --self-test
          test -z "$(git status --porcelain)"
          echo "PASS_POSTMERGE_TREE_IS_CERTIFIED_TREE $PINNED_MAIN $CERTIFIED_TREE"

      - name: Build exact task authority request
        shell: bash
        run: |
          python - "$RUNNER_TEMP/request.json" <<'PY'
          import json, os, sys
          head=os.environ['PINNED_MAIN']
          app='apps/terminal-de-venta-system/'
          pc=app+'products/pc/app/'
          ledger='PRISMA Factory Ledger/'
          core=[
            ledger+'PRISMA_FACTORY_LEDGER.json',
            ledger+'PRISMA_FACTORY_LEDGER_DO_NOT_REBUILD_MAP.json',
            ledger+'PRISMA_FACTORY_LEDGER_REGISTRATION_INDEX.json',
            ledger+'PRISMA_EVIDENCE_INDEX.json',
            ledger+'PRISMA_FACTORY_LEDGER_AGENT_GATE.md',
            ledger+'tools/verify_prisma_anti_rework_gate.py',
            app+'docs/ops/PRISMA_FIELD_MANUAL_APRENDIZAJE_OPERATIVO.md',
            app+'quality/contracts/no-fake-green.contract.json',
            '.github/workflows/pc-wave3-certification.yml',
            pc+'tools/run_pc_wave3_ci.py',
            pc+'tools/visual/verify_pc_enterprise_mutations_wave3_runtime.mjs',
            pc+'src/server/services/catalog-mutations.service.ts',
            pc+'src/server/services/supplier-records.service.ts',
            pc+'src/server/services/inventory-mutations.service.ts',
            pc+'src/server/services/device-claims.service.ts',
            pc+'src/server/services/business-settings.service.ts',
            pc+'src/server/services/wave3-mutation-audit.ts',
          ]
          caps=['pc.quality.customer_experience_wave2','data.canonical_schema_reproducibility','pc.entitlement.surface_projection']
          task=(
            f'Close PC Enterprise Mutations Wave 3 canonically on exact post-merge main {head}, whose tree equals the certified integration tree {os.environ["CERTIFIED_TREE"]}. '
            f'Certification run {os.environ["CERT_RUN"]} artifact {os.environ["CERT_ARTIFACT"]} passed isolated Wave 3 mutation persistence/runtime, frozen Wave 2 entitled and restricted regressions, and zero tracked source drift. '
            'Register granular Wave 3 runtime capabilities plus one aggregate quality capability in the Factory Ledger, Do-Not-Rebuild Map, Registration Index and Evidence Index only. '
            'Do not mutate PC product source, schema, DB, licensing, UI, processes, ports, deploys, Tablet, Mobile, Chart Lab, Shared UI or Control Center. Preserve productionCertified=false and the exact evidence ceiling.'
          )
          lanes=[
            {
              'id':'pc-wave3-canonical-capability-close',
              'surface':'pc','intent':'AUDIT','domain':'governance','task':task,
              'requiredAuthorities':core,
              'requiredDirectories':[ledger,pc+'app/api/backoffice',pc+'src/server/services',pc+'tools'],
              'requiredCapabilities':caps,'minimumCoverage':100,'failOnMissingAuthority':True,
            },
            {
              'id':'pc-wave3-evidence-provenance-close',
              'surface':'pc','intent':'VERIFY','domain':'testing','task':task,
              'requiredAuthorities':core,
              'requiredDirectories':[ledger,pc+'tools',pc+'app/api/backoffice'],
              'requiredCapabilities':caps,'minimumCoverage':100,'failOnMissingAuthority':True,
            },
          ]
          payload={'schemaVersion':'v2','profile':'pc-wave3-canonical-close-v1','expectedHead':head,'tasks':lanes}
          with open(sys.argv[1],'w',encoding='utf-8') as f:
            json.dump(payload,f,ensure_ascii=False,indent=2); f.write('\n')
          PY

      - name: Compose fresh post-merge Authority Mesh
        shell: bash
        run: |
          set -euo pipefail
          pre="$RUNNER_TEMP/pre"; par="$RUNNER_TEMP/par"; comp="$RUNNER_TEMP/comp/payload"
          mkdir -p "$pre" "$par" "$comp"
          python -m code_atlas.motors.prisma_mesh_gateway preflight \
            --repo "$GITHUB_WORKSPACE" \
            --request "$RUNNER_TEMP/request.json" \
            --out "$pre"
          python tools/code-atlas/src/code_atlas/motors/smart_allmesh_parallel.py \
            --repo "$GITHUB_WORKSPACE" \
            --out-root "$par" \
            --task-spec "$pre/legacy_tasks.json" \
            --parallel 2 \
            --workers 18 \
            --shards 54 \
            --max-files 180 \
            --max-mb 55
          python -m code_atlas.motors.prisma_mesh_gateway compose \
            --repo "$GITHUB_WORKSPACE" \
            --request "$RUNNER_TEMP/request.json" \
            --preflight "$pre" \
            --mesh-result "$par" \
            --out "$comp" | tee "$RUNNER_TEMP/compose.txt"
          grep -Fq PASS_COMPOSED_AUTHORITY_MESH "$RUNNER_TEMP/compose.txt"
          test -f "$RUNNER_TEMP/comp/prisma-automesh-composed-result.zip"
          test -z "$(git status --porcelain)"

      - name: Authorize canonical Wave 3 governance mutation
        shell: bash
        run: |
          set -euo pipefail
          python - \
            "$RUNNER_TEMP/comp/payload/PRISMA_MESH_GATEWAY_REPORT.json" \
            "$RUNNER_TEMP/pre/PREFLIGHT_MANIFEST.json" \
            "$RUNNER_TEMP/comp/prisma-automesh-composed-result.zip" \
            "$RUNNER_TEMP/factory.request.json" <<'PY'
          import hashlib,json,os,sys
          report=json.load(open(sys.argv[1],encoding='utf-8'))
          pre=json.load(open(sys.argv[2],encoding='utf-8'))
          coverage=min(float((x.get('coverage') or {}).get('resolvedPercent',0)) for x in pre['lanes'])
          mesh={
            'status':report['status'],
            'repoHead':report['repoHead'],
            'requiredAuthorityCoveragePct':coverage,
            'blockers':len(pre.get('blockers') or []),
            'requestDigest':report['requestDigest'],
            'artifactDigest':hashlib.sha256(open(sys.argv[3],'rb').read()).hexdigest(),
            'layerMapPresent':False,
          }
          req={
            'schemaVersion':'prisma.factory-ledger.anti-rework-gate.v1',
            'mode':'MUTATION',
            'expectedHead':os.environ['PINNED_MAIN'],
            'task':'Register and canonically close certified PC Enterprise Mutations Wave 3 in the four Factory Ledger JSON projections only, preserving the exact evidence ceiling and preventing rebuild of already runtime-verified mutation contracts.',
            'capabilities':[
              {'id':'pc.quality.customer_experience_wave2','requestedAction':'ADVANCE'},
              {'id':'data.canonical_schema_reproducibility','requestedAction':'ADVANCE'},
              {'id':'pc.entitlement.surface_projection','requestedAction':'ADVANCE'},
            ],
            'authorityMesh':mesh,
            'visualMutation':False,
          }
          with open(sys.argv[4],'w',encoding='utf-8') as f:
            json.dump(req,f,ensure_ascii=False,indent=2); f.write('\n')
          PY
          python "PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py" \
            --request "$RUNNER_TEMP/factory.request.json" | tee "$RUNNER_TEMP/gate.json"
          python - "$RUNNER_TEMP/gate.json" <<'PY'
          import json,os,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          assert d.get('result')=='PASS_ANTI_REWORK_GATE',d
          assert d.get('errors')==[],d
          assert d.get('repoHead')==os.environ['PINNED_MAIN'],d
          print('PASS_PC_WAVE3_CANONICAL_CLOSE_ANTI_REWORK')
          PY

      - name: Recheck main did not move during authority ceremony
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          current="$(git rev-parse origin/main)"
          test "$current" = "$PINNED_MAIN"
          test "$(git rev-parse HEAD)" = "$PINNED_MAIN"
          test "$(git rev-parse HEAD^{tree})" = "$CERTIFIED_TREE"
          echo "PASS_PC_WAVE3_CANONICAL_CLOSE_AUTHORITY head=$PINNED_MAIN"

      - name: Stage authority evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pc-wave3-canonical-close-authority"
          mkdir -p "$out"
          printf '%s\n' "$PINNED_MAIN" > "$out/PINNED_MAIN.txt"
          printf '%s\n' "$CERTIFIED_TREE" > "$out/CERTIFIED_TREE.txt"
          printf '%s\n' "$CERT_RUN" > "$out/CERT_RUN.txt"
          printf '%s\n' "$CERT_ARTIFACT" > "$out/CERT_ARTIFACT.txt"
          printf '%s\n' "$CERT_ARTIFACT_DIGEST" > "$out/CERT_ARTIFACT_DIGEST.txt"
          for p in \
            "$RUNNER_TEMP/request.json" \
            "$RUNNER_TEMP/pre/PREFLIGHT_MANIFEST.json" \
            "$RUNNER_TEMP/comp/payload/PRISMA_MESH_GATEWAY_REPORT.json" \
            "$RUNNER_TEMP/comp/payload/MANIFEST.json" \
            "$RUNNER_TEMP/comp/prisma-automesh-composed-result.zip" \
            "$RUNNER_TEMP/factory.request.json" \
            "$RUNNER_TEMP/gate.json" \
            "$RUNNER_TEMP/compose.txt"; do
            [ ! -f "$p" ] || cp "$p" "$out/$(basename "$p")"
          done

      - name: Upload canonical close authority evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pc-wave3-canonical-close-authority
          path: ${{ runner.temp }}/pc-wave3-canonical-close-authority/**
          if-no-files-found: error
          retention-days: 21
