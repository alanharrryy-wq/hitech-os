name: cloudcust runtime diagnose v6

on:
  push:
    branches:
      - cloudcust-runtime-20260814
    paths:
      - .github/workflows/cloudcust-runtime-diagnose-v6.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: cloudcust-runtime-20260814
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Exact preflight
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          git merge-base --is-ancestor origin/main HEAD
          test "$(git hash-object 'apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/py/command_center_store.py')" = 'dfec957562bf548ac6b4c9133d089fa7a8a31e8f'
          test "$(git hash-object 'apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/web/cloud_command_center.js')" = 'a3d460029a8cfd38ec0664527add991fb0c9c415'
          test -f 'apps/terminal-de-venta-system/tools/_cloudcust_finalize_source_v2.py'
          echo PASS_DIAGNOSTIC_PREFLIGHT

      - name: Apply ephemeral final transform and instrumentation
        shell: bash
        run: |
          set -euo pipefail
          python 'apps/terminal-de-venta-system/tools/_cloudcust_finalize_source_v2.py'
          python - <<'PY'
          from pathlib import Path
          app=Path('apps/terminal-de-venta-system')
          html_path=app/'Prisma Cloud Ctr/internal/web/cloud_command_center.html'
          js_path=app/'Prisma Cloud Ctr/internal/web/cloud_command_center.js'
          verifier=app/'tools/verify-cloud-center-customer-runtime-02.py'

          html=html_path.read_text(encoding='utf-8')
          anchor='      <button type="button" data-surface="entitlements">Licencias</button>\n'
          billing='      <button type="button" data-surface="billing">Cobranza</button>\n'
          if billing not in html:
              assert html.count(anchor)==1
              html=html.replace(anchor,anchor+billing,1)
          html_path.write_text(html,encoding='utf-8')

          js=js_path.read_text(encoding='utf-8')
          old='active.matches("input,select,textarea,button,[contenteditable=\'true\']")'
          if old in js: js=js.replace(old,'active.matches("input,select,textarea,[contenteditable=\'true\']")',1)
          capture='document.addEventListener("click",(event)=>{ if(state.openPicker && !event.target.closest("[data-picker-toggle],[data-picker-panel]")){ syncFlowFromDom(); state.openPicker=null; render(); } }, true);'
          if capture in js: js=js.replace(capture,'document.addEventListener("click",(event)=>{ if(state.openPicker && !event.target.closest("[data-picker-toggle],[data-picker-panel]")){ syncFlowFromDom(); state.openPicker=null; render(); } });',1)

          # Instrument closure state without exposing it in any committed runtime source.
          handle='''  async function handleAction(action, button) {\n    syncFlowFromDom();\n    if (state.busy) return;\n'''
          replacement='''  async function handleAction(action, button) {\n    syncFlowFromDom();\n    state.__diagHandleEnter={action,busyBefore:state.busy,at:Date.now()};\n    if (state.busy) { state.__diagBusyReturn={action,at:Date.now()}; return; }\n'''
          if js.count(handle)!=1: raise SystemExit(f'HANDLE_DIAG_ANCHOR:{js.count(handle)}')
          js=js.replace(handle,replacement,1)

          prepare='''      } else if (action === "prepare-client") {\n        if (!state.flow.clientRequestId) state.flow.clientRequestId = `customer-${Date.now()}-${globalThis.crypto?.randomUUID?.() || Math.random().toString(36).slice(2)}`;\n        result = await safePost("/api/command-center/draft-client", { ...state.flow, other: collectOtherValues() });\n'''
          prepare_diag='''      } else if (action === "prepare-client") {\n        state.__diagPrepareBranch={busy:state.busy,flow:{...state.flow},at:Date.now()};\n        if (!state.flow.clientRequestId) state.flow.clientRequestId = `customer-${Date.now()}-${globalThis.crypto?.randomUUID?.() || Math.random().toString(36).slice(2)}`;\n        state.__diagBeforeDraftPost={requestId:state.flow.clientRequestId,at:Date.now()};\n        result = await safePost("/api/command-center/draft-client", { ...state.flow, other: collectOtherValues() });\n'''
          if js.count(prepare)!=1: raise SystemExit(f'PREPARE_DIAG_ANCHOR:{js.count(prepare)}')
          js=js.replace(prepare,prepare_diag,1)

          boot='''  function boot() {\n    state.surface = readHashSurface();\n'''
          diag='''  function installDispatchDiagnostics(){\n    const root=$("surfaceRoot");\n    if(root && root.dataset.diagBound!=="1"){\n      root.dataset.diagBound="1";\n      root.addEventListener("click",(event)=>{\n        const action=event.target.closest("[data-action]")?.dataset?.action||null;\n        state.__diagRootClick={action,openPicker:state.openPicker,busy:state.busy,at:Date.now()};\n      },true);\n    }\n    window.__ccDispatchDiag=()=>({\n      busy:state.busy,openPicker:state.openPicker,\n      rootBound:$("surfaceRoot")?.dataset?.diagBound||null,\n      handleEnter:state.__diagHandleEnter||null,busyReturn:state.__diagBusyReturn||null,\n      prepareBranch:state.__diagPrepareBranch||null,beforeDraftPost:state.__diagBeforeDraftPost||null,\n      rootClick:state.__diagRootClick||null,flow:{...state.flow}\n    });\n  }\n\n  function boot() {\n    state.surface = readHashSurface();\n    installDispatchDiagnostics();\n'''
          if js.count(boot)!=1: raise SystemExit(f'BOOT_DIAG_ANCHOR:{js.count(boot)}')
          js=js.replace(boot,diag,1)
          js_path.write_text(js,encoding='utf-8')

          text=verifier.read_text(encoding='utf-8')
          old_before="return {button:{exists:!!button,disabled:!!button?.disabled,outerHTML:button?.outerHTML||null},fields,activeTag:document.activeElement?.tagName||null,activeField:document.activeElement?.dataset?.flowField||null};"
          new_before="return {button:{exists:!!button,disabled:!!button?.disabled,outerHTML:button?.outerHTML||null},fields,activeTag:document.activeElement?.tagName||null,activeField:document.activeElement?.dataset?.flowField||null,dispatchDiag:window.__ccDispatchDiag?.()||null};"
          if text.count(old_before)!=1: raise SystemExit('VERIFIER_BEFORE_DIAG_ANCHOR')
          text=text.replace(old_before,new_before,1)
          old_after="()=>({bodyTail:(document.body?.innerText||'').slice(-5000),buttonDisabled:!!document.querySelector('[data-action=\"prepare-client\"]')?.disabled,activeTag:document.activeElement?.tagName||null,activeField:document.activeElement?.dataset?.flowField||null})"
          new_after="()=>({bodyTail:(document.body?.innerText||'').slice(-5000),buttonDisabled:!!document.querySelector('[data-action=\"prepare-client\"]')?.disabled,activeTag:document.activeElement?.tagName||null,activeField:document.activeElement?.dataset?.flowField||null,dispatchDiag:window.__ccDispatchDiag?.()||null})"
          if text.count(old_after)!=1: raise SystemExit('VERIFIER_AFTER_DIAG_ANCHOR')
          text=text.replace(old_after,new_after,1)
          verifier.write_text(text,encoding='utf-8')
          print('PASS_EPHEMERAL_DISPATCH_INSTRUMENTATION')
          PY
          node --check 'apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/web/cloud_command_center.js'

      - name: Run browser diagnosis
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input playwright==1.54.0
          mkdir -p .cloudcust-diag
          set +e
          python 'apps/terminal-de-venta-system/tools/verify-cloud-center-customer-runtime-02.py' --out-dir .cloudcust-diag 2>&1 | tee .cloudcust-diag/diagnostic.log
          code=${PIPESTATUS[0]}
          set -e
          echo "VERIFIER_EXIT=$code"
          grep -E 'CREATE_DIAG_(BEFORE|AFTER)=' .cloudcust-diag/diagnostic.log || true
          exit 0

      - name: Upload diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: cloudcust-dispatch-diag-v6
          path: .cloudcust-diag/
          if-no-files-found: error
          retention-days: 7
