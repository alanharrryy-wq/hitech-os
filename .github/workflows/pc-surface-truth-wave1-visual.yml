name: PC Surface Truth Wave 1 Visual Gate

'on':
  pull_request:
    paths:
      - ".github/workflows/pc-surface-truth-wave1-visual.yml"
      - "apps/terminal-de-venta-system/prisma/**"
      - "apps/terminal-de-venta-system/products/pc/app/**"

permissions:
  contents: read

jobs:
  pc-wave2-schema-parity-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare isolated SQLite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/pc-wave2-schema
          DB="$RUNNER_TEMP/pc-wave2-schema-parity.db"
          TARGET="$RUNNER_TEMP/pc-wave2-schema-target.db"
          echo "DATABASE_URL=file:$DB" >> "$GITHUB_ENV"
          echo "SCHEMA_DB=$DB" >> "$GITHUB_ENV"
          echo "TARGET_DB=$TARGET" >> "$GITHUB_ENV"

      - name: Generate canonical PC Prisma client
        run: pnpm -C apps/terminal-de-venta-system/products/pc/app run prisma:generate

      - name: Apply current canonical migration history
        run: pnpm -C apps/terminal-de-venta-system/products/pc/app run db:canonical:migrate

      - name: Ask Prisma for exact migration drift
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/artifacts/pc-wave2-schema"
          set +e
          pnpm -C apps/terminal-de-venta-system/products/pc/app exec prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel "../../../prisma/schema.prisma" \
            --script \
            --exit-code \
            > "$OUT/PRISMA_MIGRATION_DRIFT.sql" \
            2> "$OUT/PRISMA_MIGRATION_DRIFT.stderr.txt"
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$OUT/PRISMA_MIGRATION_DRIFT_EXIT_CODE.txt"
          if [[ "$rc" -eq 0 ]]; then
            echo "SCHEMA_PARITY_EXACT" > "$OUT/SCHEMA_PARITY_VERDICT.txt"
          elif [[ "$rc" -eq 2 ]]; then
            echo "SCHEMA_PARITY_DRIFT_CONFIRMED" > "$OUT/SCHEMA_PARITY_VERDICT.txt"
          else
            cat "$OUT/PRISMA_MIGRATION_DRIFT.stderr.txt" >&2 || true
            exit 1
          fi

      - name: Capture canonical schema DDL
        shell: bash
        run: |
          set -euo pipefail
          pnpm -C apps/terminal-de-venta-system/products/pc/app exec prisma migrate diff \
            --from-empty \
            --to-schema-datamodel "../../../prisma/schema.prisma" \
            --script \
            > "$GITHUB_WORKSPACE/artifacts/pc-wave2-schema/CANONICAL_SCHEMA_FROM_EMPTY.sql"

      - name: Derive material-only migration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          root = Path("artifacts/pc-wave2-schema")
          drift = (root / "PRISMA_MIGRATION_DRIFT.sql").read_text(encoding="utf-8")
          marker = "-- RedefineIndex\n"
          material = drift.split(marker, 1)[0].rstrip() + "\n"
          if "-- CreateTable" not in material or "-- RedefineTables" not in material:
              raise SystemExit("material migration did not contain expected structural drift")
          (root / "MATERIAL_MIGRATION.sql").write_text(material, encoding="utf-8")
          PY

      - name: Apply material migration to isolated migrated DB
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sqlite3
          from pathlib import Path
          db = Path(os.environ["SCHEMA_DB"])
          sql = Path("artifacts/pc-wave2-schema/MATERIAL_MIGRATION.sql").read_text(encoding="utf-8")
          result = {"database": str(db), "pass": False, "error": None}
          conn = sqlite3.connect(db)
          try:
              conn.executescript(sql)
              violations = [list(row) for row in conn.execute("PRAGMA foreign_key_check")]
              result["foreignKeyViolations"] = violations
              result["pass"] = not violations
          except Exception as exc:
              result["error"] = f"{type(exc).__name__}: {exc}"
          finally:
              conn.close()
          Path("artifacts/pc-wave2-schema/MATERIAL_MIGRATION_APPLY.json").write_text(json.dumps(result, indent=2), encoding="utf-8")
          if not result["pass"]:
              raise SystemExit(result["error"] or "material migration left FK violations")
          PY

      - name: Build isolated canonical reference DB
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, sqlite3
          from pathlib import Path
          target = Path(os.environ["TARGET_DB"])
          ddl = Path("artifacts/pc-wave2-schema/CANONICAL_SCHEMA_FROM_EMPTY.sql").read_text(encoding="utf-8")
          conn = sqlite3.connect(target)
          try:
              conn.executescript(ddl)
          finally:
              conn.close()
          PY

      - name: Compare migrated DB to canonical semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sqlite3
          from pathlib import Path

          def snapshot(path):
              conn = sqlite3.connect(path)
              try:
                  tables = [r[0] for r in conn.execute("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name") if r[0] != "_prisma_migrations"]
                  columns, fks, indexes = {}, {}, {}
                  for table in tables:
                      columns[table] = [tuple(r[1:6]) for r in conn.execute(f'PRAGMA table_info("{table}")')]
                      fks[table] = sorted((r[2], r[3], r[4], r[5], r[6]) for r in conn.execute(f'PRAGMA foreign_key_list("{table}")'))
                      signatures = set()
                      for idx in conn.execute(f'PRAGMA index_list("{table}")'):
                          name, unique = idx[1], bool(idx[2])
                          cols = tuple(r[2] for r in conn.execute(f'PRAGMA index_info("{name}")'))
                          signatures.add((unique, cols))
                      indexes[table] = sorted((int(unique), list(cols)) for unique, cols in signatures)
                  violations = [list(r) for r in conn.execute("PRAGMA foreign_key_check")]
                  return {"tables": tables, "columns": columns, "foreignKeys": fks, "indexSignatures": indexes, "foreignKeyCheck": violations}
              finally:
                  conn.close()

          actual = snapshot(os.environ["SCHEMA_DB"])
          target = snapshot(os.environ["TARGET_DB"])
          report = {
              "comparison": "semantic schema parity; index names ignored, uniqueness+column signatures enforced",
              "tablesEqual": actual["tables"] == target["tables"],
              "columnsEqual": actual["columns"] == target["columns"],
              "foreignKeysEqual": actual["foreignKeys"] == target["foreignKeys"],
              "indexSignaturesEqual": actual["indexSignatures"] == target["indexSignatures"],
              "actualForeignKeyViolations": actual["foreignKeyCheck"],
              "pass": False,
          }
          report["pass"] = all([
              report["tablesEqual"], report["columnsEqual"], report["foreignKeysEqual"],
              report["indexSignaturesEqual"], not report["actualForeignKeyViolations"]
          ])
          if not report["pass"]:
              report["actual"] = actual
              report["target"] = target
          Path("artifacts/pc-wave2-schema/SEMANTIC_SCHEMA_PARITY.json").write_text(json.dumps(report, indent=2), encoding="utf-8")
          print(json.dumps({k: v for k, v in report.items() if k not in {"actual", "target"}}, indent=2))
          if not report["pass"]:
              raise SystemExit("material migration did not reach canonical semantic parity")
          PY

      - name: Upload schema parity evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pc-wave2-schema-parity-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: artifacts/pc-wave2-schema/**
