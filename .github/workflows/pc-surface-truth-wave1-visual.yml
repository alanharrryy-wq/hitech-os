name: PC Surface Truth Wave 1 Visual Gate

'on':
  pull_request:
    paths:
      - ".github/workflows/pc-surface-truth-wave1-visual.yml"
      - "apps/terminal-de-venta-system/prisma/**"
      - "apps/terminal-de-venta-system/products/pc/app/**"

permissions:
  contents: read

jobs:
  pc-wave2-schema-parity-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare isolated SQLite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/pc-wave2-schema
          DB="$RUNNER_TEMP/pc-wave2-schema-parity.db"
          echo "DATABASE_URL=file:$DB" >> "$GITHUB_ENV"
          echo "SCHEMA_DB=$DB" >> "$GITHUB_ENV"

      - name: Generate canonical PC Prisma client
        run: pnpm -C apps/terminal-de-venta-system/products/pc/app run prisma:generate

      - name: Apply current canonical migration history
        run: pnpm -C apps/terminal-de-venta-system/products/pc/app run db:canonical:migrate

      - name: Ask Prisma for exact migration drift
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/artifacts/pc-wave2-schema"
          set +e
          pnpm -C apps/terminal-de-venta-system/products/pc/app exec prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel "../../../prisma/schema.prisma" \
            --script \
            --exit-code \
            > "$OUT/PRISMA_MIGRATION_DRIFT.sql" \
            2> "$OUT/PRISMA_MIGRATION_DRIFT.stderr.txt"
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$OUT/PRISMA_MIGRATION_DRIFT_EXIT_CODE.txt"
          if [[ "$rc" -eq 1 ]]; then
            cat "$OUT/PRISMA_MIGRATION_DRIFT.stderr.txt" >&2 || true
            exit 1
          fi
          if [[ "$rc" -eq 0 ]]; then
            echo "SCHEMA_PARITY_EXACT" > "$OUT/SCHEMA_PARITY_VERDICT.txt"
          elif [[ "$rc" -eq 2 ]]; then
            echo "SCHEMA_PARITY_DRIFT_CONFIRMED" > "$OUT/SCHEMA_PARITY_VERDICT.txt"
          else
            echo "Unexpected Prisma migrate diff exit code: $rc" >&2
            exit 1
          fi

      - name: Capture canonical schema DDL
        shell: bash
        run: |
          set -euo pipefail
          pnpm -C apps/terminal-de-venta-system/products/pc/app exec prisma migrate diff \
            --from-empty \
            --to-schema-datamodel "../../../prisma/schema.prisma" \
            --script \
            > "$GITHUB_WORKSPACE/artifacts/pc-wave2-schema/CANONICAL_SCHEMA_FROM_EMPTY.sql"

      - name: Capture migrated SQLite structure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sqlite3
          from pathlib import Path
          db = Path(os.environ["SCHEMA_DB"])
          conn = sqlite3.connect(db)
          try:
              tables = [row[0] for row in conn.execute("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name")]
              fks = {}
              for table in tables:
                  fks[table] = [list(row) for row in conn.execute(f'PRAGMA foreign_key_list("{table}")')]
              fk_check = [list(row) for row in conn.execute("PRAGMA foreign_key_check")]
              report = {"database": str(db), "tables": tables, "foreignKeys": fks, "foreignKeyCheck": fk_check, "pass": not fk_check}
              Path("artifacts/pc-wave2-schema/MIGRATED_SQLITE_STRUCTURE.json").write_text(json.dumps(report, indent=2), encoding="utf-8")
              print(json.dumps({"tables": len(tables), "foreignKeyViolations": len(fk_check)}, indent=2))
          finally:
              conn.close()
          PY

      - name: Upload schema parity evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pc-wave2-schema-parity-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: artifacts/pc-wave2-schema/**
