name: Commercial Billing Ledger Register Once

on:
  push:
    branches:
      - billing-cfdi-20260814
    paths:
      - '.github/workflows/commercial-billing-apply-once.yml'
      - 'apps/terminal-de-venta-system/tools/_register_billing_factory_once.py'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: billing-cfdi-20260814

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Register Factory Ledger capability and evidence
        run: python apps/terminal-de-venta-system/tools/_register_billing_factory_once.py

      - name: Validate Factory Ledger registration
        shell: python
        run: |
          import json
          from pathlib import Path
          root = Path('PRISMA Factory Ledger')
          ledger = json.loads((root / 'PRISMA_FACTORY_LEDGER.json').read_text(encoding='utf-8'))
          evidence = json.loads((root / 'PRISMA_EVIDENCE_INDEX.json').read_text(encoding='utf-8'))
          reg = json.loads((root / 'PRISMA_FACTORY_LEDGER_REGISTRATION_INDEX.json').read_text(encoding='utf-8'))
          dnr = json.loads((root / 'PRISMA_FACTORY_LEDGER_DO_NOT_REBUILD_MAP.json').read_text(encoding='utf-8'))
          ids = {item.get('id'): item for item in ledger.get('capabilities', [])}
          expected = {
              'commercial.billing.collections': ('DONE', 'LOCAL_VERIFIED'),
              'commercial.billing.cfdi_external_gateway': ('EXTERNAL', 'EXTERNAL_BLOCKED'),
          }
          for cap_id, (classification, status) in expected.items():
              item = ids.get(cap_id)
              if not item:
                  raise SystemExit(f'Missing ledger capability {cap_id}')
              if item.get('classification') != classification or item.get('status') != status:
                  raise SystemExit(f'Wrong ledger state {cap_id}: {item}')
              if item.get('doNotRebuild') is not True:
                  raise SystemExit(f'doNotRebuild not true for {cap_id}')
              if cap_id not in reg.get('registrations', {}):
                  raise SystemExit(f'Missing registration index entry {cap_id}')
              if dnr.get('doNotRebuild', {}).get(cap_id, {}).get('value') is not True:
                  raise SystemExit(f'Missing do-not-rebuild map entry {cap_id}')
          artifact_names = {item.get('artifact') for item in evidence.get('artifacts', [])}
          for artifact in ('PR #245 Commercial Billing local verification', 'PR #245 CFDI external gateway source verification'):
              if artifact not in artifact_names:
                  raise SystemExit(f'Missing evidence artifact {artifact}')
          print('PASS_COMMERCIAL_BILLING_FACTORY_LEDGER_VALIDATED')

      - name: Commit Factory Ledger registration only
        run: |
          rm -f apps/terminal-de-venta-system/tools/_register_billing_factory_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          python - <<'PY'
          import subprocess
          staged = subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines()
          workflow_changes = [p for p in staged if p.startswith('.github/workflows/')]
          if workflow_changes:
              raise SystemExit('Workflow change leaked into ledger commit: ' + ', '.join(workflow_changes))
          allowed = {
              'PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER.json',
              'PRISMA Factory Ledger/PRISMA_EVIDENCE_INDEX.json',
              'PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER_REGISTRATION_INDEX.json',
              'PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER_DO_NOT_REBUILD_MAP.json',
              'PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER.md',
              'apps/terminal-de-venta-system/tools/_register_billing_factory_once.py',
          }
          unexpected = [p for p in staged if p not in allowed]
          if unexpected:
              raise SystemExit('Unexpected Factory Ledger staged files: ' + ', '.join(unexpected))
          print('PASS_FACTORY_LEDGER_COMMIT_SCOPE')
          PY
          git commit -m "governance: register commercial billing Factory Ledger state"
          git push origin HEAD:billing-cfdi-20260814
