name: Change Assurance Capability Anti-Rework Gate

on:
  pull_request:
    paths:
      - 'tools/code-atlas/**'
      - 'apps/terminal-de-venta-system/Prisma Cloud Ctr/**change_intelligence*'
      - 'apps/terminal-de-venta-system/docs/business/PRISMA_CHANGE_INTELLIGENCE*'
      - 'apps/terminal-de-venta-system/docs/productization/PRISMA_CHANGE_INTELLIGENCE*'
      - '.github/scripts/caext*'
      - '.github/workflows/caext*'
      - 'PRISMA Factory Ledger/PRISMA_CHANGE_INTELLIGENCE_CAPABILITY_MAP.*'
      - 'PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER_AGENT_GATE.md'
      - 'PRISMA Factory Ledger/tools/verify_change_intelligence_capability_gate.py'
      - '.github/workflows/change-intelligence-capability-gate.yml'
  push:
    branches: ['ca-assurance-v1-1908']
    paths:
      - 'PRISMA Factory Ledger/tools/verify_change_intelligence_capability_gate.py'
      - '.github/workflows/change-intelligence-capability-gate.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  install-v2-registry:
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ca-assurance-v1-1908
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Migrate existing registry in place
        run: python "PRISMA Factory Ledger/tools/verify_change_intelligence_capability_gate.py" --migrate-map-v2
      - name: Prove migration is map-only
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = 'PRISMA Factory Ledger/PRISMA_CHANGE_INTELLIGENCE_CAPABILITY_MAP.json'
          python "PRISMA Factory Ledger/tools/verify_change_intelligence_capability_gate.py" --validate-map
          python "PRISMA Factory Ledger/tools/verify_change_intelligence_capability_gate.py" --self-test
      - name: Commit migrated registry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'PRISMA Factory Ledger/PRISMA_CHANGE_INTELLIGENCE_CAPABILITY_MAP.json'
          git commit -m 'governance(ca): migrate canonical registry to v2'
          git push origin HEAD:ca-assurance-v1-1908

  anti-rework-gate:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Compile gate
        run: python -m py_compile "PRISMA Factory Ledger/tools/verify_change_intelligence_capability_gate.py"
      - name: Validate Change Assurance registry and contract
        run: python "PRISMA Factory Ledger/tools/verify_change_intelligence_capability_gate.py" --validate-map
      - name: Run fail-closed native negative tests
        run: python "PRISMA Factory Ledger/tools/verify_change_intelligence_capability_gate.py" --self-test
      - name: Block public reintroduction of deprecated product name
        if: github.event_name == 'pull_request'
        run: python "PRISMA Factory Ledger/tools/verify_change_intelligence_capability_gate.py" --check-legacy-diff --base-ref "${{ github.event.pull_request.base.sha }}"
