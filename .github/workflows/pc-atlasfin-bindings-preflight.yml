name: PC Atlasfin Binding Authority Preflight

on:
  push:
    branches:
      - agent/pc-atlasfin-bindings-preflight-20260829
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  authority-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run exact PC Atlasfin Authority Mesh
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/pc-atlasfin-authority"
          mkdir -p "$OUT"
          TASK='Prepare the first source-only governed Atlasfin-to-PC binding contract for the exact current-source target on PC /catalog. Pin route /catalog; componentUiId PC-HOME-FORM-COMPONENTS-CATALOG-PRODUCT-MEDIA-WORKSPACE-WORKSPACE-FRM-01; owner apps/terminal-de-venta-system/products/pc/app/components/catalog/product-media-workspace.tsx; CSS owner apps/terminal-de-venta-system/products/pc/app/components/catalog/product-media-workspace.module.css; selector .workspace; slot SLOT.pc.components_catalog_product_media_workspace.form.components_catalog_product_media_workspace.workspace; semantic VIS.SURFACE.CONTENT.PRIMARY; recipe RCP.ATLAS.CONTENT.GLASS.02; preset PRESET.ATLAS.CONTENT.GLASS.01; material MAT.ATLAS.GLASS.CONTENT.01; adapter ADP.PC.ADMIN.V2. Resolve and prove the structural visual-control layer identity and source provenance without inventing a certified identity-layer ID. Preserve the existing /stock governed pilot and all unrelated PC routes. Affected scope is only the exact component/CSS source as read-only authority, prisma-html/extras/atlasfin binding/recipe/adapter registries, apps/terminal-de-venta-system/.prisma-ui and governance evidence needed to prove the binding, and tools/code-atlas read-only evidence. Explicitly exclude Tablet, Mobile, Chart Lab, Web, SaaS Control Center, Cloud Command Center and Shared UI runtime source. Do not apply Atlasfin visual values yet, do not mutate product CSS or TSX, do not mutate runtime behavior, do not start or stop processes, do not touch ports, do not run Prisma generate, do not mutate databases, and do not run browser automation. The deliverable is authority for a bounded binding contract only, with blockers explicit and no fake green.'
          python tools/code-atlas/src/code_atlas/motors/smart_allmesh_automesh.py \
            --task "$TASK" \
            --surface pc \
            --repo "$GITHUB_WORKSPACE" \
            --out "$OUT" \
            --workers 18 \
            --shards 54 \
            --max-files 180 \
            --max-mb 80
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: Show result
        if: always()
        shell: bash
        run: |
          find "$RUNNER_TEMP/pc-atlasfin-authority" -maxdepth 2 -type f -printf '%p\n' || true

      - name: Upload Authority Mesh evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc-atlasfin-authority-exact-target
          path: ${{ runner.temp }}/pc-atlasfin-authority/*.zip
          if-no-files-found: error
          retention-days: 7
