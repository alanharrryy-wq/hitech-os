name: Mobile Verifier Reconciliation Final Gate

on:
  pull_request:
    paths:
      - '.github/workflows/mobile-verifier-reconciliation-final-gate.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: tools/code-atlas/src
  TARGET_HEAD: 30a3605b6c1b0ba8301421e11f2f3c3260973327
  TARGET_BASE: 630f025e3b41ac932a10ffab2f5992817c3037e5
  MOBILE_ROOT: apps/terminal-de-venta-system/products/mobile/app

jobs:
  final-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact target
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_HEAD }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Exact-head and scope guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
          python - <<'PY'
          import os, subprocess
          base, head = os.environ['TARGET_BASE'], os.environ['TARGET_HEAD']
          mobile = 'apps/terminal-de-venta-system/products/mobile/app/'
          docs = {
            mobile + 'docs/prisma-app/PRISMA_MOBILE_INTERFACE_CANON.md',
            mobile + 'docs/prisma-app/PRISMA_MOBILE_INTERFACE_CANON.contract.json',
            mobile + 'docs/prisma-app/PRISMA_APP_MOBILE_41_MULTI_CONTEXT_SWITCHER_RENDER_GRADE.md',
          }
          changed = subprocess.check_output(['git','diff','--name-only',base,head], text=True).splitlines()
          bad = [p for p in changed if not (p in docs or p == mobile + 'package.json' or (p.startswith(mobile + 'tools/verify') and p.endswith('.mjs')))]
          if not changed or bad:
              raise SystemExit('SCOPE_GUARD_FAIL:' + ','.join(bad))
          if any(p.endswith(('.tsx','.css')) for p in changed):
              raise SystemExit('PRODUCT_SOURCE_OR_CSS_MUTATION_FORBIDDEN')
          print('CHANGE_BOUNDARY_PASS')
          PY
          test -z "$(git status --porcelain)"

      - name: Governance tooling self-tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            "PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py" \
            tools/code-atlas/src/code_atlas/motors/prisma_mesh_gateway.py \
            tools/code-atlas/src/code_atlas/motors/smart_allmesh_parallel.py
          python "PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py" --self-test

      - name: Build Authority Mesh request
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/mobile-final.request.json" <<'PY'
          import json, os, sys
          app='apps/terminal-de-venta-system/'
          mobile=app+'products/mobile/app/'
          ledger='PRISMA Factory Ledger/'
          authorities=[
            ledger+'PRISMA_FACTORY_LEDGER.json',
            ledger+'PRISMA_FACTORY_LEDGER_AGENT_GATE.md',
            ledger+'tools/verify_prisma_anti_rework_gate.py',
            app+'docs/ops/PRISMA_FIELD_MANUAL_APRENDIZAJE_OPERATIVO.md',
            app+'quality/contracts/no-fake-green.contract.json',
            mobile+'docs/prisma-app/PRISMA_MOBILE_INTERFACE_CANON.md',
            mobile+'docs/prisma-app/PRISMA_MOBILE_INTERFACE_CANON.contract.json',
            mobile+'docs/prisma-app/archive/interface-history/PRISMA_APP_MOBILE_41_MULTI_CONTEXT_SWITCHER_RENDER_GRADE.md',
            mobile+'package.json',
            mobile+'tools/verify_prisma_mobile_interface_canon.mjs',
            mobile+'tools/verify_prisma_app_mobile_28_data_readiness.mjs'
          ]
          tasks=[
            {
              'id':'mobile-final-conformance',
              'surface':'mobile','intent':'VERIFY','domain':'testing',
              'task':'Verify final Mobile interface/verifier reconciliation. Seven canonical tabs remain. MultiContextSwitcher is completely retired from normative product intent with no replacement. Data Readiness verifier must validate current derivation semantically rather than by whitespace-sensitive text. No Mobile product source/runtime/API/PWA/data/sync/security/licensing/CSS mutation.',
              'requiredAuthorities':authorities,
              'requiredDirectories':[mobile+'tools',mobile+'docs/prisma-app'],
              'requiredCapabilities':['mobile.interface_specification_canon'],
              'minimumCoverage':100,'failOnMissingAuthority':True
            },
            {
              'id':'mobile-final-closure',
              'surface':'governance','intent':'VERIFY','domain':'governance',
              'task':'Require no-fake-green final closure: bounded docs/package/verifier scope only; active iteration-41 spec and verifier absent; historical archive preserved; current Mobile technical gates, typecheck and production build must pass.',
              'requiredAuthorities':authorities+[ledger+'PRISMA_EVIDENCE_INDEX.json'],
              'requiredDirectories':[app+'quality/contracts'],
              'requiredCapabilities':['mobile.interface_specification_canon'],
              'minimumCoverage':100,'failOnMissingAuthority':True
            }
          ]
          json.dump({'schemaVersion':'v2','profile':'mobile-final-no-multicontext-v2','expectedHead':os.environ['TARGET_HEAD'],'tasks':tasks},open(sys.argv[1],'w',encoding='utf-8'),ensure_ascii=False,indent=2)
          PY

      - name: Fresh exact-head Authority Mesh
        shell: bash
        run: |
          set -euo pipefail
          req="$RUNNER_TEMP/mobile-final.request.json"
          pre="$RUNNER_TEMP/mobile-final-pre"
          par="$RUNNER_TEMP/mobile-final-par"
          comp="$RUNNER_TEMP/mobile-final-comp/payload"
          mkdir -p "$pre" "$par" "$comp"
          python -m code_atlas.motors.prisma_mesh_gateway preflight --repo "$GITHUB_WORKSPACE" --request "$req" --out "$pre"
          python tools/code-atlas/src/code_atlas/motors/smart_allmesh_parallel.py \
            --repo "$GITHUB_WORKSPACE" --out-root "$par" --task-spec "$pre/legacy_tasks.json" \
            --parallel 2 --workers 18 --shards 54 --max-files 160 --max-mb 48
          python -m code_atlas.motors.prisma_mesh_gateway compose \
            --repo "$GITHUB_WORKSPACE" --request "$req" --preflight "$pre" --mesh-result "$par" --out "$comp" \
            | tee "$RUNNER_TEMP/mobile-final-compose.txt"
          grep -Fq PASS_COMPOSED_AUTHORITY_MESH "$RUNNER_TEMP/mobile-final-compose.txt"
          test -f "$RUNNER_TEMP/mobile-final-comp/prisma-automesh-composed-result.zip"

      - name: Factory Ledger MUTATION gate
        shell: bash
        run: |
          set -euo pipefail
          request="$RUNNER_TEMP/mobile-final-mutation.request.json"
          decision="$RUNNER_TEMP/mobile-final-mutation.decision.json"
          python - \
            "$RUNNER_TEMP/mobile-final-comp/payload/PRISMA_MESH_GATEWAY_REPORT.json" \
            "$RUNNER_TEMP/mobile-final-pre/PREFLIGHT_MANIFEST.json" \
            "$RUNNER_TEMP/mobile-final-comp/prisma-automesh-composed-result.zip" \
            "$request" <<'PY'
          import hashlib,json,os,sys
          report=json.load(open(sys.argv[1],encoding='utf-8'))
          pre=json.load(open(sys.argv[2],encoding='utf-8'))
          digest=hashlib.sha256(open(sys.argv[3],'rb').read()).hexdigest()
          coverage=min(float((x.get('coverage') or {}).get('resolvedPercent',0)) for x in pre['lanes'])
          payload={
            'schemaVersion':'prisma.factory-ledger.anti-rework-gate.v1',
            'mode':'MUTATION','expectedHead':os.environ['TARGET_HEAD'],
            'task':'Advance mobile.interface_specification_canon by final verifier/spec reconciliation removing MultiContextSwitcher from normative Mobile product intent and correcting the Data Readiness verifier semantic check. No Mobile product source/runtime mutation.',
            'capabilities':[{'id':'mobile.interface_specification_canon','requestedAction':'ADVANCE'}],
            'authorityMesh':{'status':report['status'],'repoHead':report['repoHead'],'requiredAuthorityCoveragePct':coverage,'blockers':len(pre.get('blockers') or []),'requestDigest':report['requestDigest'],'artifactDigest':digest,'layerMapPresent':False},
            'visualMutation':False
          }
          json.dump(payload,open(sys.argv[4],'w',encoding='utf-8'),ensure_ascii=False,indent=2)
          PY
          python "PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py" --request "$request" | tee "$decision"
          python - "$decision" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          assert d.get('result')=='PASS_ANTI_REWORK_GATE' and d.get('errors')==[], d
          print('PASS_ANTI_REWORK_GATE')
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Canon and compatibility verification
        working-directory: ${{ env.MOBILE_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          test ! -e tools/verify_prisma_app_mobile_41_multi_context_switcher.mjs
          test ! -e docs/prisma-app/PRISMA_APP_MOBILE_41_MULTI_CONTEXT_SWITCHER_RENDER_GRADE.md
          test -e docs/prisma-app/archive/interface-history/PRISMA_APP_MOBILE_41_MULTI_CONTEXT_SWITCHER_RENDER_GRADE.md
          node --check tools/verify_prisma_mobile_interface_canon.mjs
          node --check tools/verify_prisma_app_mobile_28_data_readiness.mjs
          pnpm run verify:interface-canon
          node tools/verify_prisma_app_mobile_20_command_center.mjs
          node tools/verify_prisma_app_mobile_21_owner_action_inbox.mjs
          node tools/verify_prisma_app_mobile_22_daily_brief.mjs
          node tools/verify_prisma_app_mobile_23_decision_ledger.mjs
          node tools/verify_prisma_app_mobile_24_pulse_timeline.mjs
          node tools/verify_prisma_app_mobile_33_mando_contracts.mjs
          node tools/verify_prisma_app_mobile_37_release_hardening.mjs

      - name: Current Mobile technical gates
        working-directory: ${{ env.MOBILE_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm run verify:health-radar
          pnpm run verify:health-radar-compat
          pnpm run verify:data-readiness
          pnpm run verify:premium-navigation
          pnpm run verify:crystal-intelligence
          pnpm run verify:secure-projection-gateway
          pnpm run verify:source-states
          pnpm run verify:runtime-error-guard

      - name: Typecheck Mobile
        working-directory: ${{ env.MOBILE_ROOT }}
        run: pnpm run typecheck

      - name: Build Mobile
        working-directory: ${{ env.MOBILE_ROOT }}
        run: pnpm run build

      - name: Stage evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/mobile-final-evidence"
          mkdir -p "$out"
          git diff --name-status "$TARGET_BASE" "$TARGET_HEAD" > "$out/changed-files.txt"
          git log -1 --format='%H%n%T%n%s' "$TARGET_HEAD" > "$out/target-head.txt"
          for p in \
            "$RUNNER_TEMP/mobile-final.request.json" \
            "$RUNNER_TEMP/mobile-final-pre/PREFLIGHT_MANIFEST.json" \
            "$RUNNER_TEMP/mobile-final-comp/payload/PRISMA_MESH_GATEWAY_REPORT.json" \
            "$RUNNER_TEMP/mobile-final-comp/prisma-automesh-composed-result.zip" \
            "$RUNNER_TEMP/mobile-final-mutation.request.json" \
            "$RUNNER_TEMP/mobile-final-mutation.decision.json"; do
            [ ! -f "$p" ] || cp "$p" "$out/$(basename "$p")"
          done

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-verifier-reconciliation-final-evidence-v2
          path: ${{ runner.temp }}/mobile-final-evidence/**
          if-no-files-found: error
          retention-days: 14
