name: cloudcust source finalize v7

on:
  push:
    branches:
      - cloudcust-runtime-20260814
    paths:
      - .github/workflows/cloudcust-source-finalize-v7.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: cloudcust-runtime-20260814
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Current-main authority and exact preimage gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          git merge-base --is-ancestor origin/main HEAD || { echo 'BRANCH_NOT_ON_CURRENT_MAIN'; exit 1; }
          STORE='apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/py/command_center_store.py'
          JS='apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/web/cloud_command_center.js'
          HTML='apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/web/cloud_command_center.html'
          SERVER='apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/py/prisma_unified_lab_v3.py'
          test "$(git hash-object "$STORE")" = 'dfec957562bf548ac6b4c9133d089fa7a8a31e8f'
          test "$(git hash-object "$JS")" = 'a3d460029a8cfd38ec0664527add991fb0c9c415'
          test "$(git hash-object "$HTML")" = '919b2d72807e5af9709ff5e0a1815ab11349ba87'
          test "$(git hash-object "$SERVER")" = 'b8ba736c5ed2e1074332d3713b167d39d906e2f6'
          test -f 'apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/config/customer_registration_catalogs.canonical.json'
          test -f 'apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/py/customer_registration.py'
          test -f 'apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/py/customer_registration_runtime.py'
          test -f 'apps/terminal-de-venta-system/tools/_cloudcust_finalize_source_v2.py'
          echo "HEAD=$(git rev-parse HEAD)"
          echo "CURRENT_MAIN=$(git rev-parse origin/main)"
          echo 'PASS_CURRENT_MAIN_AUTHORITY_EXACT_PREIMAGE'

      - name: Apply direct readable source integration
        shell: bash
        run: |
          set -euo pipefail
          python 'apps/terminal-de-venta-system/tools/_cloudcust_finalize_source_v2.py'
          python - <<'PY'
          from pathlib import Path
          import json

          app=Path('apps/terminal-de-venta-system')
          html_path=app/'Prisma Cloud Ctr/internal/web/cloud_command_center.html'
          js_path=app/'Prisma Cloud Ctr/internal/web/cloud_command_center.js'
          report_path=Path('.cloudcust-evidence/SOURCE_PATCH_REPORT.json')

          html=html_path.read_text(encoding='utf-8')
          nav_anchor='      <button type="button" data-surface="entitlements">Licencias</button>\n'
          billing='      <button type="button" data-surface="billing">Cobranza</button>\n'
          if billing not in html:
              if html.count(nav_anchor)!=1: raise SystemExit(f'BILLING_NAV_ANCHOR_COUNT:{html.count(nav_anchor)}')
              html=html.replace(nav_anchor,nav_anchor+billing,1)
          viewport='<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n'
          if '<link rel="icon" href="data:,">' not in html:
              if html.count(viewport)!=1: raise SystemExit(f'FAVICON_ANCHOR_COUNT:{html.count(viewport)}')
              html=html.replace(viewport,viewport+'  <link rel="icon" href="data:,">\n',1)
          html_path.write_text(html,encoding='utf-8')

          js=js_path.read_text(encoding='utf-8')

          # Button focus is not an editing session. Background refresh should only defer
          # while the operator is actually editing or has a picker open.
          old='active.matches("input,select,textarea,button,[contenteditable=\'true\']")'
          new='active.matches("input,select,textarea,[contenteditable=\'true\']")'
          if js.count(old)!=1: raise SystemExit(f'INTERACTION_SELECTOR_COUNT:{js.count(old)}')
          js=js.replace(old,new,1)

          # Root cause from browser diagnosis v6: a text input's blur/change was calling
          # render() between pointerdown and click, replacing the target action button.
          old_change='''    document.addEventListener("change", (event) => {\n      const field=event.target.closest("[data-flow-field]");\n      if(field){ syncFlowFromDom(); state.flow[field.dataset.flowField]=field.value; if(field.dataset.flowField!=="clientRequestId") state.flow.clientRequestId=""; reconcileDependencies(field.dataset.flowField); render(); }\n    });\n'''
          new_change='''    document.addEventListener("change", (event) => {\n      const field=event.target.closest("[data-flow-field]");\n      if(!field) return;\n      syncFlowFromDom();\n      const key=field.dataset.flowField;\n      state.flow[key]=field.value;\n      if(key!=="clientRequestId") state.flow.clientRequestId="";\n      reconcileDependencies(key);\n      if(field.tagName==="SELECT") render();\n    });\n'''
          if js.count(old_change)!=1: raise SystemExit(f'TEXT_CHANGE_RENDER_ANCHOR_COUNT:{js.count(old_change)}')
          js=js.replace(old_change,new_change,1)

          # Never replace the button in capture phase. Let the action listener dispatch
          # first; non-action outside clicks can close the picker afterwards.
          capture='''    document.addEventListener("click",(event)=>{ if(state.openPicker && !event.target.closest("[data-picker-toggle],[data-picker-panel]")){ syncFlowFromDom(); state.openPicker=null; render(); } }, true);\n'''
          bubble='''    document.addEventListener("click",(event)=>{\n      if(state.openPicker && !event.target.closest("[data-picker-toggle],[data-picker-panel],[data-action]")){\n        syncFlowFromDom();\n        state.openPicker=null;\n        render();\n      }\n    });\n'''
          if js.count(capture)!=1: raise SystemExit(f'PICKER_CAPTURE_ANCHOR_COUNT:{js.count(capture)}')
          js=js.replace(capture,bubble,1)
          js_path.write_text(js,encoding='utf-8')

          report=json.loads(report_path.read_text(encoding='utf-8'))
          extras=[
              'billing_navigation_exposed',
              'post_action_render_not_blocked_by_button_focus',
              'text_change_never_replaces_action_target',
              'select_change_keeps_dependency_refresh',
              'picker_close_runs_after_action_dispatch',
              'action_click_excluded_from_picker_close_rerender',
              'no_favicon_404_console_noise',
              'hidden_evidence_artifacts_uploaded_explicitly',
          ]
          report['improvements']=report.get('improvements',[])+extras
          report['improvementCount']=len(report['improvements'])
          report_path.write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print('PASS_V7_CLICK_LIFECYCLE_FIX')
          print('improvements='+str(report['improvementCount']))
          PY

      - name: Static syntax and UX lifecycle contracts
        shell: bash
        run: |
          set -euo pipefail
          APP='apps/terminal-de-venta-system'
          python -m py_compile \
            "$APP/Prisma Cloud Ctr/internal/py/customer_registration.py" \
            "$APP/Prisma Cloud Ctr/internal/py/customer_registration_runtime.py" \
            "$APP/Prisma Cloud Ctr/internal/py/command_center_store.py" \
            "$APP/Prisma Cloud Ctr/internal/py/prisma_unified_lab_v3.py" \
            "$APP/tools/verify-cloud-center-customer-registration-01.py" \
            "$APP/tools/verify-cloud-center-customer-runtime-02.py"
          node --check "$APP/Prisma Cloud Ctr/internal/web/cloud_command_center.js"
          python - <<'PY'
          from pathlib import Path
          app=Path('apps/terminal-de-venta-system')
          js=(app/'Prisma Cloud Ctr/internal/web/cloud_command_center.js').read_text(encoding='utf-8')
          html=(app/'Prisma Cloud Ctr/internal/web/cloud_command_center.html').read_text(encoding='utf-8')
          store=(app/'Prisma Cloud Ctr/internal/py/command_center_store.py').read_text(encoding='utf-8')
          required=[
              'data-customer-registration-form="v2"','selectField("acquisitionChannel"','selectField("country"',
              'selectField("deviceRole"','selectField("targetCode"','Medición homologada','operatorIsInteracting',
              'syncFlowFromDom','reconcileDependencies','clientRequestId','noDefault:true','field.tagName==="SELECT"',
              '[data-picker-toggle],[data-picker-panel],[data-action]'
          ]
          missing=[x for x in required if x not in js]
          if missing: raise SystemExit('UX_MARKERS_MISSING:'+','.join(missing))
          if html.count('data-surface="billing"')!=1: raise SystemExit('BILLING_NAV_COUNT')
          if '<html lang="es-MX">' not in html: raise SystemExit('HTML_LANG_GATE')
          if '<link rel="icon" href="data:,">' not in html: raise SystemExit('FAVICON_GATE')
          if 'customer_registration_runtime' not in store or 'PRISMA_COMMAND_CENTER_DB_PATH' not in store: raise SystemExit('STORE_RUNTIME_SEAM_GATE')
          start=js.index('function clientWizard'); end=js.index('function deviceWizard',start); client=js[start:end]
          bad=[x for x in ('cityZone','selectField("plan"','save-other-values') if x in client]
          if bad: raise SystemExit('CUSTOMER_FORM_LEGACY:'+','.join(bad))
          if 'document.addEventListener("click",(event)=>{ if(state.openPicker' in js and '}, true);' in js[js.find('document.addEventListener("click",(event)=>{ if(state.openPicker'):js.find('document.addEventListener("click",(event)=>{ if(state.openPicker')+300]:
              raise SystemExit('CAPTURE_PHASE_PICKER_CLOSE_REMAINS')
          print('PASS_STATIC_UX_LIFECYCLE_CONTRACTS')
          PY
          git diff --check

      - name: Local customer registration verifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cloudcust-evidence/local
          python 'apps/terminal-de-venta-system/tools/verify-cloud-center-customer-registration-01.py' --out-dir .cloudcust-evidence/local | tee .cloudcust-evidence/local/registration.log

      - name: Chrome browser runtime E2E verifier
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input playwright==1.54.0
          mkdir -p .cloudcust-evidence/runtime
          python 'apps/terminal-de-venta-system/tools/verify-cloud-center-customer-runtime-02.py' --out-dir .cloudcust-evidence/runtime | tee .cloudcust-evidence/runtime/runtime.log

      - name: Certify final evidence and operational learning
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          ev=Path('.cloudcust-evidence')
          local=ev/'local/CLOUD_CENTER_CUSTOMER_REGISTRATION_VERIFY.json'
          runtime=ev/'runtime/CLOUD_CENTER_CUSTOMER_RUNTIME_VERIFY.json'
          for p in (local,runtime):
              if not p.exists(): raise SystemExit(f'MISSING_EVIDENCE:{p}')
              data=json.loads(p.read_text(encoding='utf-8'))
              if data.get('status')!='PASS': raise SystemExit(f'NON_PASS_EVIDENCE:{p}:{data.get("status")}')
          report=json.loads((ev/'SOURCE_PATCH_REPORT.json').read_text(encoding='utf-8'))
          report.update({
              'status':'PASS_DIRECT_SOURCE_FINALIZATION',
              'registrationVerifier':'PASS_CLOUD_CENTER_CUSTOMER_REGISTRATION_LOCAL_VERIFIED',
              'runtimeVerifier':'PASS_CLOUD_CENTER_CUSTOMER_RUNTIME_VISUAL_VERIFIED',
              'realDatabaseTouched':False,
              'liveProcessesTouched':False,
              'transport':'direct-readable-source-no-base64',
              'authorityMainAncestry':'PASS',
              'gitDiffCheck':'PASS',
              'browserRootCause':'text_input_change_render_replaced_action_target_before_click',
          })
          (ev/'CLOUDCUST_FINAL_REPORT.json').write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          manual=Path('apps/terminal-de-venta-system/docs/ops/PRISMA_FIELD_MANUAL_APRENDIZAJE_OPERATIVO.md')
          marker='## 2026-08-14 — Cloud Center customer registration: direct-source finalization'
          text=manual.read_text(encoding='utf-8')
          if marker not in text:
              entry=f'''\n\n{marker}\n\n- **Tipo:** FIX + UX hardening / transport and browser lifecycle recovery.\n- **Superficie:** Prisma Cloud Center 3160, customer registration and operator navigation only. Tablet/PC/Mobile/Cloudflare/Prisma schema excluded.\n- **Contexto:** el aplicador comprimido/base64 falló antes de `git apply` con `binascii.Error: Only base64 data is allowed`; fail-closed evitó cambios parciales. Corridas directas posteriores bloquearon anchor whitespace-sensitive, branch fuera de main vigente y defects reales detectados por Chrome antes de commit.\n- **Causa raíz de transporte:** payload base64/zip embebido frágil. Se sustituyó por fuente UTF-8 legible, preimage SHA, current-main ancestry y transforms estructurales.\n- **Causa raíz browser:** al abandonar el último input para pulsar una acción, el evento nativo `change` ejecutaba `render()` y reemplazaba `surfaceRoot.innerHTML` entre pointerdown/mousedown y `click`; además el cierre de picker en capture podía hacer el mismo reemplazo. Resultado: el botón visible desaparecía bajo el puntero y `handleAction` nunca recibía el click. Diagnóstico v6 confirmó `busy=false`, root enlazado, `handleAction=null`, cero request API.\n- **Resolución browser:** inputs de texto sincronizan estado sin render en `change`; selects conservan render por dependencias; cierre de picker corre en bubble y excluye `[data-action]`, permitiendo despachar la acción antes de cualquier recreación del DOM.\n- **UX adicional:** Cobranza vuelve a estar visible; facts manuales no autoseleccionan la primera opción; catálogos dependientes limpian valores incompatibles; adquisición/relación/calidad se miden; errores son legibles; favicon data-URI elimina 404 espurio.\n- **Gates obligatorios:** `verify-cloud-center-customer-registration-01.py` = `PASS_CLOUD_CENTER_CUSTOMER_REGISTRATION_LOCAL_VERIFIED`; `verify-cloud-center-customer-runtime-02.py` = `PASS_CLOUD_CENTER_CUSTOMER_RUNTIME_VISUAL_VERIFIED`.\n- **Evidencia:** artifact GitHub Actions `cloudcust-1408-final-v7`, con `CLOUDCUST_FINAL_REPORT.json`, logs, diagnósticos y screenshots; hidden files habilitados explícitamente en upload-artifact.\n- **DB/procesos:** pruebas usan DB y puerto efímeros; no tocan DB real ni procesos vivos del operador.\n- **Regla nueva:** no usar base64/zip embebido para patches grandes cuando Git puede aplicar fuente legible. No re-renderizar contenedores que contienen el target entre pointerdown y click por efectos de blur/change/capture. Cierre sólo con main vigente, preimage exacto, syntax, verifier funcional, browser E2E, cero temporales y commit posterior a PASS.\n- **Rollback:** revert del commit/PR. Todo cambio previo al commit dentro de CI es efímero y fail-closed.\n'''
              manual.write_text(text.rstrip()+entry+'\n',encoding='utf-8')
          print(report['status'], 'improvements='+str(report['improvementCount']))
          PY

      - name: Remove every temporary transport and finalizer
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            '.github/workflows/cloudcust-click-inspect.yml' \
            '.github/workflows/cloudcust-runtime-apply-once.yml' \
            '.github/workflows/cloudcust-source-finalize.yml' \
            '.github/workflows/cloudcust-source-finalize-v2.yml' \
            '.github/workflows/cloudcust-source-finalize-v3.yml' \
            '.github/workflows/cloudcust-source-finalize-v4.yml' \
            '.github/workflows/cloudcust-source-finalize-v5.yml' \
            '.github/workflows/cloudcust-runtime-diagnose-v6.yml' \
            '.github/workflows/cloudcust-source-finalize-v7.yml' \
            'apps/terminal-de-venta-system/tools/_cloudcust_patch_part1.txt' \
            'apps/terminal-de-venta-system/tools/_cloudcust_patch_part2.txt' \
            'apps/terminal-de-venta-system/tools/_cloudcust_patch_part3.txt' \
            'apps/terminal-de-venta-system/tools/_cloudcust_patch_part4.txt' \
            'apps/terminal-de-venta-system/tools/_cloudcust_patch_part5.txt' \
            'apps/terminal-de-venta-system/tools/_cloudcust_runtime_patch.zb64' \
            'apps/terminal-de-venta-system/tools/_cloudcust_finalize_source_v2.py'
          git diff --check
          ! git status --short | grep -E '(_cloudcust_|cloudcust-source-finalize|cloudcust-runtime-diagnose|cloudcust-click-inspect|cloudcust-runtime-apply-once)' || { echo 'TEMP_TRANSPORT_REMAINS'; git status --short; exit 1; }
          echo 'PASS_ZERO_TEMP_TRANSPORT'

      - name: Upload final certification evidence
        uses: actions/upload-artifact@v4
        with:
          name: cloudcust-1408-final-v7
          path: .cloudcust-evidence/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Commit and push certified final source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PRISMA Cloud Center Bot'
          git config user.email 'prisma-cloud-center-bot@users.noreply.github.com'
          rm -rf .cloudcust-evidence
          git add -A
          git diff --cached --check
          ! git diff --cached --name-only | grep -E '(_cloudcust_|cloudcust-source-finalize|cloudcust-runtime-diagnose|cloudcust-click-inspect|cloudcust-runtime-apply-once)' || { echo 'TEMP_FILE_STAGED'; exit 1; }
          git diff --cached --quiet && { echo 'NO_FINAL_DIFF'; exit 1; }
          echo '--- CERTIFIED FINAL DIFF ---'
          git diff --cached --stat
          git commit -m 'fix(cloud-center): finalize governed customer registration runtime'
          git push origin HEAD:cloudcust-runtime-20260814
          echo "FINAL_HEAD=$(git rev-parse HEAD)"
