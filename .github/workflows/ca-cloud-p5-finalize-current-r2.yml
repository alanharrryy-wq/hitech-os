name: CA Cloud P5 ROI Finalizer Current R2

on:
  push:
    branches:
      - feature/ca-cloud-p5-roi-current-2608

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    env:
      SOURCE_HEAD: 487459ab8901748673b86eaf3ad3a79322c7f266
    steps:
      - name: Checkout P5 branch
        uses: actions/checkout@v6
        with:
          ref: feature/ca-cloud-p5-roi-current-2608
          fetch-depth: 0

      - name: Assert governed base and exact two-carrier scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$SOURCE_HEAD"
          test "$(git merge-base HEAD origin/main)" = "$SOURCE_HEAD"
          python - <<'PY'
          import os, subprocess
          expected = {
              '.github/workflows/ca-cloud-p5-finalize-current.yml',
              '.github/workflows/ca-cloud-p5-finalize-current-r2.yml',
          }
          raw = subprocess.check_output(['git','diff','--name-only','-z',os.environ['SOURCE_HEAD']+'...HEAD'])
          actual = {p.decode() for p in raw.split(b'\0') if p}
          if actual != expected:
              raise SystemExit(f'CARRIER_SCOPE_MISMATCH actual={sorted(actual)!r}')
          PY

      - name: Apply governed P5 over existing ROI placeholder
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          config_path = Path('apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/config/change_intelligence_cloud.json')
          verifier_path = Path('apps/terminal-de-venta-system/tools/verify-cloud-center-change-intelligence-01.py')
          contract_path = Path('apps/terminal-de-venta-system/docs/productization/PRISMA_CHANGE_INTELLIGENCE_CLOUD_CENTER_VERTICAL_CONTRACT.md')

          cfg = json.loads(config_path.read_text(encoding='utf-8'))
          generated = cfg.setdefault('generatedFrom', {})
          if 'roiProjectionAuthority' in generated:
              raise SystemExit('P5_ROI_PROJECTION_AUTHORITY_ALREADY_PRESENT_IN_COMMITTED_SOURCE')
          generated['roiProjectionAuthority'] = {
              'baseHead': '487459ab8901748673b86eaf3ad3a79322c7f266',
              'baseTree': '4d1013c985cafe3e215237181d03797ee29deab3',
              'profile': 'ca-cloud-roi-p5-current-v2',
              'authorityRunId': 32940529028,
              'authorityArtifactId': 9596382236,
              'authorityArtifactDigest': 'sha256:849d76288db5034124c89f5e88d5b132cb8728cc36fa6b4574fdb333910af31c',
              'composedArtifactSha256': 'b2e83b257537ab86437255a3b12743602361b2b17aa08d6c5ba4964e5648931d',
              'authorityRequestDigest': '8f07a8f8302b604620f42f038bdc528c5cd3da59b746b148cb4c245d93bf1a21',
              'authorityResult': 'PASS_COMPOSED_AUTHORITY_MESH',
              'laneCount': 2,
              'requiredAuthorityCoverage': '100%',
              'blockers': 0,
              'repoDriftStable': True,
              'mutationGateRunId': 32940817782,
              'mutationGateArtifactId': 9596447828,
              'mutationGateArtifactDigest': 'sha256:452c11f1015e7412b8077914c82a6f88f95881eaecae990bb2c56341de418303'
          }

          cp = cfg.setdefault('controlPlane', {})
          prior_roi = cp.get('roi')
          if not isinstance(prior_roi, dict):
              raise SystemExit('P5_EXPECTED_EXISTING_ROI_PLACEHOLDER_MISSING')
          if prior_roi.get('status') != 'INPUT_DRIVEN_NO_ESTIMATE':
              raise SystemExit(f'P5_UNEXPECTED_PRIOR_ROI_STATUS:{prior_roi.get("status")}')
          cp['roi'] = {
              'status': 'INPUT_REQUIRED_NO_ESTIMATE',
              'sourceOwner': {
                  'path': 'tools/code-atlas/src/code_atlas/change_intelligence/roi.py',
                  'capabilityId': 'ci.roi.raw_instrumentation',
                  'reuseMode': 'REFERENCE_ONLY',
                  'doNotRebuild': True
              },
              'rawMetricsSupported': [
                  'contextDiscoveryTime', 'changeScopeIdentificationTime', 'humanSupervisionTime',
                  'outOfScopeChangeRate', 'reopenedWorkRate', 'evidenceAssemblyTime',
                  'changeReadinessThroughput', 'blockedBeforeChangeCount', 'evidenceCompletenessRate'
              ],
              'customerInputsPresent': False,
              'observedEventsProjected': [],
              'estimateAllowed': False,
              'financialEstimate': None,
              'currency': 'MXN',
              'monthlyBenefitFormula': 'Discovery + Rework + Agent Supervision + Release/Evidence',
              'netMonthlyValueFormula': 'Measured Monthly Benefit - Price',
              'roiPercentFormula': '(Measured Monthly Benefit - Price) / Price * 100',
              'requiredCustomerInputs': [
                  'loaded engineering cost', 'discovery hours saved', 'avoided rework events and hours',
                  'agent review minutes saved', 'release or evidence hours saved'
              ],
              'derivationRule': 'A financial estimate may be derived only from canonical observed time events measured in hours plus an explicit non-negative loaded hourly cost and an explicit assumption label.',
              'commercialHypothesesAreMeasurements': False,
              'certifiable': False,
              'productionCertified': False,
              'doesNotProve': [
                  'realized cash savings', 'profit', 'customer willingness to pay',
                  'human usefulness', 'production readiness'
              ],
              'projectionRule': 'Reference-only projection of canonical Code Atlas ROI instrumentation. Without real customer baseline inputs and observed events, the state remains INPUT_REQUIRED_NO_ESTIMATE and financialEstimate remains null. Commercial pricing hypotheses are not customer measurements.',
              'nextGate': 'Collect real customer baseline inputs and observed raw ROI events. Only then derive an explicitly labeled estimate under the canonical ROI owner; external human usefulness remains a separate evidence gate.'
          }
          config_path.write_text(json.dumps(cfg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          verifier = verifier_path.read_text(encoding='utf-8')
          marker = '    # P5_ROI_PROJECTION_GOVERNED_CHECKS\n'
          if marker in verifier:
              raise SystemExit('P5_VERIFIER_BLOCK_ALREADY_PRESENT_IN_COMMITTED_SOURCE')
          anchor = '    links = re.findall('
          if anchor not in verifier:
              raise SystemExit('P5_VERIFIER_ANCHOR_MISSING')
          block = '''    # P5_ROI_PROJECTION_GOVERNED_CHECKS\n    roi_projection_authority = generated_from.get("roiProjectionAuthority", {})\n    p5_authority_exact = {\n        "roi_authority_head": (roi_projection_authority.get("baseHead"), "487459ab8901748673b86eaf3ad3a79322c7f266"),\n        "roi_authority_tree": (roi_projection_authority.get("baseTree"), "4d1013c985cafe3e215237181d03797ee29deab3"),\n        "roi_authority_profile": (roi_projection_authority.get("profile"), "ca-cloud-roi-p5-current-v2"),\n        "roi_authority_run": (roi_projection_authority.get("authorityRunId"), 32940529028),\n        "roi_authority_artifact": (roi_projection_authority.get("authorityArtifactId"), 9596382236),\n        "roi_authority_artifact_digest": (roi_projection_authority.get("authorityArtifactDigest"), "sha256:849d76288db5034124c89f5e88d5b132cb8728cc36fa6b4574fdb333910af31c"),\n        "roi_authority_composed_digest": (roi_projection_authority.get("composedArtifactSha256"), "b2e83b257537ab86437255a3b12743602361b2b17aa08d6c5ba4964e5648931d"),\n        "roi_authority_request_digest": (roi_projection_authority.get("authorityRequestDigest"), "8f07a8f8302b604620f42f038bdc528c5cd3da59b746b148cb4c245d93bf1a21"),\n        "roi_authority_result": (roi_projection_authority.get("authorityResult"), "PASS_COMPOSED_AUTHORITY_MESH"),\n        "roi_authority_lanes": (roi_projection_authority.get("laneCount"), 2),\n        "roi_authority_coverage": (roi_projection_authority.get("requiredAuthorityCoverage"), "100%"),\n        "roi_authority_blockers": (roi_projection_authority.get("blockers"), 0),\n        "roi_authority_drift": (roi_projection_authority.get("repoDriftStable"), True),\n        "roi_gate_run": (roi_projection_authority.get("mutationGateRunId"), 32940817782),\n        "roi_gate_artifact": (roi_projection_authority.get("mutationGateArtifactId"), 9596447828),\n        "roi_gate_artifact_digest": (roi_projection_authority.get("mutationGateArtifactDigest"), "sha256:452c11f1015e7412b8077914c82a6f88f95881eaecae990bb2c56341de418303"),\n    }\n    for name, (actual, expected) in p5_authority_exact.items():\n        check(name, actual == expected, f"actual={actual} expected={expected}")\n\n    roi = cp.get("roi", {})\n    check("roi_status_input_required", roi.get("status") == "INPUT_REQUIRED_NO_ESTIMATE", str(roi.get("status")))\n    roi_owner = roi.get("sourceOwner") if isinstance(roi.get("sourceOwner"), dict) else {}\n    check("roi_owner_path", roi_owner.get("path") == "tools/code-atlas/src/code_atlas/change_intelligence/roi.py", str(roi_owner.get("path")))\n    check("roi_owner_capability", roi_owner.get("capabilityId") == "ci.roi.raw_instrumentation", str(roi_owner.get("capabilityId")))\n    check("roi_owner_reference_only", roi_owner.get("reuseMode") == "REFERENCE_ONLY", str(roi_owner.get("reuseMode")))\n    check("roi_owner_do_not_rebuild", roi_owner.get("doNotRebuild") is True, str(roi_owner.get("doNotRebuild")))\n    expected_roi_metrics = [\n        "contextDiscoveryTime", "changeScopeIdentificationTime", "humanSupervisionTime",\n        "outOfScopeChangeRate", "reopenedWorkRate", "evidenceAssemblyTime",\n        "changeReadinessThroughput", "blockedBeforeChangeCount", "evidenceCompletenessRate",\n    ]\n    check("roi_raw_metrics_exact", roi.get("rawMetricsSupported") == expected_roi_metrics, str(roi.get("rawMetricsSupported")))\n    check("roi_customer_inputs_absent", roi.get("customerInputsPresent") is False, str(roi.get("customerInputsPresent")))\n    check("roi_observed_events_empty", roi.get("observedEventsProjected") == [], str(roi.get("observedEventsProjected")))\n    check("roi_estimate_forbidden_without_inputs", roi.get("estimateAllowed") is False, str(roi.get("estimateAllowed")))\n    check("roi_financial_estimate_null", roi.get("financialEstimate") is None, str(roi.get("financialEstimate")))\n    check("roi_commercial_hypotheses_not_measurement", roi.get("commercialHypothesesAreMeasurements") is False, str(roi.get("commercialHypothesesAreMeasurements")))\n    check("roi_not_certifiable", roi.get("certifiable") is False, str(roi.get("certifiable")))\n    check("roi_not_production", roi.get("productionCertified") is False, str(roi.get("productionCertified")))\n    required_roi_inputs = [\n        "loaded engineering cost", "discovery hours saved", "avoided rework events and hours",\n        "agent review minutes saved", "release or evidence hours saved",\n    ]\n    check("roi_required_inputs_exact", roi.get("requiredCustomerInputs") == required_roi_inputs, str(roi.get("requiredCustomerInputs")))\n    roi_dnp = roi.get("doesNotProve") if isinstance(roi.get("doesNotProve"), list) else []\n    for boundary in ("realized cash savings", "profit", "customer willingness to pay", "human usefulness", "production readiness"):\n        check(f"roi_does_not_prove:{boundary}", boundary in roi_dnp, str(roi_dnp))\n    check("roi_projection_rule_fail_closed", "INPUT_REQUIRED_NO_ESTIMATE" in str(roi.get("projectionRule")) and "financialEstimate remains null" in str(roi.get("projectionRule")), str(roi.get("projectionRule")))\n    check("roi_derivation_rule_bounded", "observed time events" in str(roi.get("derivationRule")) and "loaded hourly cost" in str(roi.get("derivationRule")), str(roi.get("derivationRule")))\n\n'''
          verifier_path.write_text(verifier.replace(anchor, block + anchor, 1), encoding='utf-8')

          contract = contract_path.read_text(encoding='utf-8')
          marker2 = '## ROI P5 projection contract\n'
          if marker2 in contract:
              raise SystemExit('P5_CONTRACT_BLOCK_ALREADY_PRESENT_IN_COMMITTED_SOURCE')
          anchor2 = '## Browser/runtime authority gate\n'
          if anchor2 not in contract:
              raise SystemExit('P5_CONTRACT_ANCHOR_MISSING')
          section = '''## ROI P5 projection contract\n\nP5 hardens the existing Cloud ROI placeholder into a read-only projection adapter over the canonical Code Atlas ROI owner. It does not add a second ROI engine, estimator, billing owner, pricing engine or customer-measurement store.\n\nFresh P5 authority and mutation authorization:\n\n- exact base: `main@487459ab8901748673b86eaf3ad3a79322c7f266` / tree `4d1013c985cafe3e215237181d03797ee29deab3`\n- Authority Mesh run/artifact: `32940529028` / `9596382236`\n- Authority Mesh artifact digest: `sha256:849d76288db5034124c89f5e88d5b132cb8728cc36fa6b4574fdb333910af31c`\n- composed artifact SHA-256: `b2e83b257537ab86437255a3b12743602361b2b17aa08d6c5ba4964e5648931d`\n- request digest: `8f07a8f8302b604620f42f038bdc528c5cd3da59b746b148cb4c245d93bf1a21`\n- result: `PASS_COMPOSED_AUTHORITY_MESH`, `2/2` lanes, `100%` required authority coverage, `0` blockers\n- mutation-gate run/artifact: `32940817782` / `9596447828`\n- mutation-gate artifact digest: `sha256:452c11f1015e7412b8077914c82a6f88f95881eaecae990bb2c56341de418303`\n\nCanonical raw ROI instrumentation remains owned by `tools/code-atlas/src/code_atlas/change_intelligence/roi.py` and is reused as-is. No real customer baseline values or observed customer ROI events are present in this source projection. The safe state is therefore `INPUT_REQUIRED_NO_ESTIMATE` with `customerInputsPresent=false`, `estimateAllowed=false`, `observedEventsProjected=[]` and `financialEstimate=null`. Commercial price references are hypotheses or terms, never measured customer benefit.\n\nP5 does not prove realized cash savings, profit, willingness to pay, human usefulness, production readiness, hosted multi-tenant readiness or enterprise readiness. Real customer baselines and observed events are the next ROI evidence gate. Independent-agent and human-usefulness gates remain separate.\n\n'''
          contract_path.write_text(contract.replace(anchor2, section + anchor2, 1), encoding='utf-8')
          PY

      - name: Remove temporary finalizers
        shell: bash
        run: |
          rm '.github/workflows/ca-cloud-p5-finalize-current.yml'
          rm '.github/workflows/ca-cloud-p5-finalize-current-r2.yml'

      - name: Assert exact uncommitted scope NUL-safe
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/ca-cloud-p5-finalize-current.yml',
              '.github/workflows/ca-cloud-p5-finalize-current-r2.yml',
              'apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/config/change_intelligence_cloud.json',
              'apps/terminal-de-venta-system/docs/productization/PRISMA_CHANGE_INTELLIGENCE_CLOUD_CENTER_VERTICAL_CONTRACT.md',
              'apps/terminal-de-venta-system/tools/verify-cloud-center-change-intelligence-01.py',
          }
          raw = subprocess.check_output(['git','diff','--name-only','-z'])
          actual = {p.decode() for p in raw.split(b'\0') if p}
          extras = {p.decode() for p in subprocess.check_output(['git','ls-files','--others','--exclude-standard','-z']).split(b'\0') if p}
          if actual != expected or extras:
              raise SystemExit(f'P5_SCOPE_MISMATCH actual={sorted(actual)!r} untracked={sorted(extras)!r}')
          PY

      - name: Commit and verify P5
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'prisma-ca-governor[bot]'
          git config user.email 'prisma-ca-governor[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(ca): project fail-closed Cloud ROI inputs'
          python -m json.tool 'apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/config/change_intelligence_cloud.json' >/dev/null
          python 'apps/terminal-de-venta-system/tools/verify-cloud-center-change-intelligence-01.py'
          python - <<'PY'
          import os, subprocess
          expected = {
              'apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/config/change_intelligence_cloud.json',
              'apps/terminal-de-venta-system/docs/productization/PRISMA_CHANGE_INTELLIGENCE_CLOUD_CENTER_VERTICAL_CONTRACT.md',
              'apps/terminal-de-venta-system/tools/verify-cloud-center-change-intelligence-01.py',
          }
          raw = subprocess.check_output(['git','diff','--name-only','-z',os.environ['SOURCE_HEAD']+'...HEAD'])
          actual = {p.decode() for p in raw.split(b'\0') if p}
          if actual != expected:
              raise SystemExit(f'FINAL_NET_SCOPE_MISMATCH actual={sorted(actual)!r}')
          if subprocess.check_output(['git','status','--porcelain']):
              raise SystemExit('WORKTREE_NOT_CLEAN')
          PY

      - name: Push validated product head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$SOURCE_HEAD"
          git push origin HEAD:feature/ca-cloud-p5-roi-current-2608
