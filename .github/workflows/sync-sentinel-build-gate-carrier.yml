name: PRISMA Sync Sentinel Build Gate Carrier

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: read

jobs:
  anti-rework-gate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gate/prisma-sync-sentinel-build-2808'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact carrier
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Fail closed on canonical drift or unexpected diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "bef71b7d092ef43580498988b09c1d56fd0ff474"
          mapfile -t files < <(git diff --name-only origin/main...HEAD)
          test "${#files[@]}" = "1"
          test "${files[0]}" = ".github/workflows/sync-sentinel-build-gate-carrier.yml"

      - name: Validate and run universal anti-rework mutation gate
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach bef71b7d092ef43580498988b09c1d56fd0ff474
          test "$(git rev-parse HEAD)" = "bef71b7d092ef43580498988b09c1d56fd0ff474"
          python "PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py" --validate
          python "PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py" --self-test
          cat > "$RUNNER_TEMP/sync-sentinel-gate-request.json" <<'JSON'
          {
            "schemaVersion": "prisma.factory-ledger.anti-rework-request.v1",
            "mode": "MUTATION",
            "expectedHead": "bef71b7d092ef43580498988b09c1d56fd0ff474",
            "task": "Build the bounded PRISMA Sync Sentinel reusable tooling under tools/prisma-sentinels only. Reuse frozen Tablet and PC synchronization capabilities read-only, use isolated temporary databases and Sentinel-owned processes for E2E, and do not mutate visual/product UI or live/customer data.",
            "capabilities": [
              {"id": "tooling.sync_sentinel", "requestedAction": "BUILD"},
              {"id": "tablet.sync.runtime_truth", "requestedAction": "VERIFY"},
              {"id": "pc.sync.dispatch_replay_runtime", "requestedAction": "VERIFY"},
              {"id": "data.canonical_schema_reproducibility", "requestedAction": "VERIFY"}
            ],
            "authorityMesh": {
              "status": "PASS_COMPOSED_AUTHORITY_MESH",
              "repoHead": "bef71b7d092ef43580498988b09c1d56fd0ff474",
              "requiredAuthorityCoveragePct": 100,
              "blockers": 0,
              "requestDigest": "5307681fb5d27b3835746167a3e30da3df17438cf091566b069750da42d122f3",
              "artifactDigest": "31916152f9cc5130c62e27f5d590241bd1f4fe5c78a0da88362e2789da665a22",
              "layerMapPresent": false
            },
            "visualMutation": false
          }
          JSON
          python "PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py" --request "$RUNNER_TEMP/sync-sentinel-gate-request.json" | tee "$RUNNER_TEMP/SYNC_SENTINEL_ANTI_REWORK_GATE.json"
          grep -F '"result": "PASS_ANTI_REWORK_GATE"' "$RUNNER_TEMP/SYNC_SENTINEL_ANTI_REWORK_GATE.json"

      - name: Upload gate evidence
        uses: actions/upload-artifact@v7
        with:
          name: sync-sentinel-build-gate-${{ github.run_id }}
          path: ${{ runner.temp }}/SYNC_SENTINEL_ANTI_REWORK_GATE.json
          if-no-files-found: error
          retention-days: 14
