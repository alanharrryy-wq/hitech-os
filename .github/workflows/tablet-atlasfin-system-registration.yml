name: Tablet Atlasfin System Registration

on:
  push:
    branches:
      - gov/tablet-atlasfin-system-homologation-2908
    paths:
      - '.github/workflows/tablet-atlasfin-system-registration.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gov/tablet-atlasfin-system-homologation-2908
          fetch-depth: 0

      - name: Register canonical capability
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          p = Path('PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          cid = 'visual.atlasfin.tablet_system_homologation'
          if any(x.get('id') == cid for x in data.get('capabilities', [])):
              raise SystemExit(f'{cid} already exists; fail closed')

          capability = {
            'id': cid,
            'displayName': 'Atlasfin governed Tablet-wide visual identity homologation',
            'domain': 'visual',
            'surfaces': ['atlasfin', 'rifat', 'tablet'],
            'classification': 'FIX',
            'status': 'VERIFY_REQUIRED',
            'stateLabel': 'TABLET_ATLASFIN_SYSTEM_HOMOLOGATION_REGISTERED',
            'doNotRebuild': False,
            'nextGate': 'After this registration is merged, run a fresh task-exact Authority Mesh with Layer Map on the exact current main and the universal anti-rework MUTATION gate. Then homologate the complete active Tablet visual grammar from canonical Atlasfin/RIFAT authority, regenerate deterministic Tablet visual runtime, preserve frozen certified targets, and require representative BEFORE/AFTER Chromium evidence before VISUAL_CERTIFIED.',
            'evidence': [
              'User request 2026-08-29: homologate all active Tablet UI against canonical HTML/catalog rather than screen-by-screen patches',
              'prisma-html/extras/atlasfin/README.md: canonical 27-page / 418-element visual catalog',
              'prisma-html/extras/atlasfin/assets/data/atlas.tokens.json',
              'prisma-html/extras/atlasfin/assets/data/surface-adapter.registry.json: ADP.TB.TOUCH.V2',
              'Real runtime screenshots for /stock, /sales/today and /shift used as current-state visual samples'
            ],
            'doesNotProve': [
              'Tablet-wide runtime visual improvement',
              'Every active Tablet route is visually conformant',
              'Hosted production deployment',
              'Any database, Prisma, sync, licensing or operational business-logic mutation',
              'Any PC, Mobile, Chart Lab or Shared UI visual certification'
            ],
            'allowedActions': [
              'fresh task-exact visual Authority Mesh and Layer Map for complete active Tablet visual scope',
              'canonical RIFAT Tablet visual-source changes required for systemic Atlasfin homologation',
              'deterministic Tablet visual runtime regeneration',
              'representative and then complete Chromium visual evidence against the same viewports and fixture states',
              'focused accessibility, zero-important, RIFAT drift and layout gates',
              'rollback or byte-exact restoration if evidence regresses'
            ],
            'forbiddenActions': [
              'screen-by-screen ad-hoc overrides when a canonical shared owner can express the rule',
              'manual edits to generated Tablet runtime projections',
              'modify certified frozen Cobrar target semantics or recipe without its own drift-triggered recertification',
              'modify PC, Mobile, Chart Lab or Shared UI as part of this capability',
              'modify database, Prisma schema, sync, licensing or operational business logic',
              'use !important as an override strategy',
              'claim VISUAL_CERTIFIED without runtime BEFORE/AFTER evidence'
            ]
          }
          data.setdefault('capabilities', []).append(capability)
          data['updatedAt'] = datetime.now(timezone.utc).isoformat(timespec='seconds').replace('+00:00', 'Z')
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('REGISTERED', cid)
          PY

      - name: Validate registration shape and scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          cid = 'visual.atlasfin.tablet_system_homologation'
          matches = [x for x in data['capabilities'] if x.get('id') == cid]
          assert len(matches) == 1, len(matches)
          cap = matches[0]
          assert cap['classification'] == 'FIX'
          assert cap['status'] == 'VERIFY_REQUIRED'
          assert cap['doNotRebuild'] is False
          assert set(cap['surfaces']) == {'atlasfin','rifat','tablet'}
          print('PASS_REGISTRATION_SHAPE')
          PY
          git diff --check

      - name: Remove transient workflow and commit registration
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tablet-atlasfin-system-registration.yml
          mapfile -t changed < <(git status --short | sed -E 's/^...//')
          printf 'Changed paths:\n%s\n' "${changed[*]}"
          if [[ ${#changed[@]} -ne 2 ]]; then
            echo 'Expected exactly Ledger + transient workflow deletion before commit.' >&2
            git status --short
            exit 1
          fi
          allowed_ledger='PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER.json'
          allowed_workflow='.github/workflows/tablet-atlasfin-system-registration.yml'
          for p in "${changed[@]}"; do
            [[ "$p" == "$allowed_ledger" || "$p" == "$allowed_workflow" ]] || { echo "Unexpected path: $p" >&2; exit 1; }
          done
          git config user.name 'prisma-governance-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A -- 'PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER.json' '.github/workflows/tablet-atlasfin-system-registration.yml'
          git commit -m 'governance(tablet): register Atlasfin system homologation'
          git push origin HEAD:gov/tablet-atlasfin-system-homologation-2908
