name: Commercial Billing Evidence Refresh Once

on:
  push:
    branches:
      - billing-cfdi-20260814
    paths:
      - '.github/workflows/commercial-billing-evidence-refresh-once.yml'
      - 'apps/terminal-de-venta-system/tools/_refresh_billing_evidence_once.py'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: billing-cfdi-20260814

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Refresh exact evidence claims
        run: python apps/terminal-de-venta-system/tools/_refresh_billing_evidence_once.py

      - name: Validate evidence freshness
        shell: python
        run: |
          import json
          from pathlib import Path
          path = Path('PRISMA Factory Ledger/PRISMA_EVIDENCE_INDEX.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          target = next(item for item in payload['artifacts'] if item.get('artifact') == 'PR #245 Commercial Billing local verification')
          proves = target.get('proves', [])
          assert 'Behavioral verifier completed all declared local checks (22 on PR #245 final suite)' in proves
          assert 'Command Center store E2E completed 9 additional temporary-DB integration checks' in proves
          assert 'Behavioral verifier completed 21 checks' not in proves
          entry = next(item for item in payload['entries'] if item.get('capabilityId') == 'commercial.billing.collections')
          assert 'COMMERCIAL_BILLING_VERIFY.json' in entry.get('evidence', [])
          assert 'COMMERCIAL_BILLING_COMMAND_CENTER_E2E.json' in entry.get('evidence', [])
          print('PASS_BILLING_EVIDENCE_FRESH')

      - name: Commit evidence refresh only
        run: |
          rm -f apps/terminal-de-venta-system/tools/_refresh_billing_evidence_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          python - <<'PY'
          import subprocess
          staged = subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines()
          workflow_changes = [p for p in staged if p.startswith('.github/workflows/')]
          if workflow_changes:
              raise SystemExit('Workflow change leaked into evidence commit: ' + ', '.join(workflow_changes))
          allowed = {
              'PRISMA Factory Ledger/PRISMA_EVIDENCE_INDEX.json',
              'apps/terminal-de-venta-system/tools/_refresh_billing_evidence_once.py',
          }
          unexpected = [p for p in staged if p not in allowed]
          if unexpected:
              raise SystemExit('Unexpected evidence files: ' + ', '.join(unexpected))
          print('PASS_BILLING_EVIDENCE_COMMIT_SCOPE')
          PY
          git commit -m "governance: refresh commercial billing evidence counts"
          git push origin HEAD:billing-cfdi-20260814
