name: Cloud Center Ledger Close Once

on:
  push:
    branches:
      - cloudcust-ledger-close-1408

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  register-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cloudcust-ledger-close-1408
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Verify certified ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 2557f4e0efa5204a5cad650e71382ff21bcb1b84 HEAD
          echo PASS_PR254_ANCESTRY

      - name: Register capability fail-closed
        shell: python
        run: |
          from __future__ import annotations
          import hashlib
          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          ROOT = Path('.')
          LEDGER = ROOT / 'PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER.json'
          EVIDENCE = ROOT / 'PRISMA Factory Ledger/PRISMA_EVIDENCE_INDEX.json'
          REG = ROOT / 'PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER_REGISTRATION_INDEX.json'
          DNR = ROOT / 'PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER_DO_NOT_REBUILD_MAP.json'
          CAP_ID = 'cloud_center.customer_registration_runtime'
          MERGE = '2557f4e0efa5204a5cad650e71382ff21bcb1b84'
          MESH_DIGEST = 'sha256:b17dcac8a3f1dabf504e02297d33b879e4c45a8ab5b87d50c2c61d78cd58c886'

          expected_hashes = {
              'apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/config/customer_registration_catalogs.canonical.json': '2ac887a4205054d65c7cdeb52615e931f409badcd7148c19f93a94dc2d7b0421',
              'apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/py/command_center_store.py': '1919b3c92632caaab8d131c6673b457af9223db6e3f3c1279dd870ea46051eef',
              'apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/py/customer_registration.py': '16cfee0e87bcaadc6e7ddc7d9a373142dc5c642b7d57646fc2479a873d06f23b',
              'apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/py/customer_registration_runtime.py': 'a656d85df4f2a6c43ec35539d74cd541fa941a0e70942403ab61f18dca889e9a',
              'apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/web/cloud_command_center.html': 'ad5aa9b87cee18e525a7b85a40600a82034345f39a0ff149b85b2f1aef938c8d',
              'apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/web/cloud_command_center.js': '47e0bd13d527490e021933dce777903727c739bde59b2942dd320250247a138a',
              'apps/terminal-de-venta-system/tools/verify-cloud-center-customer-registration-01.py': 'fa5914d0fe015fe64d43ce2f91028ff4e71fd3478f712288dcb9b782428dd23d',
              'apps/terminal-de-venta-system/tools/verify-cloud-center-customer-runtime-02.py': '09731a0ee2e459b465a442abc623945a5ef8b958a8a557ae8bfd1a6cb899b29c',
          }
          for raw_path, expected in expected_hashes.items():
              path = ROOT / raw_path
              if not path.exists():
                  raise SystemExit(f'MISSING_CERTIFIED_SOURCE: {raw_path}')
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f'CERTIFIED_SOURCE_DRIFT: {raw_path} expected={expected} actual={actual}')

          for path in (LEDGER, EVIDENCE, REG, DNR):
              if not path.exists():
                  raise SystemExit(f'MISSING_LEDGER_AUTHORITY: {path}')

          ledger = json.loads(LEDGER.read_text(encoding='utf-8'))
          evidence = json.loads(EVIDENCE.read_text(encoding='utf-8'))
          reg = json.loads(REG.read_text(encoding='utf-8'))
          dnr = json.loads(DNR.read_text(encoding='utf-8'))

          now = datetime.now(timezone(timedelta(hours=-6))).isoformat(timespec='seconds')

          capability = {
              'id': CAP_ID,
              'displayName': 'Prisma Cloud Center governed customer registration runtime',
              'domain': 'commercial',
              'surfaces': ['cloud_center', 'customer_registration', 'governance', 'quality'],
              'classification': 'DONE',
              'status': 'RUNTIME_VERIFIED',
              'stateLabel': 'PASS_CLOUD_CENTER_CUSTOMER_REGISTRATION_RUNTIME_VERIFIED',
              'doNotRebuild': True,
              'nextGate': 'CUSTOMER_CLOUD_ACTIVATION as a separate governed task; do not rebuild the merged local customer-registration runtime.',
              'evidence': [
                  'PR #254 Cloud Center customer registration runtime certification',
                  f'merge commit {MERGE}',
                  'verify-cloud-center-customer-registration-01.py 24/24 PASS',
                  'Chrome Playwright customer registration E2E 11/11 PASS',
                  'cloudcust-1408-final-v10',
                  f'cloudcust-ledger-mesh {MESH_DIGEST}',
              ],
              'doesNotProve': [
                  'Real cloud customer activation or hosted production provisioning',
                  'External admin/token mutation or licensing activation',
                  'Future runtime behavior after source drift',
                  'Readiness of unrelated Tablet, PC, Mobile, Web, Chart Lab or Shared UI surfaces',
              ],
              'allowedActions': [
                  'read-only recertification',
                  'fix demonstrated drift',
                  'advance to CUSTOMER_CLOUD_ACTIVATION under a fresh Authority Mesh',
              ],
              'forbiddenActions': [
                  'rebuild customer registration from scratch',
                  'weaken canonical contact, location or catalog validation to satisfy legacy fixtures',
                  'claim real cloud activation from the local prepared state',
                  'touch unrelated product surfaces as part of this capability',
              ],
          }

          caps = ledger.setdefault('capabilities', [])
          matches = [i for i, item in enumerate(caps) if item.get('id') == CAP_ID]
          if len(matches) > 1:
              raise SystemExit('DUPLICATE_CAPABILITY_ID')
          if matches:
              caps[matches[0]] = capability
          else:
              caps.append(capability)
          ledger['updatedAt'] = now

          artifact_name = 'PR #254 Cloud Center customer registration runtime certification'
          artifact = {
              'artifact': artifact_name,
              'type': 'cloud_center_customer_registration_runtime',
              'scope': ['cloud_center', 'customer_registration', 'governance', 'quality'],
              'status': 'PASS_RUNTIME_VERIFIED',
              'proves': [
                  'Customer registration focused verifier completed 24/24 declared checks',
                  'Chrome Playwright E2E completed 11/11 declared checks',
                  'draft-client request returned HTTP 200 in certified browser flow',
                  'Certified browser flow recorded zero console errors and zero failed requests',
                  'PR #254 final CI, ForgeOS Quality Gate, Zero Priority Gate, License Pricing Canon, Commercial Billing Authority, repo-analyzer-self-test and CLA Check passed',
                  f'PR #254 merged as {MERGE}',
                  'Closure Authority Mesh passed with productization + quality only, zero change types, zero missing authority, explicit layer exclusions and exact source hashes',
              ],
              'doesNotProve': capability['doesNotProve'],
          }
          artifacts = evidence.setdefault('artifacts', [])
          am = [i for i, item in enumerate(artifacts) if item.get('artifact') == artifact_name]
          if len(am) > 1:
              raise SystemExit('DUPLICATE_EVIDENCE_ARTIFACT')
          if am:
              artifacts[am[0]] = artifact
          else:
              artifacts.append(artifact)

          entry = {
              'capabilityId': CAP_ID,
              'status': 'RUNTIME_VERIFIED',
              'runId': 'PR254_CLOUD_CENTER_CUSTOMER_REGISTRATION_RUNTIME',
              'evidence': [
                  'PR #254',
                  f'merge commit {MERGE}',
                  'verify-cloud-center-customer-registration-01.py',
                  'verify-cloud-center-customer-runtime-02.py',
                  'cloudcust-1408-final-v10',
                  f'cloudcust-ledger-mesh {MESH_DIGEST}',
              ],
          }
          entries = evidence.setdefault('entries', [])
          em = [i for i, item in enumerate(entries) if item.get('capabilityId') == CAP_ID]
          if len(em) > 1:
              raise SystemExit('DUPLICATE_EVIDENCE_ENTRY')
          if em:
              entries[em[0]] = entry
          else:
              entries.append(entry)
          evidence['updatedAt'] = now

          registrations = reg.setdefault('registrations', {})
          registrations[CAP_ID] = {
              'status': 'DONE_RUNTIME_VERIFIED',
              'updatedAt': now,
              'evidence': 'apps/terminal-de-venta-system/tools/verify-cloud-center-customer-registration-01.py',
              'sourceEvidenceSha256': 'a656d85df4f2a6c43ec35539d74cd541fa941a0e70942403ab61f18dca889e9a',
              'verifierSha256': 'fa5914d0fe015fe64d43ce2f91028ff4e71fd3478f712288dcb9b782428dd23d',
              'doNotRebuild': True,
              'nextGate': 'CUSTOMER_CLOUD_ACTIVATION',
          }
          reg['updatedAt'] = now

          dn = dnr.setdefault('doNotRebuild', {})
          dn[CAP_ID] = {
              'value': True,
              'reason': 'PR #254 customer registration runtime is merged and runtime-verified; advance to cloud activation instead of rebuilding.',
              'evidence': 'apps/terminal-de-venta-system/tools/verify-cloud-center-customer-registration-01.py',
              'updatedAt': now,
          }
          dnr['updatedAt'] = now

          for path, data in ((LEDGER, ledger), (EVIDENCE, evidence), (REG, reg), (DNR, dnr)):
              path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
              json.loads(path.read_text(encoding='utf-8'))

          check_ledger = json.loads(LEDGER.read_text(encoding='utf-8'))
          check_caps = [x for x in check_ledger['capabilities'] if x.get('id') == CAP_ID]
          assert len(check_caps) == 1
          assert check_caps[0]['classification'] == 'DONE'
          assert check_caps[0]['status'] == 'RUNTIME_VERIFIED'
          assert check_caps[0]['doNotRebuild'] is True
          assert 'CUSTOMER_CLOUD_ACTIVATION' in check_caps[0]['nextGate']

          check_reg = json.loads(REG.read_text(encoding='utf-8'))['registrations'][CAP_ID]
          assert check_reg['doNotRebuild'] is True
          assert check_reg['nextGate'] == 'CUSTOMER_CLOUD_ACTIVATION'
          check_dnr = json.loads(DNR.read_text(encoding='utf-8'))['doNotRebuild'][CAP_ID]
          assert check_dnr['value'] is True

          report = {
              'status': 'PASS_FACTORY_LEDGER_CLOUD_CUSTOMER_RUNTIME_REGISTERED',
              'capabilityId': CAP_ID,
              'classification': 'DONE',
              'runtimeStatus': 'RUNTIME_VERIFIED',
              'doNotRebuild': True,
              'nextGate': 'CUSTOMER_CLOUD_ACTIVATION',
              'mergeCommit': MERGE,
              'authorityMeshDigest': MESH_DIGEST,
              'sourceHashCount': len(expected_hashes),
              'allowedFiles': [str(x) for x in (LEDGER, EVIDENCE, REG, DNR)],
              'generatedAt': now,
          }
          Path('cc-ledger-close-report.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, indent=2))

      - name: Verify exact write scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            'PRISMA Factory Ledger/PRISMA_EVIDENCE_INDEX.json'
            'PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER.json'
            'PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER_DO_NOT_REBUILD_MAP.json'
            'PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER_REGISTRATION_INDEX.json'
          )
          if [ "${changed[*]}" != "${expected[*]}" ]; then
            printf 'Unexpected write scope:\n%s\n' "${changed[*]}"
            exit 1
          fi
          echo PASS_EXACT_FOUR_FILE_SCOPE

      - name: Commit registration when needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'prisma-ledger-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- \
            'PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER.json' \
            'PRISMA Factory Ledger/PRISMA_EVIDENCE_INDEX.json' \
            'PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER_REGISTRATION_INDEX.json' \
            'PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER_DO_NOT_REBUILD_MAP.json'
          if git diff --cached --quiet; then
            echo LEDGER_ALREADY_CURRENT
          else
            git commit -m 'docs(factory-ledger): register Cloud Center customer runtime'
            git push origin HEAD:cloudcust-ledger-close-1408
          fi

      - name: Upload closure evidence
        uses: actions/upload-artifact@v7
        with:
          name: cc-ledger-close
          if-no-files-found: error
          path: cc-ledger-close-report.json
