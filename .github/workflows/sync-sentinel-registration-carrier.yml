name: PRISMA Sync Sentinel Registration Carrier

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  register-sync-sentinel:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'governance/sync-sentinel-registration-2808'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact carrier branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Fail closed on canonical base drift
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "214a83b5c13f104d1e86b1dd4e7096e63308dc74"

      - name: Register Sync Sentinel capability only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          path = Path('PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          cid = 'tooling.sync_sentinel'
          ids = [str(x.get('id') or '') for x in data.get('capabilities', []) if isinstance(x, dict)]
          if cid in ids:
              raise SystemExit(f'{cid} already exists; fail closed')

          required_existing = {'tablet.sync.runtime_truth', 'pc.sync.dispatch_replay_runtime'}
          missing_existing = sorted(required_existing.difference(ids))
          if missing_existing:
              raise SystemExit(f'missing required frozen sync authorities: {missing_existing}')

          data['capabilities'].append({
              'id': cid,
              'displayName': 'PRISMA Sync Sentinel Tablet ↔ PC verification and diagnostics tooling',
              'domain': 'tooling',
              'surfaces': ['tooling', 'tablet', 'pc', 'governance'],
              'classification': 'BUILD',
              'status': 'NOT_STARTED',
              'stateLabel': 'SYNC_SENTINEL_CANONICAL_REGISTERED_NOT_STARTED',
              'doNotRebuild': False,
              'nextGate': 'Build the bounded reusable Sync Sentinel under tools/prisma-sentinels using a fresh exact-current-main Authority Mesh and universal anti-rework MUTATION gate. Reuse tablet.sync.runtime_truth and pc.sync.dispatch_replay_runtime; do not modify Tablet/PC product sync owners or any visual/product UI surface unless separate evidence proves a real defect and fresh FIX authority is obtained.',
              'evidence': [
                  'PRISMA Sync Sentinel registration preflight Remote AutoMesh run 33144935939',
                  'Remote AutoMesh artifact 9675400060 sha256:2ed8a6b369d31e3ea84d884fb993c0a1e4ba18057f50d9090f2099db178939ef',
                  'Composed Authority Mesh sha256:7c76f59b808c7a1bc3811a5c61304b2f2f6bdd24099441d06f35dac00fffd184',
                  'Authority requestDigest 0400e28ec99b7392ee63a070d6c4308e683f91a0b7d510941c6ec6a41b8208b9',
                  'main@214a83b5c13f104d1e86b1dd4e7096e63308dc74',
                  'apps/terminal-de-venta-system/docs/sync/PC_TABLET_SYNC_CURRENT_AUTHORITY.md',
                  'tools/prisma-sentinels/README_TABLET_SENTINEL.md'
              ],
              'doesNotProve': [
                  'Sync Sentinel source exists or is merged',
                  'SCAN, DIAGNOSE, E2E or CERTIFY behavior',
                  'DB-backed Tablet ↔ PC end-to-end synchronization',
                  'PC → Tablet catalog-delta end-to-end synchronization',
                  'Negative-test coverage or fail-closed behavior',
                  'Live/customer database safety until the Sentinel safety guard is implemented and verified',
                  'Hosted production readiness or production certification',
                  'Future correctness after source drift'
              ],
              'allowedActions': [
                  'build the bounded reusable Sync Sentinel tooling under fresh exact authority',
                  'reuse existing Tablet and PC sync owners, contracts and verifiers read-only',
                  'run isolated temporary-DB verification without mutating customer/live databases',
                  'advance evidence only after fail-closed tests and real end-to-end proof'
              ],
              'forbiddenActions': [
                  'reimplement Tablet or PC sync business logic in Python',
                  'modify Tablet or PC product sync source merely to facilitate Sentinel tests',
                  'modify CSS, visual components, layouts, pages, visual tokens, Shared UI, Chart Lab, Mobile or visual recipes under this capability',
                  'touch customer/live databases or global user processes during isolated E2E',
                  'claim PASS when any mandatory assertion is UNKNOWN or BLOCKED',
                  'claim productionCertified from local or isolated evidence'
              ],
              'forbiddenClaims': [
                  'Do not claim Sync Sentinel is implemented from this registration.',
                  'Do not claim Tablet ↔ PC E2E is certified until the full real-code isolated journeys and mandatory negative tests pass.',
                  'Do not claim hosted production or customer-live certification from local isolated evidence.'
              ]
          })
          mx = timezone(timedelta(hours=-6))
          data['updatedAt'] = datetime.now(mx).isoformat(timespec='seconds')
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Validate canonical Factory Ledger gate
        shell: bash
        run: |
          set -euo pipefail
          python "PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py" --validate
          python "PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py" --self-test

      - name: Prove bounded registration diff
        shell: bash
        run: |
          set -euo pipefail
          git diff -- 'PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER.json'
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER.json').read_text(encoding='utf-8'))
          row = next((x for x in data.get('capabilities', []) if x.get('id') == 'tooling.sync_sentinel'), None)
          assert row is not None
          assert row['classification'] == 'BUILD'
          assert row['status'] == 'NOT_STARTED'
          assert row['doNotRebuild'] is False
          PY

      - name: Remove carrier and commit canonical registration
        shell: bash
        run: |
          set -euo pipefail
          rm -f '.github/workflows/sync-sentinel-registration-carrier.yml'
          git config user.name 'prisma-governance-carrier[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- 'PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER.json' '.github/workflows/sync-sentinel-registration-carrier.yml'
          git diff --cached --exit-code && { echo 'Expected bounded registration diff was empty'; exit 1; } || true
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = '2'
          test "$(git diff --cached --name-only | grep -Fx 'PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER.json' | wc -l | tr -d ' ')" = '1'
          test "$(git diff --cached --name-only | grep -Fx '.github/workflows/sync-sentinel-registration-carrier.yml' | wc -l | tr -d ' ')" = '1'
          git commit -m 'governance(sync): register Sync Sentinel capability'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
