name: PRISMA Sync Sentinel Ledger Close Mutation Gate Carrier

on:
  pull_request:
    paths:
      - '.github/workflows/prisma-sync-sentinel-ledger-close-mutation-gate-carrier.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  PINNED_BASE: 65f45505b66abf7d22ce6cd07a7396ea5a887ccf

jobs:
  mutation-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout carrier
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run task-exact Factory Ledger MUTATION gate on canonical base
        shell: bash
        run: |
          set -euo pipefail
          current="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$current" = "$PINNED_BASE"
          git worktree add --detach "$RUNNER_TEMP/base" "$PINNED_BASE"
          cd "$RUNNER_TEMP/base"
          cat > "$RUNNER_TEMP/gate.request.json" <<'JSON'
          {
            "schemaVersion":"prisma.factory-ledger.anti-rework-gate.v1",
            "mode":"MUTATION",
            "expectedHead":"65f45505b66abf7d22ce6cd07a7396ea5a887ccf",
            "task":"Canonically close the already merged PRISMA Sync Sentinel Mobile 3140 and permanent Sync Sentinel Watch in Factory Ledger/evidence truth only. Register post-merge Watch run 33344270490 artifact 9741492976 digest e97fd22dd0eb5454182fd9e017e6a732757b52bbe36e6e1c6553b09f984810e6. Preserve tooling.sync_sentinel as DONE and doNotRebuild=true with productionCertified=false. Advance mobile.secure_projection_gateway_phase1 only as supported by isolated signed-session read-side runtime evidence, preserving no hosted production, customer DB, deployed issuer, mutations, offline commands or zero-egress claims. No product, UI, CSS, Prisma schema, DB, process, port, dependency or runtime mutation.",
            "capabilities":[
              {"id":"tooling.sync_sentinel","requestedAction":"ADVANCE"},
              {"id":"mobile.secure_projection_gateway_phase1","requestedAction":"ADVANCE"},
              {"id":"tablet.sync.runtime_truth","requestedAction":"REUSE"},
              {"id":"pc.sync.dispatch_replay_runtime","requestedAction":"REUSE"},
              {"id":"data.canonical_schema_reproducibility","requestedAction":"REUSE"}
            ],
            "authorityMesh":{
              "status":"PASS_COMPOSED_AUTHORITY_MESH",
              "repoHead":"65f45505b66abf7d22ce6cd07a7396ea5a887ccf",
              "requiredAuthorityCoveragePct":100,
              "blockers":0,
              "requestDigest":"c4c68614772835a7a271aba7b128ff394bce9d16e9d2f8786ffda7a39d273f7c",
              "artifactDigest":"101d261de4c6e4327a68e526880657320ae2d720c0809eb3ca6221ab9a507d17",
              "layerMapPresent":false
            },
            "visualMutation":false
          }
          JSON
          python "PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py" --request "$RUNNER_TEMP/gate.request.json" > "$RUNNER_TEMP/gate.result.json"
          cat "$RUNNER_TEMP/gate.result.json"
          python - "$RUNNER_TEMP/gate.result.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          assert d.get('result') == 'PASS_ANTI_REWORK_GATE', d
          assert d.get('errors') == [], d
          assert d.get('repoHead') == '65f45505b66abf7d22ce6cd07a7396ea5a887ccf', d
          rows={row['id']:row for row in d.get('selected',[])}
          assert rows['tooling.sync_sentinel']['doNotRebuild'] is True
          assert rows['tooling.sync_sentinel']['requestedAction'] == 'ADVANCE'
          assert rows['mobile.secure_projection_gateway_phase1']['requestedAction'] == 'ADVANCE'
          assert rows['tablet.sync.runtime_truth']['requestedAction'] == 'REUSE'
          assert rows['pc.sync.dispatch_replay_runtime']['requestedAction'] == 'REUSE'
          assert rows['data.canonical_schema_reproducibility']['requestedAction'] == 'REUSE'
          PY

      - name: Stage gate evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sync-sentinel-ledger-close-mutation-gate"
          cp "$RUNNER_TEMP/gate.request.json" "$RUNNER_TEMP/sync-sentinel-ledger-close-mutation-gate/ANTI_REWORK_REQUEST.json" 2>/dev/null || true
          cp "$RUNNER_TEMP/gate.result.json" "$RUNNER_TEMP/sync-sentinel-ledger-close-mutation-gate/ANTI_REWORK_GATE.json" 2>/dev/null || true

      - name: Upload mutation-gate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prisma-sync-sentinel-ledger-close-mutation-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sync-sentinel-ledger-close-mutation-gate/**
          if-no-files-found: error
          retention-days: 14
