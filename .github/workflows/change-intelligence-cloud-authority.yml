name: Change Intelligence Cloud Authority

on:
  pull_request:
    paths:
      - 'apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/web/change_intelligence_center*'
      - 'apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/config/change_intelligence_cloud.json'
      - 'apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/py/change_intelligence_runtime.py'
      - 'apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/py/command_center_store.py'
      - 'apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/web/cloud_command_center.html'
      - 'apps/terminal-de-venta-system/docs/productization/PRISMA_CHANGE_INTELLIGENCE_CLOUD_CENTER_VERTICAL_CONTRACT.md'
      - 'apps/terminal-de-venta-system/tools/verify-cloud-center-change-intelligence-*'
      - '.github/workflows/change-intelligence-cloud-authority.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  change-intelligence-cloud-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pci-python-pycache
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: One-shot restore pre-existing store text on PR 321
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 321
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch origin "$HEAD_REF"
          git checkout -B "$HEAD_REF" "origin/$HEAD_REF"
          python - <<'PY'
          from pathlib import Path

          store = Path('apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/py/command_center_store.py')
          text = store.read_text(encoding='utf-8')
          noisy = '''        "CREATE TABLE IF NOT EXISTS CloudBridgeStatus(id TEXT PRIMARY KEY,mode TEXT DEFAULT 'local_prepared',cloudOrigin TEXT DEFAULT 'https://app.hitechrts.com',tokenState TEXT DEFAULT 'unknown',lastCheckedAt TEXT,payload TEXT)",
        "CREATE TABLE IF NOT EXISTS SupportCase(id TEXT PRIMARY KEY, caseCode TEXT NOT NULL UNIQUE, clientRequestId TEXT UNIQUE, title TEXT NOT NULL, supportCode TEXT, severity TEXT NOT NULL DEFAULT 'warning', status TEXT NOT NULL DEFAULT 'CASE_OPEN', stage TEXT NOT NULL DEFAULT 'SCOPE_RESOLVING', assignedTo TEXT, scope TEXT NOT NULL DEFAULT '{}', expectedSourceRevision TEXT, revision INTEGER NOT NULL DEFAULT 1, createdAt TEXT DEFAULT CURRENT_TIMESTAMP, updatedAt TEXT DEFAULT CURRENT_TIMESTAMP, closedAt TEXT)",
        "CREATE TABLE IF NOT EXISTS SupportCaseEvent(id TEXT PRIMARY KEY, caseId TEXT NOT NULL, eventType TEXT NOT NULL, fromState TEXT, toState TEXT, correlationId TEXT NOT NULL, summary TEXT NOT NULL, payload TEXT NOT NULL DEFAULT '{}', createdAt TEXT DEFAULT CURRENT_TIMESTAMP)",
        "CREATE INDEX IF NOT EXISTS idx_support_case_status_updated ON SupportCase(status, updatedAt DESC)",
        "CREATE INDEX IF NOT EXISTS idx_support_case_event_case_created ON SupportCaseEvent(caseId, createdAt DESC)",
        "CREATE TABLE IF NOT EXISTS SupportCommandRun(id TEXT PRIMARY KEY, caseId TEXT, commandId TEXT NOT NULL, idempotencyKey TEXT NOT NULL UNIQUE, expectedRevision INTEGER, beforeRevision INTEGER, afterRevision INTEGER, status TEXT NOT NULL, backupId TEXT, rollbackId TEXT, correlationId TEXT NOT NULL, payload TEXT NOT NULL DEFAULT '{}', result TEXT NOT NULL DEFAULT '{}', createdAt TEXT DEFAULT CURRENT_TIMESTAMP, updatedAt TEXT DEFAULT CURRENT_TIMESTAMP)",
        "CREATE INDEX IF NOT EXISTS idx_support_command_case_created ON SupportCommandRun(caseId, createdAt DESC)",
        "CREATE TABLE IF NOT EXISTS SupportEvidence(id TEXT PRIMARY KEY, evidenceCode TEXT NOT NULL UNIQUE, caseId TEXT, evidenceType TEXT NOT NULL, source TEXT NOT NULL, sourceRevision TEXT, correlationId TEXT NOT NULL, sha256 TEXT NOT NULL, redacted INTEGER NOT NULL DEFAULT 1, payload TEXT NOT NULL DEFAULT '{}', observedAt TEXT NOT NULL, createdAt TEXT DEFAULT CURRENT_TIMESTAMP)",
        "CREATE INDEX IF NOT EXISTS idx_support_evidence_case_created ON SupportEvidence(caseId, createdAt DESC)",
        "CREATE TABLE IF NOT EXISTS SupportRollbackSnapshot(id TEXT PRIMARY KEY, backupCode TEXT NOT NULL UNIQUE, caseId TEXT, commandId TEXT NOT NULL, correlationId TEXT NOT NULL, sourceRevision INTEGER, sha256 TEXT NOT NULL, snapshot TEXT NOT NULL, restoredAt TEXT, createdAt TEXT DEFAULT CURRENT_TIMESTAMP)"
'''
          original = '''        "CREATE TABLE IF NOT EXISTS CloudBridgeStatus(id TEXT PRIMARY KEY, mode TEXT DEFAULT 'local_prepared', cloudOrigin TEXT DEFAULT 'https://app.hitechrts.com', tokenState TEXT DEFAULT 'unknown', lastCheckedAt TEXT, payload TEXT)"
        ,"CREATE TABLE IF NOT EXISTS SupportCase(id TEXT PRIMARY KEY, caseCode TEXT NOT NULL UNIQUE, clientRequestId TEXT UNIQUE, title TEXT NOT NULL, supportCode TEXT, severity TEXT NOT NULL DEFAULT 'warning', status TEXT NOT NULL DEFAULT 'CASE_OPEN', stage TEXT NOT NULL DEFAULT 'SCOPE_RESOLVING', assignedTo TEXT, scope TEXT NOT NULL DEFAULT '{}', expectedSourceRevision TEXT, revision INTEGER NOT NULL DEFAULT 1, createdAt TEXT DEFAULT CURRENT_TIMESTAMP, updatedAt TEXT DEFAULT CURRENT_TIMESTAMP, closedAt TEXT)"
        ,"CREATE TABLE IF NOT EXISTS SupportCaseEvent(id TEXT PRIMARY KEY, caseId TEXT NOT NULL, eventType TEXT NOT NULL, fromState TEXT, toState TEXT, correlationId TEXT NOT NULL, summary TEXT NOT NULL, payload TEXT NOT NULL DEFAULT '{}', createdAt TEXT DEFAULT CURRENT_TIMESTAMP)"
        ,"CREATE INDEX IF NOT EXISTS idx_support_case_status_updated ON SupportCase(status, updatedAt DESC)"
        ,"CREATE INDEX IF NOT EXISTS idx_support_case_event_case_created ON SupportCaseEvent(caseId, createdAt DESC)"
        ,"CREATE TABLE IF NOT EXISTS SupportCommandRun(id TEXT PRIMARY KEY, caseId TEXT, commandId TEXT NOT NULL, idempotencyKey TEXT NOT NULL UNIQUE, expectedRevision INTEGER, beforeRevision INTEGER, afterRevision INTEGER, status TEXT NOT NULL, backupId TEXT, rollbackId TEXT, correlationId TEXT NOT NULL, payload TEXT NOT NULL DEFAULT '{}', result TEXT NOT NULL DEFAULT '{}', createdAt TEXT DEFAULT CURRENT_TIMESTAMP, updatedAt TEXT DEFAULT CURRENT_TIMESTAMP)"
        ,"CREATE INDEX IF NOT EXISTS idx_support_command_case_created ON SupportCommandRun(caseId, createdAt DESC)"
        ,"CREATE TABLE IF NOT EXISTS SupportEvidence(id TEXT PRIMARY KEY, evidenceCode TEXT NOT NULL UNIQUE, caseId TEXT, evidenceType TEXT NOT NULL, source TEXT NOT NULL, sourceRevision TEXT, correlationId TEXT NOT NULL, sha256 TEXT NOT NULL, redacted INTEGER NOT NULL DEFAULT 1, payload TEXT NOT NULL DEFAULT '{}', observedAt TEXT NOT NULL, createdAt TEXT DEFAULT CURRENT_TIMESTAMP)"
        ,"CREATE INDEX IF NOT EXISTS idx_support_evidence_case_created ON SupportEvidence(caseId, createdAt DESC)"
        ,"CREATE TABLE IF NOT EXISTS SupportRollbackSnapshot(id TEXT PRIMARY KEY, backupCode TEXT NOT NULL UNIQUE, caseId TEXT, commandId TEXT NOT NULL, correlationId TEXT NOT NULL, sourceRevision INTEGER, sha256 TEXT NOT NULL, snapshot TEXT NOT NULL, restoredAt TEXT, createdAt TEXT DEFAULT CURRENT_TIMESTAMP)"
'''
          if text.count(noisy) != 1:
              raise SystemExit(f'expected exactly one accidental normalization block; found={text.count(noisy)}')
          store.write_text(text.replace(noisy, original, 1), encoding='utf-8')
          PY
          git diff --check
          git diff --exit-code --quiet && { echo 'No normalization needed'; exit 1; }
          git config user.name 'prisma-ci-p1c-normalizer'
          git config user.email 'actions@users.noreply.github.com'
          git add -- 'apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/py/command_center_store.py'
          git commit -m 'chore(ci): restore patch-only store diff'
          git push origin HEAD:"$HEAD_REF"
          echo 'One-shot normalization committed. This run stops so the final workflow can be restored read-only.'
          exit 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compile bounded runtime adapters outside worktree
        run: |
          python -m py_compile \
            "apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/py/change_intelligence_runtime.py" \
            "apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/py/command_center_store.py"

      - name: Verify source contract
        run: python apps/terminal-de-venta-system/tools/verify-cloud-center-change-intelligence-01.py

      - name: Install Playwright runtime without mutating lockfiles
        run: |
          mkdir -p "$RUNNER_TEMP/pci-playwright"
          cd "$RUNNER_TEMP/pci-playwright"
          npm init -y >/dev/null 2>&1
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify runtime scan starts from a clean worktree
        run: |
          status="$(git status --porcelain=v1 --untracked-files=all)"
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            echo "Runtime verification would start from a dirty worktree."
            exit 1
          fi

      - name: Start isolated real Cloud Center host
        env:
          PRISMA_COMMAND_CENTER_DB_PATH: ${{ runner.temp }}/prisma-command-center.db
        run: |
          mkdir -p "$RUNNER_TEMP/protected-current" "$RUNNER_TEMP/prisma-cloud-runtime"
          python "apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/py/prisma_unified_lab_v3.py" \
            --serve \
            --lab-root "$GITHUB_WORKSPACE/apps/terminal-de-venta-system/Prisma Cloud Ctr" \
            --protected-current "$RUNNER_TEMP/protected-current" \
            --out-dir "$RUNNER_TEMP/prisma-cloud-runtime" \
            --host 127.0.0.1 \
            --port 8316 \
            > "$RUNNER_TEMP/pci-http.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/pci-http.pid"
          python - <<'PY'
          import time, urllib.request
          url='http://127.0.0.1:8316/api/health'
          for _ in range(120):
              try:
                  with urllib.request.urlopen(url, timeout=1) as response:
                      if response.status == 200:
                          raise SystemExit(0)
              except Exception:
                  time.sleep(0.25)
          raise SystemExit('Real Cloud Center host did not become ready')
          PY

      - name: Verify browser runtime desktop mobile and fallback
        env:
          PCI_PLAYWRIGHT_ROOT: ${{ runner.temp }}/pci-playwright/node_modules/playwright
          PCI_BASE_URL: http://127.0.0.1:8316
          PCI_EVIDENCE_DIR: ${{ github.workspace }}/pci-runtime-evidence
          PCI_REPO_ROOT: ${{ github.workspace }}
          PCI_EXPECTED_REPOSITORY: prismahitech/hitech-os
        run: node apps/terminal-de-venta-system/tools/verify-cloud-center-change-intelligence-runtime-01.mjs

      - name: Stop isolated real Cloud Center host
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/pci-http.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/pci-http.pid")" 2>/dev/null || true
          fi

      - name: Upload Change Intelligence runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: change-intelligence-cloud-runtime-evidence
          path: |
            pci-runtime-evidence/
            ${{ runner.temp }}/pci-http.log
          if-no-files-found: warn
          retention-days: 14
