name: PRISMA Sync Sentinel Full Carrier V12

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - tooling/prisma-sync-sentinel-v1-2808
    paths:
      - '.github/workflows/sync-sentinel-full-carrier-v12.yml'
      - '.github/DO_NOT_MERGE_SYNC_SENTINEL_FULL_V12.txt'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  sentinel-full:
    if: github.event.pull_request.head.ref == 'gate/prisma-sync-sentinel-full-3008-v12'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Guard exact source and canonical main
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA='bbe843deebef2c34a75e31d687afd533c1b47731'
          MAIN_SHA='0ef7e0c67edac5d0e8166c2b952dd423cbb1841f'
          git fetch origin main tooling/prisma-sync-sentinel-v1-2808
          test "$(git rev-parse origin/main)" = "$MAIN_SHA"
          test "$(git rev-parse origin/tooling/prisma-sync-sentinel-v1-2808)" = "$SOURCE_SHA"
          mapfile -t changed < <(git diff --name-only "$SOURCE_SHA" HEAD)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fxq '.github/workflows/sync-sentinel-full-carrier-v12.yml'
          printf '%s\n' "${changed[@]}" | grep -Fxq '.github/DO_NOT_MERGE_SYNC_SENTINEL_FULL_V12.txt'
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Compile and self-test
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q tools/prisma-sentinels/sync-sentinel
          python tools/prisma-sentinels/sync-sentinel/prisma_sync_sentinel.py self-test | tee /tmp/sync-sentinel-selftest.log
          grep -Fq 'PASS_SYNC_SENTINEL_SELF_TEST' /tmp/sync-sentinel-selftest.log

      - name: Runtime doctor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools/_local/reports/sync-sentinel-v12/doctor
          python tools/prisma-sentinels/sync-sentinel/prisma_sync_sentinel.py doctor \
            --repo . --expected-head "$SOURCE_SHA" \
            --evidence-dir tools/_local/reports/sync-sentinel-v12/doctor | tee /tmp/sync-sentinel-doctor.log
          grep -Fq 'PASS_SENTINEL_RUNTIME_DOCTOR' /tmp/sync-sentinel-doctor.log

      - name: Real-code E2E including A-L
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools/_local/reports/sync-sentinel-v12/e2e
          python tools/prisma-sentinels/sync-sentinel/prisma_sync_sentinel.py e2e \
            --repo . --expected-head "$SOURCE_SHA" --workers 18 \
            --evidence-dir tools/_local/reports/sync-sentinel-v12/e2e | tee /tmp/sync-sentinel-e2e.log
          grep -Fq 'PASS_SYNC_E2E' /tmp/sync-sentinel-e2e.log

      - name: Final certification including A-L
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools/_local/reports/sync-sentinel-v12/certify
          python tools/prisma-sentinels/sync-sentinel/prisma_sync_sentinel.py certify \
            --repo . --expected-head "$SOURCE_SHA" --workers 18 \
            --evidence-dir tools/_local/reports/sync-sentinel-v12/certify | tee /tmp/sync-sentinel-certify.log
          grep -Fq 'PASS_SYNC_CERTIFICATION' /tmp/sync-sentinel-certify.log
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git diff --name-only)"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sync-sentinel-full-v12-${{ github.run_id }}-${{ github.run_attempt }}
          path: tools/_local/reports/sync-sentinel-v12/**
          if-no-files-found: error
          retention-days: 14
