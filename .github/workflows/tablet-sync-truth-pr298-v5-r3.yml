name: Tablet Sync Truth PR298 V5 R3

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tablet-sync-truth-pr298-v5-r3.yml

permissions:
  contents: read

concurrency:
  group: tablet-sync-truth-pr298-v5-r3
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  TARGET_SHA: caec783e1d6f1a14af113143c5089bc8f41c6317
  AUTHORITY_MAIN_SHA: d14effee1a1223cc772247ea9d7ec8547dc15c78
  AUTHORITY_MESH_REQUEST_ID: 54e08127e1395ef4
  APP_ROOT: apps/terminal-de-venta-system/products/tablet/app
  EVIDENCE_DIR: evidence/tablet-sync-truth-pr298-v5-r3

jobs:
  tablet-sync-truth-r3:
    if: github.head_ref == 'evidence/tablet-sync-truth-pr298-v5-r3'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact product head
        uses: actions/checkout@v6
        with:
          ref: caec783e1d6f1a14af113143c5089bc8f41c6317
          fetch-depth: 0
          persist-credentials: false

      - name: Verify governed three-file scope
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git cat-file -e "${AUTHORITY_MAIN_SHA}^{commit}"
          base="$(git merge-base "$AUTHORITY_MAIN_SHA" "$TARGET_SHA")"
          printf '%s\n' "$base" > "$EVIDENCE_DIR/merge-base.txt"
          git diff --name-only "$base" "$TARGET_SHA" | tee "$EVIDENCE_DIR/product-diff-files.txt"
          python - <<'PY'
          from pathlib import Path
          expected={
            'apps/terminal-de-venta-system/products/tablet/app/app/api/pos/sync/panel/route.ts',
            'apps/terminal-de-venta-system/products/tablet/app/components/sync/pending-offline-sync-panel-screen.tsx',
            'apps/terminal-de-venta-system/products/tablet/app/tools/verify_tablet_sync_panel_truth_1808.mjs',
          }
          actual={x.strip() for x in Path('evidence/tablet-sync-truth-pr298-v5-r3/product-diff-files.txt').read_text().splitlines() if x.strip()}
          if actual != expected:
            raise SystemExit(f'SCOPE_MISMATCH expected={sorted(expected)} actual={sorted(actual)}')
          print('PASS exact three-file Tablet product scope')
          PY

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install standalone Tablet without scripts or Prisma generation
        shell: bash
        run: |
          set -euo pipefail
          pnpm -C "$APP_ROOT" install --frozen-lockfile --ignore-scripts 2>&1 | tee "$EVIDENCE_DIR/tablet-install.log"
          test -x "$APP_ROOT/node_modules/.bin/next"
          "$APP_ROOT/node_modules/.bin/next" --version | tee "$EVIDENCE_DIR/next-version.log"
          test ! -e "$APP_ROOT/.generated/prisma-client"
          printf '%s\n' \
            'PASS standalone install --frozen-lockfile --ignore-scripts' \
            'PASS Next executable present' \
            'PASS no generated Prisma client' \
            'PASS no prisma generate / migrate / seed / db push executed' \
            | tee "$EVIDENCE_DIR/prisma-generation-gate.log"

      - name: Focused truth verifier 36/36
        shell: bash
        run: |
          set -euo pipefail
          node "$APP_ROOT/tools/verify_tablet_sync_panel_truth_1808.mjs" 2>&1 | tee "$EVIDENCE_DIR/verify-tablet-sync-panel-truth.log"

      - name: Zero important gate
        shell: bash
        run: |
          set -euo pipefail
          pnpm -C "$APP_ROOT" run verify:zero-important 2>&1 | tee "$EVIDENCE_DIR/verify-zero-important.log"

      - name: License allow deny gate
        shell: bash
        run: |
          set -euo pipefail
          pnpm -C "$APP_ROOT" run verify:tablet-license-missing-fallback 2>&1 | tee "$EVIDENCE_DIR/verify-tablet-license.log"

      - name: Tablet operational gate
        shell: bash
        run: |
          set -euo pipefail
          pnpm -C "$APP_ROOT" run verify:tablet-operational-gate 2>&1 | tee "$EVIDENCE_DIR/verify-tablet-operational-gate.log"

      - name: Tablet sync dispatcher local-first gate
        shell: bash
        run: |
          set -euo pipefail
          pnpm -C "$APP_ROOT" run verify:tablet-sync-dispatcher 2>&1 | tee "$EVIDENCE_DIR/verify-tablet-sync-dispatcher.log"

      - name: Resolve preinstalled Chrome
        id: chrome
        shell: bash
        run: |
          set -euo pipefail
          chrome=''
          for c in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$c" >/dev/null 2>&1; then chrome="$(command -v "$c")"; break; fi
          done
          test -n "$chrome"
          "$chrome" --version | tee "$EVIDENCE_DIR/chrome-resolution.log"
          echo "bin=$chrome" >> "$GITHUB_OUTPUT"

      - name: Start only runner-local Tablet on 3120
        shell: bash
        run: |
          set -euo pipefail
          if curl --silent --fail --max-time 1 http://127.0.0.1:3120/ >/dev/null 2>&1; then
            echo 'BLOCKED runner port 3120 already occupied; refusing cleanup' | tee "$EVIDENCE_DIR/runtime-start.log"
            exit 1
          fi
          setsid bash -lc "cd '$APP_ROOT' && exec pnpm exec next dev --webpack -p 3120" > "$EVIDENCE_DIR/server.log" 2>&1 &
          pid=$!
          echo "$pid" > "$EVIDENCE_DIR/server.pid"
          ready=0
          for _ in $(seq 1 120); do
            if curl --silent --fail --max-time 2 http://127.0.0.1:3120/sync >/dev/null 2>&1; then ready=1; break; fi
            if ! kill -0 "$pid" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo 'BLOCKED_TABLET_RUNTIME_NOT_READY' | tee "$EVIDENCE_DIR/runtime-start.log"
            tail -n 240 "$EVIDENCE_DIR/server.log" || true
            exit 1
          fi
          echo 'PASS runner-local Tablet /sync HTTP ready' | tee "$EVIDENCE_DIR/runtime-start.log"

      - name: Capture runtime no-fake-green evidence
        id: browser
        continue-on-error: true
        shell: bash
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.bin }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/capture-r3.mjs" <<'JS'
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import { spawn } from 'node:child_process';
          const dir=process.env.EVIDENCE_DIR, sleep=(ms)=>new Promise(r=>setTimeout(r,ms));
          fs.mkdirSync(dir,{recursive:true});
          class CDP{
            constructor(url){this.ws=new WebSocket(url);this.id=0;this.pending=new Map();this.listeners=[];}
            async open(){await new Promise((res,rej)=>{const t=setTimeout(()=>rej(new Error('CDP open timeout')),10000);this.ws.addEventListener('open',()=>{clearTimeout(t);res();},{once:true});this.ws.addEventListener('error',()=>{clearTimeout(t);rej(new Error('CDP websocket error'));},{once:true});});this.ws.addEventListener('message',e=>{const m=JSON.parse(String(e.data));if(m.id&&this.pending.has(m.id)){const p=this.pending.get(m.id);this.pending.delete(m.id);m.error?p.reject(new Error(`${m.error.code}: ${m.error.message}`)):p.resolve(m.result??{});return;}for(const f of this.listeners)f(m);});}
            on(f){this.listeners.push(f)}
            send(method,params={},sessionId){const id=++this.id,payload={id,method,params};if(sessionId)payload.sessionId=sessionId;return new Promise((resolve,reject)=>{this.pending.set(id,{resolve,reject});this.ws.send(JSON.stringify(payload));});}
          }
          const envelope=(status,body)=>({responseCode:status,responseHeaders:[{name:'content-type',value:'application/json; charset=utf-8'},{name:'cache-control',value:'no-store'},{name:'x-prisma-evidence-fixture',value:'tablet-sync-truth-pr298-v5-r3'}],body:Buffer.from(JSON.stringify(body)).toString('base64')});
          const profile=fs.mkdtempSync(path.join(os.tmpdir(),'prisma-tablet-r3-'));
          const chromeLog=fs.openSync(path.join(dir,'chrome.log'),'a');
          const chrome=spawn(process.env.CHROME_BIN,['--headless=new','--no-sandbox','--disable-dev-shm-usage','--remote-debugging-port=0',`--user-data-dir=${profile}`,'--window-size=1365,768','--force-device-scale-factor=1','about:blank'],{stdio:['ignore',chromeLog,chromeLog]});
          const pageConsole=[],pageErrors=[],logEntries=[],apiRequests=[],unexpectedApis=[];
          try{
            const portFile=path.join(profile,'DevToolsActivePort');
            for(let i=0;i<100&&!fs.existsSync(portFile);i++)await sleep(100);
            if(!fs.existsSync(portFile))throw new Error('DevToolsActivePort missing');
            const port=Number(fs.readFileSync(portFile,'utf8').trim().split(/\r?\n/)[0]);
            const version=await fetch(`http://127.0.0.1:${port}/json/version`).then(r=>r.json());
            const cdp=new CDP(version.webSocketDebuggerUrl);await cdp.open();
            const {targetId}=await cdp.send('Target.createTarget',{url:'about:blank'});
            const {sessionId}=await cdp.send('Target.attachToTarget',{targetId,flatten:true});
            let resolveLoad;const loaded=new Promise(r=>resolveLoad=r);
            cdp.on(m=>{
              if(m.sessionId!==sessionId)return;
              if(m.method==='Page.loadEventFired')resolveLoad?.();
              if(m.method==='Runtime.consoleAPICalled')pageConsole.push({type:m.params.type,args:(m.params.args??[]).map(a=>a.value??a.description??a.type)});
              if(m.method==='Runtime.exceptionThrown')pageErrors.push(m.params.exceptionDetails);
              if(m.method==='Log.entryAdded')logEntries.push(m.params.entry);
              if(m.method==='Fetch.requestPaused')void(async()=>{
                const request=m.params.request,url=request.url,method=request.method;
                if(!url.includes('/api/')){await cdp.send('Fetch.continueRequest',{requestId:m.params.requestId},sessionId);return;}
                let response;
                if(method==='GET'&&url.includes('/api/pos/sync/panel')) response=envelope(503,{ok:false,code:'SYNC_PANEL_UNVERIFIED',message:'No se pudo confirmar el estado de pendientes a tiempo. La venta local sigue disponible; vuelve a revisar el panel.',details:{source:'EVIDENCE_FIXTURE_R3',reason:'bounded_timeout',localSalesBlocked:false}});
                else if(method==='GET'&&url.includes('/api/license/status')) response=envelope(200,{ok:true,data:{status:{state:'active',plan:'Evidence Active',assignmentState:'assigned',operationalDecision:'allow'}},meta:{source:'EVIDENCE_FIXTURE_R3'}});
                else if(method==='GET'&&url.includes('/api/pos/sync/health/pc')) response=envelope(200,{ok:false,enabled:true,status:'offline',url:'http://pc-evidence.invalid',error:'PC intentionally unavailable in isolated fixture'});
                else if(method==='GET'&&url.includes('/api/pos/sync/pull')) response=envelope(200,{ok:true,data:{stream:'catalog',targetBusinessId:'evidence-business',terminalId:'evidence-terminal',pc:{enabled:false,origin:null,exportPath:'/api/backoffice/catalog/export'},checkpoint:null,tableCounts:{}},meta:{source:'EVIDENCE_FIXTURE_R3'}});
                else {unexpectedApis.push({method,url});response=envelope(503,{ok:false,code:'EVIDENCE_UNEXPECTED_API_BLOCKED',message:'Unexpected API blocked by evidence harness.',details:{method,url}});}
                apiRequests.push({method,url,responseCode:response.responseCode});
                await cdp.send('Fetch.fulfillRequest',{requestId:m.params.requestId,...response},sessionId);
              })().catch(e=>pageErrors.push({text:String(e?.stack??e)}));
            });
            await Promise.all([cdp.send('Page.enable',{},sessionId),cdp.send('Runtime.enable',{},sessionId),cdp.send('Log.enable',{},sessionId),cdp.send('Fetch.enable',{patterns:[{urlPattern:'*://*/api/*',requestStage:'Request'}]},sessionId),cdp.send('Emulation.setDeviceMetricsOverride',{width:1365,height:768,deviceScaleFactor:1,mobile:false},sessionId)]);
            await cdp.send('Page.navigate',{url:'http://127.0.0.1:3120/sync'},sessionId);await Promise.race([loaded,sleep(30000)]);await sleep(5000);
            const inspected=await cdp.send('Runtime.evaluate',{expression:`(()=>{const pill=document.querySelector('[data-prisma-component="StatusPill"]');const sec=[...document.querySelectorAll('section')].find(n=>String(n.className).includes('kpis'));const kpis=sec?[...sec.querySelectorAll('article')].map(a=>({label:a.querySelector('span')?.textContent?.trim()??'',value:a.querySelector('strong')?.textContent?.trim()??''})):[];return{innerText:document.body.innerText,textContent:document.body.textContent??'',pill:pill?{text:pill.textContent?.trim()??'',className:pill.className,color:getComputedStyle(pill).color,borderColor:getComputedStyle(pill).borderColor}:null,kpis};})()`,returnByValue:true},sessionId);
            const dom=inspected.result.value;
            const assertions={
              unverifiedHeadlineVisible:dom.innerText.includes('Estado de pendientes sin confirmar'),
              queueUnconfirmedVisible:dom.innerText.includes('Cola sin confirmar'),
              timeoutCopyVisible:dom.innerText.includes('No se pudo confirmar el estado de pendientes a tiempo'),
              neutralPillClass:Boolean(dom.pill?.className?.includes('status_neutral')),
              okPillClassAbsent:!Boolean(dom.pill?.className?.includes('status_ok')),
              noFakeHealthyHeadline:!dom.innerText.includes('Pendientes al día'),
              noFakeEmptyQueueClaim:!dom.innerText.includes('No hay pendientes para enviar.'),
              kpisRemainUnknown:dom.kpis.length>=4&&dom.kpis.every(r=>r.value==='—'),
              pcOfflineProjected:dom.innerText.includes('PC sin respuesta'),
              localFirstCopyPreserved:dom.textContent.includes('Venta local disponible aunque PC no responda'),
              sync503Observed:apiRequests.some(r=>r.method==='GET'&&r.url.includes('/api/pos/sync/panel')&&r.responseCode===503),
              licenseFixtureObserved:apiRequests.some(r=>r.method==='GET'&&r.url.includes('/api/license/status')&&r.responseCode===200),
              pcFixtureObserved:apiRequests.some(r=>r.method==='GET'&&r.url.includes('/api/pos/sync/health/pc')&&r.responseCode===200),
              catalogStatusGetObserved:apiRequests.some(r=>r.method==='GET'&&r.url.includes('/api/pos/sync/pull')&&r.responseCode===200),
              noCatalogMutationObserved:!apiRequests.some(r=>r.method!=='GET'&&r.url.includes('/api/pos/sync/pull')),
              noUnexpectedApi:unexpectedApis.length===0,
              noPageExceptions:pageErrors.length===0,
              noConsoleErrors:!pageConsole.some(r=>r.type==='error')
            };
            const metrics=await cdp.send('Page.getLayoutMetrics',{},sessionId),size=metrics.cssContentSize??metrics.contentSize;
            const shot=await cdp.send('Page.captureScreenshot',{format:'png',fromSurface:true,captureBeyondViewport:true,clip:{x:0,y:0,width:Math.min(5000,Math.ceil(size.width)),height:Math.min(12000,Math.ceil(size.height)),scale:1}},sessionId);
            fs.writeFileSync(path.join(dir,'sync-unverified.png'),Buffer.from(shot.data,'base64'));
            const evidence={schemaVersion:'tablet_sync_truth_runtime_evidence.v3',targetSha:process.env.TARGET_SHA,authorityMainSha:process.env.AUTHORITY_MAIN_SHA,authorityMeshRequestId:process.env.AUTHORITY_MESH_REQUEST_ID,evidenceSemantics:{routeBehavior:'SOURCE_AND_FOCUSED_VERIFIER_PROOF; DB-backed route not executed.',browserProjection:'REAL /sync NEXT RUNTIME AGAINST EXPLICIT GET-ONLY CONTRACT FIXTURES.',hotPrismaGenerate:false,realDatabaseMutation:false},assertions,dom:{pill:dom.pill,kpis:dom.kpis},apiRequests,unexpectedApis,pageConsole,pageErrors,logEntries};
            fs.writeFileSync(path.join(dir,'browser-evidence.json'),JSON.stringify(evidence,null,2)+'\n');
            fs.writeFileSync(path.join(dir,'api-fixture-evidence.json'),JSON.stringify({apiRequests,unexpectedApis},null,2)+'\n');
            fs.writeFileSync(path.join(dir,'page-console.json'),JSON.stringify(pageConsole,null,2)+'\n');
            fs.writeFileSync(path.join(dir,'page-errors.json'),JSON.stringify(pageErrors,null,2)+'\n');
            const failed=Object.entries(assertions).filter(([,ok])=>!ok).map(([n])=>n);
            fs.writeFileSync(path.join(dir,'RUNTIME_EVIDENCE.md'),['# Tablet Sync Truth Runtime Evidence R3','',`- target: \`${process.env.TARGET_SHA}\``,`- authority main: \`${process.env.AUTHORITY_MAIN_SHA}\``,`- Authority Mesh: \`${process.env.AUTHORITY_MESH_REQUEST_ID}\``,'- Browser: real `/sync` Next runtime with explicit GET-only fixtures.','- Route: source + focused verifier; not DB-backed route E2E.','- Hot Prisma generation: false.','- Real DB mutation: false.','',...Object.entries(assertions).map(([n,ok])=>`- ${ok?'PASS':'FAIL'} ${n}`),'',`Final: ${failed.length?'BLOCKED '+failed.join(', '):'PASS_RUNTIME_NO_FAKE_GREEN'}`,''].join('\n'));
            if(failed.length)throw new Error(`Runtime assertions failed: ${failed.join(', ')}`);
            await cdp.send('Browser.close');
          }finally{if(!chrome.killed)chrome.kill('SIGTERM');fs.closeSync(chromeLog);}
          JS
          node "$RUNNER_TEMP/capture-r3.mjs" 2>&1 | tee "$EVIDENCE_DIR/browser-capture.log"

      - name: Scan server log fail-closed
        id: server_scan
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test -f "$EVIDENCE_DIR/server.log"
          forbidden='PrismaClientKnownRequestError|unhandledRejection|no such table|Cannot find module.*\.generated/prisma-client|Module not found.*\.generated/prisma-client'
          if grep -Ein "$forbidden" "$EVIDENCE_DIR/server.log" > "$EVIDENCE_DIR/server-log-forbidden.txt"; then
            cat "$EVIDENCE_DIR/server-log-forbidden.txt"
            exit 1
          fi
          echo 'PASS no forbidden Prisma/database/unhandled runtime errors' > "$EVIDENCE_DIR/server-log-forbidden.txt"

      - name: Build manifest
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['EVIDENCE_DIR']);root.mkdir(parents=True,exist_ok=True)
          files=[]
          for p in sorted(root.rglob('*')):
            if p.is_file():
              b=p.read_bytes();files.append({'path':p.relative_to(root).as_posix(),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          out={'schemaVersion':'tablet_sync_truth_evidence_manifest.v3','targetSha':os.environ['TARGET_SHA'],'authorityMainSha':os.environ['AUTHORITY_MAIN_SHA'],'authorityMeshRequestId':os.environ['AUTHORITY_MESH_REQUEST_ID'],'runId':os.environ['GITHUB_RUN_ID'],'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],'evidenceOnly':True,'mustNeverMerge':True,'hotPrismaGenerateExecuted':False,'realDatabaseMutationExecuted':False,'files':files}
          (root/'manifest.json').write_text(json.dumps(out,indent=2)+'\n')
          (root/'manifest.md').write_text('\n'.join(['# Tablet Sync Truth R3 Manifest','',f"- run: `{out['runId']}`",f"- target: `{out['targetSha']}`",'- evidence-only: `true`','- hot Prisma generate: `false`','- real DB mutation: `false`','','## Files']+[f"- `{f['path']}` — {f['bytes']} bytes — `{f['sha256']}`" for f in files])+'\n')
          PY

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tablet-sync-truth-pr298-v5-r3-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: evidence/tablet-sync-truth-pr298-v5-r3/**

      - name: Stop only recorded runner-local Tablet group
        if: always()
        shell: bash
        run: |
          set +e
          if [ -f "$EVIDENCE_DIR/server.pid" ]; then
            pid="$(cat "$EVIDENCE_DIR/server.pid")"
            kill -TERM -- "-$pid" >/dev/null 2>&1 || kill -TERM "$pid" >/dev/null 2>&1 || true
            sleep 2
            kill -KILL -- "-$pid" >/dev/null 2>&1 || kill -KILL "$pid" >/dev/null 2>&1 || true
          fi
          echo 'cleanup limited to recorded runner-local process group'

      - name: Fail closed on browser or server evidence
        if: always()
        shell: bash
        env:
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          SERVER_OUTCOME: ${{ steps.server_scan.outcome }}
        run: |
          set -euo pipefail
          echo "browser=$BROWSER_OUTCOME server=$SERVER_OUTCOME"
          test "$BROWSER_OUTCOME" = success
          test "$SERVER_OUTCOME" = success
          grep -q 'Final: PASS_RUNTIME_NO_FAKE_GREEN' "$EVIDENCE_DIR/RUNTIME_EVIDENCE.md"
          echo 'PASS_TABLET_SYNC_TRUTH_RUNTIME_R3'
