name: Tablet POS Atlasfin Apply

on:
  push:
    branches:
      - feat/tablet-pos-atlasfin-vender-v1

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'

concurrency:
  group: tablet-pos-atlasfin-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v6
        with:
          ref: feat/tablet-pos-atlasfin-vender-v1
          fetch-depth: 0

      - name: Setup Python and Node
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Apply Atlasfin composition at canonical RIFAT owner
        shell: bash
        run: |
          set -euo pipefail
          POS='prisma-html/authority/rifat/tablet/runtime-sources/modules/pos/pos.module.css'
          expected_blob='baa2c6f613abf01a90646a6a14a67dc6215bab3b'
          actual_blob="$(git hash-object "$POS")"
          echo "POS_OWNER_BLOB=$actual_blob"
          test "$actual_blob" = "$expected_blob" || { echo "POS_OWNER_CONCURRENT_DRIFT:$actual_blob:$expected_blob"; exit 41; }

          python - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path('prisma-html/authority/rifat/tablet/runtime-sources/modules/pos/pos.module.css')
          text = path.read_text(encoding='utf-8')
          expected_cobrar = '4efc69648237f0e066ab4728abf2914bf854b7c7d0f6852b90772c236fa8bfac'

          def cobrar_hash(value: str) -> str:
              start = value.index('  .cobrarReferenceButton {')
              end = value.index('  .posPremiumTicketOptions,', start)
              return hashlib.sha256(value[start:end].encode()).hexdigest()

          if cobrar_hash(text) != expected_cobrar:
              raise SystemExit('COBRAR_BASELINE_DRIFT')

          def get_block(value: str, selector: str, start_at: int = 0):
              start = value.index(selector, start_at)
              end = value.index('\n  }', start) + len('\n  }')
              return start, end, value[start:end]

          def mutate_block(value: str, selector: str, replacements: list[tuple[str, str]], start_at: int = 0):
              start, end, block = get_block(value, selector, start_at)
              for old, new in replacements:
                  count = block.count(old)
                  if count != 1:
                      raise SystemExit(f'BLOCK_REPLACE_COUNT:{selector[:42]}:{old}:{count}')
                  block = block.replace(old, new, 1)
              return value[:start] + block + value[end:]

          # Ticket lines become rows inside one glass rail instead of glass cards inside glass.
          text = mutate_block(text, '  .posPremiumTicketLine {', [
              ('    padding: 10px;', '    padding: 10px 2px 11px;'),
              ('    border: 1px solid rgba(235, 244, 255, 0.14);', '    border: 0;\n    border-bottom: 1px solid rgba(235, 244, 255, 0.10);'),
              ('    border-radius: 16px;', '    border-radius: 0;'),
              ('    background:\n      linear-gradient(155deg, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0.010)),\n      rgba(255, 255, 255, 0.018);', '    background: transparent;'),
              ('    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);', '    box-shadow: none;'),
          ])

          readability = text.index('  /* PRISMA_POS_READABILITY_CONTRACT_2507')
          glass = text.index('  /* PRISMA_POS_GLASS_REBALANCE_2507')

          # Readability contract: preserve legibility but obey the 48px Tablet touch floor.
          text = mutate_block(text, '  .posPremiumCategoryButton,\n  .posPremiumCategoryButtonActive {', [
              ('    min-height: 46px;', '    min-height: var(--prisma-touch-target);'),
              ('rgba(225, 241, 255, 0.16)', 'rgba(225, 241, 255, 0.14)'),
              ('rgba(4, 9, 15, 0.66)', 'rgba(4, 9, 15, 0.38)'),
              ('rgba(0, 0, 0, 0.92)', 'rgba(0, 0, 0, 0.88)'),
          ], readability)
          active_start = text.index('  .posPremiumCategoryButtonActive {', readability)
          text = mutate_block(text, '  .posPremiumCategoryButtonActive {', [
              ('rgba(112, 224, 255, 0.58)', 'rgba(112, 224, 255, 0.52)'),
              ('rgba(112, 224, 255, 0.22)', 'rgba(112, 224, 255, 0.17)'),
              ('rgba(112, 224, 255, 0.075)', 'rgba(112, 224, 255, 0.055)'),
              ('rgba(5, 15, 22, 0.88)', 'rgba(5, 15, 22, 0.52)'),
          ], active_start)

          glass = text.index('  /* PRISMA_POS_GLASS_REBALANCE_2507')

          # Sticky search/chrome: lighter, clearer atmosphere, still one controlled glass plane.
          sticky_selector = '  .posPremiumCatalogHeader,\n  .posPremiumCatalogToolbar,\n  .posPremiumCatalogChrome,\n  .posPremiumSearchShell,\n  .posPremiumSearchBar,\n  .posPremiumSearchSurface,\n  .posPremiumSearchContainer,\n  .posPremiumSearchCard {'
          text = mutate_block(text, sticky_selector, [
              ('blur(18px) saturate(1.08)', 'blur(14px) saturate(1.06)'),
              ('blur(18px) saturate(1.08)', 'blur(14px) saturate(1.06)'),
          ], glass)

          text = mutate_block(text, '  .posPremiumCatalogHeader,\n  .posPremiumCatalogToolbar,\n  .posPremiumCatalogChrome {', [
              ('rgba(4, 8, 13, 0.24)', 'rgba(4, 8, 13, 0.16)'),
              ('rgba(4, 8, 13, 0.08)', 'rgba(4, 8, 13, 0.045)'),
              ('rgba(5, 10, 16, 0.22)', 'rgba(5, 10, 16, 0.14)'),
          ], glass)

          search_selector = '  .posPremiumSearchShell,\n  .posPremiumSearchBar,\n  .posPremiumSearchSurface,\n  .posPremiumSearchContainer,\n  .posPremiumSearchCard {'
          text = mutate_block(text, search_selector, [
              ('rgba(209, 233, 247, 0.13)', 'rgba(209, 233, 247, 0.12)'),
              ('rgba(255, 255, 255, 0.045)', 'rgba(255, 255, 255, 0.032)'),
              ('rgba(255, 255, 255, 0.012)', 'rgba(255, 255, 255, 0.008)'),
              ('rgba(4, 10, 16, 0.30)', 'rgba(4, 10, 16, 0.18)'),
              ('0 10px 30px rgba(0, 0, 0, 0.18)', '0 9px 24px rgba(0, 0, 0, 0.14)'),
              ('rgba(255, 255, 255, 0.08)', 'rgba(255, 255, 255, 0.06)'),
          ], glass)

          # Product cards retain Commerce depth while allowing the café scene to participate.
          text = mutate_block(text, '  .posPremiumProductCard {', [
              ('rgba(231, 242, 251, 0.22)', 'rgba(231, 242, 251, 0.18)'),
              ('rgba(255, 255, 255, 0.065)', 'rgba(255, 255, 255, 0.048)'),
              ('rgba(255, 255, 255, 0.018)', 'rgba(255, 255, 255, 0.012)'),
              ('rgba(4, 9, 14, 0.68)', 'rgba(4, 9, 14, 0.38)'),
              ('0 16px 40px rgba(0, 0, 0, 0.24)', '0 14px 34px rgba(0, 0, 0, 0.20)'),
              ('rgba(255, 255, 255, 0.09)', 'rgba(255, 255, 255, 0.07)'),
              ('blur(16px) saturate(1.06)', 'blur(14px) saturate(1.05)'),
              ('blur(16px) saturate(1.06)', 'blur(14px) saturate(1.05)'),
          ], glass)
          text = mutate_block(text, '  .posPremiumProductCard:hover {', [
              ('rgba(136, 228, 255, 0.42)', 'rgba(136, 228, 255, 0.36)'),
              ('rgba(255, 255, 255, 0.078)', 'rgba(255, 255, 255, 0.060)'),
              ('rgba(255, 255, 255, 0.026)', 'rgba(255, 255, 255, 0.018)'),
              ('rgba(6, 12, 18, 0.72)', 'rgba(6, 12, 18, 0.46)'),
              ('0 18px 42px rgba(0, 0, 0, 0.26)', '0 17px 38px rgba(0, 0, 0, 0.22)'),
              ('0 0 22px rgba(123, 225, 255, 0.12),\n      0 0 44px rgba(123, 225, 255, 0.08),', '0 0 22px rgba(123, 225, 255, 0.10),'),
              ('rgba(255, 255, 255, 0.11)', 'rgba(255, 255, 255, 0.09)'),
          ], glass)
          text = mutate_block(text, '  .posPremiumProductText {', [
              ('rgba(4, 8, 13, 0.10)', 'rgba(4, 8, 13, 0.06)'),
              ('rgba(4, 8, 13, 0.58)', 'rgba(4, 8, 13, 0.38)'),
          ], glass)
          text = mutate_block(text, '  .posPremiumCategoryButton,\n  .posPremiumCategoryButtonActive {', [
              ('rgba(4, 9, 15, 0.46)', 'rgba(4, 9, 15, 0.28)'),
          ], glass)

          if cobrar_hash(text) != expected_cobrar:
              raise SystemExit('COBRAR_CHANGED')
          if '!important' in text:
              raise SystemExit('POS_OWNER_IMPORTANT_FORBIDDEN')
          path.write_text(text, encoding='utf-8', newline='\n')
          print('PASS_POS_ATLASFIN_PATCH')
          print('COBRAR_REGION_SHA256=' + cobrar_hash(text))
          print('POS_SOURCE_SHA256=' + hashlib.sha256(text.encode()).hexdigest())
          PY

      - name: Regenerate and validate governed Tablet runtime
        shell: bash
        run: |
          set -euo pipefail
          python prisma-html/tools/generate_tablet_visual_runtime.py --authority-commit 09637233dfd2de00db3276fca1fb90beae82aa59
          python prisma-html/tools/generate_tablet_visual_runtime.py --check
          python prisma-html/tools/validate_rifat_authority.py
          node apps/terminal-de-venta-system/products/tablet/app/tools/verify_rifat_tablet_visual_runtime.mjs
          node tools/quality/verify-zero-important.mjs --mode repo-tree --format text
          git diff --check

      - name: Enforce Tablet-only scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed = {
              'prisma-html/authority/rifat/tablet/runtime-sources/modules/pos/pos.module.css',
              'apps/terminal-de-venta-system/products/tablet/app/components/pos/pos.module.css',
              'apps/terminal-de-venta-system/products/tablet/app/generated/prisma-visual-runtime/runtime-manifest.json',
              'apps/terminal-de-venta-system/products/tablet/app/generated/prisma-visual-runtime/authority-lock.json',
              'apps/terminal-de-venta-system/.prisma-ui/AUTHORITY_LOCK.json',
              '.github/workflows/tablet-pos-atlasfin-apply.yml',
          }
          lines = subprocess.check_output(['git','status','--porcelain'], text=True).splitlines()
          paths = {line[3:] for line in lines if len(line) > 3}
          extra = sorted(paths - allowed)
          if extra:
              raise SystemExit('UNEXPECTED_SCOPE:' + ','.join(extra))
          print('PASS_TABLET_ONLY_SCOPE')
          PY

      - name: Commit governed result and retire transient runner
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/tablet-pos-atlasfin-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            prisma-html/authority/rifat/tablet/runtime-sources/modules/pos/pos.module.css \
            apps/terminal-de-venta-system/products/tablet/app/components/pos/pos.module.css \
            apps/terminal-de-venta-system/products/tablet/app/generated/prisma-visual-runtime/runtime-manifest.json \
            apps/terminal-de-venta-system/products/tablet/app/generated/prisma-visual-runtime/authority-lock.json \
            apps/terminal-de-venta-system/.prisma-ui/AUTHORITY_LOCK.json \
            .github/workflows/tablet-pos-atlasfin-apply.yml
          git diff --cached --check
          git commit -m 'style(tablet): apply Atlasfin POS composition through RIFAT'
          git push origin HEAD:feat/tablet-pos-atlasfin-vender-v1
