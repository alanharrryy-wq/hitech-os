name: PC Wave 3 Main Reconciliation Authority

on:
  pull_request:
    paths:
      - '.github/workflows/pc-wave3-reconcile-main-authority.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
  PYTHONPATH: tools/code-atlas/src
  PINNED_MAIN: 487459ab8901748673b86eaf3ad3a79322c7f266
  WAVE3_HEAD: d04cd790c684839fd5efdfe309e1841ad1969c05
  MERGE_BASE: 28b0821d4a3c2b07041a0c4dfe18004f4f7d52ab

jobs:
  authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact canonical main
        uses: actions/checkout@v6
        with:
          ref: 487459ab8901748673b86eaf3ad3a79322c7f266
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Verify exact heads and current governance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PINNED_MAIN"
          git cat-file -e "$WAVE3_HEAD^{commit}"
          git cat-file -e "$MERGE_BASE^{commit}"
          test -f "apps/terminal-de-venta-system/docs/ops/PRISMA_FIELD_MANUAL_APRENDIZAJE_OPERATIVO.md"
          test -f "PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER_AGENT_GATE.md"
          python tools/code-atlas/src/code_atlas/motors/smart_allmesh_automesh.py --self-test
          test -z "$(git status --porcelain)"

      - name: Prove parallel drift has zero Wave 3 path overlap
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reconcile"
          git diff --name-only "$MERGE_BASE..$WAVE3_HEAD" | sort -u > "$RUNNER_TEMP/reconcile/wave3.paths"
          git diff --name-only "$MERGE_BASE..$PINNED_MAIN" | sort -u > "$RUNNER_TEMP/reconcile/main.paths"
          comm -12 "$RUNNER_TEMP/reconcile/wave3.paths" "$RUNNER_TEMP/reconcile/main.paths" > "$RUNNER_TEMP/reconcile/overlap.paths"
          python - "$RUNNER_TEMP/reconcile/wave3.paths" "$RUNNER_TEMP/reconcile/main.paths" "$RUNNER_TEMP/reconcile/overlap.paths" "$RUNNER_TEMP/reconcile/PARALLEL_OVERLAP_REPORT.json" <<'PY'
          import json,sys
          from pathlib import Path
          wave3=[x for x in Path(sys.argv[1]).read_text(encoding='utf-8').splitlines() if x]
          main=[x for x in Path(sys.argv[2]).read_text(encoding='utf-8').splitlines() if x]
          overlap=[x for x in Path(sys.argv[3]).read_text(encoding='utf-8').splitlines() if x]
          report={
            'schemaVersion':'prisma.pc-wave3.parallel-reconciliation.v1',
            'canonicalHead':'487459ab8901748673b86eaf3ad3a79322c7f266',
            'wave3Head':'d04cd790c684839fd5efdfe309e1841ad1969c05',
            'mergeBase':'28b0821d4a3c2b07041a0c4dfe18004f4f7d52ab',
            'wave3PathCount':len(wave3),
            'mainParallelPathCount':len(main),
            'wave3Paths':wave3,
            'overlap':overlap,
            'pass':len(wave3)==20 and not overlap
          }
          Path(sys.argv[4]).write_text(json.dumps(report,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({k:v for k,v in report.items() if k!='wave3Paths'},indent=2))
          if not report['pass']:
              raise SystemExit('PC_WAVE3_RECONCILIATION_OVERLAP_OR_SCOPE_DRIFT')
          PY

      - name: Build task exact authority request
        shell: bash
        run: |
          python - "$RUNNER_TEMP/request.json" <<'PY'
          import json,sys
          head='487459ab8901748673b86eaf3ad3a79322c7f266'
          core=[
            'PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER.json',
            'PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER_DO_NOT_REBUILD_MAP.json',
            'PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER_REGISTRATION_INDEX.json',
            'PRISMA Factory Ledger/PRISMA_EVIDENCE_INDEX.json',
            'PRISMA Factory Ledger/PRISMA_FACTORY_LEDGER_AGENT_GATE.md',
            'PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py',
            'apps/terminal-de-venta-system/docs/ops/PRISMA_FIELD_MANUAL_APRENDIZAJE_OPERATIVO.md',
            'apps/terminal-de-venta-system/products/pc/app/src/server/services/pc-command-center.service.ts',
            'apps/terminal-de-venta-system/products/pc/app/src/server/services/catalog-delta-export.service.ts'
          ]
          caps=['pc.quality.customer_experience_wave2','data.canonical_schema_reproducibility','pc.entitlement.surface_projection']
          task=(
            'Reconcile certified PC Wave 3 head d04cd790c684839fd5efdfe309e1841ad1969c05 with canonical main 487459ab8901748673b86eaf3ad3a79322c7f266 after proving zero path overlap from merge base 28b0821d4a3c2b07041a0c4dfe18004f4f7d52ab. '
            'Preserve all 20 Wave 3 changed files byte-for-byte while incorporating current main history and current governance. '
            'Do not modify Wave 3 product behavior, schema, licensing, UI, excluded surfaces, live/customer databases, deploys, or evidence semantics. '
            'After reconciliation, rerun the existing complete Wave 3 certification before product merge.'
          )
          lanes=[
            {'id':'parallel-history-reconciliation','surface':'pc','intent':'FIX','domain':'tooling','task':task,'requiredAuthorities':core,'requiredDirectories':['.github/workflows','apps/terminal-de-venta-system/products/pc/app'],'requiredCapabilities':caps,'minimumCoverage':100,'failOnMissingAuthority':True},
            {'id':'wave3-runtime-preservation','surface':'pc','intent':'AUDIT','domain':'runtime','task':task,'requiredAuthorities':core,'requiredDirectories':['apps/terminal-de-venta-system/products/pc/app/app','apps/terminal-de-venta-system/products/pc/app/src/server','apps/terminal-de-venta-system/products/pc/app/tools'],'requiredCapabilities':caps,'minimumCoverage':100,'failOnMissingAuthority':True}
          ]
          with open(sys.argv[1],'w',encoding='utf-8') as f:
            json.dump({'schemaVersion':'v2','profile':'pc-wave3-reconcile-main-v1','expectedHead':head,'tasks':lanes},f,ensure_ascii=False,indent=2); f.write('\n')
          PY

      - name: Compose fresh Authority Mesh
        shell: bash
        run: |
          set -euo pipefail
          pre="$RUNNER_TEMP/pre"; par="$RUNNER_TEMP/par"; comp="$RUNNER_TEMP/comp/payload"; mkdir -p "$pre" "$par" "$comp"
          python -m code_atlas.motors.prisma_mesh_gateway preflight --repo "$GITHUB_WORKSPACE" --request "$RUNNER_TEMP/request.json" --out "$pre"
          python tools/code-atlas/src/code_atlas/motors/smart_allmesh_parallel.py --repo "$GITHUB_WORKSPACE" --out-root "$par" --task-spec "$pre/legacy_tasks.json" --parallel 2 --workers 18 --shards 54 --max-files 180 --max-mb 55
          python -m code_atlas.motors.prisma_mesh_gateway compose --repo "$GITHUB_WORKSPACE" --request "$RUNNER_TEMP/request.json" --preflight "$pre" --mesh-result "$par" --out "$comp" | tee "$RUNNER_TEMP/compose.txt"
          grep -Fq PASS_COMPOSED_AUTHORITY_MESH "$RUNNER_TEMP/compose.txt"
          test -f "$RUNNER_TEMP/comp/prisma-automesh-composed-result.zip"
          test -z "$(git status --porcelain)"

      - name: Generate task exact Layer Map
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/reconcile/PARALLEL_OVERLAP_REPORT.json" "$RUNNER_TEMP/PC_WAVE3_RECONCILE_LAYER_MAP.json" <<'PY'
          import json,sys
          from pathlib import Path
          overlap=json.load(open(sys.argv[1],encoding='utf-8'))
          out={
            'schemaVersion':'prisma.pc-wave3.reconcile.layer-map.v1',
            'canonicalHead':'487459ab8901748673b86eaf3ad3a79322c7f266',
            'wave3Head':'d04cd790c684839fd5efdfe309e1841ad1969c05',
            'surface':'pc',
            'visualMutationAuthorized':False,
            'allowedMutationLayers':['git_history_reconciliation_only'],
            'preservedProductPathCount':overlap['wave3PathCount'],
            'pathOverlap':overlap['overlap'],
            'excludedSurfaces':['tablet','mobile','chart_lab','shared_ui','control_center'],
            'unresolved':[],
            'rules':['preserve all Wave 3 path blobs byte-for-byte','incorporate canonical main history only','rerun full certification on reconciled head','no product source mutation during reconciliation','no live/customer DB mutation','no visual mutation']
          }
          Path(sys.argv[2]).write_text(json.dumps(out,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,indent=2))
          PY

      - name: Universal Factory Ledger mutation authorization
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/comp/payload/PRISMA_MESH_GATEWAY_REPORT.json" "$RUNNER_TEMP/pre/PREFLIGHT_MANIFEST.json" "$RUNNER_TEMP/comp/prisma-automesh-composed-result.zip" "$RUNNER_TEMP/factory.request.json" <<'PY'
          import hashlib,json,sys
          report=json.load(open(sys.argv[1],encoding='utf-8')); pre=json.load(open(sys.argv[2],encoding='utf-8'))
          coverage=min(float((x.get('coverage') or {}).get('resolvedPercent',0)) for x in pre['lanes'])
          mesh={'status':report['status'],'repoHead':report['repoHead'],'requiredAuthorityCoveragePct':coverage,'blockers':len(pre.get('blockers') or []),'requestDigest':report['requestDigest'],'artifactDigest':hashlib.sha256(open(sys.argv[3],'rb').read()).hexdigest(),'layerMapPresent':True}
          req={'schemaVersion':'prisma.factory-ledger.anti-rework-gate.v1','mode':'MUTATION','expectedHead':'487459ab8901748673b86eaf3ad3a79322c7f266','task':'Reconcile certified PC Wave 3 branch history with current canonical main after verified zero path overlap, preserving all Wave 3 source blobs byte-for-byte and rerunning certification before merge.','capabilities':[{'id':'pc.quality.customer_experience_wave2','requestedAction':'ADVANCE'},{'id':'data.canonical_schema_reproducibility','requestedAction':'ADVANCE'},{'id':'pc.entitlement.surface_projection','requestedAction':'ADVANCE'}],'authorityMesh':mesh,'visualMutation':False}
          with open(sys.argv[4],'w',encoding='utf-8') as f: json.dump(req,f,ensure_ascii=False,indent=2); f.write('\n')
          PY
          python "PRISMA Factory Ledger/tools/verify_prisma_anti_rework_gate.py" --request "$RUNNER_TEMP/factory.request.json" | tee "$RUNNER_TEMP/gate.json"
          python - "$RUNNER_TEMP/gate.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          assert d.get('result')=='PASS_ANTI_REWORK_GATE',d
          assert d.get('errors')==[],d
          assert d.get('repoHead')=='487459ab8901748673b86eaf3ad3a79322c7f266',d
          PY
          echo PASS_PC_WAVE3_MAIN_RECONCILIATION_AUTHORITY

      - name: Stage evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pc-wave3-reconcile-main-authority"; mkdir -p "$out"
          for p in "$RUNNER_TEMP/request.json" "$RUNNER_TEMP/pre/PREFLIGHT_MANIFEST.json" "$RUNNER_TEMP/comp/payload/PRISMA_MESH_GATEWAY_REPORT.json" "$RUNNER_TEMP/comp/payload/MANIFEST.json" "$RUNNER_TEMP/comp/prisma-automesh-composed-result.zip" "$RUNNER_TEMP/PC_WAVE3_RECONCILE_LAYER_MAP.json" "$RUNNER_TEMP/factory.request.json" "$RUNNER_TEMP/gate.json" "$RUNNER_TEMP/compose.txt" "$RUNNER_TEMP/reconcile/PARALLEL_OVERLAP_REPORT.json"; do [ ! -f "$p" ] || cp "$p" "$out/$(basename "$p")"; done

      - name: Upload reconciliation authority evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pc-wave3-reconcile-main-authority
          path: ${{ runner.temp }}/pc-wave3-reconcile-main-authority/**
          if-no-files-found: error
          retention-days: 14
