name: cloudcust source finalize v5

on:
  push:
    branches:
      - cloudcust-runtime-20260814
    paths:
      - .github/workflows/cloudcust-source-finalize-v5.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: cloudcust-runtime-20260814
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Current-main and exact-preimage gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          git merge-base --is-ancestor origin/main HEAD || { echo 'BRANCH_NOT_ON_CURRENT_MAIN'; exit 1; }
          test "$(git hash-object 'apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/py/command_center_store.py')" = 'dfec957562bf548ac6b4c9133d089fa7a8a31e8f'
          test "$(git hash-object 'apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/web/cloud_command_center.js')" = 'a3d460029a8cfd38ec0664527add991fb0c9c415'
          test "$(git hash-object 'apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/web/cloud_command_center.html')" = '919b2d72807e5af9709ff5e0a1815ab11349ba87'
          test "$(git hash-object 'apps/terminal-de-venta-system/Prisma Cloud Ctr/internal/py/prisma_unified_lab_v3.py')" = 'b8ba736c5ed2e1074332d3713b167d39d906e2f6'
          test -f 'apps/terminal-de-venta-system/tools/_cloudcust_finalize_source_v2.py'
          echo 'PASS_CURRENT_MAIN_EXACT_PREIMAGE'

      - name: Apply governed source plus stable-root event delegation
        shell: bash
        run: |
          set -euo pipefail
          python 'apps/terminal-de-venta-system/tools/_cloudcust_finalize_source_v2.py'
          python - <<'PY'
          from pathlib import Path
          app=Path('apps/terminal-de-venta-system')
          html_path=app/'Prisma Cloud Ctr/internal/web/cloud_command_center.html'
          js_path=app/'Prisma Cloud Ctr/internal/web/cloud_command_center.js'

          html=html_path.read_text(encoding='utf-8')
          nav_anchor='      <button type="button" data-surface="entitlements">Licencias</button>\n'
          billing='      <button type="button" data-surface="billing">Cobranza</button>\n'
          if billing not in html:
              if html.count(nav_anchor)!=1: raise SystemExit('BILLING_NAV_ANCHOR')
              html=html.replace(nav_anchor,nav_anchor+billing,1)
          viewport='<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n'
          if '<link rel="icon" href="data:,">' not in html:
              if html.count(viewport)!=1: raise SystemExit('FAVICON_ANCHOR')
              html=html.replace(viewport,viewport+'  <link rel="icon" href="data:,">\n',1)
          html_path.write_text(html,encoding='utf-8')

          js=js_path.read_text(encoding='utf-8')
          old='active.matches("input,select,textarea,button,[contenteditable=\'true\']")'
          new='active.matches("input,select,textarea,[contenteditable=\'true\']")'
          if js.count(old)!=1: raise SystemExit(f'INTERACTION_SELECTOR_COUNT:{js.count(old)}')
          js=js.replace(old,new,1)

          capture='''    document.addEventListener("click",(event)=>{ if(state.openPicker && !event.target.closest("[data-picker-toggle],[data-picker-panel]")){ syncFlowFromDom(); state.openPicker=null; render(); } }, true);\n'''
          bubble='''    document.addEventListener("click",(event)=>{ if(state.openPicker && !event.target.closest("[data-picker-toggle],[data-picker-panel]")){ syncFlowFromDom(); state.openPicker=null; render(); } });\n'''
          if js.count(capture)!=1: raise SystemExit(f'OUTSIDE_CLICK_COUNT:{js.count(capture)}')
          js=js.replace(capture,bubble,1)

          boot_anchor='''  function boot() {\n    state.surface = readHashSurface();\n'''
          stable='''  function installStableSurfaceDelegation(){\n    const root=$("surfaceRoot");\n    if(!root || root.dataset.operatorEventsBound==="1") return;\n    root.dataset.operatorEventsBound="1";\n    root.addEventListener("input",(event)=>{\n      const filter=event.target.closest("[data-picker-filter]");\n      if(filter) return;\n      const field=event.target.closest("[data-flow-field]");\n      if(field){\n        const key=field.dataset.flowField;\n        state.flow[key]=field.value;\n        if(key!=="clientRequestId") state.flow.clientRequestId="";\n        event.stopPropagation();\n        return;\n      }\n      const other=event.target.closest("[data-other-for]");\n      if(other){ state.flow[other.dataset.otherFor+"Other"]=other.value; state.flow.clientRequestId=""; event.stopPropagation(); }\n    });\n    root.addEventListener("change",(event)=>{\n      const field=event.target.closest("[data-flow-field]");\n      if(!field) return;\n      syncFlowFromDom();\n      const key=field.dataset.flowField;\n      state.flow[key]=field.value;\n      if(key!=="clientRequestId") state.flow.clientRequestId="";\n      reconcileDependencies(key);\n      event.stopPropagation();\n      render();\n    });\n    root.addEventListener("click",(event)=>{\n      const actionButton=event.target.closest("[data-action]");\n      if(!actionButton) return;\n      syncFlowFromDom();\n      state.openPicker=null;\n      event.stopPropagation();\n      handleAction(actionButton.dataset.action,actionButton);\n    });\n  }\n\n  function boot() {\n    state.surface = readHashSurface();\n    installStableSurfaceDelegation();\n'''
          if js.count(boot_anchor)!=1: raise SystemExit(f'BOOT_ANCHOR_COUNT:{js.count(boot_anchor)}')
          js=js.replace(boot_anchor,stable,1)
          js_path.write_text(js,encoding='utf-8')
          print('PASS_STABLE_SURFACE_ROOT_DELEGATION')
          PY

      - name: Static syntax and operator contracts
        shell: bash
        run: |
          set -euo pipefail
          APP='apps/terminal-de-venta-system'
          python -m py_compile \
            "$APP/Prisma Cloud Ctr/internal/py/customer_registration.py" \
            "$APP/Prisma Cloud Ctr/internal/py/customer_registration_runtime.py" \
            "$APP/Prisma Cloud Ctr/internal/py/command_center_store.py" \
            "$APP/Prisma Cloud Ctr/internal/py/prisma_unified_lab_v3.py" \
            "$APP/tools/verify-cloud-center-customer-registration-01.py" \
            "$APP/tools/verify-cloud-center-customer-runtime-02.py"
          node --check "$APP/Prisma Cloud Ctr/internal/web/cloud_command_center.js"
          python - <<'PY'
          from pathlib import Path
          app=Path('apps/terminal-de-venta-system')
          js=(app/'Prisma Cloud Ctr/internal/web/cloud_command_center.js').read_text(encoding='utf-8')
          html=(app/'Prisma Cloud Ctr/internal/web/cloud_command_center.html').read_text(encoding='utf-8')
          assert html.count('data-surface="billing"')==1
          assert '<html lang="es-MX">' in html
          assert '<link rel="icon" href="data:,">' in html
          assert 'function installStableSurfaceDelegation()' in js
          assert 'root.dataset.operatorEventsBound' in js
          assert 'root.addEventListener("click"' in js
          assert 'handleAction(actionButton.dataset.action,actionButton)' in js
          assert 'Medición homologada' in js
          start=js.index('function clientWizard'); end=js.index('function deviceWizard',start); client=js[start:end]
          for forbidden in ('cityZone','selectField("plan"','save-other-values'):
              assert forbidden not in client, forbidden
          print('PASS_STATIC_OPERATOR_CONTRACTS')
          PY
          git diff --check

      - name: Local customer-registration verifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cloudcust-evidence/local
          python 'apps/terminal-de-venta-system/tools/verify-cloud-center-customer-registration-01.py' --out-dir .cloudcust-evidence/local | tee .cloudcust-evidence/local/registration.log

      - name: Chrome end-to-end runtime verifier
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input playwright==1.54.0
          mkdir -p .cloudcust-evidence/runtime
          python 'apps/terminal-de-venta-system/tools/verify-cloud-center-customer-runtime-02.py' --out-dir .cloudcust-evidence/runtime | tee .cloudcust-evidence/runtime/runtime.log

      - name: Certify evidence and update operational manual
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          ev=Path('.cloudcust-evidence')
          local=ev/'local/CLOUD_CENTER_CUSTOMER_REGISTRATION_VERIFY.json'
          runtime=ev/'runtime/CLOUD_CENTER_CUSTOMER_RUNTIME_VERIFY.json'
          for p in (local,runtime):
              if not p.exists(): raise SystemExit(f'MISSING_EVIDENCE:{p}')
              data=json.loads(p.read_text(encoding='utf-8'))
              if data.get('status')!='PASS': raise SystemExit(f'NON_PASS_EVIDENCE:{p}:{data.get("status")}')
          report=json.loads((ev/'SOURCE_PATCH_REPORT.json').read_text(encoding='utf-8'))
          extras=[
              'billing_navigation_exposed',
              'post_action_render_not_blocked_by_button_focus',
              'stable_surface_root_event_delegation',
              'form_state_persisted_before_rerender',
              'action_dispatch_before_document_fallbacks',
              'outside_picker_close_after_root_dispatch',
              'no_favicon_404_console_noise',
          ]
          report['improvements']=report.get('improvements',[])+extras
          report['improvementCount']=len(report['improvements'])
          report.update({
              'status':'PASS_DIRECT_SOURCE_FINALIZATION',
              'registrationVerifier':'PASS_CLOUD_CENTER_CUSTOMER_REGISTRATION_LOCAL_VERIFIED',
              'runtimeVerifier':'PASS_CLOUD_CENTER_CUSTOMER_RUNTIME_VISUAL_VERIFIED',
              'realDatabaseTouched':False,
              'liveProcessesTouched':False,
              'transport':'direct-readable-source-no-base64',
              'authorityMainAncestry':'PASS',
              'gitDiffCheck':'PASS',
          })
          (ev/'CLOUDCUST_FINAL_REPORT.json').write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          manual=Path('apps/terminal-de-venta-system/docs/ops/PRISMA_FIELD_MANUAL_APRENDIZAJE_OPERATIVO.md')
          marker='## 2026-08-14 — Cloud Center customer registration: direct-source finalization'
          text=manual.read_text(encoding='utf-8')
          if marker not in text:
              entry=f'''\n\n{marker}\n\n- **Tipo:** FIX + UX hardening / transport failure recovery.\n- **Superficie:** Prisma Cloud Center 3160, customer registration and operator navigation only. Tablet/PC/Mobile/Cloudflare/Prisma schema excluded.\n- **Contexto:** el transporte comprimido/base64 falló antes de `git apply`; fail-closed evitó cambios parciales. Las corridas directas posteriores bloquearon un anchor whitespace-sensitive, una rama fuera de main vigente, Cobranza sin navegación y pérdida/despacho frágil del formulario. Ninguna corrida fallida hizo commit de runtime.\n- **Causa raíz final:** además del payload base64 frágil, la UI dependía de listeners globales sobre un árbol recreado con `innerHTML`. La solución estable es delegar input/change/action en `#surfaceRoot`, nodo persistente que no se reemplaza.\n- **Resolución:** fuente UTF-8 legible + preimage SHA + current-main ancestry + adapter aislado + delegación estable en root + DOM→state antes de acciones + refresh protegido + picker fail-safe.\n- **UX adicional:** Cobranza vuelve a estar visible; manual facts no autoseleccionan la primera opción; favicon data-URI elimina 404 espurio; dropdowns dependientes limpian valores incompatibles; métricas y errores son legibles.\n- **Gates:** `verify-cloud-center-customer-registration-01.py` = `PASS_CLOUD_CENTER_CUSTOMER_REGISTRATION_LOCAL_VERIFIED`; `verify-cloud-center-customer-runtime-02.py` = `PASS_CLOUD_CENTER_CUSTOMER_RUNTIME_VISUAL_VERIFIED`.\n- **Evidencia:** artifact GitHub Actions `cloudcust-1408-final-v5`, con reportes, logs, diagnósticos y screenshots.\n- **DB/procesos:** pruebas usan DB/puerto efímeros; no tocan DB real ni procesos vivos del operador.\n- **Regla:** no usar base64/zip embebido para patches grandes cuando Git puede aplicar fuente legible. Cierre sólo con main vigente, preimage, syntax, verifier funcional, browser E2E, cero temporales y commit después de PASS.\n- **Rollback:** revert del commit/PR; todo cambio previo al commit dentro del runner es efímero y fail-closed.\n'''
              manual.write_text(text.rstrip()+entry+'\n',encoding='utf-8')
          print(report['status'], 'improvements='+str(report['improvementCount']))
          PY

      - name: Remove all temporary application transport
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            '.github/workflows/cloudcust-click-inspect.yml' \
            '.github/workflows/cloudcust-runtime-apply-once.yml' \
            '.github/workflows/cloudcust-source-finalize.yml' \
            '.github/workflows/cloudcust-source-finalize-v2.yml' \
            '.github/workflows/cloudcust-source-finalize-v3.yml' \
            '.github/workflows/cloudcust-source-finalize-v4.yml' \
            '.github/workflows/cloudcust-source-finalize-v5.yml' \
            'apps/terminal-de-venta-system/tools/_cloudcust_patch_part1.txt' \
            'apps/terminal-de-venta-system/tools/_cloudcust_patch_part2.txt' \
            'apps/terminal-de-venta-system/tools/_cloudcust_patch_part3.txt' \
            'apps/terminal-de-venta-system/tools/_cloudcust_patch_part4.txt' \
            'apps/terminal-de-venta-system/tools/_cloudcust_patch_part5.txt' \
            'apps/terminal-de-venta-system/tools/_cloudcust_runtime_patch.zb64' \
            'apps/terminal-de-venta-system/tools/_cloudcust_finalize_source_v2.py'
          git diff --check
          ! git status --short | grep -E '(_cloudcust_|cloudcust-source-finalize|cloudcust-click-inspect|cloudcust-runtime-apply-once)' || { echo 'TEMP_TRANSPORT_REMAINS'; git status --short; exit 1; }

      - name: Upload final certification artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudcust-1408-final-v5
          path: .cloudcust-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Commit and push certified final source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PRISMA Cloud Center Bot'
          git config user.email 'prisma-cloud-center-bot@users.noreply.github.com'
          rm -rf .cloudcust-evidence
          git add -A
          git diff --cached --check
          ! git diff --cached --name-only | grep -E '(_cloudcust_|cloudcust-source-finalize|cloudcust-click-inspect|cloudcust-runtime-apply-once)' || { echo 'TEMP_FILE_STAGED'; exit 1; }
          git diff --cached --quiet && { echo 'NO_FINAL_DIFF'; exit 1; }
          echo '--- CERTIFIED FINAL DIFF ---'
          git diff --cached --stat
          git commit -m 'fix(cloud-center): finalize governed customer registration runtime'
          git push origin HEAD:cloudcust-runtime-20260814
          echo "FINAL_HEAD=$(git rev-parse HEAD)"
