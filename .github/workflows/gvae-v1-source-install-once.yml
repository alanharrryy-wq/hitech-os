name: PRISMA GVAE V1 Source Install Once

on:
  push:
    branches:
      - feat/gvae-v1-implementation-3108
    paths:
      - '.github/prisma-carriers/gvae-v1-source3/**'
      - '.github/workflows/gvae-v1-source-install-once.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  PYTHONDONTWRITEBYTECODE: '1'
  EXPECTED_MAIN: 1dabf0604c21dec0115c53e766c22b11b415dd68
  TARGET_BRANCH: feat/gvae-v1-implementation-3108
  BUNDLE_SHA256: 971fc0180756a49ba499fdebb2b43d4ca0f4ed9338f3b5ab548d05048e59fffc

jobs:
  install-and-certify-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Prove canonical main and branch are still exact
        shell: bash
        run: |
          set -euo pipefail
          main_now="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$main_now" = "$EXPECTED_MAIN"
          local_now="$(git rev-parse HEAD)"
          remote_now="$(git ls-remote origin refs/heads/$TARGET_BRANCH | awk '{print $1}')"
          test "$local_now" = "$remote_now"

      - name: Materialize certified GVAE source bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, io, tarfile

          parts = Path('.github/prisma-carriers/gvae-v1-source3')
          part_files = sorted(parts.glob('part*.txt'))
          if len(part_files) != 10:
              raise SystemExit(f'GVAE_SOURCE_PART_COUNT_DRIFT:{len(part_files)}')
          encoded = ''.join(p.read_text(encoding='ascii').strip() for p in part_files)
          raw = base64.b64decode(encoded, validate=True)
          expected = '971fc0180756a49ba499fdebb2b43d4ca0f4ed9338f3b5ab548d05048e59fffc'
          actual = hashlib.sha256(raw).hexdigest()
          if actual != expected:
              raise SystemExit(f'GVAE_SOURCE_BUNDLE_DIGEST_MISMATCH:{actual}')

          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:gz') as archive:
              members = archive.getmembers()
              if len(members) != 29:
                  raise SystemExit(f'GVAE_SOURCE_FILE_COUNT_DRIFT:{len(members)}')
              for member in members:
                  path = Path(member.name)
                  if path.is_absolute() or '..' in path.parts or not path.parts or path.parts[0] != 'prisma-html':
                      raise SystemExit(f'GVAE_BUNDLE_UNSAFE_MEMBER:{member.name}')
                  if not member.isfile() or '__pycache__' in path.parts or path.suffix == '.pyc':
                      raise SystemExit(f'GVAE_BUNDLE_FORBIDDEN_MEMBER:{member.name}')
                  target = Path(member.name)
                  fh = archive.extractfile(member)
                  if fh is None:
                      raise SystemExit(f'GVAE_BUNDLE_UNREADABLE_MEMBER:{member.name}')
                  candidate = fh.read()
                  if target.exists() and target.read_bytes() != candidate:
                      raise SystemExit(f'GVAE_BUNDLE_WOULD_OVERWRITE_EXISTING:{member.name}')
              archive.extractall('.')
          print(f'GVAE_SOURCE_FILES={len(members)}')
          print(f'GVAE_SOURCE_BUNDLE_SHA256={actual}')
          PY

      - name: Integrate Target Index into read-only Visual Core
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('prisma-html/tools/visual_core.py')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'VISCORE_ANCHOR_DRIFT:{label}:{count}')
              text = text.replace(old, new, 1)

          old_import = 'from identity_dictionary_core import COMPILED, IDENTITY, ROOT, SURFACES, build_compilation, load_model, validate_model\n'
          replace_once(old_import, old_import + 'from visual_application.target_index import build_index as build_application_target_index\n', 'import')

          replace_once(
              '    by_projection_surface = projection_counts(visual_manifest)\n\n    surfaces = [\n',
              '    by_projection_surface = projection_counts(visual_manifest)\n    application_index = build_application_target_index(ROOT)\n\n    surfaces = [\n',
              'index-build',
          )

          replace_once(
              '    if visual_manifest.get("surfaceCount") != len(by_projection_surface):\n        architecture_problems.append("visual-source-manifest-surface-count-drift")\n\n    atlas_sections = atlas_manifest.get("sections", [])\n',
              '    if visual_manifest.get("surfaceCount") != len(by_projection_surface):\n        architecture_problems.append("visual-source-manifest-surface-count-drift")\n    architecture_problems.extend(\n        f"application-target-index:{item}" for item in application_index.get("globalBlockers", [])\n    )\n\n    atlas_sections = atlas_manifest.get("sections", [])\n',
              'architecture',
          )

          replace_once(
              '        "surfaces": surfaces,\n        "metadataDrift": metadata_drift,\n',
              '        "applicationEngine": {\n'
              '            "schema": "prisma.visual.application.engine-readiness.v1",\n'
              '            "status": "SOURCE_STATIC_ONLY" if not application_index.get("globalBlockers") else "BLOCKED_STATIC",\n'
              '            "targetIndex": "authority/rifat/prisma-ui/visual-control/target-index/manifest.json",\n'
              '            "indexDigest": application_index.get("indexDigest"),\n'
              '            "recordCount": application_index.get("recordCount", 0),\n'
              '            "countsByStatus": application_index.get("countsByStatus", {}),\n'
              '            "supportedProjectionModes": application_index.get("supportedProjectionModes", []),\n'
              '            "globalBlockers": application_index.get("globalBlockers", []),\n'
              '            "evidenceClassification": "SOURCE_STATIC_ONLY",\n'
              '            "runtimeVisualGreen": False,\n'
              '            "ready": False,\n'
              '            "doesNotProve": ["browser-rendering", "runtime-visual-green", "production-readiness", "all-surfaces-application", "broader-mutation-authorization"],\n'
              '        },\n'
              '        "surfaces": surfaces,\n'
              '        "metadataDrift": metadata_drift,\n',
              'return',
          )

          markdown_anchor = '        f"- Projection entries: `{status[\'projectionManifest\'][\'entryCount\']}`",\n'
          replace_once(
              markdown_anchor,
              markdown_anchor + '        f"- GVAE Target Index: `{status[\'applicationEngine\'][\'status\']}` / `{status[\'applicationEngine\'][\'recordCount\']}` records",\n',
              'markdown',
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install prisma-html validation dependencies
        run: python -m pip install -r prisma-html/requirements-dev.txt

      - name: Run complete GVAE V1 suite with zero skips
        working-directory: prisma-html
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover('tools/visual_application/tests', top_level_dir='tools')
          count = suite.countTestCases()
          if count != 54:
              raise SystemExit(f'GVAE_TEST_COUNT_DRIFT:{count}')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.testsRun != 54:
              raise SystemExit(f'GVAE_TEST_RUN_DRIFT:{result.testsRun}')
          if result.skipped:
              raise SystemExit('GVAE_FULL_CHECKOUT_TESTS_SKIPPED:' + repr(result.skipped))
          if not result.wasSuccessful():
              raise SystemExit('GVAE_TEST_SUITE_FAILED')
          PY

      - name: Generate deterministic Target Index and file manifest
        working-directory: prisma-html
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python -m visual_application.target_index --write
          PYTHONPATH=tools python -m visual_application.target_index --check
          PYTHONPATH=tools python -m visual_application.target_index --status > "$RUNNER_TEMP/gvae-target-index.json"
          python tools/refresh_files_manifest.py --write
          python tools/refresh_files_manifest.py --check

      - name: Prove source and static integration truth
        working-directory: prisma-html
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tools python -m visual_application.target_index --check
          python tools/validate_project.py --root . --report "$RUNNER_TEMP/gvae-source-validator.json"
          python tools/visual_core.py check
          python tools/validate_rifat_authority.py
          python tools/validate_identity_dictionary.py
          python tools/compile_identity_dictionary.py --check
          python tools/refresh_files_manifest.py --check

      - name: Prove frozen Code Atlas files are untouched
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "$EXPECTED_MAIN" -- \
            tools/code-atlas/src/code_atlas/ui_bridge/application.py \
            tools/code-atlas/src/code_atlas/ui_bridge/cobrar_application.py

      - name: Prove exact Master Map and executable source policy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          master = Path('prisma-html/docs/ops/PRISMA_VISUAL_CHANGE_MASTER_MAP.md')
          expected = '87d1a7cd375ed8b4c0a264a74f1e1d75921d704b4d9da62e53d427a3ac05662d'
          actual = hashlib.sha256(master.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f'MASTER_MAP_BYTE_DRIFT:{actual}')
          marker = ('!' + 'important').encode()
          offenders = [p.as_posix() for p in Path('prisma-html/tools/visual_application').rglob('*.py') if marker in p.read_bytes()]
          if offenders:
              raise SystemExit('GVAE_PRIORITY_OVERRIDE_LITERAL:' + ','.join(offenders))
          PY

      - name: Commit only governed GVAE V1 source and generated views
        shell: bash
        run: |
          set -euo pipefail
          before="$(git rev-parse HEAD)"
          remote="$(git ls-remote origin refs/heads/$TARGET_BRANCH | awk '{print $1}')"
          test "$remote" = "$before"
          python - <<'PY'
          import subprocess
          allowed_prefixes = (
              'prisma-html/tools/visual_application/',
              'prisma-html/authority/rifat/identity/contract/application/',
              'prisma-html/authority/rifat/prisma-ui/visual-control/target-index/',
          )
          allowed_exact = {
              'prisma-html/docs/ops/PRISMA_VISUAL_CHANGE_MASTER_MAP.md',
              'prisma-html/tools/visual_core.py',
              'prisma-html/FILES_MANIFEST.json',
          }
          rows = subprocess.check_output(['git','status','--porcelain=v1'], text=True).splitlines()
          changed = []
          for row in rows:
              if len(row) < 4:
                  continue
              path = row[3:].strip()
              if ' -> ' in path:
                  path = path.split(' -> ',1)[1]
              path = path.replace('\\','/')
              changed.append(path)
          unexpected = sorted(p for p in changed if p not in allowed_exact and not p.startswith(allowed_prefixes))
          if unexpected:
              raise SystemExit('GVAE_UNEXPECTED_WORKTREE_MUTATION:' + ','.join(unexpected))
          print('GVAE_CHANGED=' + ','.join(sorted(changed)))
          PY
          git add -- prisma-html
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name 'prisma-gvae[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(visual): implement Generic Visual Application Engine V1'
          remote2="$(git ls-remote origin refs/heads/$TARGET_BRANCH | awk '{print $1}')"
          test "$remote2" = "$before"
          git push --porcelain origin "HEAD:refs/heads/$TARGET_BRANCH"
