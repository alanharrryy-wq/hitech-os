version: 1
timezone: America/Mexico_City
description: Federation Level 2 default repository registry for meta-governance.
determinism:
  stable_repo_order: name_asc
  stable_blocker_order: repo_type_message
  stable_debt_order: debt_id_asc
feature_flags:
  convergence_actions: OFF
  forced_repo_changes: OFF
  auto_repo_mutation: OFF
policy:
  offline_blocks_by_default: false
  strict_mode_offline_degrades: true
  run_docs_doctor_on_missing_report: true
  report_excerpt_lines: 12
defaults:
  docs_doctor_relpath: tools/ops/Docs-Doctor.ps1
  final_report_relpath: docs/govos/_reports/FINAL_REPORT.md
repos:
  - name: hitech-os
    path: F:\repos\hitech-os
    docs_doctor: tools/ops/Docs-Doctor.ps1
    final_report: docs/govos/_reports/FINAL_REPORT.md
    enabled: true
    required: true
    notes: Primary federation authority repo.
  - name: inversion-next
    path: F:\repos\inversion-next
    docs_doctor: tools/ops/Docs-Doctor.ps1
    final_report: docs/govos/_reports/FINAL_REPORT.md
    enabled: true
    required: false
    notes: External product governance repo.
  - name: hitech-frontend
    path: F:\OneDrive\Hitech\3.Proyectos\CHAT GPT AI Estudio\HITECH_AISTUDIO_SYSTEM\0.Origins\app\frontend\hitech-frontend
    docs_doctor: tools/ops/Docs-Doctor.ps1
    final_report: docs/govos/_reports/FINAL_REPORT.md
    enabled: true
    required: false
    notes: Frontend federation participant.
