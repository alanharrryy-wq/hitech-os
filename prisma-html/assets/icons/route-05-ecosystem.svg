<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" role="img" aria-labelledby="title desc">
  <title id="title">Ecosistema PRISMA</title>
  <desc id="desc">Órbitas y nodos que representan el ecosistema que construye PRISMA.</desc>
  <defs>
