[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deltaforge"
version = "0.1.0"
description = "DeltaForge session-based workstation shell"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.5",
]

[project.scripts]
deltaforge = "deltaforge.bootstrap:run"
