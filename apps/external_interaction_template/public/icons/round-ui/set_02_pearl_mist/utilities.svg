  <g stroke="#5C6887" stroke-opacity="0.98" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#iconGlow)" color="#5C6887">
    <line x1="36" y1="40" x2="60" y2="40"/><circle cx="45" cy="40" r="3" /><line x1="36" y1="48" x2="60" y2="48"/><circle cx="54" cy="48" r="3" /><line x1="36" y1="56" x2="60" y2="56"/><circle cx="41" cy="56" r="3" />
