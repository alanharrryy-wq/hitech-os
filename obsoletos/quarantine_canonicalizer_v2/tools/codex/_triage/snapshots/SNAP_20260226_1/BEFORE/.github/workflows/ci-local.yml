name: ci-local

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Print tool versions
        run: |
          node -v
          npm -v
